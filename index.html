<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YAM Chat V4.5.1</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

html,body{
    width:100%;
    min-height:100%;
    overflow-x:hidden;
}

body{
    background:#eef3ff;
    color:#111827;
}

/* =========================
   LOGIN
========================= */

#loginPage{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:linear-gradient(135deg,#0d47a1,#1976d2,#42a5f5);
}

.login-box{
    width:100%;
    max-width:390px;
    background:white;
    padding:30px 22px;
    border-radius:22px;
    box-shadow:0 15px 40px rgba(0,0,0,.25);
}

.logo-box{
    text-align:center;
    margin-bottom:25px;
}

.logo-main{
    font-size:44px;
    font-weight:900;
    color:#ff1493;
    letter-spacing:2px;
}

.logo-sub{
    font-size:14px;
    font-weight:bold;
    color:#1976d2;
    margin-top:-4px;
}

.input{
    width:100%;
    padding:14px;
    margin-bottom:12px;
    border:1px solid #d1d5db;
    border-radius:12px;
    outline:none;
    font-size:15px;
}

.input:focus{
    border-color:#1976d2;
}

.btn{
    width:100%;
    border:none;
    padding:13px;
    border-radius:12px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

.btn-primary{
    background:#1976d2;
    color:white;
}

.btn-pink{
    background:#ff1493;
    color:white;
}

.btn-gray{
    background:#e5e7eb;
    color:#111827;
}

.small-btn{
    padding:9px 13px;
    border:none;
    border-radius:9px;
    cursor:pointer;
    font-weight:bold;
}

/* =========================
   APP
========================= */

#app{
    display:none;
    min-height:100vh;
    padding-bottom:70px;
}

.topbar{
    position:sticky;
    top:0;
    z-index:50;
    height:62px;
    background:white;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 14px;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
}

.top-logo{
    display:flex;
    align-items:center;
    gap:6px;
}

.top-logo-yam{
    font-size:24px;
    font-weight:900;
    color:#ff1493;
}

.top-logo-chat{
    font-size:12px;
    font-weight:bold;
    color:#1976d2;
}

.current-user{
    font-size:13px;
    font-weight:bold;
    color:#374151;
}

/* =========================
   PAGES
========================= */

.page{
    display:none;
    max-width:720px;
    margin:auto;
    padding:14px;
}

.page.active{
    display:block;
}

/* =========================
   COMPOSER
========================= */

.composer{
    background:white;
    border-radius:16px;
    padding:14px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
    margin-bottom:14px;
}

.composer textarea{
    width:100%;
    min-height:85px;
    resize:vertical;
    border:1px solid #e5e7eb;
    border-radius:12px;
    padding:12px;
    outline:none;
}

.post-type-row{
    display:flex;
    gap:7px;
    margin-top:10px;
    flex-wrap:wrap;
}

.post-type-btn{
    border:none;
    background:#f1f5f9;
    padding:9px 12px;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
}

.post-type-btn.active{
    background:#1976d2;
    color:white;
}

.media-preview{
    margin-top:10px;
}

.media-preview img,
.media-preview video{
    display:block;
    width:100%;
    max-height:520px;
    height:auto;
    object-fit:contain;
    border-radius:12px;
    background:#000;
}

.file-info{
    margin-top:7px;
    font-size:12px;
    color:#6b7280;
}

/* =========================
   POST
========================= */

.post{
    background:white;
    border-radius:16px;
    padding:14px;
    margin-bottom:14px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.post-head{
    display:flex;
    align-items:center;
    gap:10px;
}

.avatar{
    width:44px;
    height:44px;
    border-radius:50%;
    object-fit:cover;
    background:#dbeafe;
}

.avatar-placeholder{
    width:44px;
    height:44px;
    border-radius:50%;
    background:#1976d2;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
}

.post-user{
    flex:1;
}

.post-user-name{
    font-weight:bold;
}

.post-time{
    color:#6b7280;
    font-size:11px;
    margin-top:3px;
}

.post-menu{
    border:none;
    background:none;
    font-size:20px;
    cursor:pointer;
}

.post-text{
    margin:12px 0;
    line-height:1.5;
    white-space:pre-wrap;
    word-break:break-word;
}

.post-media{
    display:block;
    width:100%;
    max-height:650px;
    height:auto;
    object-fit:contain;
    border-radius:12px;
    background:#000;
    margin-top:10px;
}

.post-actions{
    display:flex;
    gap:8px;
    margin-top:12px;
    border-top:1px solid #eee;
    padding-top:10px;
}

.action-btn{
    flex:1;
    border:none;
    background:#f8fafc;
    padding:9px 5px;
    border-radius:9px;
    cursor:pointer;
    font-weight:bold;
}

.action-btn.liked{
    color:#ff1493;
}

.comments{
    margin-top:10px;
}

.comment{
    background:#f1f5f9;
    padding:8px 10px;
    border-radius:10px;
    margin-top:7px;
    font-size:13px;
}

.comment-head{
    display:flex;
    align-items:center;
    gap:5px;
}

.comment-name{
    font-weight:bold;
    flex:1;
}

.comment-tools{
    display:flex;
    gap:4px;
}

.comment-tool{
    border:none;
    background:transparent;
    cursor:pointer;
    font-size:13px;
    padding:2px 4px;
}

.comment-row{
    display:flex;
    gap:6px;
    margin-top:9px;
}

.comment-input{
    flex:1;
    border:1px solid #ddd;
    border-radius:9px;
    padding:9px;
}

.comment-send{
    border:none;
    background:#1976d2;
    color:white;
    border-radius:9px;
    padding:0 12px;
    font-weight:bold;
}

.share-box{
    text-align:center;
    line-height:1.5;
}

/* =========================
   PROFILE
========================= */

.profile-cover{
    height:210px;
    border-radius:16px 16px 0 0;
    overflow:hidden;
    background:linear-gradient(135deg,#1976d2,#90caf9);
    position:relative;
}

.profile-cover img{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* Cover diteruskan sehingga bawah 3 butang */
.profile-card{
    background:white;
    border-radius:0 0 16px 16px;
    margin-top:0;
    position:relative;
    padding:14px;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
}

.profile-avatar-wrap{
    margin-top:-55px;
}

.profile-avatar{
    width:100px;
    height:100px;
    border-radius:50%;
    object-fit:cover;
    border:4px solid white;
    background:#1976d2;
}

.profile-name{
    font-size:21px;
    font-weight:bold;
    margin-top:8px;
}

.profile-username{
    color:#6b7280;
    font-size:13px;
}

.profile-bio{
    margin-top:9px;
    line-height:1.45;
}

.profile-status{
    display:inline-block;
    margin-top:9px;
    background:#e0f2fe;
    color:#0369a1;
    padding:6px 9px;
    border-radius:8px;
    font-size:12px;
}

.profile-buttons{
    display:flex;
    gap:7px;
    margin-top:12px;
}

.profile-buttons button{
    flex:1;
}

.profile-tabs{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:4px;
    margin-top:14px;
    background:white;
    padding:5px;
    border-radius:12px;
}

.profile-tab{
    border:none;
    background:#f1f5f9;
    padding:10px 3px;
    border-radius:9px;
    cursor:pointer;
    font-size:12px;
    font-weight:bold;
}

.profile-tab.active{
    background:#1976d2;
    color:white;
}

.profile-tab-content{
    margin-top:12px;
}

.profile-media-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:5px;
}

.profile-media-item{
    aspect-ratio:1/1;
    background:#111827;
    border-radius:8px;
    overflow:hidden;
    position:relative;
}

.profile-media-item img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.profile-video-list{
    display:flex;
    flex-direction:column;
    gap:12px;
}

.profile-video-card{
    background:white;
    border-radius:12px;
    padding:8px;
    overflow:hidden;
    box-shadow:0 2px 7px rgba(0,0,0,.07);
}

.profile-video-card video{
    width:100%;
    height:auto;
    max-height:520px;
    display:block;
    border-radius:10px;
    background:#000;
}

.profile-video-text{
    padding:8px 3px 2px;
    line-height:1.45;
}

/* =========================
   FRIENDS
========================= */

.friend-card{
    background:white;
    padding:12px;
    border-radius:14px;
    margin-bottom:9px;
    display:flex;
    align-items:center;
    gap:10px;
    box-shadow:0 2px 7px rgba(0,0,0,.06);
}

.friend-info{
    flex:1;
}

.friend-name{
    font-weight:bold;
}

.friend-btn{
    border:none;
    background:#1976d2;
    color:white;
    padding:8px 11px;
    border-radius:9px;
    font-weight:bold;
}

/* =========================
   ROOMS
========================= */

.room-card{
    background:white;
    padding:15px;
    border-radius:14px;
    margin-bottom:10px;
    display:flex;
    align-items:center;
    gap:10px;
    box-shadow:0 2px 7px rgba(0,0,0,.06);
}

.room-info{
    flex:1;
}

.room-name{
    font-weight:bold;
}

.room-region{
    color:#6b7280;
    font-size:12px;
    margin-top:3px;
}

.room-btn{
    border:none;
    background:#ff1493;
    color:white;
    padding:8px 12px;
    border-radius:9px;
    font-weight:bold;
}

/* =========================
   MARKET
========================= */

.market-card{
    background:white;
    border-radius:15px;
    overflow:hidden;
    margin-bottom:13px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.market-card img{
    width:100%;
    max-height:360px;
    object-fit:cover;
    display:block;
}

.market-body{
    padding:12px;
}

.market-title{
    font-size:18px;
    font-weight:bold;
}

.market-price{
    color:#e11d48;
    font-weight:bold;
    font-size:17px;
    margin-top:5px;
}

.market-desc{
    margin-top:6px;
    line-height:1.4;
}

.market-actions{
    display:flex;
    gap:7px;
    margin-top:10px;
}

.market-actions button{
    flex:1;
}

/* =========================
   MUSIC
========================= */

.music-box{
    background:white;
    border-radius:14px;
    padding:14px;
    margin-top:12px;
}

.music-box audio{
    width:100%;
    margin-top:8px;
}

/* =========================
   BOTTOM NAV
========================= */

.bottom-nav{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    z-index:100;
    height:65px;
    background:white;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    box-shadow:0 -2px 10px rgba(0,0,0,.1);
}

.nav-btn{
    border:none;
    background:white;
    font-size:11px;
    font-weight:bold;
    cursor:pointer;
}

.nav-btn span{
    display:block;
    font-size:22px;
    margin-bottom:2px;
}

.nav-btn.active{
    color:#1976d2;
}

/* =========================
   MODAL
========================= */

.modal-bg{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    z-index:300;
    align-items:center;
    justify-content:center;
    padding:15px;
}

.modal-bg.show{
    display:flex;
}

.modal{
    width:100%;
    max-width:430px;
    background:white;
    border-radius:17px;
    padding:18px;
    max-height:90vh;
    overflow-y:auto;
}

.modal-title{
    font-size:19px;
    font-weight:bold;
    margin-bottom:12px;
}

.modal-actions{
    display:flex;
    gap:8px;
    margin-top:15px;
}

.modal-actions button{
    flex:1;
}

/* =========================
   CHAT
========================= */

.chat-bg{
    display:none;
    position:fixed;
    inset:0;
    background:#f1f5f9;
    z-index:200;
}

.chat-bg.show{
    display:flex;
    flex-direction:column;
}

.chat-head{
    height:60px;
    background:white;
    display:flex;
    align-items:center;
    gap:10px;
    padding:0 12px;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
}

.chat-back{
    border:none;
    background:none;
    font-size:24px;
}

.chat-name{
    font-weight:bold;
}

.chat-messages{
    flex:1;
    overflow-y:auto;
    padding:12px;
}

.chat-msg{
    max-width:80%;
    padding:9px 11px;
    border-radius:13px;
    margin-bottom:8px;
    line-height:1.4;
    word-break:break-word;
}

.chat-msg.mine{
    background:#1976d2;
    color:white;
    margin-left:auto;
    border-bottom-right-radius:4px;
}

.chat-msg.other{
    background:white;
    border-bottom-left-radius:4px;
}

.chat-input-row{
    background:white;
    padding:8px;
    display:flex;
    gap:7px;
}

.chat-input{
    flex:1;
    border:1px solid #ddd;
    border-radius:10px;
    padding:10px;
}

.chat-send{
    border:none;
    background:#1976d2;
    color:white;
    padding:0 15px;
    border-radius:10px;
    font-weight:bold;
}

/* =========================
   EMPTY
========================= */

.empty{
    background:white;
    border-radius:14px;
    padding:30px 15px;
    text-align:center;
    color:#6b7280;
}

.section-title{
    font-size:20px;
    font-weight:bold;
    margin-bottom:12px;
}

.storage-note{
    background:#fff7ed;
    border:1px solid #fed7aa;
    color:#9a3412;
    padding:10px;
    border-radius:10px;
    font-size:12px;
    margin-top:10px;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:500px){

    .page{
        padding:10px;
    }

    .profile-cover{
        height:175px;
    }

    .profile-tabs{
        grid-template-columns:repeat(4,1fr);
    }

    .profile-tab{
        font-size:10px;
    }

    .post{
        border-radius:13px;
    }

    .post-media{
        max-height:560px;
    }

    .action-btn{
        font-size:12px;
    }
}
</style>
</head>

<body>

<!-- LOGIN -->

<div id="loginPage">

    <div class="login-box">

        <div class="logo-box">
            <div class="logo-main">YAM</div>
            <div class="logo-sub">YAM CHAT</div>
        </div>

        <input
            id="loginUsername"
            class="input"
            type="text"
            placeholder="Username"
            autocomplete="username">

        <input
            id="loginPassword"
            class="input"
            type="password"
            placeholder="Password"
            autocomplete="current-password">

        <button
            class="btn btn-primary"
            onclick="login()">
            LOGIN
        </button>

        <div style="height:8px"></div>

        <button
            class="btn btn-pink"
            onclick="register()">
            DAFTAR AKAUN
        </button>

    </div>

</div>


<!-- APP -->

<div id="app">

    <div class="topbar">

        <div class="top-logo">
            <div class="top-logo-yam">YAM</div>
            <div class="top-logo-chat">CHAT</div>
        </div>

        <div
            id="currentUserDisplay"
            class="current-user">
        </div>

    </div>


    <!-- HOME -->

    <div
        id="homePage"
        class="page">

        <div class="composer">

            <textarea
                id="postText"
                placeholder="Apa yang anda fikirkan?"></textarea>

            <div
                id="mediaPreview"
                class="media-preview">
            </div>

            <div
                id="fileInfo"
                class="file-info">
            </div>

            <div class="post-type-row">

                <button
                    id="textPostBtn"
                    class="post-type-btn active"
                    onclick="selectPostType('text')">
                    📝 Teks
                </button>

                <button
                    id="imagePostBtn"
                    class="post-type-btn"
                    onclick="selectPostType('image')">
                    📷 Gambar
                </button>

                <button
                    id="videoPostBtn"
                    class="post-type-btn"
                    onclick="selectPostType('video')">
                    🎥 Video
                </button>

                <button
                    class="small-btn"
                    style="background:#1976d2;color:white"
                    onclick="createPost()">
                    POST
                </button>

                <button
                    class="small-btn"
                    onclick="cancelPost()">
                    BATAL
                </button>

            </div>

            <div class="storage-note">
                📌 YAM Chat V4.5.1 menggunakan IndexedDB untuk media.
                Gambar maksimum 3MB dan video maksimum 6MB untuk demo ini.
            </div>

        </div>

        <div id="feed"></div>

    </div>


    <!-- FRIENDS -->

    <div
        id="friendsPage"
        class="page">

        <div class="section-title">
            👥 Friends
        </div>

        <div id="friendsList"></div>

    </div>


    <!-- ROOMS -->

    <div
        id="roomsPage"
        class="page">

        <div class="section-title">
            🌎 Rooms
        </div>

        <div id="roomsList"></div>

    </div>


    <!-- PROFILE -->

    <div
        id="profilePage"
        class="page">

        <div id="profileArea"></div>

    </div>


    <!-- BOTTOM NAV -->

    <div class="bottom-nav">

        <button
            id="navHome"
            class="nav-btn active"
            onclick="showPage('home')">
            <span>🏠</span>
            Home
        </button>

        <button
            id="navFriends"
            class="nav-btn"
            onclick="showPage('friends')">
            <span>👥</span>
            Friends
        </button>

        <button
            id="navRooms"
            class="nav-btn"
            onclick="showPage('rooms')">
            <span>🌎</span>
            Rooms
        </button>

        <button
            id="navProfile"
            class="nav-btn"
            onclick="showPage('profile')">
            <span>👤</span>
            Profile
        </button>

    </div>

</div>


<!-- FILE INPUTS -->

<input
    id="profileFile"
    type="file"
    accept="image/*"
    style="display:none"
    onchange="changeProfilePicture(event)">

<input
    id="coverFile"
    type="file"
    accept="image/*"
    style="display:none">

<input
    id="postImageFile"
    type="file"
    accept="image/*"
    style="display:none"
    onchange="handlePostImage(event)">

<input
    id="postVideoFile"
    type="file"
    accept="video/*"
    style="display:none"
    onchange="handlePostVideo(event)">

<input
    id="musicFile"
    type="file"
    accept="audio/*"
    style="display:none"
    onchange="handleMusic(event)">

<input
    id="marketImageFile"
    type="file"
    accept="image/*"
    style="display:none"
    onchange="handleMarketImage(event)">


<!-- MODAL -->

<div
    id="modalBg"
    class="modal-bg">

    <div class="modal">

        <div
            id="modalTitle"
            class="modal-title">
        </div>

        <div id="modalContent"></div>

        <div class="modal-actions">

            <button
                class="btn btn-gray"
                onclick="closeModal()">
                Tutup
            </button>

        </div>

    </div>

</div>


<!-- CHAT -->

<div
    id="chatBg"
    class="chat-bg">

    <div class="chat-head">

        <button
            class="chat-back"
            onclick="closeChat()">
            ←
        </button>

        <div
            id="chatName"
            class="chat-name">
        </div>

    </div>

    <div
        id="chatMessages"
        class="chat-messages">
    </div>

    <div class="chat-input-row">

        <input
            id="chatInput"
            class="chat-input"
            placeholder="Tulis mesej..."
            onkeydown="if(event.key==='Enter')sendChat()">

        <button
            class="chat-send"
            onclick="sendChat()">
            Hantar
        </button>

    </div>

</div>


<script>

/* =====================================================
   BASIC STATE
===================================================== */

let currentUser =
    localStorage.getItem("yam_current_user") || null;

let selectedPostType = "text";
let selectedPostFile = null;
let selectedMarketImage = null;
let currentChatUser = null;
let currentProfileTab = "posts";


/* =====================================================
   INDEXED DB
===================================================== */

const DB_NAME = "YAM_CHAT_MEDIA_DB";
const DB_VERSION = 1;
const MEDIA_STORE = "media";

let mediaDB = null;


function openMediaDB(){

    return new Promise((resolve,reject)=>{

        if(mediaDB){
            resolve(mediaDB);
            return;
        }

        const request =
            indexedDB.open(DB_NAME,DB_VERSION);

        request.onupgradeneeded=function(e){

            const db=e.target.result;

            if(!db.objectStoreNames.contains(MEDIA_STORE)){

                db.createObjectStore(
                    MEDIA_STORE,
                    {keyPath:"id"}
                );

            }

        };

        request.onsuccess=function(e){

            mediaDB=e.target.result;

            resolve(mediaDB);

        };

        request.onerror=function(){

            reject(request.error);

        };

    });

}


async function saveMedia(file){

    const db=await openMediaDB();

    const id=
        "media_" +
        Date.now() +
        "_" +
        Math.random()
            .toString(36)
            .substring(2,9);

    return new Promise((resolve,reject)=>{

        const tx=
            db.transaction(
                MEDIA_STORE,
                "readwrite"
            );

        tx.objectStore(MEDIA_STORE).put({

            id:id,
            name:file.name,
            type:file.type,
            size:file.size,
            blob:file,
            created:Date.now()

        });

        tx.oncomplete=function(){

            resolve(id);

        };

        tx.onerror=function(){

            reject(tx.error);

        };

    });

}


async function getMedia(id){

    if(!id){
        return null;
    }

    const db=await openMediaDB();

    return new Promise((resolve,reject)=>{

        const tx=
            db.transaction(
                MEDIA_STORE,
                "readonly"
            );

        const request=
            tx.objectStore(MEDIA_STORE).get(id);

        request.onsuccess=function(){

            resolve(request.result || null);

        };

        request.onerror=function(){

            reject(request.error);

        };

    });

}


async function deleteMedia(id){

    if(!id){
        return;
    }

    const db=await openMediaDB();

    return new Promise((resolve,reject)=>{

        const tx=
            db.transaction(
                MEDIA_STORE,
                "readwrite"
            );

        tx.objectStore(MEDIA_STORE).delete(id);

        tx.oncomplete=function(){

            resolve();

        };

        tx.onerror=function(){

            reject(tx.error);

        };

    });

}


async function clearAllMedia(){

    const db=await openMediaDB();

    return new Promise((resolve,reject)=>{

        const tx=
            db.transaction(
                MEDIA_STORE,
                "readwrite"
            );

        tx.objectStore(MEDIA_STORE).clear();

        tx.oncomplete=function(){

            resolve();

        };

        tx.onerror=function(){

            reject(tx.error);

        };

    });

}

/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(text){

    return String(text || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =====================================================
   TIME
===================================================== */

function timeAgo(time){

    const diff=
        Math.floor(
            (Date.now()-time)/1000
        );

    if(diff<60){
        return "baru sahaja";
    }

    if(diff<3600){
        return Math.floor(diff/60)+" minit lalu";
    }

    if(diff<86400){
        return Math.floor(diff/3600)+" jam lalu";
    }

    return Math.floor(diff/86400)+" hari lalu";

}

/* =====================================================
   FILE SIZE
===================================================== */

function formatSize(bytes){

    if(bytes<1024){
        return bytes+" B";
    }

    if(bytes<1024*1024){

        return (
            bytes/1024
        ).toFixed(1)+" KB";

    }

    return (
        bytes/(1024*1024)
    ).toFixed(2)+" MB";

}

/* =====================================================
   CREATE POST
===================================================== */

async function createPost(){

    const text=
        document
        .getElementById("postText")
        .value
        .trim();

    if(
        selectedPostType==="text"
        &&
        !text
    ){

        alert("Tulis sesuatu dahulu.");

        return;

    }

    if(
        (
            selectedPostType==="image"
            ||
            selectedPostType==="video"
        )
        &&
        !selectedPostFile
    ){

        alert("Sila pilih media dahulu.");

        return;

    }

    let mediaId="";

    if(selectedPostFile){

        try{

            mediaId=
                await saveMedia(
                    selectedPostFile
                );

        }catch(error){

            console.error(error);

            alert(
                "Media gagal disimpan. Cuba fail yang lebih kecil."
            );

            return;

        }

    }

    const posts=getPosts();

    posts.unshift({

        id:Date.now(),

        owner:currentUser,

        text:text,

        type:selectedPostType,

        mediaId:mediaId,

        time:Date.now(),

        likes:[],

        comments:[],

        hiddenComments:false,

        blockedUsers:[]

    });

    if(!savePosts(posts)){

        if(mediaId){

            await deleteMedia(mediaId);

        }

        return;

    }

    cancelPost();

    renderFeed();

}

/* =====================================================
   FEED
===================================================== */

async function renderFeed(){

    const area=
        document.getElementById("feed");

    const posts=getPosts();

    if(!posts.length){

        area.innerHTML=`
            <div class="empty">
                Belum ada post.
                <br><br>
                Jadilah orang pertama membuat post.
            </div>
        `;

        return;

    }

    let html="";

    for(const post of posts){

        let mediaHtml="";

        if(post.mediaId){

            const media=
                await getMedia(post.mediaId);

            if(media){

                const url=
                    URL.createObjectURL(
                        media.blob
                    );

                if(post.type==="image"){

                    mediaHtml=`
                        <img
                            class="post-media"
                            src="${url}"
                            alt="Post gambar">
                    `;

                }

                if(post.type==="video"){

                    mediaHtml=`
                        <video
                            class="post-media"
                            src="${url}"
                            controls
                            playsinline
                            preload="metadata">
                        </video>
                    `;

                }

            }

        }

        const likes=
            post.likes || [];

        const comments=
            post.comments || [];

        const blocked=
            post.blockedUsers || [];

        const liked=
            likes.includes(currentUser);

        const visibleComments=
            comments.filter(
                c=>!blocked.includes(c.user)
            );

        let commentsHtml="";

        if(
            !post.hiddenComments
            &&
            visibleComments.length
        ){

            commentsHtml=
                visibleComments
                .map(c=>`

                    <div class="comment">

                        <div class="comment-head">

                            <span class="comment-name">
                                ${escapeHtml(c.user)}
                            </span>

                            ${
                                post.owner===currentUser
                                ?
                                `
                                <div class="comment-tools">

                                    <button
                                        class="comment-tool"
                                        title="Padam komen"
                                        onclick="deleteComment(${post.id},${c.id})">
                                        🗑️
                                    </button>

                                    ${
                                        blocked.includes(c.user)
                                        ?
                                        ""
                                        :
                                        `
                                        <button
                                            class="comment-tool"
                                            title="Block pengguna"
                                            onclick="blockCommentUser(${post.id},'${escapeHtml(c.user)}')">
                                            🚫
                                        </button>
                                        `
                                    }

                                </div>
                                `
                                :
                                ""
                            }

                        </div>

                        <div>
                            ${escapeHtml(c.text)}
                        </div>

                    </div>

                `)
                .join("");

        }

        html+=`

            <div class="post">

                <div class="post-head">

                    ${avatarHtml(post.owner)}

                    <div class="post-user">

                        <div class="post-user-name">
                            ${escapeHtml(post.owner)}
                        </div>

                        <div class="post-time">
                            ${timeAgo(post.time)}
                        </div>

                    </div>

                    ${
                        post.owner===currentUser
                        ?
                        `
                        <button
                            class="post-menu"
                            onclick="postOwnerMenu(${post.id})">
                            ⋮
                        </button>
                        `
                        :
                        ""
                    }

                </div>

                ${
                    post.text
                    ?
                    `
                    <div class="post-text">
                        ${escapeHtml(post.text)}
                    </div>
                    `
                    :
                    ""
                }

                ${mediaHtml}

                <div class="post-actions">

                    <button
                        class="action-btn ${liked?"liked":""}"
                        onclick="toggleLike(${post.id})">
                        ${liked?"❤️":"♡"}
                        ${likes.length}
                    </button>

                    <button
                        class="action-btn"
                        onclick="focusComment(${post.id})">
                        💬
                        ${visibleComments.length}
                    </button>

                    <button
                        class="action-btn"
                        onclick="sharePost(${post.id})">
                        🔗 Share
                    </button>

                </div>

                <div
                    class="comments"
                    id="comments-${post.id}">

                    ${
                        post.hiddenComments
                        ?
                        `
                        ${
                            post.owner===currentUser
                            ?
                            `
                            <button
                                class="small-btn"
                                onclick="toggleComments(${post.id})">
                                👁️ Tunjukkan komen
                            </button>
                            `
                            :
                            `
                            <div
                                style="
                                    color:#6b7280;
                                    font-size:12px;
                                    padding:8px">
                                Komen disembunyikan oleh author.
                            </div>
                            `
                        }
                        `
                        :
                        `
                        ${commentsHtml}

                        ${
                            blocked.includes(currentUser)
                            ?
                            `
                            <div
                                style="
                                    color:#b91c1c;
                                    font-size:12px;
                                    margin-top:9px;
                                    padding:8px;
                                    background:#fee2e2;
                                    border-radius:9px">
                                🚫 Anda telah disekat daripada komen pada post ini.
                            </div>
                            `
                            :
                            `
                            <div class="comment-row">

                                <input
                                    id="comment-${post.id}"
                                    class="comment-input"
                                    placeholder="Tulis komen..."
                                    onkeydown="if(event.key==='Enter')addComment(${post.id})">

                                <button
                                    class="comment-send"
                                    onclick="addComment(${post.id})">
                                    ↗
                                </button>

                            </div>
                            `
                        }
                        `
                    }

                </div>

            </div>

        `;

    }

    area.innerHTML=html;

}


/* =====================================================
   LIKE
===================================================== */

function toggleLike(id){

    const posts=getPosts();

    const post=
        posts.find(p=>p.id===id);

    if(!post){
        return;
    }

    if(!post.likes){
        post.likes=[];
    }

    const index=
        post.likes.indexOf(currentUser);

    if(index>=0){

        post.likes.splice(index,1);

    }else{

        post.likes.push(currentUser);

    }

    savePosts(posts);

    renderFeed();

}


/* =====================================================
   SHARE
===================================================== */

function sharePost(id){

    const posts=getPosts();

    const post=
        posts.find(p=>p.id===id);

    if(!post){
        return;
    }

    const shareText=
        "Post YAM Chat oleh @"+post.owner+
        (post.text ? "\n\n"+post.text : "");

    if(
        navigator.share
    ){

        navigator.share({

            title:"YAM Chat",
            text:shareText

        }).catch(()=>{});

        return;

    }

    openModal(
        "🔗 Share Post",
        `
            <div class="share-box">

                <p>
                    ${escapeHtml(shareText)}
                </p>

                <br>

                <button
                    class="btn btn-primary"
                    onclick="copyShareText(${id})">
                    📋 Salin
                </button>

            </div>
        `
    );

}


function copyShareText(id){

    const posts=getPosts();

    const post=
        posts.find(p=>p.id===id);

    if(!post){
        return;
    }

    const text=
        "Post YAM Chat oleh @"+post.owner+
        (post.text ? "\n\n"+post.text : "");

    if(
        navigator.clipboard
        &&
        navigator.clipboard.writeText
    ){

        navigator.clipboard
            .writeText(text)
            .then(()=>{

                closeModal();

                alert("Post berjaya disalin untuk share.");

            })
            .catch(()=>{

                alert("Tidak dapat menyalin.");

            });

    }else{

        closeModal();

        alert("Fungsi salin tidak disokong browser ini.");

    }

}


/* =====================================================
   COMMENT
===================================================== */

function addComment(id){

    const input=
        document
        .getElementById("comment-"+id);

    if(!input){
        return;
    }

    const text=
        input.value.trim();

    if(!text){
        return;
    }

    const posts=getPosts();

    const post=
        posts.find(p=>p.id===id);

    if(!post){
        return;
    }

    if(!post.comments){
        post.comments=[];
    }

    if(!post.blockedUsers){
        post.blockedUsers=[];
    }

    if(
        post.blockedUsers.includes(currentUser)
    ){

        alert(
            "Anda telah disekat daripada komen pada post ini."
        );

        return;

    }

    if(post.hiddenComments){

        alert(
            "Komen untuk post ini sedang disembunyikan oleh author."
        );

        return;

    }

    post.comments.push({

        id:
            Date.now()+
            Math.floor(Math.random()*1000),

        user:currentUser,

        text:text,

        time:Date.now()

    });

    savePosts(posts);

    renderFeed();

}


function focusComment(id){

    const posts=getPosts();

    const post=
        posts.find(p=>p.id===id);

    if(
        post &&
        (post.blockedUsers||[])
        .includes(currentUser)
    ){

        alert(
            "Anda telah disekat daripada komen pada post ini."
        );

        return;

    }

    const input=
        document
        .getElementById("comment-"+id);

    if(input){

        input.focus();

        return;

    }

    const comments=
        document.getElementById(
            "comments-"+id
        );

    if(comments){

        comments.scrollIntoView({
            behavior:"smooth",
            block:"center"
        });

    }

}


/* =====================================================
   HIDE / SHOW COMMENTS
===================================================== */

function toggleComments(id){

    const posts=getPosts();

    const post=
        posts.find(p=>p.id===id);

    if(!post){
        return;
    }

    if(post.owner!==currentUser){

        alert(
            "Hanya author post boleh mengurus komen."
        );

        return;

    }

    post.hiddenComments=
        !post.hiddenComments;

    savePosts(posts);

    renderFeed();

}


/* =====================================================
   DELETE COMMENT
===================================================== */

function deleteComment(postId,commentId){

    const posts=getPosts();

    const post=
        posts.find(p=>p.id===postId);

    if(!post){
        return;
    }

    if(post.owner!==currentUser){

        alert(
            "Hanya author post boleh padam komen."
        );

        return;

    }

    const comment=
        (post.comments||[])
        .find(c=>c.id===commentId);

    if(!comment){
        return;
    }

    if(
        !confirm(
            "Padam komen daripada @"+
            comment.user+
            "?"
        )
    ){

        return;

    }

    post.comments=
        (post.comments||[])
        .filter(
            c=>c.id!==commentId
        );

    savePosts(posts);

    renderFeed();

}


/* =====================================================
   BLOCK COMMENT USER
===================================================== */

function blockCommentUser(postId,username){

    const posts=getPosts();

    const post=
        posts.find(p=>p.id===postId);

    if(!post){
        return;
    }

    if(post.owner!==currentUser){

        alert(
            "Hanya author post boleh block pengguna."
        );

        return;

    }

    if(username===currentUser){

        alert(
            "Author tidak boleh block diri sendiri."
        );

        return;

    }

    if(!post.blockedUsers){
        post.blockedUsers=[];
    }

    if(
        post.blockedUsers.includes(username)
    ){

        post.blockedUsers=
            post.blockedUsers.filter(
                u=>u!==username
            );

    }else{

        post.blockedUsers.push(username);

    }

    savePosts(posts);

    renderFeed();

}


/* =====================================================
   UNBLOCK USER
===================================================== */

function unblockCommentUser(postId,username){

    const posts=getPosts();

    const post=
        posts.find(p=>p.id===postId);

    if(!post){
        return;
    }

    if(post.owner!==currentUser){
        return;
    }

    post.blockedUsers=
        (post.blockedUsers||[])
        .filter(
            u=>u!==username
        );

    savePosts(posts);

    renderFeed();

}

/* =====================================================
   MANAGE COMMENTS
===================================================== */

function managePostComments(id){

    const posts=getPosts();

    const post=
        posts.find(p=>p.id===id);

    if(!post){
        return;
    }

    if(post.owner!==currentUser){
        return;
    }

    const comments=
        post.comments || [];

    const blocked=
        post.blockedUsers || [];

    let html="";

    if(!comments.length){

        html+=`
            <div class="empty">
                Belum ada komen.
            </div>
        `;

    }else{

        comments.forEach(comment=>{

            const isBlocked=
                blocked.includes(comment.user);

            html+=`

                <div class="comment">

                    <div class="comment-head">

                        <span class="comment-name">
                            @${escapeHtml(comment.user)}
                        </span>

                        ${
                            isBlocked
                            ?
                            `
                            <span
                                style="
                                    font-size:10px;
                                    color:#b91c1c">
                                BLOCKED
                            </span>
                            `
                            :
                            ""
                        }

                    </div>

                    <div>
                        ${escapeHtml(comment.text)}
                    </div>

                    <div
                        style="
                            display:flex;
                            gap:5px;
                            margin-top:7px">

                        <button
                            class="small-btn"
                            style="background:#fee2e2;color:#b91c1c"
                            onclick="deleteComment(${id},${comment.id});managePostComments(${id})">
                            🗑️ Padam
                        </button>

                        ${
                            isBlocked
                            ?
                            `
                            <button
                                class="small-btn"
                                onclick="unblockCommentUser(${id},'${escapeHtml(comment.user)}');managePostComments(${id})">
                                Buka Block
                            </button>
                            `
                            :
                            `
                            <button
                                class="small-btn"
                                style="background:#fef3c7;color:#92400e"
                                onclick="blockCommentUser(${id},'${escapeHtml(comment.user)}');managePostComments(${id})">
                                🚫 Block
                            </button>
                            `
                        }

                    </div>

                </div>

            `;

        });

    }

    openModal(
        "💬 Urus Komen",
        html
    );

}


/* =====================================================
   DELETE POST
===================================================== */

async function deletePost(id){

    closeModal();

    const posts=getPosts();

    const post=
        posts.find(p=>p.id===id);

    if(!post){
        return;
    }

    if(post.owner!==currentUser){

        alert(
            "Hanya author boleh padam post."
        );

        return;

    }

    if(
        !confirm(
            "Padam post ini?"
        )
    ){
        return;
    }

    if(post.mediaId){

        try{

            await deleteMedia(
                post.mediaId
            );

        }catch(e){

            console.error(e);

        }

    }

    const remaining=
        posts.filter(
            p=>p.id!==id
        );

    savePosts(remaining);

    renderFeed();

}

        .querySelectorAll(".profile-tab")

    const button=
        document.getElementById(
            "profileTab"+
            tab.charAt(0).toUpperCase()+
            tab.slice(1)
        );

    if(button){
        button.classList.add("active");
    }

    if(tab==="posts"){

        renderProfilePosts();

    }

    if(tab==="images"){

        renderProfileImages();

    }

    if(tab==="videos"){

        renderProfileVideos();

    }

    if(tab==="market"){

        renderMarket();

    }

}

function changeProfilePicture(event){

    if(!event || !event.target){

        document
            .getElementById("profileFile")
            .click();

        return;

    }

    const file=
        event.target.files[0];

    if(!file){
        return;
    }

    if(file.size>3*1024*1024){

        alert("Gambar maksimum 3MB.");

        event.target.value="";

        return;

    }

    const reader=
        new FileReader();

    reader.onload=function(e){

        try{

            localStorage.setItem(
                "yam_picture_"+currentUser,
                e.target.result
            );

            renderProfile();

        }catch(error){

            alert(
                "Gambar profil tidak dapat disimpan kerana storage browser penuh."
            );

        }

    };

    reader.readAsDataURL(file);

}

    }

    items.forEach(item=>{

        html+=`

            <div class="market-card">

                ${
                    item.image
                    ?
                    `<img src="${item.image}" alt="">`
                    :
                    ""
                }

                <div class="market-body">

                    <div class="market-title">
                        ${escapeHtml(item.title)}
                    </div>

                    <div class="market-price">
                        RM ${escapeHtml(item.price)}
                    </div>

                    ${
                        item.description
                        ?
                        `
                        <div class="market-desc">
                            ${escapeHtml(item.description)}
                        </div>
                        `
                        :
                        ""
                    }

                    <div class="post-time">
                        ${timeAgo(item.time)}
                    </div>

                    <div class="market-actions">

                        <button
                            class="small-btn btn-gray"
                            onclick="deleteMarketItem(${item.id})">
                            🗑️ Padam
                        </button>

                    </div>

                </div>

            </div>

        `;

    });

    area.innerHTML=html;

}


function addMarketItem(){

    selectedMarketImage=null;

    openModal(
        "Tambah Barang",
        `

        <input
            id="marketTitle"
            class="input"
            placeholder="Nama barang">

        <input
            id="marketPrice"
            class="input"
            placeholder="Harga">

        <textarea
            id="marketDescription"
            class="input"
            placeholder="Keterangan"
            style="min-height:100px"></textarea>

        <button
            class="btn btn-gray"
            onclick="chooseMarketImage()">
            📷 Pilih Gambar
        </button>

        <div
            id="marketImagePreview"
            style="margin-top:10px">
        </div>

        <div style="height:10px"></div>

        <button
            class="btn btn-primary"
            onclick="saveMarketItem()">
            Simpan Barang
        </button>

        `
    );

}


function chooseMarketImage(){

    document
        .getElementById("marketImageFile")
        .click();

}


function handleMarketImage(event){

    const file=
        event.target.files[0];

    if(!file){
        return;
    }

    if(file.size>3*1024*1024){

        alert(
            "Gambar maksimum 3MB."
        );

        event.target.value="";

        return;

    }

    const reader=
        new FileReader();

    reader.onload=function(e){

        selectedMarketImage=
            e.target.result;

        document
            .getElementById(
                "marketImagePreview"
            )
            .innerHTML=`
                <img
                    src="${selectedMarketImage}"
                    style="
                        width:100%;
                        max-height:250px;
                        object-fit:cover;
                        border-radius:10px;
                    ">
            `;

    };

    reader.readAsDataURL(file);

}


function saveMarketItem(){

    const title=
        document
        .getElementById("marketTitle")
        .value
        .trim();

    const price=
        document
        .getElementById("marketPrice")
        .value
        .trim();

    const description=
        document
        .getElementById("marketDescription")
        .value
        .trim();

    if(!title || !price){

        alert(
            "Nama barang dan harga diperlukan."
        );

        return;

    }

    const items=getMarket();

    items.unshift({

        id:Date.now(),

        owner:currentUser,

        title:title,

        price:price,

        description:description,

        image:selectedMarketImage,

        time:Date.now()

    });

    if(saveMarket(items)){

        selectedMarketImage=null;

        closeModal();

        renderMarket();

    }

}


function deleteMarketItem(id){

    if(
        !confirm(
            "Padam barang ini?"
        )
    ){
        return;
    }

    const items=
        getMarket()
        .filter(
            item=>item.id!==id
        );

    saveMarket(items);

    renderMarket();

}


/* =====================================================
   CHAT
===================================================== */

function chatKey(a,b){

    return (
        "yamchat_"+
        [a,b]
        .sort()
        .join("_")
    );

}


function getChatMessages(a,b){

    try{

        return JSON.parse(
            localStorage.getItem(
                chatKey(a,b)
            ) || "[]"
        );

    }catch(e){

        return [];

    }

}


function openChat(username){

    currentChatUser=username;

    document
        .getElementById("chatName")
        .textContent=username;

    document
        .getElementById("chatBg")
        .classList.add("show");

    renderChat();

}


function closeChat(){

    currentChatUser=null;

    document
        .getElementById("chatBg")
        .classList.remove("show");

}


function renderChat(){

    if(!currentChatUser){
        return;
    }

    const messages=
        getChatMessages(
            currentUser,
            currentChatUser
        );

    const area=
        document.getElementById(
            "chatMessages"
        );

    if(!messages.length){

        area.innerHTML=`
            <div
                style="
                    text-align:center;
                    color:#6b7280;
                    padding:30px">
                Belum ada mesej.
            </div>
        `;

        return;

    }

    area.innerHTML=
        messages.map(m=>`

            <div
                class="chat-msg
                ${m.user===currentUser?"mine":"other"}">

                ${escapeHtml(m.text)}

                <div
                    style="
                        font-size:9px;
                        opacity:.7;
                        margin-top:3px">
                    ${timeAgo(m.time)}
                </div>

            </div>

        `).join("");

    area.scrollTop=
        area.scrollHeight;

}


function sendChat(){

    const input=
        document.getElementById(
            "chatInput"
        );

    const text=
        input.value.trim();

    if(!text || !currentChatUser){
        return;
    }

    const key=
        chatKey(
            currentUser,
            currentChatUser
        );

    const messages=
        getChatMessages(
            currentUser,
            currentChatUser
        );

    messages.push({

        user:currentUser,

        text:text,

        time:Date.now()

    });

    try{

        localStorage.setItem(
            key,
            JSON.stringify(messages)
        );

    }catch(e){

        alert(
            "Mesej gagal disimpan. Storage browser penuh."
        );

        return;

    }

    input.value="";

    renderChat();

}


/* =====================================================
   ROOM
===================================================== */

function openRoom(roomName){

    openModal(
        roomName+" Room",
        `

        <div class="empty">

            🌎 Selamat datang di
            <strong>${escapeHtml(roomName)}</strong> Room.

            <br><br>

            Chat room demo YAM Chat.

        </div>

        <div style="height:12px"></div>

        <input
            id="roomMessage"
            class="input"
            placeholder="Tulis mesej room...">

        <button
            class="btn btn-primary"
            onclick="sendRoomMessage('${escapeHtml(roomName)}')">
            Hantar
        </button>

        <div
            id="roomMessages"
            style="margin-top:12px">
        </div>

        `
    );

    renderRoomMessages(roomName);

}


function roomKey(room){

    return "yamroom_"+room;

}


function renderRoomMessages(room){

    const area=
        document.getElementById(
            "roomMessages"
        );

    if(!area){
        return;
    }

    let messages=[];

    try{

        messages=
            JSON.parse(
                localStorage.getItem(
                    roomKey(room)
                ) || "[]"
            );

    }catch(e){

        messages=[];

    }

    area.innerHTML=
        messages.map(m=>`

            <div class="comment">

                <span class="comment-name">
                    ${escapeHtml(m.user)}
                </span>

                <div>
                    ${escapeHtml(m.text)}
                </div>

            </div>

        `).join("");

}


function sendRoomMessage(room){

    const input=
        document.getElementById(
            "roomMessage"
        );

    if(!input){
        return;
    }

    const text=
        input.value.trim();

    if(!text){
        return;
    }

    let messages=[];

    try{

        messages=
            JSON.parse(
                localStorage.getItem(
                    roomKey(room)
                ) || "[]"
            );

    }catch(e){

        messages=[];

    }

    messages.push({

        user:currentUser,

        text:text,

        time:Date.now()

    });

    try{

        localStorage.setItem(
            roomKey(room),
            JSON.stringify(messages)
        );

    }catch(e){

        alert(
            "Room gagal disimpan. Storage browser penuh."
        );

        return;

    }

    input.value="";

    renderRoomMessages(room);

}

        .textContent=title;

    document

    document

}


function closeModal(){

    document
        .getElementById("modalBg")
        .classList.remove("show");

}

if(currentUser){

}
