<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YAM Chat V4.5.7</title>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Arial,sans-serif;
}
html,body{
width:100%;
min-height:100%;
overflow-x:hidden;
}
body{background:#f1f3f6;color:#111}

/* LOGIN */
#loginPage{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
background:linear-gradient(135deg,#111,#333,#111);
}
.login-box{
width:100%;
max-width:390px;
background:#fff;
border-radius:20px;
padding:30px 24px;
box-shadow:0 15px 50px rgba(0,0,0,.35);
}
.logo{text-align:center;font-size:38px;font-weight:900;margin-bottom:5px}
.logo .yam-blue,.top-logo .yam-blue{color:#1877f2}
.logo .chat-pink,.top-logo .chat-pink{color:#ff4f9a}
.login-sub{text-align:center;color:#777;margin-bottom:25px}
.login-box input{
width:100%;padding:14px;margin-bottom:12px;
border:1px solid #ddd;border-radius:10px;outline:none;font-size:15px;
}
.login-box input:focus{border-color:#1877f2}
.login-btn,.register-btn{
width:100%;padding:13px;border:0;border-radius:10px;
font-size:16px;font-weight:bold;cursor:pointer;
}
.login-btn{background:#1877f2;color:#fff}
.register-btn{margin-top:10px;background:#e9f3ff;color:#1877f2}
.login-msg{text-align:center;min-height:20px;margin-top:12px;font-size:14px;color:#d00}

/* APP */
#app{display:none;min-height:100vh;padding-bottom:70px}
.topbar{
position:sticky;top:0;z-index:50;height:58px;background:#fff;
border-bottom:1px solid #ddd;display:flex;align-items:center;
justify-content:space-between;padding:0 15px;
}
.top-logo{font-size:25px;font-weight:900}
.current-user{font-size:14px;font-weight:bold;color:#555}

/* PAGES */
.page{display:none}
.page.active{display:block}
.container{width:100%;max-width:700px;margin:auto;padding:12px}

/* COMPOSER */
.composer{
background:#fff;border-radius:14px;padding:14px;
box-shadow:0 1px 4px rgba(0,0,0,.08);margin-bottom:12px;
}
.composer-top{display:flex;gap:10px;align-items:center}
.small-avatar{
width:42px;height:42px;border-radius:50%;object-fit:cover;background:#ddd;
}
.composer textarea{
flex:1;min-height:45px;resize:none;border:1px solid #ddd;
border-radius:12px;padding:12px;outline:none;
}
.post-type-row{display:flex;gap:8px;margin-top:10px}
.post-type-row button{
flex:1;border:0;padding:10px 5px;border-radius:9px;
background:#f0f2f5;cursor:pointer;
}
.post-type-row button.active{background:#1877f2;color:#fff}
.media-preview{display:none;margin-top:10px}
.media-preview img,.media-preview video{
width:100%;max-height:350px;object-fit:contain;
border-radius:10px;background:#111;
}
.post-btn{
width:100%;margin-top:10px;border:0;padding:12px;
border-radius:10px;background:#1877f2;color:#fff;
font-weight:bold;cursor:pointer;
}

/* POSTS */
.post{
background:#fff;border-radius:14px;margin-bottom:12px;
overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.08);
}
.post-head{
display:flex;align-items:center;padding:12px;gap:10px;
}
.post-avatar{
width:42px;height:42px;border-radius:50%;object-fit:cover;background:#ddd;
}
.post-owner{font-weight:bold}
.post-time{font-size:12px;color:#777;margin-top:2px}
.post-menu{
margin-left:auto;border:0;background:none;font-size:22px;cursor:pointer;
}
.post-text{
padding:0 12px 12px;white-space:pre-wrap;word-break:break-word;
}
.post-media{
width:100%;max-height:550px;object-fit:contain;background:#111;
}
.post-actions{
display:flex;border-top:1px solid #eee;border-bottom:1px solid #eee;
}
.post-actions button{
flex:1;border:0;background:#fff;padding:11px 4px;
cursor:pointer;font-weight:bold;color:#555;
}
.post-actions button.liked{color:#1877f2}
.comment-area{padding:10px}
.comment{
background:#f0f2f5;border-radius:10px;padding:8px 10px;
margin-bottom:7px;position:relative;
}
.comment-user{font-weight:bold;font-size:13px}
.comment-text{font-size:14px;margin-top:3px;word-break:break-word}
.comment-tools{
margin-top:5px;display:flex;gap:5px;flex-wrap:wrap;
}
.comment-tools button{
border:0;background:none;color:#1877f2;font-size:12px;cursor:pointer;
}
.comment-tools button.danger{color:#c00}
.comment-tools button.block-btn{color:#c00}
.comment-tools button.comment-loved{color:#e91e63;font-weight:bold}
.comment-input-row{display:flex;gap:7px}
.comment-input-row input{
flex:1;border:1px solid #ddd;border-radius:20px;padding:9px 12px;outline:none;
}
.comment-input-row button{
border:0;background:#1877f2;color:#fff;border-radius:20px;padding:0 15px;
}
.no-comments{font-size:13px;color:#888;margin-bottom:8px}

/* PROFILE */
.profile-page{
padding:0 0 20px;
}

/*
PROFILE V4.5.7
- Seluruh Profile dinaikkan
- Ruang kosong atas dikurangkan
- Cover dipendekkan
- Avatar, nama, bio dan 3 butang ikut naik
- Tab Profile ikut naik
- Cover tetap berada di belakang 3 butang
*/
.profile-hero{
position:relative;
min-height:350px;
background:#222;
background-position:center;
background-size:cover;
background-repeat:no-repeat;
overflow:hidden;
}

.profile-hero::before{
content:"";
position:absolute;
inset:0;
background:linear-gradient(
to bottom,
rgba(0,0,0,.02),
rgba(0,0,0,.10) 35%,
rgba(0,0,0,.72) 100%
);
}

.profile-content{
position:relative;
z-index:2;
min-height:350px;
padding-top:25px;
padding-bottom:16px;
display:flex;
flex-direction:column;
justify-content:flex-end;
}

.profile-info{
padding:6px 15px 4px;
color:#fff;
}

.profile-avatar-wrap{
margin-bottom:3px;
}

.profile-avatar{
width:90px;
height:90px;
border-radius:50%;
object-fit:cover;
border:4px solid #fff;
background:#ddd;
box-shadow:0 4px 15px rgba(0,0,0,.35);
}

.profile-name{
font-size:22px;
font-weight:900;
text-shadow:0 2px 5px rgba(0,0,0,.5);
}

.profile-bio{
margin-top:2px;
font-size:14px;
opacity:.95;
}

.profile-buttons{
display:flex;
gap:6px;
padding:5px 9px 1px;
}

.profile-buttons button{
flex:1;
border:1px solid rgba(255,255,255,.55);
background:rgba(255,255,255,.92);
color:#111;
padding:9px 5px;
border-radius:10px;
font-weight:bold;
cursor:pointer;
backdrop-filter:blur(5px);
}

.profile-tabs{
display:flex;
background:#fff;
border-bottom:1px solid #ddd;
overflow-x:auto;
}

.profile-tabs button{
min-width:100px;
flex:1;
padding:13px 8px;
border:0;
background:#fff;
cursor:pointer;
font-weight:bold;
color:#666;
}

.profile-tabs button.active{
color:#1877f2;
border-bottom:3px solid #1877f2;
}

/* FRIENDS / ROOMS */
.friend-card,.room-card{
background:#fff;
border-radius:14px;
padding:13px;
margin-bottom:10px;
display:flex;
align-items:center;
gap:12px;
box-shadow:0 1px 4px rgba(0,0,0,.08);
}

.friend-card img{
width:50px;
height:50px;
border-radius:50%;
object-fit:cover;
}

.friend-info{
flex:1;
}

.friend-name{
font-weight:bold;
}

.friend-card button,.room-card button{
border:0;
background:#1877f2;
color:#fff;
border-radius:9px;
padding:9px 12px;
}

/* MARKET */
.market-add{
background:#fff;
padding:14px;
border-radius:14px;
margin-bottom:12px;
}

.market-add input,.market-add textarea{
width:100%;
margin-bottom:9px;
padding:11px;
border:1px solid #ddd;
border-radius:9px;
}

.market-add textarea{
min-height:80px;
}

.market-add button{
width:100%;
padding:11px;
border:0;
border-radius:9px;
background:#1877f2;
color:#fff;
font-weight:bold;
}

.market-item{
background:#fff;
border-radius:14px;
overflow:hidden;
margin-bottom:12px;
}

.market-item img{
width:100%;
max-height:350px;
object-fit:contain;
background:#111;
}

.market-info{
padding:12px;
}

.market-title{
font-weight:bold;
font-size:18px;
}

.market-price{
color:#e53935;
font-size:18px;
font-weight:bold;
margin:5px 0;
}

/* NAV */
.bottom-nav{
position:fixed;
z-index:100;
bottom:0;
left:0;
right:0;
height:65px;
background:#fff;
border-top:1px solid #ddd;
display:flex;
}

.bottom-nav button{
flex:1;
border:0;
background:#fff;
color:#777;
font-weight:bold;
cursor:pointer;
}

.bottom-nav button.active{
color:#1877f2;
}

/* MODAL */
.modal-bg{
display:none;
position:fixed;
z-index:200;
inset:0;
background:rgba(0,0,0,.55);
align-items:center;
justify-content:center;
padding:15px;
}

.modal{
width:100%;
max-width:500px;
max-height:85vh;
overflow-y:auto;
background:#fff;
border-radius:15px;
padding:18px;
}

.modal h3{
margin-bottom:12px;
}

.modal button{
border:0;
padding:10px 12px;
border-radius:9px;
margin:4px 2px;
cursor:pointer;
}

.modal .danger{
background:#ffe7e7;
color:#c00;
}

.modal .primary{
background:#1877f2;
color:#fff;
}

.modal .normal{
background:#eee;
}

/* CHAT */
.chat-overlay{
display:none;
position:fixed;
z-index:150;
inset:0;
background:#f1f3f6;
}

.chat-head{
height:58px;
background:#fff;
border-bottom:1px solid #ddd;
display:flex;
align-items:center;
gap:10px;
padding:0 12px;
}

.chat-head button{
border:0;
background:none;
font-size:23px;
}

.chat-messages{
height:calc(100vh - 116px);
overflow-y:auto;
padding:12px;
}

.chat-bubble{
max-width:78%;
padding:9px 12px;
border-radius:15px;
margin-bottom:7px;
word-break:break
