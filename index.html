<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YAM Chat V4.4.3</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

html,body{
    width:100%;
    overflow-x:hidden;
}

body{
    background:#eef2f7;
    color:#222;
}

button{
    border:0;
    cursor:pointer;
}

.hidden{
    display:none!important;
}

/* ================= LOGIN ================= */

#loginPage{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:linear-gradient(135deg,#2563eb,#0f172a);
}

.login-box{
    width:100%;
    max-width:420px;
    background:white;
    padding:28px;
    border-radius:20px;
    box-shadow:0 15px 40px rgba(0,0,0,.25);
}

.logo{
    text-align:center;
    font-size:42px;
    font-weight:900;
    color:#2563eb;
    margin-bottom:5px;
}

.login-sub{
    text-align:center;
    color:#777;
    margin-bottom:25px;
}

.input{
    width:100%;
    padding:13px;
    border:1px solid #ddd;
    border-radius:10px;
    margin-bottom:12px;
    outline:none;
}

.input:focus{
    border-color:#2563eb;
}

.primary-btn{
    width:100%;
    padding:13px;
    border-radius:10px;
    background:#2563eb;
    color:white;
    font-weight:bold;
}

.secondary-btn{
    width:100%;
    padding:13px;
    border-radius:10px;
    background:#eef2ff;
    color:#2563eb;
    font-weight:bold;
    margin-top:10px;
}

/* ================= APP ================= */

#app{
    display:none;
    min-height:100vh;
}

.topbar{
    position:sticky;
    top:0;
    z-index:100;
    height:58px;
    background:white;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 15px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.top-logo{
    font-size:25px;
    font-weight:900;
    color:#2563eb;
}

.top-user{
    font-weight:bold;
    color:#444;
}

.main{
    max-width:700px;
    margin:auto;
    padding:15px;
    padding-bottom:90px;
}

.page{
    display:none;
}

.page.active{
    display:block;
}

/* ================= HOME ================= */

.create-box{
    background:white;
    border-radius:18px;
    padding:15px;
    box-shadow:0 3px 12px rgba(0,0,0,.06);
    margin-bottom:15px;
}

.create-title{
    font-size:18px;
    font-weight:bold;
    margin-bottom:12px;
}

.post-options{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
}

.post-option{
    padding:13px 5px;
    border-radius:12px;
    background:#f1f5f9;
    font-weight:bold;
    color:#334155;
}

.post-option.active{
    background:#2563eb;
    color:white;
}

.post-editor{
    margin-top:12px;
}

.post-editor textarea{
    width:100%;
    min-height:100px;
    resize:none;
    border:1px solid #ddd;
    border-radius:12px;
    padding:12px;
    outline:none;
}

.media-preview{
    margin-top:10px;
}

.media-preview img,
.media-preview video{
    width:100%;
    max-height:350px;
    object-fit:contain;
    border-radius:12px;
    background:#000;
}

.editor-actions{
    display:flex;
    gap:8px;
    margin-top:10px;
}

.editor-actions button{
    flex:1;
    padding:12px;
    border-radius:10px;
    font-weight:bold;
}

.cancel-btn{
    background:#eee;
}

.post-btn{
    background:#2563eb;
    color:white;
}

/* ================= POSTS ================= */

.post-card{
    background:white;
    border-radius:18px;
    padding:15px;
    margin-bottom:15px;
    box-shadow:0 3px 12px rgba(0,0,0,.06);
}

.post-head{
    display:flex;
    align-items:center;
    gap:10px;
}

.avatar{
    width:45px;
    height:45px;
    border-radius:50%;
    object-fit:cover;
    background:#2563eb;
}

.avatar-small{
    width:35px;
    height:35px;
    border-radius:50%;
    object-fit:cover;
    background:#2563eb;
}

.post-user{
    font-weight:bold;
}

.post-time{
    font-size:12px;
    color:#888;
    margin-top:3px;
}

.post-menu{
    margin-left:auto;
    font-size:22px;
    background:transparent;
}

.post-text{
    margin:14px 0;
    white-space:pre-wrap;
    line-height:1.5;
}

.post-media{
    width:100%;
    max-height:450px;
    object-fit:contain;
    border-radius:12px;
    background:#000;
}

.post-actions{
    display:flex;
    gap:5px;
    margin-top:10px;
    border-top:1px solid #eee;
    padding-top:10px;
}

.post-actions button{
    flex:1;
    padding:9px 5px;
    border-radius:9px;
    background:#f1f5f9;
}

.post-actions button.liked{
    color:#2563eb;
    font-weight:bold;
}

.comments{
    margin-top:10px;
}

.comment{
    display:flex;
    gap:8px;
    margin-top:9px;
}

.comment-body{
    flex:1;
    background:#f1f5f9;
    border-radius:12px;
    padding:8px 10px;
}

.comment-name{
    font-weight:bold;
    font-size:13px;
}

.comment-text{
    margin-top:3px;
    white-space:pre-wrap;
}

.comment-input{
    display:flex;
    gap:7px;
    margin-top:10px;
}

.comment-input input{
    flex:1;
    border:1px solid #ddd;
    border-radius:10px;
    padding:10px;
}

.comment-input button{
    background:#2563eb;
    color:white;
    padding:0 15px;
    border-radius:10px;
}

/* ================= FRIENDS ================= */

.section-title{
    font-size:22px;
    font-weight:bold;
    margin-bottom:15px;
}

.friend-card{
    background:white;
    border-radius:15px;
    padding:12px;
    margin-bottom:10px;
    display:flex;
    align-items:center;
    gap:12px;
    box-shadow:0 3px 10px rgba(0,0,0,.05);
}

.friend-info{
    flex:1;
}

.friend-name{
    font-weight:bold;
}

.friend-status{
    color:#777;
    font-size:13px;
    margin-top:4px;
}

.chat-btn{
    background:#2563eb;
    color:white;
    padding:9px 13px;
    border-radius:9px;
    font-weight:bold;
}

/* ================= ROOMS ================= */

.room-card{
    background:white;
    padding:16px;
    border-radius:16px;
    margin-bottom:10px;
    box-shadow:0 3px 10px rgba(0,0,0,.05);
    cursor:pointer;
}

.room-name{
    font-weight:bold;
    font-size:17px;
}

.room-region{
    color:#777;
    margin-top:5px;
    font-size:13px;
}

/* ================= PROFILE ================= */

#profilePage{
    margin-left:-15px;
    margin-right:-15px;
    margin-top:-15px;
}

.profile-main{
    background:white;
    border-radius:0;
    overflow:hidden;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
}

/* ================= FULL SCREEN COVER ================= */

.profile-cover{
    width:100vw;
    height:360px;
    margin-left:calc(50% - 50vw);
    margin-right:calc(50% - 50vw);
    background:linear-gradient(135deg,#2563eb,#111827);
    background-size:cover;
    background-position:center;
    position:relative;
    overflow:visible;
}

.cover-dark{
    position:absolute;
    inset:0;
    background:linear-gradient(
        to bottom,
        rgba(0,0,0,.05),
        rgba(0,0,0,.42)
    );
    pointer-events:none;
}

/* ================= CAMERA + THREE DOT ================= */

.profile-top-actions{
    position:absolute;
    top:15px;
    right:15px;
    left:auto;
    display:flex;
    align-items:center;
    justify-content:flex-end;
    gap:8px;
    z-index:50;
}

.profile-top-actions button{
    width:44px;
    height:44px;
    border-radius:50%;
    background:rgba(255,255,255,.94);
    color:#222;
    font-size:21px;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 3px 12px rgba(0,0,0,.22);
    transition:.15s;
}

.profile-top-actions button:hover{
    background:white;
    transform:scale(1.05);
}

/* ================= THREE DOT AREA ================= */

.profile-menu-wrap{
    position:relative;
    display:flex;
    justify-content:flex-end;
}

.profile-menu{
    position:absolute;
    top:52px;
    right:0;
    width:220px;
    background:white;
    border-radius:14px;
    padding:6px;
    box-shadow:0 8px 25px rgba(0,0,0,.25);
    border:1px solid rgba(0,0,0,.08);
    z-index:100;
}

.profile-menu::before{
    content:"";
    position:absolute;
    top:-7px;
    right:14px;
    width:14px;
    height:14px;
    background:white;
    transform:rotate(45deg);
    border-left:1px solid rgba(0,0,0,.08);
    border-top:1px solid rgba(0,0,0,.08);
}

.profile-menu-item{
    position:relative;
    z-index:2;
    padding:13px 12px;
    border-radius:9px;
    cursor:pointer;
    font-weight:600;
    background:white;
}

.profile-menu-item:hover{
    background:#f1f5f9;
}

.profile-menu-item.logout-item{
    color:#dc2626;
}

/* ================= PROFILE INFO ================= */

.profile-picture-wrap{
    padding:0 18px;
    margin-top:-60px;
    position:relative;
    z-index:20;
}

/* ================= NEW PROFILE PICTURE CAMERA ================= */

.profile-picture-box{
    position:relative;
    width:115px;
    height:115px;
}

.profile-picture{
    width:115px;
    height:115px;
    border-radius:50%;
    border:5px solid white;
    object-fit:cover;
    background:#2563eb;
    box-shadow:0 4px 14px rgba(0,0,0,.2);
    display:block;
}

.profile-picture-camera{
    position:absolute;
    right:0;
    bottom:0;
    width:38px;
    height:38px;
    border-radius:50%;
    background:white;
    color:#222;
    font-size:18px;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 3px 10px rgba(0,0,0,.25);
    border:3px solid white;
    z-index:30;
    transition:.15s;
}

.profile-picture-camera:hover{
    transform:scale(1.05);
    background:#f8fafc;
}

.profile-name{
    font-size:25px;
    font-weight:bold;
    margin-top:10px;
}

.profile-username{
    color:#888;
    font-size:13px;
    margin-top:3px;
}

.profile-status{
    color:#555;
    margin-top:8px;
    cursor:pointer;
}

.profile-bio{
    color:#444;
    margin-top:10px;
    line-height:1.5;
    white-space:pre-wrap;
}

/* ================= PROFILE EXTRA BUTTONS ================= */

.profile-buttons{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    padding:16px;
}

.profile-buttons button{
    padding:12px 8px;
    border-radius:11px;
    background:#eef2ff;
    color:#2563eb;
    font-weight:bold;
}

/* ================= INFO ================= */

.info-title{
    padding:15px 15px 5px;
    font-size:18px;
    font-weight:bold;
}

.info-list{
    padding:0 15px 15px;
}

.info-row{
    padding:12px 0;
    border-bottom:1px solid #eee;
}

.info-label{
    color:#888;
    font-size:12px;
    margin-bottom:3px;
}

.info-value{
    font-weight:500;
}

/* ================= MUSIC ================= */

.music-box{
    margin:0 15px 15px;
    background:#f5f7fb;
    padding:14px;
    border-radius:14px;
}

.music-title{
    font-weight:bold;
    margin-bottom:9px;
}

.music-box audio{
    width:100%;
}

.music-buttons{
    display:flex;
    gap:8px;
    margin-top:9px;
}

.music-buttons button{
    flex:1;
    padding:9px;
    border-radius:9px;
}

/* ================= BOTTOM NAV ================= */

.bottom-nav{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    z-index:200;
    height:65px;
    background:white;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    box-shadow:0 -2px 12px rgba(0,0,0,.1);
}

.nav-btn{
    background:white;
    color:#777;
    font-size:12px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:3px;
}

.nav-btn span{
    font-size:21px;
}

.nav-btn.active{
    color:#2563eb;
    font-weight:bold;
}

/* ================= MODAL ================= */

.modal-bg{
    position:fixed;
    inset:0;
    z-index:500;
    background:rgba(0,0,0,.55);
    display:none;
    align-items:center;
    justify-content:center;
    padding:18px;
}

.modal-bg.show{
    display:flex;
}

.modal{
    width:100%;
    max-width:500px;
    max-height:90vh;
    overflow:auto;
    background:white;
    border-radius:18px;
    padding:20px;
}

.modal-title{
    font-size:20px;
    font-weight:bold;
    margin-bottom:15px;
}

.modal-actions{
    display:flex;
    gap:8px;
    margin-top:15px;
}

.modal-actions button{
    flex:1;
    padding:12px;
    border-radius:10px;
    font-weight:bold;
}

.modal-ok{
    background:#2563eb;
    color:white;
}

.modal-cancel{
    background:#eee;
}

/* ================= CHAT ================= */

.chat-overlay{
    position:fixed;
    inset:0;
    z-index:400;
    background:#eef2f7;
    display:none;
    flex-direction:column;
}

.chat-overlay.show{
    display:flex;
}

.chat-head{
    height:60px;
    background:white;
    display:flex;
    align-items:center;
    gap:10px;
    padding:0 12px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.chat-back{
    font-size:25px;
    background:transparent;
}

.chat-title{
    font-weight:bold;
}

.chat-body{
    flex:1;
    overflow:auto;
    padding:15px;
}

.chat-message{
    max-width:75%;
    padding:10px 12px;
    border-radius:15px;
    margin-bottom:9px;
    background:white;
    box-shadow:0 2px 5px rgba(0,0,0,.05);
}

.chat-message.mine{
    margin-left:auto;
    background:#2563eb;
    color:white;
}

.chat-foot{
    background:white;
    padding:10px;
    display:flex;
    gap:8px;
}

.chat-foot input{
    flex:1;
    padding:12px;
    border:1px solid #ddd;
    border-radius:12px;
}

.chat-foot button{
    padding:0 17px;
    border-radius:12px;
    background:#2563eb;
    color:white;
}

/* ================= EMPTY ================= */

.empty{
    text-align:center;
    padding:35px 15px;
    color:#888;
    background:white;
    border-radius:16px;
}

/* ================= RESPONSIVE ================= */

@media(max-width:430px){

    .profile-cover{
        height:330px;
    }

    .profile-picture-box{
        width:105px;
        height:105px;
    }

    .profile-picture{
        width:105px;
        height:105px;
    }

    .profile-picture-camera{
        width:36px;
        height:36px;
        font-size:17px;
    }

    .profile-picture-wrap{
        margin-top:-55px;
    }

    .profile-menu{
        width:195px;
        right:0;
    }

    .profile-buttons{
        grid-template-columns:1fr 1fr;
    }
}

</style>
</head>

<body>

<!-- ================= LOGIN ================= -->

<div id="loginPage">

    <div class="login-box">

        <div class="logo">
            YAM
        </div>

        <div class="login-sub">
            Chat • Friends • Rooms • Social
        </div>

        <input
            id="loginUsername"
            class="input"
            placeholder="Username">

        <input
            id="loginPassword"
            class="input"
            type="password"
            placeholder="Password">

        <button
            class="primary-btn"
            onclick="login()">
            🔐 LOGIN
        </button>

        <button
            class="secondary-btn"
            onclick="register()">
            📝 DAFTAR AKAUN
        </button>

    </div>

</div>


<!-- ================= APP ================= -->

<div id="app">

    <div class="topbar">

        <div class="top-logo">
            YAM
        </div>

        <div
            id="topUser"
            class="top-user">
        </div>

    </div>


    <main class="main">

        <!-- ================= HOME ================= -->

        <section
            id="homePage"
            class="page active">

            <div class="create-box">

                <div class="create-title">
                    📝 Apa yang anda mahu post?
                </div>

                <div class="post-options">

                    <button
                        id="textPostBtn"
                        class="post-option active"
                        onclick="selectPostType('text')">
                        📝 TULISAN
                    </button>

                    <button
                        id="imagePostBtn"
                        class="post-option"
                        onclick="selectPostType('image')">
                        🖼️ GAMBAR
                    </button>

                    <button
                        id="videoPostBtn"
                        class="post-option"
                        onclick="selectPostType('video')">
                        🎥 VIDEO
                    </button>

                </div>


                <div
                    id="postEditor"
                    class="post-editor">

                    <textarea
                        id="postText"
                        placeholder="Apa yang anda fikirkan?"></textarea>

                    <div
                        id="mediaPreview"
                        class="media-preview">
                    </div>

                    <div class="editor-actions">

                        <button
                            class="cancel-btn"
                            onclick="cancelPost()">
                            Batal
                        </button>

                        <button
                            class="post-btn"
                            onclick="createPost()">
                            🚀 POST
                        </button>

                    </div>

                </div>

            </div>

            <div id="feed"></div>

        </section>


        <!-- ================= FRIENDS ================= -->

        <section
            id="friendsPage"
            class="page">

            <div class="section-title">
                👥 Friends
            </div>

            <div id="friendsList"></div>

        </section>


        <!-- ================= ROOMS ================= -->

        <section
            id="roomsPage"
            class="page">

            <div class="section-title">
                🌎 YAM Rooms
            </div>

            <div id="roomsList"></div>

        </section>


        <!-- ================= PROFILE ================= -->

        <section
            id="profilePage"
            class="page">

            <div class="profile-main">

                <!-- ================= FULL COVER ================= -->

                <div
                    id="profileCover"
                    class="profile-cover">

                    <div class="cover-dark"></div>

                    <!-- CAMERA + THREE DOT -->

                    <div class="profile-top-actions">

                        <!-- COVER CAMERA -->

                        <button
                            onclick="changeCover()"
                            title="Tukar Background Cover">
                            📷
                        </button>


                        <!-- THREE DOT + MENU -->

                        <div class="profile-menu-wrap">

                            <button
                                onclick="openProfileMenu()"
                                title="Menu Profile">
                                ⋮
                            </button>

                            <div
                                id="profileMenu"
                                class="profile-menu hidden">

                                <div
                                    class="profile-menu-item"
                                    onclick="editProfile()">
                                    ✏️ Edit Profile
                                </div>

                                <div
                                    class="profile-menu-item"
                                    onclick="changeName()">
                                    ✍️ Tukar Nama
                                </div>

                                <div
                                    class="profile-menu-item"
                                    onclick="changePassword()">
                                    🔑 Tukar Password
                                </div>

                                <div
                                    class="profile-menu-item logout-item"
                                    onclick="logout()">
                                    🚪 Log Out
                                </div>

                            </div>

                        </div>

                    </div>

                </div>


                <!-- ================= PROFILE INFO ================= -->

                <div class="profile-picture-wrap">

                    <!-- PROFILE PICTURE + CAMERA -->

                    <div class="profile-picture-box">

                        <img
                            id="profilePicture"
                            class="profile-picture"
                            src=""
                            alt="Profile">

                        <button
                            class="profile-picture-camera"
                            onclick="changeProfilePicture()"
                            title="Tukar Gambar Profile">
                            📷
                        </button>

                    </div>


                    <div
                        id="profileName"
                        class="profile-name">
                    </div>


                    <div
                        id="profileUsername"
                        class="profile-username">
                    </div>


                    <div
                        id="profileStatus"
                        class="profile-status"
                        onclick="editStatus()">
                    </div>


                    <div
                        id="profileBio"
                        class="profile-bio">
                    </div>

                </div>


                <!-- ================= EXTRA BUTTONS ================= -->

                <div class="profile-buttons">

                    <!-- Tukar Gambar sudah dibuang -->

                    <button
                        onclick="editStatus()">
                        🟢 Status
                    </button>

                    <button
                        onclick="openMusic()">
                        🎵 Music
                    </button>

                    <button
                        onclick="openPrivacy()">
                        🔒 Privacy
                    </button>

                </div>


                <!-- ================= MUSIC ================= -->

                <div
                    id="musicArea"
                    class="music-box hidden">
                </div>


                <!-- ================= INFO ================= -->

                <div class="info-title">
                    ℹ️ Maklumat Profile
                </div>

                <div
                    id="profileInfo"
                    class="info-list">
                </div>

            </div>

        </section>

    </main>


    <!-- ================= BOTTOM NAV ================= -->

    <nav class="bottom-nav">

        <button
            id="navHome"
            class="nav-btn active"
            onclick="showPage('home')">

            <span>🏠</span>
            Home

        </button>


        <button
            id="navFriends"
            class="nav-btn"
            onclick="showPage('friends')">

            <span>👥</span>
            Friends

        </button>

/* ================= GLOBAL ================= */

let currentUser =

/* ================= HELPERS ================= */

function getAccounts(){

    return JSON.parse(
        localStorage.getItem("yam_accounts") || "{}"
    );

}


function saveAccounts(accounts){

    localStorage.setItem(
        "yam_accounts",
        JSON.stringify(accounts)
    );

}


function getProfileData(username){

    const accounts = getAccounts();

    if(accounts[username]){
        return accounts[username];
    }

    return {
        username:username,
        name:username,
        password:"",
        status:"Available",
        bio:"",
        birthday:"",
        location:"",
        job:"",
        gender:""
    };

}


function saveCurrentProfile(data){

    const accounts = getAccounts();

    accounts[currentUser] = data;

    saveAccounts(accounts);

}


function escapeHtml(text){

    return String(text ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function getAvatar(username){

    return localStorage.getItem(
        "yam_picture_" + username
    ) || "";

}


function avatarHtml(username){

    const avatar = getAvatar(username);

    if(avatar){

        return `
            <img
                class="avatar"
                src="${avatar}"
                alt="Profile">
        `;

    }

    const profile = getProfileData(username);

    const letter =
        (profile.name || username || "?")
        .charAt(0)
        .toUpperCase();

    return `
        <div
            class="avatar"
            style="
                display:flex;
                align-items:center;
                justify-content:center;
                color:white;
                font-weight:bold;
                font-size:18px;
            ">
            ${escapeHtml(letter)}
        </div>
    `;

}


function timeAgo(timestamp){

    const diff =
        Date.now() - timestamp;

    const minute =
        Math.floor(diff / 60000);

    if(minute < 1){
        return "baru sahaja";
    }

    if(minute < 60){
        return minute + " minit lalu";
    }

    const hour =
        Math.floor(minute / 60);

    if(hour < 24){
        return hour + " jam lalu";
    }

    const day =
        Math.floor(hour / 24);

    return day + " hari lalu";

}


/* ================= AUTH ================= */

    const username =

    const password =
        document.getElementById("loginPassword")
        .value;

    if(!username || !password){

        alert("Sila isi username dan password.");

        return;
    }

    const accounts = getAccounts();

    if(!accounts[username]){

        accounts[username] = {

            username:username,
            name:username,
            password:password,
            status:"🟢 Available",
            bio:"",
            birthday:"",
            location:"",
            job:"",
            gender:""

        };

        saveAccounts(accounts);

    }

    if(accounts[username].password !== password){

        alert("Password tidak betul.");

        return;

    currentUser = username;

    localStorage.setItem(
        "yam_current_user",

}

function logout(){

    if(!confirm("Log Out dari YAM?")) return;

    closeProfileMenu();

/* ================= START APP ================= */

function startApp(){

    document.getElementById("loginPage")

    document.getElementById("app")
        .style.display = "block";

    renderProfile();
    renderFeed();
    renderFriends();
    renderRooms();

}


/* ================= NAV ================= */

function showPage(page){

    closeProfileMenu();

    document.querySelectorAll(".page")
        .forEach(el => {

            el.classList.remove("active");

        });

    document.querySelectorAll(".nav-btn")
        .forEach(el => {

            el.classList.remove("active");

        });


    if(page === "home"){

        document.getElementById("homePage")
            .classList.add("active");

        document.getElementById("navHome")
            .classList.add("active");

    }


    if(page === "friends"){

        document.getElementById("friendsPage")
            .classList.add("active");

        document.getElementById("navFriends")
            .classList.add("active");

            .classList.add("active");

            .classList.add("active");

            .classList.add("active");

        document.getElementById("navProfile")
            .classList.add("active");

/* ================= POST TYPE ================= */

function selectPostType(type){

    selectedPostType = type;
    selectedPostFile = null;

    document
        .querySelectorAll(".post-option")
        .forEach(btn => {

            btn.classList.remove("active");

        });


    if(type === "text"){

        document.getElementById("textPostBtn")
            .classList.add("active");

    }


    if(type === "image"){

        document.getElementById("imagePostBtn")
            .classList.add("active");

        document.getElementById("postImageFile")
            .click();

    }


    if(type === "video"){

        document.getElementById("videoPostBtn")
            .classList.add("active");

        document.getElementById("postVideoFile")
            .click();

    }

}


/* ================= POST MEDIA ================= */

document.getElementById("postImageFile")
.addEventListener("change",function(){

    const file = this.files[0];

    if(!file) return;

    if(file.size > 3 * 1024 * 1024){

        alert("Gambar maksimum 3MB.");

        this.value = "";

        return;
    }

    selectedPostFile = file;

    const reader = new FileReader();

    reader.onload = function(e){

        document.getElementById("mediaPreview")
            .innerHTML = `
                <img src="${e.target.result}">
            `;

    };

    reader.readAsDataURL(file);

});


document.getElementById("postVideoFile")
.addEventListener("change",function(){

    const file = this.files[0];

    if(!file) return;

    if(file.size > 6 * 1024 * 1024){

        alert("Video maksimum 6MB.");

        this.value = "";

        return;
    }

    selectedPostFile = file;

    const reader = new FileReader();

    reader.onload = function(e){

        document.getElementById("mediaPreview")
            .innerHTML = `
                <video
                    src="${e.target.result}"
                    controls>
                </video>
            `;

    };

    reader.readAsDataURL(file);

});


/* ================= CREATE POST ================= */

function createPost(){

    const text =
        document.getElementById("postText")
        .value.trim();

    if(selectedPostType === "text" && !text){

        alert("Tulis sesuatu dahulu.");

        return;
    }

    if(
        (selectedPostType === "image" ||
         selectedPostType === "video")
        &&
        !selectedPostFile
    ){

        alert("Sila pilih media dahulu.");

        return;
    }


    const finish = function(media){

        const posts =
            JSON.parse(
                localStorage.getItem("yam_posts") || "[]"
            );

        posts.unshift({

            id:Date.now(),
            owner:currentUser,
            text:text,
            type:selectedPostType,
            media:media,
            time:Date.now(),
            likes:[],
            comments:[],
            hiddenComments:false,
            blockedUsers:[]

        });

        localStorage.setItem(
            "yam_posts",
            JSON.stringify(posts)
        );

        cancelPost();

        renderFeed();

    };


    if(selectedPostFile){

        const reader = new FileReader();

        reader.onload = function(e){

            finish(e.target.result);

        };

        reader.readAsDataURL(
            selectedPostFile
        );

    }else{

        finish("");

    }

}


/* ================= CANCEL POST ================= */

function cancelPost(){

    document.getElementById("postText")
        .value = "";

    document.getElementById("mediaPreview")
        .innerHTML = "";

    document.getElementById("postImageFile")
        .value = "";

    document.getElementById("postVideoFile")
        .value = "";

    selectedPostFile = null;

    selectPostType("text");

}


/* ================= FEED ================= */

function renderFeed(){

    const feed =
        document.getElementById("feed");

    const posts =
        JSON.parse(
            localStorage.getItem("yam_posts") || "[]"
        );


    if(!posts.length){

        feed.innerHTML = `
            <div class="empty">
                Belum ada post.<br>
                Jadilah orang pertama post di YAM.
            </div>
        `;

        return;
    }


    feed.innerHTML =
        posts.map(post => {

            const profile =
                getProfileData(post.owner);

            const liked =
                (post.likes || [])
                .includes(currentUser);

            let media = "";


            if(post.type === "image" && post.media){

                media = `
                    <img
                        class="post-media"
                        src="${post.media}">
                `;

            }


            if(post.type === "video" && post.media){

                media = `
                    <video
                        class="post-media"
                        src="${post.media}"
                        controls>
                    </video>
                `;

            }


            const ownerMenu =
                post.owner === currentUser
                ?
                `
                    <button
                        class="post-menu"
                        onclick="postOwnerMenu('${post.id}')">
                        ⋮
                    </button>
                `
                :
                "";


            return `

                <article class="post-card">

                    <div class="post-head">

                        ${avatarHtml(post.owner)}

                        <div>

                            <div class="post-user">
                                ${escapeHtml(
                                    profile.name ||
                                    post.owner
                                )}
                            </div>

                            <div class="post-time">
                                ${timeAgo(post.time)}
                            </div>

                        </div>

                        ${ownerMenu}

                    </div>


                    ${
                        post.text
                        ?
                        `
                        <div class="post-text">
                            ${escapeHtml(post.text)}
                        </div>
                        `
                        :
                        ""
                    }


                    ${media}


                    <div class="post-actions">

                        <button
                            class="${liked ? "liked" : ""}"
                            onclick="toggleLike('${post.id}')">

                            ${liked ? "💙" : "🤍"}
                            ${(post.likes || []).length}

                        </button>


                        <button
                            onclick="focusComment('${post.id}')">

                            💬
                            ${(post.comments || []).length}

                        </button>

                    </div>


                    <div
                        id="comments-${post.id}"
                        class="comments">

                        ${renderComments(post)}

                    </div>

                </article>

            `;

        }).join("");

}


/* ================= LIKE ================= */

function toggleLike(id){

    const posts =
        JSON.parse(
            localStorage.getItem("yam_posts") || "[]"
        );

    const post =
        posts.find(
            p => String(p.id) === String(id)
        );

    if(!post) return;

    post.likes = post.likes || [];

    const index =
        post.likes.indexOf(currentUser);


    if(index >= 0){

        post.likes.splice(index,1);

    }else{

        post.likes.push(currentUser);

    }


    localStorage.setItem(
        "yam_posts",
        JSON.stringify(posts)
    );

    renderFeed();

}


/* ================= COMMENTS ================= */

function renderComments(post){

    let html = "";


    if(post.hiddenComments){

        if(post.owner === currentUser){

            html += `
                <div
                    style="
                        padding:10px;
                        color:#777;
                        text-align:center;
                    ">

                    🔒 Komen disembunyikan

                </div>
            `;

        }

    }else{

        (post.comments || [])
        .forEach(comment => {

            const p =
                getProfileData(comment.user);

            const own =
                comment.user === currentUser;


            html += `

                <div class="comment">

                    ${avatarHtml(comment.user)}

                    <div class="comment-body">

                        <div class="comment-name">

                            ${escapeHtml(
                                p.name ||
                                comment.user
                            )}

                        </div>

                        <div class="comment-text">

                            ${escapeHtml(
                                comment.text
                            )}

                        </div>

                    </div>


                    ${
                        own || post.owner === currentUser
                        ?
                        `
                        <button
                            onclick="commentMenu(
                                '${post.id}',
                                '${comment.id}'
                            )"
                            style="
                                background:transparent;
                                font-size:18px;
                            ">

                            ⋮

                        </button>
                        `
                        :
                        ""
                    }

                </div>

            `;

        });

    }


    html += `

        <div class="comment-input">

            <input
                id="comment-${post.id}"
                placeholder="Tulis komen...">

            <button
                onclick="addComment('${post.id}')">

                ➤

            </button>

        </div>

    `;


    return html;

}


/* ================= ADD COMMENT ================= */

function addComment(id){

    const input =
        document.getElementById(
            "comment-" + id
        );

    if(!input) return;

    const text =
        input.value.trim();

    if(!text) return;


    const posts =
        JSON.parse(
            localStorage.getItem("yam_posts") || "[]"
        );


    const post =
        posts.find(
            p => String(p.id) === String(id)
        );

    if(!post) return;


    post.comments =
        post.comments || [];


    post.comments.push({

        id:Date.now(),
        user:currentUser,
        text:text,
        time:Date.now()

    });


    localStorage.setItem(
        "yam_posts",
        JSON.stringify(posts)
    );


    renderFeed();

}


/* ================= COMMENT MENU ================= */

function commentMenu(postId,commentId){

    const posts =
        JSON.parse(
            localStorage.getItem("yam_posts") || "[]"
        );


    const post =
        posts.find(
            p => String(p.id) === String(postId)
        );

    if(!post) return;


    const comment =
        (post.comments || [])
        .find(
            c => String(c.id) === String(commentId)
        );

    if(!comment) return;


    const canManage =
        comment.user === currentUser ||
        post.owner === currentUser;


    if(!canManage) return;


    let html = "";


    if(post.owner === currentUser){

        html += `

            <button
                class="secondary-btn"
                onclick="
                    toggleCommentVisibility('${postId}');
                    closeModal();
                ">

                ${
                    post.hiddenComments
                    ? "👁️ Tunjukkan Komen"
                    : "🔒 Sembunyikan Komen"
                }

            </button>

        `;

    }


    html += `

        <button
            class="secondary-btn"
            onclick="
                deleteComment('${postId}','${commentId}');
                closeModal();
            ">

            🗑️ Padam Komen

        </button>

    `;


    if(
        post.owner === currentUser &&
        comment.user !== currentUser
    ){

        html += `

            <button
                class="secondary-btn"
                onclick="
                    blockCommenter(
                        '${postId}',
                        '${comment.user}'
                    );
                    closeModal();
                ">

                🚫 Block Pengguna

            </button>

        `;

    }


    openModal(
        "⚙️ Komen",
        html,
        function(){}
    );

}


/* ================= DELETE COMMENT ================= */

function deleteComment(postId,commentId){

    const posts =
        JSON.parse(
            localStorage.getItem("yam_posts") || "[]"
        );


    const post =
        posts.find(
            p => String(p.id) === String(postId)
        );

    if(!post) return;


    const comment =
        (post.comments || [])
        .find(
            c => String(c.id) === String(commentId)
        );

    if(!comment) return;


    if(
        comment.user !== currentUser &&
        post.owner !== currentUser
    ){

        return;

    }


    post.comments =
        (post.comments || [])
        .filter(
            c => String(c.id) !== String(commentId)
        );


    localStorage.setItem(
        "yam_posts",
        JSON.stringify(posts)
    );


    renderFeed();

}


/* ================= HIDE COMMENTS ================= */

function toggleCommentVisibility(id){

    const posts =
        JSON.parse(
            localStorage.getItem("yam_posts") || "[]"
        );


    const post =
        posts.find(
            p => String(p.id) === String(id)
        );

    if(!post) return;


    if(post.owner !== currentUser) return;


    post.hiddenComments =
        !post.hiddenComments;


    localStorage.setItem(
        "yam_posts",
        JSON.stringify(posts)
    );


    renderFeed();

}


/* ================= BLOCK COMMENTER ================= */

function blockCommenter(postId,username){

    const posts =
        JSON.parse(
            localStorage.getItem("yam_posts") || "[]"
        );


    const post =
        posts.find(
            p => String(p.id) === String(postId)
        );

    if(!post) return;


    if(post.owner !== currentUser) return;


    post.blockedUsers =
        post.blockedUsers || [];


    if(!post.blockedUsers.includes(username)){

        post.blockedUsers.push(username);

    }


    post.comments =
        (post.comments || [])
        .filter(
            c => c.user !== username
        );


    localStorage.setItem(
        "yam_posts",
        JSON.stringify(posts)
    );


    renderFeed();

}


function unblockCommenter(postId,username){

    const posts =
        JSON.parse(
            localStorage.getItem("yam_posts") || "[]"
        );


    const post =
        posts.find(
            p => String(p.id) === String(postId)
        );

    if(!post) return;


    post.blockedUsers =
        (post.blockedUsers || [])
        .filter(
            u => u !== username
        );


    localStorage.setItem(
        "yam_posts",
        JSON.stringify(posts)
    );


    renderFeed();

}


/* ================= POST OWNER MENU ================= */

function postOwnerMenu(id){

    const html = `

        <button
            class="secondary-btn"
            onclick="
                deletePost('${id}');
                closeModal();
            ">

            🗑️ Padam Post

        </button>

    `;


    openModal(
        "⚙️ Menu Post",
        html
    );

}


function deletePost(id){

    const posts =
        JSON.parse(
            localStorage.getItem("yam_posts") || "[]"
        );


    const post =
        posts.find(
            p => String(p.id) === String(id)
        );

    if(!post) return;


    if(post.owner !== currentUser){

        alert("Hanya pemilik post boleh padam.");

        return;

    }


    const updated =
        posts.filter(
            p => String(p.id) !== String(id)
        );


    localStorage.setItem(
        "yam_posts",
        JSON.stringify(updated)
    );


    renderFeed();

}

function focusComment(id){

        document.getElementById(
            "comment-" + id

    if(input){

        input.focus();

}

/* ================= PROFILE ================= */

function renderProfile(){

/* ================= CHAT ================= */

function chatKey(){

    return (
        "yamchat_" +
        currentUser +
        "_" +
        currentChatUser
    );

}


function openChat(username){

    currentChatUser =
        username;


    const profile =
        getProfileData(username);


    document.getElementById(
        "chatTitle"
    ).textContent =
        profile.name ||
        username;


    const avatar =
        getAvatar(username);


    const img =
        document.getElementById(
            "chatAvatar"
        );


    if(avatar){

        img.src =
            avatar;

    }else{

        img.src =
            "data:image/svg+xml;charset=UTF-8," +
            encodeURIComponent(`

                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="100"
                    height="100">

                    <rect
                        width="100"
                        height="100"
                        fill="#2563eb"/>

                    <text
                        x="50%"
                        y="62%"
                        text-anchor="middle"
                        font-size="45"
                        fill="white"
                        font-family="Arial">

                        ${
                            (
                                profile.name ||
                                username
                            )
                            .charAt(0)
                            .toUpperCase()
                        }

                    </text>

                </svg>

            `);

    }


    document.getElementById(
        "chatOverlay"
    ).classList.add(
        "show"
    );


    renderChat();

}


function closeChat(){

    document.getElementById(
        "chatOverlay"
    ).classList.remove(
        "show"
    );


    currentChatUser = null;

}


function renderChat(){

    if(!currentChatUser) return;


    const body =
        document.getElementById(
            "chatBody"
        );


    const messages =
        JSON.parse(
            localStorage.getItem(
                chatKey()
            ) || "[]"
        );


    if(!messages.length){

        body.innerHTML = `

            <div class="empty">

                Belum ada mesej.

            </div>

        `;

        return;
    }


    body.innerHTML =
        messages.map(msg => {

            const mine =
                msg.user === currentUser;


            return `

                <div
                    class="
                        chat-message
                        ${mine ? "mine" : ""}
                    ">

                    ${escapeHtml(msg.text)}

                </div>

            `;

        }).join("");


    body.scrollTop =
        body.scrollHeight;

}


function sendChat(){

    if(!currentChatUser) return;


    const input =
        document.getElementById(
            "chatInput"
        );


    const text =
        input.value.trim();


    if(!text) return;


    const messages =
        JSON.parse(
            localStorage.getItem(
                chatKey()
            ) || "[]"
        );


    messages.push({

        user:currentUser,
        text:text,
        time:Date.now()

    });


    localStorage.setItem(
        chatKey(),
        JSON.stringify(messages)
    );


    input.value = "";


    renderChat();

}


/* ================= ENTER CHAT ================= */

document.getElementById(

)
.addEventListener(
    "keydown",
    function(e){

        if(e.key === "Enter"){

            sendChat();

        }

    }
);


/* ================= ROOM ================= */

function openRoom(roomName){

    const key =
        "yamroom_" +
        roomName;


    const messages =
        JSON.parse(
            localStorage.getItem(key) || "[]"
        );


    let html = `

        <div
            id="roomMessages"
            style="
                max-height:280px;
                overflow:auto;
                margin-bottom:10px;
            ">

    `;


    if(!messages.length){

        html += `

            <div class="empty">

                Belum ada mesej dalam room.

            </div>

        `;

    }else{

        messages.forEach(msg => {

            const p =
                getProfileData(msg.user);


            html += `

                <div style="
                    padding:9px;
                    background:#f1f5f9;
                    border-radius:10px;
                    margin-bottom:7px;
                ">

                    <b>

                        ${escapeHtml(
                            p.name ||
                            msg.user
                        )}

                    </b>

                    <div>

                        ${escapeHtml(
                            msg.text
                        )}

                    </div>

                </div>

            `;

        });

    }


    html += `

        </div>


        <input
            id="roomInput"
            class="input"
            placeholder="Tulis mesej room...">

    `;


    openModal(
        "🌎 " + roomName,
        html,
        function(){

            const input =
                document.getElementById(
                    "roomInput"
                );


            const text =
                input.value.trim();


            if(!text) return;


            messages.push({

                user:currentUser,
                text:text,
                time:Date.now()

            });


            localStorage.setItem(
                key,
                JSON.stringify(messages)
            );


            closeModal();


            openRoom(roomName);

        }
    );

}


/* ================= MODAL ================= */

function openModal(
    title,
    content,
    okFunction
){

    document.getElementById(
        "modalTitle"
    ).textContent =
        title;


    document.getElementById(
        "modalContent"
    ).innerHTML =
        content;


    const ok =
        document.getElementById(
            "modalOk"
        );


    ok.onclick =
        okFunction ||
        closeModal;


    document.getElementById(
        "modalBg"
    ).classList.add(
        "show"
    );

}


function closeModal(){

    document.getElementById(
        "modalBg"
    ).classList.remove(
        "show"
    );

}

if(currentUser){

    startApp();

}
