<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Y-M Chat - Profile V1.0</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#eef3f8;
    color:#222;
}

.app{
    width:100%;
    max-width:480px;
    min-height:100vh;
    margin:auto;
    background:#fff;
    position:relative;
    padding-bottom:75px;
}

/* HEADER */
.topbar{
    height:58px;
    background:#1976d2;
    color:white;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 16px;
    position:sticky;
    top:0;
    z-index:20;
    box-shadow:0 2px 6px rgba(0,0,0,.18);
}

.topbar h2{
    font-size:20px;
}

.topbar button{
    border:0;
    background:transparent;
    color:white;
    font-size:27px;
    cursor:pointer;
}

/* COVER */
.cover{
    height:190px;
    background:linear-gradient(135deg,#1976d2,#64b5f6);
    position:relative;
    overflow:hidden;
}

.cover img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:none;
}

.cover-camera{
    position:absolute;
    right:12px;
    bottom:12px;
    width:42px;
    height:42px;
    border-radius:50%;
    border:0;
    background:white;
    font-size:20px;
    cursor:pointer;
    box-shadow:0 2px 7px rgba(0,0,0,.25);
}

/* PROFILE */
.profile-area{
    padding:0 15px;
}

.profile-head{
    position:relative;
    min-height:130px;
}

.avatar-box{
    position:absolute;
    top:-58px;
    left:10px;
}

.avatar{
    width:116px;
    height:116px;
    border-radius:50%;
    border:5px solid white;
    background:#dcecff;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    box-shadow:0 2px 8px rgba(0,0,0,.25);
}

.avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:none;
}

.avatar-text{
    font-size:44px;
    color:#1976d2;
    font-weight:bold;
}

.avatar-camera{
    position:absolute;
    right:2px;
    bottom:3px;
    width:36px;
    height:36px;
    border-radius:50%;
    border:3px solid white;
    background:#1976d2;
    color:white;
    font-size:16px;
    cursor:pointer;
}

.profile-info{
    padding-top:67px;
    padding-left:5px;
}

.profile-info h1{
    font-size:23px;
    margin-bottom:4px;
}

.profile-info .ymid{
    color:#777;
    font-size:14px;
}

.bio{
    margin-top:9px;
    color:#555;
    line-height:1.4;
}

/* MENU */
.menu{
    position:absolute;
    right:10px;
    top:10px;
    z-index:10;
}

.menu-button{
    width:42px;
    height:42px;
    border-radius:50%;
    border:0;
    background:rgba(255,255,255,.92);
    font-size:25px;
    cursor:pointer;
    box-shadow:0 2px 6px rgba(0,0,0,.2);
}

.menu-box{
    display:none;
    position:absolute;
    right:0;
    top:48px;
    width:220px;
    background:white;
    border-radius:10px;
    box-shadow:0 4px 16px rgba(0,0,0,.22);
    overflow:hidden;
}

.menu-box button{
    width:100%;
    padding:14px;
    border:0;
    border-bottom:1px solid #eee;
    background:white;
    text-align:left;
    cursor:pointer;
    font-size:15px;
}

.menu-box button:hover{
    background:#f2f7fc;
}

/* INFO */
.info-card{
    margin-top:5px;
    background:#f7f9fc;
    border-radius:12px;
    padding:14px;
}

.info-row{
    padding:8px 0;
    border-bottom:1px solid #e5e9ee;
    font-size:14px;
}

.info-row:last-child{
    border-bottom:0;
}

.info-label{
    color:#777;
    margin-bottom:3px;
}

.info-value{
    font-weight:bold;
}

/* POST BOX */
.post-box{
    margin-top:15px;
    border:1px solid #e0e5eb;
    border-radius:12px;
    padding:13px;
    background:white;
}

.post-box h3{
    font-size:16px;
    margin-bottom:10px;
}

.post-input{
    width:100%;
    min-height:75px;
    resize:none;
    border:1px solid #ddd;
    border-radius:9px;
    padding:10px;
    font-size:15px;
    outline:none;
}

.post-input:focus{
    border-color:#1976d2;
}

.post-tools{
    display:flex;
    gap:8px;
    margin-top:10px;
    flex-wrap:wrap;
}

.post-tools button{
    border:1px solid #d9e0e7;
    background:#f6f8fa;
    border-radius:8px;
    padding:9px 12px;
    cursor:pointer;
}

.post-tools button:hover{
    background:#eaf3fc;
}

.publish{
    width:100%;
    margin-top:10px;
    padding:11px;
    border:0;
    border-radius:8px;
    background:#1976d2;
    color:white;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

.selected-file{
    margin-top:8px;
    font-size:13px;
    color:#1976d2;
}

/* POSTS */
.section-title{
    margin-top:20px;
    margin-bottom:10px;
    font-size:18px;
}

.post{
    border:1px solid #e1e5e9;
    border-radius:12px;
    margin-bottom:14px;
    overflow:hidden;
    background:white;
}

.post-header{
    display:flex;
    align-items:center;
    padding:11px;
}

.post-avatar{
    width:42px;
    height:42px;
    border-radius:50%;
    background:#1976d2;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
    overflow:hidden;
    margin-right:10px;
}

.post-avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.post-user{
    flex:1;
}

.post-user strong{
    display:block;
    font-size:14px;
}

.post-user small{
    color:#777;
    font-size:11px;
}

.post-menu{
    border:0;
    background:transparent;
    font-size:22px;
    cursor:pointer;
}

.post-content{
    padding:0 12px 12px;
    line-height:1.45;
    white-space:pre-wrap;
}

.post-media{
    width:100%;
    max-height:430px;
    object-fit:cover;
    display:block;
}

.post-actions{
    display:flex;
    border-top:1px solid #eee;
    border-bottom:1px solid #eee;
}

.post-actions button{
    flex:1;
    padding:10px 4px;
    border:0;
    background:white;
    cursor:pointer;
    font-size:13px;
}

.post-actions button:hover{
    background:#f2f6fa;
}

.like-active{
    font-weight:bold;
}

.comments{
    padding:10px 12px;
}

.comment{
    background:#f2f4f7;
    border-radius:9px;
    padding:8px 10px;
    margin-bottom:7px;
    font-size:13px;
}

.comment-top{
    display:flex;
    justify-content:space-between;
    gap:8px;
}

.comment-delete{
    border:0;
    background:transparent;
    cursor:pointer;
    color:#d32f2f;
}

.comment-hide{
    border:0;
    background:transparent;
    cursor:pointer;
    color:#777;
}

.comment-input{
    width:100%;
    border:1px solid #ddd;
    border-radius:8px;
    padding:9px;
    margin-top:5px;
}

.comment-send{
    margin-top:6px;
    border:0;
    background:#1976d2;
    color:white;
    padding:8px 13px;
    border-radius:7px;
    cursor:pointer;
}

/* MODAL */
.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    z-index:100;
    align-items:center;
    justify-content:center;
    padding:15px;
}

.modal-content{
    width:100%;
    max-width:450px;
    max-height:90vh;
    overflow-y:auto;
    background:white;
    border-radius:14px;
    padding:18px;
}

.modal-content h2{
    margin-bottom:15px;
    color:#1976d2;
}

.form-group{
    margin-bottom:11px;
}

.form-group label{
    display:block;
    font-size:13px;
    margin-bottom:5px;
    color:#555;
}

.form-group input,
.form-group textarea,
.form-group select{
    width:100%;
    padding:10px;
    border:1px solid #d5dce3;
    border-radius:8px;
    outline:none;
}

.form-group textarea{
    min-height:80px;
    resize:vertical;
}

.modal-buttons{
    display:flex;
    gap:8px;
    margin-top:15px;
}

.modal-buttons button{
    flex:1;
    padding:11px;
    border-radius:8px;
    border:0;
    cursor:pointer;
}

.save{
    background:#1976d2;
    color:white;
}

.cancel{
    background:#e9edf1;
}

/* BOTTOM NAV */
.bottom-nav{
    position:fixed;
    bottom:0;
    left:50%;
    transform:translateX(-50%);
    width:100%;
    max-width:480px;
    height:65px;
    background:white;
    border-top:1px solid #ddd;
    display:flex;
    z-index:50;
}

.bottom-nav button{
    flex:1;
    border:0;
    background:white;
    cursor:pointer;
    font-size:11px;
    color:#555;
}

.bottom-nav button span{
    display:block;
    font-size:22px;
    margin-bottom:2px;
}

.bottom-nav .active{
    color:#1976d2;
    font-weight:bold;
}

/* TOAST */
.toast{
    position:fixed;
    left:50%;
    bottom:82px;
    transform:translateX(-50%);
    background:#222;
    color:white;
    padding:10px 16px;
    border-radius:8px;
    display:none;
    z-index:200;
    font-size:14px;
}
</style>
</head>

<body>

<div class="app">

    <!-- TOP BAR -->
    <div class="topbar">
        <h2>Y-M Chat</h2>
        <button onclick="toggleMenu()">⋮</button>
    </div>

    <!-- COVER -->
    <div class="cover">
        <img id="coverImage" alt="Cover Photo">

        <button class="cover-camera" onclick="document.getElementById('coverInput').click()">
            📷
        </button>

        <input
            id="coverInput"
            type="file"
            accept="image/*"
            style="display:none"
            onchange="uploadCover(this)"
        >
    </div>

    <!-- PROFILE -->
    <div class="profile-area">

        <div class="profile-head">

            <!-- 3 DOT MENU -->
            <div class="menu">
                <button class="menu-button" onclick="toggleMenuBox()">⋮</button>

                <div class="menu-box" id="menuBox">
                    <button onclick="openEditProfile()">
                        ✏️ Edit Profile
                    </button>

                    <button onclick="openPasswordModal()">
                        🔐 Change Password
                    </button>

                    <button onclick="openEmailModal()">
                        📧 Change Email
                    </button>

                    <button onclick="logout()">
                        🚪 Log Out
                    </button>
                </div>
            </div>

            <!-- AVATAR -->
            <div class="avatar-box">

                <div class="avatar">
                    <img id="profileImage" alt="Profile Photo">
                    <span id="avatarText" class="avatar-text">N</span>
                </div>

                <button
                    class="avatar-camera"
                    onclick="document.getElementById('profileInput').click()"
                >
                    📷
                </button>

                <input
                    id="profileInput"
                    type="file"
                    accept="image/*"
                    style="display:none"
                    onchange="uploadProfile(this)"
                >
            </div>

            <!-- PROFILE INFO -->
            <div class="profile-info">
                <h1 id="profileName">Nizam@</h1>
                <div class="ymid" id="profileYmid">@nizam</div>
                <div class="bio" id="profileBio">
                    Welcome to my Y-M Chat profile.
                </div>
            </div>

        </div>

        <!-- INFO CARD -->
        <div class="info-card">

            <div class="info-row">
                <div class="info-label">🎂 Birthday</div>
                <div class="info-value" id="infoBirthday">Not set</div>
            </div>

            <div class="info-row">
                <div class="info-label">📍 Birthplace</div>
                <div class="info-value" id="infoBirthplace">Not set</div>
            </div>

            <div class="info-row">
                <div class="info-label">🎓 School</div>
                <div class="info-value" id="infoSchool">Not set</div>
            </div>

            <div class="info-row">
                <div class="info-label">🌏 Country</div>
                <div class="info-value" id="infoCountry">Malaysia</div>
            </div>

        </div>

        <!-- POST BOX -->
        <div class="post-box">

            <h3>What's on your mind?</h3>

            <textarea
                id="postText"
                class="post-input"
                placeholder="Write something..."
            ></textarea>

            <div class="post-tools">

                <button onclick="document.getElementById('postImageInput').click()">
                    📷 Photo
                </button>

                <button onclick="document.getElementById('postVideoInput').click()">
                    🎥 Video
                </button>

                <button onclick="clearPostMedia()">
                    ✖ Clear
                </button>

            </div>

            <input
                id="postImageInput"
                type="file"
                accept="image/*"
                style="display:none"
                onchange="selectPostImage(this)"
            >

            <input
                id="postVideoInput"
                type="file"
                accept="video/*"
                style="display:none"
                onchange="selectPostVideo(this)"
            >

            <div id="selectedFile" class="selected-file"></div>

            <button class="publish" onclick="createPost()">
                POST
            </button>

        </div>

        <!-- POSTS -->
        <h2 class="section-title">My Posts</h2>

        <div id="postsContainer"></div>

    </div>
</div>

<!-- BOTTOM NAV -->
<div class="bottom-nav">

    <button onclick="goHome()">
        <span>🏠</span>
        Home
    </button>

    <button onclick="showComingSoon('Chats')">
        <span>💬</span>
        Chats
    </button>

    <button onclick="showComingSoon('Friends')">
        <span>👥</span>
        Friends
    </button>

    <button onclick="showComingSoon('Rooms')">
        <span>🌎</span>
        Rooms
    </button>

    <button class="active">
        <span>👤</span>
        Profile
    </button>

</div>

<!-- EDIT PROFILE MODAL -->
<div class="modal" id="editModal">

    <div class="modal-content">

        <h2>✏️ Edit Profile</h2>

        <div class="form-group">
            <label>Name</label>
            <input id="editName" type="text">
        </div>

        <div class="form-group">
            <label>Birthday</label>
            <input id="editBirthday" type="date">
        </div>

        <div class="form-group">
            <label>Birthplace</label>
            <input id="editBirthplace" type="text">
        </div>

        <div class="form-group">
            <label>School</label>
            <input id="editSchool" type="text">
        </div>

        <div class="form-group">
            <label>Country</label>
            <input id="editCountry" type="text">
        </div>

        <div class="form-group">
            <label>Bio</label>
            <textarea id="editBio"></textarea>
        </div>

        <div class="modal-buttons">
            <button class="cancel" onclick="closeModal('editModal')">
                Cancel
            </button>

            <button class="save" onclick="saveProfile()">
                Save
            </button>
        </div>

    </div>
</div>

<!-- PASSWORD MODAL -->
<div class="modal" id="passwordModal">

    <div class="modal-content">

        <h2>🔐 Change Password</h2>

        <div class="form-group">
            <label>Current Password</label>
            <input id="currentPassword" type="password">
        </div>

        <div class="form-group">
            <label>New Password</label>
            <input id="newPassword" type="password">
        </div>

        <div class="form-group">
            <label>Confirm New Password</label>
            <input id="confirmPassword" type="password">
        </div>

        <div class="modal-buttons">

            <button class="cancel" onclick="closeModal('passwordModal')">
                Cancel
            </button>

            <button class="save" onclick="changePassword()">
                Change
            </button>

        </div>

    </div>
</div>

<!-- EMAIL MODAL -->
<div class="modal" id="emailModal">

    <div class="modal-content">

        <h2>📧 Change Email</h2>

        <div class="form-group">
            <label>New Email</label>
            <input id="newEmail" type="email">
        </div>

        <div class="form-group">
            <label>Confirm New Email</label>
            <input id="confirmEmail" type="email">
        </div>

        <div class="modal-buttons">

            <button class="cancel" onclick="closeModal('emailModal')">
                Cancel
            </button>

            <button class="save" onclick="changeEmail()">
                Save Email
            </button>

        </div>

    </div>
</div>

<div class="toast" id="toast"></div>

<script>

/* =====================================================
   Y-M CHAT PROFILE V1.0
   ===================================================== */

const ACCOUNT_KEY = "ym_accounts";
const CURRENT_USER_KEY = "ym_current_user";
const PROFILE_KEY = "ym_profiles";
const POSTS_KEY = "ym_profile_posts";

let currentUser = null;
let profileData = {};
let posts = [];

let selectedPostImage = null;
let selectedPostVideo = null;


/* =====================================================
   HELPERS
   ===================================================== */

function getAccounts(){
    try{
        return JSON.parse(localStorage.getItem(ACCOUNT_KEY)) || [];
    }catch(e){
        return [];
    }
}

function saveAccounts(accounts){
    localStorage.setItem(
        ACCOUNT_KEY,
        JSON.stringify(accounts)
    );
}

function getProfiles(){
    try{
        return JSON.parse(localStorage.getItem(PROFILE_KEY)) || {};
    }catch(e){
        return {};
    }
}

function saveProfiles(data){
    localStorage.setItem(
        PROFILE_KEY,
        JSON.stringify(data)
    );
}

function getPosts(){
    try{
        return JSON.parse(localStorage.getItem(POSTS_KEY)) || [];
    }catch(e){
        return [];
    }
}

function savePosts(data){
    localStorage.setItem(
        POSTS_KEY,
        JSON.stringify(data)
    );
}

function escapeHTML(text){
    if(text === null || text === undefined){
        return "";
    }

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}

function showToast(message){

    const toast = document.getElementById("toast");

    toast.textContent = message;
    toast.style.display = "block";

    clearTimeout(window.toastTimer);

    window.toastTimer = setTimeout(()=>{
        toast.style.display = "none";
    },2200);
}

function getInitial(name){

    if(!name){
        return "N";
    }

    return name.trim().charAt(0).toUpperCase() || "N";
}


/* =====================================================
   SESSION
   ===================================================== */

function initialize(){

    const savedUser =
        localStorage.getItem(CURRENT_USER_KEY);

    if(!savedUser){

        profileData = {
            name:"Nizam@",
            ymid:"@nizam",
            birthday:"",
            birthplace:"",
            school:"",
            country:"Malaysia",
            bio:"Welcome to my Y-M Chat profile.",
            profilePhoto:"",
            coverPhoto:"",
            email:""
        };

        posts = [];

        renderProfile();
        renderPosts();

        return;
    }

    currentUser = savedUser;

    const profiles = getProfiles();

    if(profiles[currentUser]){

        profileData = profiles[currentUser];

    }else{

        const accounts = getAccounts();

        const account = accounts.find(
            a =>
            a.ymid === currentUser ||
            a.username === currentUser ||
            a.name === currentUser
        );

        profileData = {
            name: account?.name || currentUser,
            ymid: account?.ymid || currentUser,
            birthday:"",
            birthplace:"",
            school:"",
            country:account?.country || "Malaysia",
            bio:"Welcome to my Y-M Chat profile.",
            profilePhoto:"",
            coverPhoto:"",
            email:account?.email || ""
        };

        profiles[currentUser] = profileData;
        saveProfiles(profiles);
    }

    posts = getPosts();

    renderProfile();
    renderPosts();
}


/* =====================================================
   PROFILE RENDER
   ===================================================== */

function renderProfile(){

    document.getElementById("profileName").textContent =
        profileData.name || "Y-M User";

    document.getElementById("profileYmid").textContent =
        profileData.ymid || currentUser || "@user";

    document.getElementById("profileBio").textContent =
        profileData.bio || "Welcome to my Y-M Chat profile.";

    document.getElementById("infoBirthday").textContent =
        profileData.birthday || "Not set";

    document.getElementById("infoBirthplace").textContent =
        profileData.birthplace || "Not set";

    document.getElementById("infoSchool").textContent =
        profileData.school || "Not set";

    document.getElementById("infoCountry").textContent =
        profileData.country || "Not set";


    /* PROFILE PHOTO */

    const profileImage =
        document.getElementById("profileImage");

    const avatarText =
        document.getElementById("avatarText");

    if(profileData.profilePhoto){

        profileImage.src =
            profileData.profilePhoto;

        profileImage.style.display = "block";
        avatarText.style.display = "none";

    }else{

        profileImage.style.display = "none";
        avatarText.style.display = "block";

        avatarText.textContent =
            getInitial(profileData.name);
    }


    /* COVER PHOTO */

    const coverImage =
        document.getElementById("coverImage");

    if(profileData.coverPhoto){

        coverImage.src =
            profileData.coverPhoto;

        coverImage.style.display = "block";

    }else{

        coverImage.style.display = "none";
    }
}


/* =====================================================
   PROFILE PHOTO
   ===================================================== */

function uploadProfile(input){

    const file = input.files[0];

    if(!file){
        return;
    }

    if(!file.type.startsWith("image/")){

        showToast("Please select an image.");

        input.value = "";
        return;
    }

    const reader = new FileReader();

    reader.onload = function(e){

        profileData.profilePhoto =
            e.target.result;

        saveCurrentProfile();

        renderProfile();

        showToast("Profile photo updated.");
    };

    reader.readAsDataURL(file);

    input.value = "";
}


/* =====================================================
   COVER PHOTO
   ===================================================== */

function uploadCover(input){

    const file = input.files[0];

    if(!file){
        return;
    }

    if(!file.type.startsWith("image/")){

        showToast("Please select an image.");

        input.value = "";
        return;
    }

    const reader = new FileReader();

    reader.onload = function(e){

        profileData.coverPhoto =
            e.target.result;

        saveCurrentProfile();

        renderProfile();

        showToast("Cover photo updated.");
    };

    reader.readAsDataURL(file);

    input.value = "";
}

/* =====================================================
   PASSWORD
   ===================================================== */

function openPasswordModal(){

    closeMenuBox();

    document.getElementById("currentPassword").value = "";
    document.getElementById("newPassword").value = "";
    document.getElementById("confirmPassword").value = "";

    document.getElementById("passwordModal").style.display =
        "flex";
}

function changePassword(){

    const current =
        document.getElementById("currentPassword").value;

    const next =
        document.getElementById("newPassword").value;

    const confirm =
        document.getElementById("confirmPassword").value;

    if(!current || !next || !confirm){

        showToast("Please complete all fields.");
        return;
    }

    if(next !== confirm){

        showToast("New passwords do not match.");
        return;
    }

    if(next.length < 6){

        showToast("Password must be at least 6 characters.");
        return;
    }

    const accounts = getAccounts();

    const index = accounts.findIndex(
        a =>
        a.ymid === currentUser ||
        a.username === currentUser ||
        a.name === currentUser
    );

    if(index === -1){

        /*
           Standalone demo:
           If there is no account database,
           simply accept the change locally.
        */

        profileData.demoPassword = next;
        saveCurrentProfile();

        closeModal("passwordModal");

        showToast("Password changed.");
        return;
    }

    const account = accounts[index];

    if(account.password !== current){

        showToast("Current password is incorrect.");
        return;
    }

    account.password = next;

    accounts[index] = account;

    saveAccounts(accounts);

    closeModal("passwordModal");

    showToast("Password changed successfully.");
}


/* =====================================================
   EMAIL
   ===================================================== */

function openEmailModal(){

    closeMenuBox();

    document.getElementById("newEmail").value =
        profileData.email || "";

    document.getElementById("confirmEmail").value =
        profileData.email || "";

    document.getElementById("emailModal").style.display =
        "flex";
}

function changeEmail(){

    const email =
        document.getElementById("newEmail").value.trim();

    const confirm =
        document.getElementById("confirmEmail").value.trim();

    if(!email || !confirm){

        showToast("Please enter the email.");
        return;
    }

    if(email !== confirm){

        showToast("Emails do not match.");
        return;
    }

    if(!email.includes("@")){

        showToast("Please enter a valid email.");
        return;
    }

    profileData.email = email;

    saveCurrentProfile();

    const accounts = getAccounts();

    const index = accounts.findIndex(
        a =>
        a.ymid === currentUser ||
        a.username === currentUser ||
        a.name === currentUser
    );

    if(index !== -1){

        accounts[index].email = email;

        saveAccounts(accounts);
    }

    closeModal("emailModal");

    showToast("Email updated.");
}


/* =====================================================
   POST MEDIA
   ===================================================== */

function selectPostImage(input){

    const file = input.files[0];

    if(!file){
        return;
    }

    selectedPostImage = file;
    selectedPostVideo = null;

    document.getElementById("selectedFile").textContent =
        "📷 Selected: " + file.name;

    document.getElementById("postVideoInput").value = "";
}

function selectPostVideo(input){

    const file = input.files[0];

    if(!file){
        return;
    }

    selectedPostVideo = file;
    selectedPostImage = null;

    document.getElementById("selectedFile").textContent =
        "🎥 Selected: " + file.name;

    document.getElementById("postImageInput").value = "";
}

function clearPostMedia(){

    selectedPostImage = null;
    selectedPostVideo = null;

    document.getElementById("postImageInput").value = "";
    document.getElementById("postVideoInput").value = "";

    document.getElementById("selectedFile").textContent = "";

    showToast("Media cleared.");
}


/* =====================================================
   CREATE POST
   ===================================================== */

function createPost(){

    const text =
        document.getElementById("postText").value.trim();

    if(
        !text &&
        !selectedPostImage &&
        !selectedPostVideo
    ){

        showToast("Write something or choose media.");
        return;
    }

    const post = {

        id:
            Date.now() +
            Math.random().toString(16).slice(2),

        user:
            currentUser ||
            profileData.ymid ||
            "demo-user",

        name:
            profileData.name ||
            "Y-M User",

        avatar:
            profileData.profilePhoto || "",

        text:text,

        image:"",
        video:"",

        likes:[],
        comments:[],

        hidden:false,

        createdAt:
            new Date().toLocaleString()
    };


    if(selectedPostImage){

        const reader =
            new FileReader();

        reader.onload = function(e){

            post.image =
                e.target.result;

            posts.unshift(post);

            savePosts(posts);

            finishPost();
        };

        reader.readAsDataURL(selectedPostImage);

        return;
    }


    if(selectedPostVideo){

        const reader =
            new FileReader();

        reader.onload = function(e){

            post.video =
                e.target.result;

            posts.unshift(post);

            savePosts(posts);

            finishPost();
        };

        reader.readAsDataURL(selectedPostVideo);

        return;
    }


    posts.unshift(post);

    savePosts(posts);

    finishPost();
}

function finishPost(){

    document.getElementById("postText").value = "";

    clearPostMedia();

    renderPosts();

    showToast("Post published.");
}


/* =====================================================
   RENDER POSTS
   ===================================================== */

function renderPosts(){

    const container =
        document.getElementById("postsContainer");

    container.innerHTML = "";

    const visiblePosts =
        posts.filter(p => !p.hidden);

    if(visiblePosts.length === 0){

        container.innerHTML = `
            <div style="
                text-align:center;
                padding:30px 10px;
                color:#777;
            ">
                No posts yet.<br>
                Write something above.
            </div>
        `;

        return;
    }


    visiblePosts.forEach(post => {

        const liked =
            Array.isArray(post.likes) &&
            post.likes.includes(
                currentUser ||
                profileData.ymid ||
                "demo-user"
            );

        const postElement =
            document.createElement("div");

        postElement.className = "post";

        let avatarHTML = "";

        if(post.avatar){

            avatarHTML =
                `<img src="${post.avatar}" alt="avatar">`;

        }else{

            avatarHTML =
                escapeHTML(
                    getInitial(post.name)
                );
        }


        let mediaHTML = "";

        if(post.image){

            mediaHTML += `
                <img
                    class="post-media"
                    src="${post.image}"
                    alt="Post image"
                >
            `;
        }

        if(post.video){

            mediaHTML += `
                <video
                    class="post-media"
                    controls
                    preload="metadata"
                >
                    <source
                        src="${post.video}"
                        type="video/mp4"
                    >
                </video>
            `;
        }


        let commentsHTML = "";

        if(post.comments && post.comments.length){

            post.comments.forEach(comment => {

                if(comment.hidden){
                    return;
                }

                const isOwn =
                    comment.user ===
                    (
                        currentUser ||
                        profileData.ymid ||
                        "demo-user"
                    );

                commentsHTML += `
                    <div class="comment">

                        <div class="comment-top">

                            <div>
                                <strong>
                                    ${escapeHTML(comment.name)}
                                </strong>

                                <div>
                                    ${escapeHTML(comment.text)}
                                </div>
                            </div>

                            <div>

                                ${
                                    isOwn
                                    ?
                                    `<button
                                        class="comment-delete"
                                        onclick="deleteComment('${post.id}','${comment.id}')"
                                    >
                                        🗑️
                                    </button>`
                                    :
                                    ""
                                }

                                ${
                                    !isOwn
                                    ?
                                    `<button
                                        class="comment-hide"
                                        onclick="hideComment('${post.id}','${comment.id}')"
                                    >
                                        🙈
                                    </button>`
                                    :
                                    ""
                                }

                            </div>

                        </div>

                    </div>
                `;
            });
        }


        postElement.innerHTML = `

            <div class="post-header">

                <div class="post-avatar">
                    ${avatarHTML}
                </div>

                <div class="post-user">

                    <strong>
                        ${escapeHTML(post.name)}
                    </strong>

                    <small>
                        ${escapeHTML(post.createdAt)}
                    </small>

                </div>

                <button
                    class="post-menu"
                    onclick="openPostMenu('${post.id}')"
                >
                    ⋮
                </button>

            </div>

            ${
                post.text
                ?
                `<div class="post-content">
                    ${escapeHTML(post.text)}
                </div>`
                :
                ""
            }

            ${mediaHTML}

            <div class="post-actions">

                <button
                    class="${liked ? "like-active" : ""}"
                    onclick="toggleLike('${post.id}')"
                >
                    ${liked ? "❤️" : "🤍"} Like
                    (${post.likes ? post.likes.length : 0})
                </button>

                <button onclick="focusComment('${post.id}')">
                    💬 Comment
                </button>

                <button onclick="sharePost('${post.id}')">
                    📤 Share
                </button>

            </div>

            <div class="comments">

                ${commentsHTML}

                <input
                    id="comment-${post.id}"
                    class="comment-input"
                    type="text"
                    placeholder="Write a comment..."
                    onkeydown="commentKey(event,'${post.id}')"
                >

                <button
                    class="comment-send"
                    onclick="addComment('${post.id}')"
                >
                    Send Comment
                </button>

            </div>
        `;

        container.appendChild(postElement);
    });
}


/* =====================================================
   LIKE
   ===================================================== */

function toggleLike(postId){

    const post =
        posts.find(p => p.id === postId);

    if(!post){
        return;
    }

    if(!Array.isArray(post.likes)){
        post.likes = [];
    }

    const user =
        currentUser ||
        profileData.ymid ||
        "demo-user";

    const index =
        post.likes.indexOf(user);

    if(index === -1){

        post.likes.push(user);

    }else{

        post.likes.splice(index,1);
    }

    savePosts(posts);

    renderPosts();
}


/* =====================================================
   COMMENT
   ===================================================== */

function focusComment(postId){

    const input =
        document.getElementById(
            "comment-" + postId
        );

    if(input){

        input.focus();

        input.scrollIntoView({
            behavior:"smooth",
            block:"center"
        });
    }
}

function commentKey(event,postId){

    if(event.key === "Enter"){

        event.preventDefault();

        addComment(postId);
    }
}

function addComment(postId){

    const input =
        document.getElementById(
            "comment-" + postId
        );

    if(!input){
        return;
    }

    const text =
        input.value.trim();

    if(!text){
        return;
    }

    const post =
        posts.find(p => p.id === postId);

    if(!post){
        return;
    }

    if(!Array.isArray(post.comments)){
        post.comments = [];
    }

    post.comments.push({

        id:
            Date.now() +
            Math.random().toString(16).slice(2),

        user:
            currentUser ||
            profileData.ymid ||
            "demo-user",

        name:
            profileData.name ||
            "Y-M User",

        text:text,

        hidden:false
    });

    savePosts(posts);

    renderPosts();

    showToast("Comment added.");
}


/* =====================================================
   DELETE COMMENT
   ===================================================== */

function deleteComment(postId,commentId){

    const post =
        posts.find(p => p.id === postId);

    if(!post || !post.comments){
        return;
    }

    const user =
        currentUser ||
        profileData.ymid ||
        "demo-user";

    const comment =
        post.comments.find(
            c => c.id === commentId
        );

    if(!comment){
        return;
    }

    if(comment.user !== user){

        showToast("You can only delete your comment.");
        return;
    }

    post.comments =
        post.comments.filter(
            c => c.id !== commentId
        );

    savePosts(posts);

    renderPosts();

    showToast("Comment deleted.");
}


/* =====================================================
   HIDE COMMENT
   ===================================================== */

function hideComment(postId,commentId){

    const post =
        posts.find(p => p.id === postId);

    if(!post || !post.comments){
        return;
    }

    const comment =
        post.comments.find(
            c => c.id === commentId
        );

    if(!comment){
        return;
    }

    comment.hidden = true;

    savePosts(posts);

    renderPosts();

    showToast("Comment hidden.");
}


/* =====================================================
   POST MENU
   ===================================================== */

function openPostMenu(postId){

    const post =
        posts.find(p => p.id === postId);

    if(!post){
        return;
    }

    const user =
        currentUser ||
        profileData.ymid ||
        "demo-user";

    if(post.user === user){

        const remove =
            confirm(
                "Delete this post?"
            );

        if(remove){

            posts =
                posts.filter(
                    p => p.id !== postId
                );

            savePosts(posts);

            renderPosts();

            showToast("Post deleted.");
        }

        return;
    }

    const hide =
        confirm(
            "Hide this post?"
        );

    if(hide){

        post.hidden = true;

        savePosts(posts);

        renderPosts();

        showToast("Post hidden.");
    }
}


/* =====================================================
   SHARE
   ===================================================== */

function sharePost(postId){

    const post =
        posts.find(p => p.id === postId);

    if(!post){
        return;
    }

    const shareText =
        `${post.name}: ${post.text || "Y-M Chat post"}`;

    if(
        navigator.share
    ){

        navigator.share({
            title:"Y-M Chat",
            text:shareText
        }).catch(()=>{});

        return;
    }

    if(
        navigator.clipboard
    ){

        navigator.clipboard
            .writeText(shareText)
            .then(()=>{
                showToast("Post text copied.");
            })
            .catch(()=>{
                showToast("Share not available.");
            });

        return;
    }

    showToast("Share not available.");
}
