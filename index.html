<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Y-M Chat - Home V1.2</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#eef2f7;
    color:#222;
}

button,
textarea,
input{
    font:inherit;
}

button{
    cursor:pointer;
}

.app{
    width:100%;
    max-width:480px;
    min-height:100vh;
    margin:auto;
    background:#f5f7fa;
    padding-bottom:80px;
}

/* HEADER */

.header{
    height:62px;
    background:#1976d2;
    color:white;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 15px;
    position:sticky;
    top:0;
    z-index:20;
    box-shadow:0 2px 8px rgba(0,0,0,.18);
}

.logo{
    font-size:23px;
    font-weight:bold;
}

.logo small{
    display:block;
    font-size:12px;
    font-weight:normal;
    opacity:.85;
}

.header-actions{
    display:flex;
    gap:8px;
}

.icon-btn{
    width:40px;
    height:40px;
    border:0;
    border-radius:50%;
    background:rgba(255,255,255,.18);
    color:white;
    font-size:20px;
}

/* PROFILE */

.profile-bar{
    background:white;
    padding:13px 15px;
    display:flex;
    align-items:center;
    gap:11px;
    border-bottom:1px solid #ddd;
}

.avatar{
    width:45px;
    height:45px;
    border-radius:50%;
    background:#1976d2;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
    font-size:18px;
    overflow:hidden;
    flex-shrink:0;
}

.profile-info{
    flex:1;
}

.profile-name{
    font-weight:bold;
    font-size:15px;
}

.profile-id{
    color:#777;
    font-size:12px;
    margin-top:3px;
}

/* NOTICE */

.notice{
    margin:12px;
    padding:11px;
    border-radius:10px;
    background:#e3f2fd;
    border:1px solid #bbdefb;
    color:#1565c0;
    font-size:13px;
}

/* CREATE POST */

.create-post{
    background:white;
    margin:12px;
    padding:13px;
    border-radius:12px;
    box-shadow:0 1px 5px rgba(0,0,0,.08);
}

.create-row{
    display:flex;
    gap:10px;
    align-items:flex-start;
}

.mini-avatar{
    width:40px;
    height:40px;
    border-radius:50%;
    background:#1976d2;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
    flex-shrink:0;
}

.post-input{
    width:100%;
    min-height:45px;
    resize:vertical;
    border:1px solid #ddd;
    border-radius:12px;
    padding:12px;
    outline:none;
    font-size:14px;
}

.post-input:focus{
    border-color:#1976d2;
}

.media-preview{
    display:none;
    margin-top:10px;
    border-radius:10px;
    overflow:hidden;
    background:#111;
}

.media-preview img,
.media-preview video{
    display:block;
    width:100%;
    max-height:280px;
    object-fit:contain;
}

.create-actions{
    display:flex;
    gap:6px;
    margin-top:12px;
    padding-top:10px;
    border-top:1px solid #eee;
}

.action-btn{
    flex:1;
    border:0;
    border-radius:8px;
    padding:10px 4px;
    background:#f1f3f5;
    color:#444;
    font-size:12px;
}

.action-btn.post{
    background:#1976d2;
    color:white;
    font-weight:bold;
}

input[type="file"]{
    display:none;
}

/* FEED */

.feed-title{
    padding:5px 14px 9px;
    font-size:16px;
    font-weight:bold;
}

.post-card{
    margin:0 12px 12px;
    background:white;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 1px 5px rgba(0,0,0,.08);
}

.post-head{
    display:flex;
    align-items:center;
    gap:10px;
    padding:13px;
}

.post-user{
    flex:1;
}

.post-user-name{
    font-size:14px;
    font-weight:bold;
}

.post-time{
    margin-top:3px;
    font-size:11px;
    color:#888;
}

.more-btn{
    border:0;
    background:white;
    color:#777;
    font-size:22px;
    padding:4px 8px;
}

.post-text{
    padding:0 13px 13px;
    font-size:14px;
    line-height:1.5;
    white-space:pre-wrap;
}

.post-media{
    background:#000;
}

.post-media img,
.post-media video{
    width:100%;
    max-height:430px;
    display:block;
    object-fit:contain;
}

.post-stats{
    padding:9px 13px;
    border-bottom:1px solid #eee;
    color:#777;
    font-size:12px;
}

.post-actions{
    display:flex;
}

.post-action{
    flex:1;
    border:0;
    background:white;
    color:#555;
    padding:11px 4px;
    font-size:13px;
}

.post-action.liked{
    color:#1976d2;
    font-weight:bold;
}

.post-action:hover{
    background:#f4f6f8;
}

/* COMMENTS */

.comments-area{
    background:#fafafa;
    border-top:1px solid #eee;
    padding:11px 13px;
}

.comments-title{
    color:#666;
    font-size:12px;
    font-weight:bold;
    margin-bottom:9px;
}

.comment{
    display:flex;
    gap:8px;
    margin-bottom:10px;
}

.comment-avatar{
    width:30px;
    height:30px;
    border-radius:50%;
    background:#1976d2;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:12px;
    font-weight:bold;
    flex-shrink:0;
}

.comment-body{
    flex:1;
    min-width:0;
    background:white;
    border:1px solid #e2e2e2;
    border-radius:9px;
    padding:8px;
}

.comment-name{
    font-size:12px;
    font-weight:bold;
}

.comment-text{
    margin-top:4px;
    font-size:13px;
    line-height:1.4;
    white-space:pre-wrap;
    overflow-wrap:anywhere;
}

.comment-footer{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:5px;
    margin-top:6px;
}

.comment-time{
    color:#999;
    font-size:10px;
}

.comment-options{
    border:0;
    background:transparent;
    color:#666;
    font-size:11px;
    padding:3px;
}

.comment-form{
    display:flex;
    gap:7px;
    margin-top:10px;
}

.comment-form input{
    flex:1;
    min-width:0;
    border:1px solid #ddd;
    border-radius:20px;
    padding:10px 12px;
    outline:none;
    font-size:13px;
}

.comment-form input:focus{
    border-color:#1976d2;
}

.comment-send{
    border:0;
    border-radius:20px;
    padding:0 14px;
    background:#1976d2;
    color:white;
    font-weight:bold;
    font-size:12px;
}

/* EMPTY */

.empty{
    text-align:center;
    color:#888;
    padding:35px 20px;
}

.empty-icon{
    font-size:42px;
    margin-bottom:10px;
}

/* NOTIFICATIONS */

.notification-panel{
    display:none;
    position:fixed;
    top:62px;
    right:calc(50% - 230px);
    width:310px;
    max-width:calc(100% - 30px);
    background:white;
    z-index:40;
    border-radius:0 0 12px 12px;
    box-shadow:0 4px 15px rgba(0,0,0,.2);
    overflow:hidden;
}

.notification-panel.show{
    display:block;
}

.notification-head{
    padding:13px;
    font-weight:bold;
    border-bottom:1px solid #eee;
}

.notification-item{
    padding:12px;
    font-size:13px;
    border-bottom:1px solid #eee;
}

.notification-item small{
    display:block;
    color:#888;
    margin-top:4px;
}

/* MODALS */

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.45);
    z-index:60;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.modal.show{
    display:flex;
}

.modal-box{
    width:100%;
    max-width:390px;
    background:white;
    border-radius:14px;
    padding:18px;
}

.modal-title{
    font-size:18px;
    font-weight:bold;
    margin-bottom:14px;
}

.modal-textarea{
    width:100%;
    min-height:90px;
    resize:vertical;
    border:1px solid #ddd;
    border-radius:9px;
    padding:11px;
    outline:none;
}

.modal-btn{
    width:100%;
    border:0;
    border-radius:8px;
    padding:12px;
    margin-top:8px;
    background:#1976d2;
    color:white;
    font-weight:bold;
}

.modal-btn.cancel{
    background:#e9ecef;
    color:#333;
}

.menu-option{
    display:block;
    width:100%;
    border:0;
    border-radius:8px;
    background:#f1f3f5;
    padding:12px;
    margin-top:8px;
    text-align:left;
    font-size:14px;
}

.menu-option.delete{
    color:#d32f2f;
}

/* BOTTOM NAV */

.bottom-nav{
    position:fixed;
    left:50%;
    bottom:0;
    transform:translateX(-50%);
    width:100%;
    max-width:480px;
    height:68px;
    display:flex;
    background:white;
    border-top:1px solid #ddd;
    box-shadow:0 -2px 8px rgba(0,0,0,.08);
    z-index:30;
}

.nav-btn{
    flex:1;
    border:0;
    background:white;
    color:#777;
    font-size:11px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:4px;
}

.nav-icon{
    font-size:21px;
}

.nav-btn.active{
    color:#1976d2;
    font-weight:bold;
}

@media(max-width:480px){
    .notification-panel{
        right:15px;
    }
}
</style>
</head>

<body>

<div class="app">

<header class="header">

    <div class="logo">
        Y-M Chat
        <small>Home</small>
    </div>

    <div class="header-actions">
        <button class="icon-btn" id="notificationButton">🔔</button>
        <button class="icon-btn" id="mainMenuButton">⋮</button>
    </div>

</header>

<div id="notificationPanel" class="notification-panel">

    <div class="notification-head">
        🔔 Notifications
    </div>

    <div class="notification-item">
        Welcome to Y-M Chat.
        <small>Just now</small>
    </div>

    <div class="notification-item">

        <small>Today</small>

<section class="profile-bar">

<nav class="bottom-nav">

        <span class="nav-icon">💬</span>

    </button>

        <span class="nav-icon">🌎</span>
        Rooms
    </button>

    <button class="nav-btn" id="profileNav">
        <span class="nav-icon">👤</span>

</nav>

<!-- COMMENT MODAL -->

<div id="commentModal" class="modal">

    <div class="modal-box">

        <div class="modal-title">

        <textarea

        ></textarea>

            Send Comment
        </button>

        <button class="modal-btn cancel" id="cancelCommentButton">
            Cancel
        </button>

    </div>

</div>

<!-- POST MENU MODAL -->

<div id="postMenuModal" class="modal">

    <div class="modal-box">

        <div class="modal-title">
            Post Options
        </div>

        <div id="postMenuOptions"></div>

        <button class="modal-btn cancel" id="cancelPostMenuButton">
            Cancel
        </button>

    </div>

</div>

<!-- COMMENT MENU MODAL -->

<div id="commentMenuModal" class="modal">

    <div class="modal-box">

        <div class="modal-title">
            Comment Options
        </div>

        <div id="commentMenuOptions"></div>

        <button class="modal-btn cancel" id="cancelCommentMenuButton">
            Cancel
        </button>

    </div>

</div>

<script>
"use strict";

/* DATA */

let posts = [];
let selectedMedia = null;
let selectedMediaType = null;

let activeCommentPostId = null;
let selectedPostId = null;
let selectedCommentPostId = null;
let selectedCommentId = null;


/* USER */

function getCurrentUser(){

    const saved =
        localStorage.getItem("ym_current_user");

    if(!saved){
        return null;
    }

    try{
        return JSON.parse(saved);
    }catch(error){
        return null;
    }
}

function getCurrentName(){

    const user = getCurrentUser();

    return user && user.name
        ? user.name
        : "Y-M User";
}

function getCurrentUsername(){

    const user = getCurrentUser();

    return user && user.username
        ? user.username
        : "ymuser";
}

function getLetter(name){

    return String(name || "Y")
        .charAt(0)
        .toUpperCase();
}

function loadUser(){

    const name = getCurrentName();
    const username = getCurrentUsername();
    const letter = getLetter(name);

    document.getElementById("topName").textContent =
        name;

    document.getElementById("topId").textContent =
        "@" + username;

    document.getElementById("topAvatar").textContent =
        letter;

    document.getElementById("miniAvatar").textContent =
        letter;
}


/* STORAGE */

function loadPosts(){

    const saved =
        localStorage.getItem("ym_home_posts");

    if(!saved){

        posts = [];

        renderPosts();

        return;
    }

    try{

        posts = JSON.parse(saved);

        if(!Array.isArray(posts)){
            posts = [];
        }

    }catch(error){

        posts = [];

    }

    renderPosts();
}

function savePosts(){

    localStorage.setItem(
        "ym_home_posts",
        JSON.stringify(posts)
    );
}


/* HELPERS */

function escapeHTML(value){

    return String(value || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}

function formatTime(timestamp){

    const date = new Date(timestamp);
    const now = new Date();

    const minutes =
        Math.floor((now - date) / 60000);

    if(minutes < 1){
        return "Just now";
    }

    if(minutes < 60){
        return minutes + " minutes ago";
    }

    const hours =
        Math.floor(minutes / 60);

    if(hours < 24){
        return hours + " hours ago";
    }

    const days =
        Math.floor(hours / 24);

    if(days < 7){
        return days + " days ago";
    }

    return date.toLocaleDateString();
}


/* CREATE POST */

function createPost(){

    const input =
        document.getElementById("postInput");

    const text =
        input.value.trim();

    if(!text && !selectedMedia){

        alert("Please write something or select a photo/video.");

        return;
    }

    const post = {

        id:Date.now(),

        userName:getCurrentName(),

        username:getCurrentUsername(),

        text:text,

        media:selectedMedia,

        mediaType:selectedMediaType,

        time:Date.now(),

        likes:0,

        liked:false,

        hidden:false,

        comments:[]

    };

    posts.unshift(post);

    savePosts();

    input.value = "";

    selectedMedia = null;
    selectedMediaType = null;

    document.getElementById("mediaPreview").innerHTML = "";
    document.getElementById("mediaPreview").style.display = "none";

    document.getElementById("imageInput").value = "";
    document.getElementById("videoInput").value = "";

    renderPosts();
}


/* MEDIA */

function previewImage(event){

    const file =
        event.target.files[0];

    if(!file){
        return;
    }

    const reader = new FileReader();

    reader.onload = function(){

        selectedMedia =
            reader.result;

        selectedMediaType =
            "image";

        const preview =
            document.getElementById("mediaPreview");

        preview.innerHTML = `
            <img src="${selectedMedia}" alt="Image preview">
        `;

        preview.style.display = "block";
    };

    reader.readAsDataURL(file);
}

function previewVideo(event){

    const file =
        event.target.files[0];

    if(!file){
        return;
    }

    const reader = new FileReader();

    reader.onload = function(){

        selectedMedia =
            reader.result;

        selectedMediaType =
            "video";

        const preview =
            document.getElementById("mediaPreview");

        preview.innerHTML = `
            <video src="${selectedMedia}" controls></video>
        `;

        preview.style.display = "block";
    };

    reader.readAsDataURL(file);
}


/* RENDER POSTS */

function renderPosts(){

    const feed =
        document.getElementById("feed");

    feed.innerHTML = "";

    const visiblePosts =
        posts.filter(post => !post.hidden);

    if(visiblePosts.length === 0){

        feed.innerHTML = `
            <div class="empty">
                <div class="empty-icon">📰</div>
                <div>No posts available.</div>
                <small>Be the first to create a post.</small>
            </div>
        `;

        return;
    }

    visiblePosts.forEach(post => {

        if(!Array.isArray(post.comments)){
            post.comments = [];
        }

        const card =
            document.createElement("article");

        card.className = "post-card";

        const letter =
            getLetter(post.userName);

        let mediaHTML = "";

        if(post.media && post.mediaType === "image"){

            mediaHTML = `
                <div class="post-media">
                    <img src="${post.media}" alt="Post image">
                </div>
            `;
        }

        if(post.media && post.mediaType === "video"){

            mediaHTML = `
                <div class="post-media">
                    <video src="${post.media}" controls></video>
                </div>
            `;
        }

        const commentsHTML =
            renderComments(post);

        card.innerHTML = `

            <div class="post-head">

                <div class="avatar">
                    ${letter}
                </div>

                <div class="post-user">

                    <div class="post-user-name">
                        ${escapeHTML(post.userName)}
                    </div>

                    <div class="post-time">
                        @${escapeHTML(post.username)}
                        ·
                        ${formatTime(post.time)}
                    </div>

                </div>

                <button
                    class="more-btn"
                    data-post-menu="${post.id}">
                    ⋮
                </button>

            </div>

            ${
                post.text
                ? `<div class="post-text">
                    ${escapeHTML(post.text)}
                   </div>`
                : ""
            }

            ${mediaHTML}

            <div class="post-stats">
                ❤️ ${post.likes || 0}
                &nbsp;&nbsp;
                💬 ${post.comments.length}
            </div>

            <div class="post-actions">

                <button
                    class="post-action ${post.liked ? "liked" : ""}"
                    data-like-post="${post.id}">

                    ${post.liked ? "💙 Liked" : "👍 Like"}

                </button>

                <button
                    class="post-action"
                    data-open-comment="${post.id}">

                    💬 Comment

                </button>

                <button
                    class="post-action"
                    data-share-post="${post.id}">

                    ↗️ Share

                </button>

            </div>

            ${commentsHTML}

        `;

        feed.appendChild(card);

    });
}


/* RENDER COMMENTS */

function renderComments(post){

    const comments =
        post.comments.filter(comment => !comment.hidden);

    let html = "";

    if(comments.length > 0){

        html += `
            <div class="comments-area">
                <div class="comments-title">
                    Comments
                </div>
        `;

        comments.forEach(comment => {

            html += `

                <div class="comment">

                    <div class="comment-avatar">
                        ${getLetter(comment.user)}
                    </div>

                    <div class="comment-body">

                        <div class="comment-name">
                            ${escapeHTML(comment.user)}
                        </div>

                        <div class="comment-text">
                            ${escapeHTML(comment.text)}
                        </div>

                        <div class="comment-footer">

                            <span class="comment-time">
                                ${formatTime(comment.time)}
                            </span>

                            <button
                                class="comment-options"
                                data-comment-menu-post="${post.id}"
                                data-comment-menu-id="${comment.id}">

                                Options ▾

                            </button>

                        </div>

                    </div>

                </div>

            `;

        });

        html += `</div>`;
    }

    html += `

        <div class="comments-area">

            <form
                class="comment-form"
                data-comment-form="${post.id}">

                <input
                    type="text"
                    placeholder="Write a comment..."
                    maxlength="500"
                    required
                >

                <button
                    type="submit"
                    class="comment-send">

                    Send

                </button>

            </form>

        </div>

    `;

    return html;
}


/* COMMENT SUBMIT - STABLE FORM METHOD */

function submitInlineComment(postId, form){

    const input =
        form.querySelector("input");

    const text =
        input.value.trim();

    if(!text){

        alert("Please write a comment.");

        return;
    }

    const post =
        posts.find(item => item.id === postId);

    if(!post){
        return;
    }

    if(!Array.isArray(post.comments)){
        post.comments = [];
    }

    post.comments.push({

        id:Date.now(),

        user:getCurrentName(),

        username:getCurrentUsername(),

        text:text,

        time:Date.now(),

        hidden:false

    });

    savePosts();

    renderPosts();
}


/* LIKE */

function likePost(id){

    const post =
        posts.find(item => item.id === id);

    if(!post){
        return;
    }

    if(post.liked){

        post.likes =
            Math.max(0,(post.likes || 0) - 1);

        post.liked = false;

    }else{

        post.likes =
            (post.likes || 0) + 1;

        post.liked = true;

    }

    savePosts();

    renderPosts();
}


/* SHARE */

function sharePost(id){

    const post =
        posts.find(item => item.id === id);

    if(!post){
        return;
    }

    const text =
        post.text || "Post from Y-M Chat";

    if(
        navigator.share &&
        typeof navigator.share === "function"
    ){

        navigator.share({

            title:"Y-M Chat",
            text:text

        }).catch(() => {});

    }else{

        alert("Share: " + text);

    }
}


/* POST MENU */

function openPostMenu(id){

    selectedPostId = id;

    const post =
        posts.find(item => item.id === id);

    if(!post){
        return;
    }

    const owner =
        post.username === getCurrentUsername();

    const options =
        document.getElementById("postMenuOptions");

    if(owner){

        options.innerHTML = `
            <button class="menu-option delete" id="deletePostOption">
                🗑️ Delete Post
            </button>
        `;

        document.getElementById("deletePostOption")
            .addEventListener("click",deleteSelectedPost);

    }else{

        options.innerHTML = `
            <button class="menu-option" id="hidePostOption">
                🚫 Hide Post
            </button>
        `;

        document.getElementById("hidePostOption")
            .addEventListener("click",hideSelectedPost);

    }

    document.getElementById("postMenuModal")
        .classList.add("show");
}

function closePostMenu(){

    document.getElementById("postMenuModal")
        .classList.remove("show");

    selectedPostId = null;
}

function deleteSelectedPost(){

    if(selectedPostId === null){
        return;
    }

    if(!confirm("Are you sure you want to delete this post?")){
        return;
    }

    posts =
        posts.filter(item => item.id !== selectedPostId);

    savePosts();

    closePostMenu();

    renderPosts();
}

function hideSelectedPost(){

    const post =
        posts.find(item => item.id === selectedPostId);

    if(!post){
        return;
    }

    post.hidden = true;

    savePosts();

    closePostMenu();

    renderPosts();
}


/* COMMENT MENU */

function openCommentMenu(postId,commentId){

    selectedCommentPostId = postId;
    selectedCommentId = commentId;

    const post =
        posts.find(item => item.id === postId);

    if(!post){
        return;
    }

    const comment =
        post.comments.find(item => item.id === commentId);

    if(!comment){
        return;
    }

    const owner =
        comment.username === getCurrentUsername();

    const options =
        document.getElementById("commentMenuOptions");

    if(owner){

        options.innerHTML = `
            <button class="menu-option delete" id="deleteCommentOption">
                🗑️ Delete Comment
            </button>
        `;

        document.getElementById("deleteCommentOption")
            .addEventListener("click",deleteSelectedComment);

    }else{

        options.innerHTML = `
            <button class="menu-option" id="hideCommentOption">
                🚫 Hide Comment
            </button>
        `;

        document.getElementById("hideCommentOption")
            .addEventListener("click",hideSelectedComment);

    }

    document.getElementById("commentMenuModal")
        .classList.add("show");
}

function closeCommentMenu(){

    document.getElementById("commentMenuModal")
        .classList.remove("show");

    selectedCommentPostId = null;
    selectedCommentId = null;
}

function deleteSelectedComment(){

    const post =
        posts.find(item => item.id === selectedCommentPostId);

    if(!post){
        return;
    }

    if(!confirm("Are you sure you want to delete this comment?")){
        return;
    }

    post.comments =
        post.comments.filter(
            item => item.id !== selectedCommentId
        );

    savePosts();

    closeCommentMenu();

    renderPosts();
}

function hideSelectedComment(){

    const post =
        posts.find(item => item.id === selectedCommentPostId);

    if(!post){
        return;
    }

    const comment =
        post.comments.find(item => item.id === selectedCommentId);

    if(!comment){
        return;
    }

    comment.hidden = true;

    savePosts();

    closeCommentMenu();

    renderPosts();
}

/* FEED EVENTS */

document.getElementById("feed")
    .addEventListener("click",function(event){

        const target =
            event.target.closest("button");

        if(!target){
            return;
        }

        if(target.dataset.postMenu){

            openPostMenu(
                Number(target.dataset.postMenu)
            );

            return;
        }

        if(target.dataset.likePost){

            likePost(
                Number(target.dataset.likePost)
            );

            return;
        }

        if(target.dataset.openComment){

            openCommentModal(
                Number(target.dataset.openComment)
            );

            return;
        }

        if(target.dataset.sharePost){

            sharePost(
                Number(target.dataset.sharePost)
            );

            return;
        }

        if(target.dataset.commentMenuPost){

            openCommentMenu(
                Number(target.dataset.commentMenuPost),
                Number(target.dataset.commentMenuId)
            );

            return;
        }

    });


document.getElementById("feed")
    .addEventListener("submit",function(event){

        const form =
            event.target.closest("form[data-comment-form]");

        if(!form){
            return;
        }

        event.preventDefault();

        const postId =
            Number(form.dataset.commentForm);

        submitInlineComment(postId,form);

    });


/* CLOSE MODALS WHEN CLICKING BACKGROUND */

document.querySelectorAll(".modal")
    .forEach(function(modal){

        modal.addEventListener("click",function(event){

            if(event.target === modal){

                modal.classList.remove("show");

            }

        });

    });
