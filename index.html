<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Y-M Chat V1.9.3</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

html,body{
    width:100%;
    min-height:100%;
    background:#eef4fb;
    color:#222;
}

button,input{
    font:inherit;
}

button{
    cursor:pointer;
    border:0;
}

.app{
    width:100%;
    max-width:480px;
    min-height:100vh;
    margin:auto;
    background:#fff;
    position:relative;
    overflow-x:hidden;
}

.hidden{
    display:none!important;
}

/* ================= AUTH ================= */

.auth-screen{
    min-height:100vh;
    padding:35px 22px;
    background:linear-gradient(160deg,#1976d2,#42a5f5);
    display:flex;
    align-items:center;
    justify-content:center;
}

.auth-box{
    width:100%;
    background:#fff;
    border-radius:22px;
    padding:28px 22px;
    box-shadow:0 15px 40px rgba(0,0,0,.18);
}

.logo{
    width:72px;
    height:72px;
    border-radius:20px;
    background:#1976d2;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:25px;
    font-weight:bold;
    margin:0 auto 15px;
}

.auth-title{
    text-align:center;
    font-size:28px;
    color:#1976d2;
    font-weight:bold;
}

.auth-subtitle{
    text-align:center;
    color:#777;
    margin:7px 0 24px;
    font-size:14px;
}

.input-group{
    margin-bottom:14px;
}

.input-group label{
    display:block;
    font-size:13px;
    font-weight:bold;
    margin-bottom:6px;
    color:#555;
}

.input-group input{
    width:100%;
    padding:13px 14px;
    border:1px solid #d8e0ea;
    border-radius:12px;
    outline:none;
    background:#f8fafc;
}

.input-group input:focus{
    border-color:#1976d2;
    background:#fff;
}

.primary-btn{
    width:100%;
    padding:13px;
    background:#1976d2;
    color:#fff;
    border-radius:12px;
    font-weight:bold;
    margin-top:5px;
}

.secondary-btn{
    width:100%;
    padding:12px;
    background:#eef5ff;
    color:#1976d2;
    border-radius:12px;
    font-weight:bold;
    margin-top:10px;
}

.text-btn{
    display:block;
    background:none;
    color:#1976d2;
    margin:16px auto 0;
    font-size:14px;
}

.demo-box{
    margin-top:18px;
    background:#f4f8fd;
    border-radius:12px;
    padding:11px;
    font-size:12px;
    color:#666;
    text-align:center;
}

/* ================= TOP BAR ================= */

.topbar{
    height:62px;
    background:#1976d2;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 15px;
    position:sticky;
    top:0;
    z-index:30;
}

.top-title{
    font-size:20px;
    font-weight:bold;
}

.top-actions{
    display:flex;
    gap:7px;
}

.icon-btn{
    width:38px;
    height:38px;
    border-radius:50%;
    background:rgba(255,255,255,.15);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:17px;
    position:relative;
}

.badge{
    position:absolute;
    top:-2px;
    right:-2px;
    min-width:17px;
    height:17px;
    border-radius:20px;
    background:#f44336;
    color:#fff;
    font-size:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0 4px;
}

/* ================= PAGE ================= */

.page{
    padding-bottom:82px;
    min-height:calc(100vh - 62px);
}

.page-content{
    padding:15px;
}

.section-title{
    font-size:18px;
    font-weight:bold;
    margin-bottom:11px;
}

.muted{
    color:#777;
    font-size:13px;
}

/* ================= HOME ================= */

.hero{
    background:linear-gradient(135deg,#1976d2,#42a5f5);
    border-radius:18px;
    padding:20px;
    color:#fff;
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom:15px;
}

.hero-avatar{
    width:58px;
    height:58px;
    border-radius:50%;
    background:#fff;
    color:#1976d2;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:22px;
    font-weight:bold;
    overflow:hidden;
    flex-shrink:0;
}

.hero-avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.hero-info{
    flex:1;
}

.hero-info h2{
    font-size:20px;
    margin-bottom:5px;
}

.online-label{
    font-size:12px;
    opacity:.95;
}

.search-box{
    width:100%;
    background:#f3f6fa;
    border-radius:13px;
    padding:12px 14px;
    border:1px solid #e1e7ef;
    outline:none;
    margin-bottom:16px;
}

.quick-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
    margin-bottom:20px;
}

.quick-card{
    background:#f5f8fc;
    border:1px solid #e4eaf1;
    border-radius:13px;
    padding:12px 4px;
    text-align:center;
    color:#1976d2;
    font-size:12px;
}

.quick-card .q-icon{
    font-size:21px;
    margin-bottom:5px;
}

.online-list{
    display:flex;
    gap:12px;
    overflow-x:auto;
    padding-bottom:5px;
    margin-bottom:20px;
}

.online-person{
    min-width:64px;
    text-align:center;
}

.person-avatar{
    width:50px;
    height:50px;
    border-radius:50%;
    background:#dcecff;
    color:#1976d2;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
    position:relative;
}

.status-dot{
    width:11px;
    height:11px;
    border-radius:50%;
    background:#4caf50;
    border:2px solid #fff;
    position:absolute;
    right:0;
    bottom:0;
}

.status-dot.offline{
    background:#aaa;
}

.online-person span{
    display:block;
    font-size:11px;
    margin-top:5px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.activity-card,
.feature-card,
.room-card{
    border:1px solid #e5ebf2;
    border-radius:15px;
    padding:14px;
    background:#fff;
    margin-bottom:10px;
}

.feature-card{
    background:#f3f8ff;
    border-color:#d8e9ff;
}

.room-card{
    display:flex;
    align-items:center;
    gap:12px;
}

.room-icon{
    width:45px;
    height:45px;
    border-radius:13px;
    background:#eaf3ff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:21px;
}

.room-info{
    flex:1;
}

.room-info strong{
    display:block;
    margin-bottom:4px;
}

.room-info small{
    color:#777;
}

.room-count{
    font-size:12px;
    color:#1976d2;
    font-weight:bold;
}

/* ================= CHAT / FRIEND / ROOM SEARCH ================= */

.filter-row{
    display:flex;
    gap:7px;
    margin-bottom:12px;
    overflow-x:auto;
}

.filter-btn{
    padding:8px 13px;
    border-radius:20px;
    background:#eef3f8;
    color:#555;
    white-space:nowrap;
    font-size:12px;
}

.filter-btn.active{
    background:#1976d2;
    color:#fff;
}

.list-card{
    display:flex;
    align-items:center;
    gap:11px;
    padding:13px 5px;
    border-bottom:1px solid #edf0f4;
}

.list-avatar{
    width:48px;
    height:48px;
    border-radius:50%;
    background:#e2efff;
    color:#1976d2;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
    position:relative;
    flex-shrink:0;
    overflow:hidden;
}

.list-avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.list-info{
    flex:1;
    min-width:0;
}

.list-name{
    font-weight:bold;
    margin-bottom:4px;
}

.list-preview{
    color:#777;
    font-size:12px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.list-right{
    text-align:right;
    min-width:42px;
}

.time{
    font-size:10px;
    color:#999;
}

.unread{
    display:inline-flex;
    min-width:20px;
    height:20px;
    border-radius:20px;
    background:#1976d2;
    color:#fff;
    align-items:center;
    justify-content:center;
    font-size:10px;
    margin-top:5px;
}

/* ================= MODAL ================= */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.45);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:18px;
    z-index:100;
}

.modal-box{
    width:100%;
    max-width:460px;
    max-height:88vh;
    overflow:auto;
    background:#fff;
    border-radius:18px;
}

.modal-head{
    padding:15px;
    border-bottom:1px solid #edf0f4;
    display:flex;
    justify-content:space-between;
    align-items:center;
    position:sticky;
    top:0;
    background:#fff;
    z-index:2;
}

.modal-head strong{
    font-size:17px;
}

.close-btn{
    width:34px;
    height:34px;
    border-radius:50%;
    background:#eef3f8;
    color:#555;
}

.modal-body{
    padding:15px;
}

/* ================= CHAT MODAL ================= */

.chat-modal-box{
    height:82vh;
    display:flex;
    flex-direction:column;
}

.chat-header{
    padding:12px 15px;
    display:flex;
    align-items:center;
    gap:10px;
    border-bottom:1px solid #edf0f4;
}

.chat-header-info{
    flex:1;
}

.chat-header-info strong{
    display:block;
}

.chat-header-info small{
    color:#4caf50;
}

.chat-header-actions{
    display:flex;
    gap:5px;
}

.small-icon{
    width:32px;
    height:32px;
    border-radius:50%;
    background:#f0f3f7;
}

.chat-messages{
    flex:1;
    overflow-y:auto;
    padding:14px;
    background:#f5f8fc;
}

.message-row{
    display:flex;
    margin-bottom:9px;
}

.message-row.me{
    justify-content:flex-end;
}

.message-bubble{
    max-width:78%;
    background:#fff;
    padding:9px 11px;
    border-radius:14px 14px 14px 4px;
    box-shadow:0 1px 3px rgba(0,0,0,.06);
}

.message-row.me .message-bubble{
    background:#1976d2;
    color:#fff;
    border-radius:14px 14px 4px 14px;
}

.message-text{
    font-size:13px;
    word-wrap:break-word;
}

.message-time{
    font-size:9px;
    color:#999;
    margin-top:4px;
}

.message-row.me .message-time{
    color:rgba(255,255,255,.75);
}

.message-delete{
    background:none;
    font-size:9px;
    color:#f44336;
    margin-top:3px;
}

.chat-input-area{
    padding:10px;
    display:flex;
    gap:7px;
    border-top:1px solid #e5e9ef;
    background:#fff;
}

.chat-input{
    flex:1;
    min-width:0;
    padding:11px 12px;
    border:1px solid #dce3eb;
    border-radius:20px;
    outline:none;
}

.send-btn{
    width:42px;
    height:42px;
    border-radius:50%;
    background:#1976d2;
    color:#fff;
}

/* ================= FRIENDS ================= */

.friend-actions{
    display:flex;
    gap:7px;
    margin-bottom:14px;
}

.add-btn{
    flex:1;
    padding:11px;
    background:#1976d2;
    color:#fff;
    border-radius:11px;
    font-weight:bold;
}

.stat-row{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin-bottom:15px;
}

.stat-card{
    background:#f5f8fc;
    border-radius:12px;
    padding:11px 5px;
    text-align:center;
}

.stat-card strong{
    display:block;
    color:#1976d2;
    font-size:18px;
}

.stat-card span{
    font-size:10px;
    color:#777;
}

/* ================= PROFILE ================= */

.profile-cover{
    height:170px;
    background:linear-gradient(135deg,#1976d2,#64b5f6);
    position:relative;
    overflow:hidden;
}

.profile-cover img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.camera-btn{
    position:absolute;
    right:12px;
    top:12px;
    width:37px;
    height:37px;
    border-radius:50%;
    background:rgba(0,0,0,.45);
    color:#fff;
}

.profile-main{
    padding:0 15px 20px;
}

.profile-avatar-large{
    width:92px;
    height:92px;
    border-radius:50%;
    border:4px solid #fff;
    background:#dcecff;
    color:#1976d2;
    margin-top:-46px;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:30px;
    font-weight:bold;
    overflow:hidden;
}

.profile-avatar-large img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.avatar-camera{
    position:absolute;
    right:-1px;
    bottom:2px;
    width:29px;
    height:29px;
    border-radius:50%;
    background:#1976d2;
    color:#fff;
    font-size:13px;
}

.profile-name{
    font-size:22px;
    font-weight:bold;
    margin-top:10px;
}

.profile-username{
    color:#777;
    font-size:13px;
    margin-top:3px;
}

.profile-actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-top:17px;
}

.profile-action{
    padding:11px;
    border-radius:11px;
    background:#f0f5fa;
    color:#333;
}

.profile-action.danger{
    color:#f44336;
}

.info-box{
    margin-top:17px;
    border:1px solid #e4eaf1;
    border-radius:14px;
    padding:14px;
}

.info-row{
    display:flex;
    justify-content:space-between;
    padding:9px 0;
    border-bottom:1px solid #edf0f4;
    font-size:13px;
}

.info-row:last-child{
    border-bottom:0;
}

.privacy-btn{
    color:#1976d2;
    background:none;
    font-size:12px;
}

/* ================= BOTTOM NAV ================= */

.bottom-nav{
    position:fixed;
    bottom:0;
    left:50%;
    transform:translateX(-50%);
    width:100%;
    max-width:480px;
    height:68px;
    background:#fff;
    border-top:1px solid #e1e6ec;
    display:grid;
    grid-template-columns:repeat(5,1fr);
    z-index:40;
}

.nav-btn{
    background:#fff;
    color:#8a929d;
    font-size:10px;
    position:relative;
}

.nav-btn .nav-icon{
    font-size:20px;
    display:block;
    margin-bottom:3px;
}

.nav-btn.active{
    color:#1976d2;
    font-weight:bold;
}

/* ================= TOAST ================= */

.toast{
    position:fixed;
    left:50%;
    bottom:82px;
    transform:translateX(-50%);
    max-width:90%;
    background:#222;
    color:#fff;
    padding:10px 15px;
    border-radius:20px;
    font-size:12px;
    z-index:300;
    box-shadow:0 5px 18px rgba(0,0,0,.2);
}

/* ================= EMPTY ================= */

.empty{
    text-align:center;
    padding:35px 15px;
    color:#888;
}

.empty-icon{
    font-size:35px;
    margin-bottom:10px;
}

/* ================= CONFIRM ================= */

.confirm-text{
    color:#666;
    line-height:1.5;
    font-size:14px;
    margin-bottom:18px;
}

.confirm-actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
}

.confirm-cancel{
    padding:11px;
    border-radius:11px;
    background:#eef3f8;
}

.confirm-ok{
    padding:11px;
    border-radius:11px;
    background:#f44336;
    color:#fff;
}

/* ================= ROOM ================= */

.room-header{
    background:#f3f8ff;
    border-radius:15px;
    padding:15px;
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:13px;
}

.room-big-icon{
    width:52px;
    height:52px;
    border-radius:15px;
    background:#dcecff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:25px;
}

.room-header-info{
    flex:1;
}

.room-header-info strong{
    display:block;
    font-size:18px;
}

.room-header-info small{
    color:#777;
}

.room-messages{
    height:55vh;
    overflow-y:auto;
    background:#f5f8fc;
    border-radius:14px;
    padding:12px;
}

.room-message{
    background:#fff;
    border-radius:11px;
    padding:9px 11px;
    margin-bottom:8px;
}

.room-message strong{
    color:#1976d2;
    font-size:12px;
}

.room-message p{
    font-size:13px;
    margin-top:3px;
}

.room-message small{
    display:block;
    color:#999;
    font-size:9px;
    margin-top:4px;
}

.room-input-area{
    display:flex;
    gap:7px;
    margin-top:10px;
}

.room-input{
    flex:1;
    min-width:0;
    padding:11px 12px;
    border:1px solid #dce3eb;
    border-radius:20px;
    outline:none;
}

/* ================= LANGUAGE ================= */

.language-list{
    display:grid;
    gap:8px;
}

.language-option{
    width:100%;
    padding:13px;
    background:#f5f8fc;
    border-radius:11px;
    text-align:left;
}

.language-option.active{
    background:#e1efff;
    color:#1976d2;
    font-weight:bold;
}

/* ================= RESPONSIVE ================= */

@media(max-width:380px){
    .quick-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .profile-actions{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<div class="app">

<!-- ================= AUTH ================= -->

<div id="authScreen" class="auth-screen">

    <div id="loginBox" class="auth-box">

        <div class="logo">Y-M</div>

        <div class="auth-title">Y-M Chat</div>
        <div class="auth-subtitle">Connect. Chat. Belong.</div>

        <div class="input-group">
            <label>Username</label>
            <input id="loginUsername" type="text" placeholder="Enter username">
        </div>

        <div class="input-group">
            <label>Password</label>
            <input id="loginPassword" type="password" placeholder="Enter password">
        </div>

        <button class="primary-btn" onclick="login()">Login</button>

        <button class="text-btn" onclick="showRegister()">
            Create a new account
        </button>

        <button class="text-btn" onclick="showForgot()">
            Forgot Password?
        </button>

        <div class="demo-box">
            Demo account: <b>demo</b> / <b>123456</b>
        </div>

    </div>

    <div id="registerBox" class="auth-box hidden">

        <div class="logo">Y-M</div>

        <div class="auth-title">Create Account</div>
        <div class="auth-subtitle">Join Y-M Chat</div>

        <div class="input-group">
            <label>Name</label>
            <input id="registerName" type="text" placeholder="Your name">
        </div>

        <div class="input-group">
            <label>Username</label>
            <input id="registerUsername" type="text" placeholder="Choose username">
        </div>

        <div class="input-group">
            <label>Password</label>
            <input id="registerPassword" type="password" placeholder="Create password">
        </div>

        <div class="input-group">
            <label>Security Answer</label>
            <input id="registerAnswer" type="text" placeholder="What is YAM?">
        </div>

        <button class="primary-btn" onclick="register()">Register</button>

        <button class="text-btn" onclick="showLogin()">
            Already have an account? Login
        </button>

    </div>

    <div id="forgotBox" class="auth-box hidden">

        <div class="logo">Y-M</div>

        <div class="auth-title">Forgot Password</div>
        <div class="auth-subtitle">Recover your account</div>

        <div id="forgotStep1">

            <div class="input-group">
                <label>Username</label>
                <input id="forgotUsername" type="text" placeholder="Enter username">
            </div>

            <button class="primary-btn" onclick="checkForgotUser()">
                Continue
            </button>

        </div>

        <div id="forgotStep2" class="hidden">

            <div class="input-group">
                <label>Security Question</label>
                <input value="What is YAM?" disabled>
            </div>

            <div class="input-group">
                <label>Your Answer</label>
                <input id="forgotAnswer" type="text" placeholder="Enter answer">
            </div>

            <button class="primary-btn" onclick="resetPassword()">
                Verify Answer
            </button>

        </div>

        <div id="forgotStep3" class="hidden">

            <div class="input-group">
                <label>New Password</label>
                <input id="newPassword" type="password" placeholder="New password">
            </div>

            <button class="primary-btn" onclick="saveNewPassword()">
                Change Password
            </button>

        </div>

        <button class="text-btn" onclick="showLogin()">
            Back to Login
        </button>

    </div>

</div>

<script>

/* =========================================================
   BASIC HELPERS
========================================================= */

function escapeHTML(text){

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


function getInitial(name){

    if(!name) return "?";

    return name.trim().charAt(0).toUpperCase();
}


function showToast(message){

    const toast=document.getElementById("toast");

    toast.textContent=message;
    toast.classList.remove("hidden");

    clearTimeout(window.toastTimer);

    window.toastTimer=setTimeout(()=>{
        toast.classList.add("hidden");
    },2200);
}


/* =========================================================
   AUTH / USERS
========================================================= */

function getUsers(){

    try{
        return JSON.parse(localStorage.getItem("ym_users")) || [];
    }catch(e){
        return [];
    }
}


function saveUsers(users){

    localStorage.setItem(
        "ym_users",
        JSON.stringify(users)
    );
}


function getCurrentUser(){

    try{
        return JSON.parse(
            localStorage.getItem("ym_current_user")
        );
    }catch(e){
        return null;
    }
}


function createDemoUser(){

    let users=getUsers();

    if(!users.some(u=>u.username==="demo")){

        users.push({
            name:"Demo User",
            username:"demo",
            password:"123456",
            answer:"yam"
        });

        saveUsers(users);
    }
}


function showLogin(){

    document.getElementById("loginBox")
        .classList.remove("hidden");

    document.getElementById("registerBox")
        .classList.add("hidden");

    document.getElementById("forgotBox")
        .classList.add("hidden");
}


function showRegister(){

    document.getElementById("loginBox")
        .classList.add("hidden");

    document.getElementById("registerBox")
        .classList.remove("hidden");

    document.getElementById("forgotBox")
        .classList.add("hidden");
}


function showForgot(){

    document.getElementById("loginBox")
        .classList.add("hidden");

    document.getElementById("registerBox")
        .classList.add("hidden");

    document.getElementById("forgotBox")
        .classList.remove("hidden");

    document.getElementById("forgotStep1")
        .classList.remove("hidden");

    document.getElementById("forgotStep2")
        .classList.add("hidden");

    document.getElementById("forgotStep3")
        .classList.add("hidden");
}


function login(){

    const username=
        document.getElementById("loginUsername")
        .value.trim()
        .toLowerCase();

    const password=
        document.getElementById("loginPassword")
        .value;

    if(!username || !password){

        showToast("Please enter username and password.");
        return;
    }

    const users=getUsers();

    const user=users.find(u=>
        u.username.toLowerCase()===username &&
        u.password===password
    );

    if(!user){

        showToast("Invalid username or password.");
        return;
    }

    localStorage.setItem(
        "ym_current_user",
        JSON.stringify(user)
    );

    startApp();
}


function register(){

    const name=
        document.getElementById("registerName")
        .value.trim();

    const username=
        document.getElementById("registerUsername")
        .value.trim()
        .toLowerCase();

    const password=
        document.getElementById("registerPassword")
        .value;

    const answer=
        document.getElementById("registerAnswer")
        .value.trim()
        .toLowerCase();

    if(!name || !username || !password || !answer){

        showToast("Please complete all fields.");
        return;
    }

    if(username.length<3){

        showToast("Username must be at least 3 characters.");
        return;
    }

    if(password.length<6){

        showToast("Password must be at least 6 characters.");
        return;
    }

    const users=getUsers();

    if(users.some(u=>u.username===username)){

        showToast("Username already exists.");
        return;
    }

    users.push({
        name:name,
        username:username,
        password:password,
        answer:answer
    });

    saveUsers(users);

    showToast("Account created successfully.");

    document.getElementById("loginUsername").value=username;
    document.getElementById("loginPassword").value="";

    showLogin();
}


let forgotUser=null;


function checkForgotUser(){

    const username=
        document.getElementById("forgotUsername")
        .value.trim()
        .toLowerCase();

    const users=getUsers();

    const user=users.find(u=>
        u.username.toLowerCase()===username
    );

    if(!user){

        showToast("Username not found.");
        return;
    }

    forgotUser=user;

    document.getElementById("forgotStep1")
        .classList.add("hidden");

    document.getElementById("forgotStep2")
        .classList.remove("hidden");
}


function resetPassword(){

    if(!forgotUser) return;

    const answer=
        document.getElementById("forgotAnswer")
        .value.trim()
        .toLowerCase();

    if(answer!==forgotUser.answer){

        showToast("Wrong security answer.");
        return;
    }

    document.getElementById("forgotStep2")
        .classList.add("hidden");

    document.getElementById("forgotStep3")
        .classList.remove("hidden");
}


function saveNewPassword(){

    if(!forgotUser) return;

    const password=
        document.getElementById("newPassword")
        .value;

    if(password.length<6){

        showToast("Password must be at least 6 characters.");
        return;
    }

    const users=getUsers();

    const index=users.findIndex(
        u=>u.username===forgotUser.username
    );

    if(index===-1){

        showToast("Account not found.");
        return;
    }

    users[index].password=password;

    saveUsers(users);

    forgotUser=null;

    showToast("Password changed successfully.");

    showLogin();
}


/* =========================================================
   START APP
========================================================= */

function startApp(){

    createDemoUser();

    document.getElementById("authScreen")
        .classList.add("hidden");

    document.getElementById("mainApp")
        .classList.remove("hidden");

    loadChatData();
    loadFriendsData();

    renderHome();
    renderChats();
    renderFriends();
    renderRooms();
    renderProfile();
    updateGlobalUnread();

    openPage("home");
}


/* =========================================================
   NAVIGATION
========================================================= */

function openPage(page){

    const pages=[
        "home",
        "chats",
        "friends",
        "rooms",
        "profile"
    ];

    pages.forEach(p=>{

        const element=
            document.getElementById(p+"Page");

        if(element){

            element.classList.toggle(
                "hidden",
                p!==page
            );
        }

    });

    document.querySelectorAll(".nav-btn")
        .forEach(btn=>{
            btn.classList.remove("active");
        });

    const nav=
        document.getElementById(
            "nav"+page.charAt(0).toUpperCase()+page.slice(1)
        );

    if(nav) nav.classList.add("active");

    if(page==="home") renderHome();
    if(page==="chats") renderChats();
    if(page==="friends") renderFriends();
    if(page==="rooms") renderRooms();
    if(page==="profile") renderProfile();
}


/* =========================================================
   HOME
========================================================= */

function renderHome(){

    const user=getCurrentUser();

    if(!user) return;

    const photo=
        localStorage.getItem("ym_profile_photo");

    const avatar=photo
        ? `<img src="${photo}" alt="Profile">`
        : getInitial(user.name);

    const friendData=getFriendData();

    const onlineFriends=
        friendData.friends.filter(f=>f.online);

    const rooms=getRoomData().slice(0,4);

    document.getElementById("homeContent").innerHTML=`

        <div class="hero">

            <div class="hero-avatar">
                ${avatar}
            </div>

            <div class="hero-info">

                <h2>
                    Welcome, ${escapeHTML(user.name)}
                </h2>

                <div class="online-label">
                    ● Online
                </div>

            </div>

        </div>


        <input
            class="search-box"
            placeholder="Search Y-M Chat..."
            onkeydown="searchHome(event)"
        >


        <div class="quick-grid">

            <button class="quick-card"
                    onclick="openPage('chats')">
                <div class="q-icon">💬</div>
                Chats
            </button>

            <button class="quick-card"
                    onclick="openPage('friends')">
                <div class="q-icon">👥</div>
                Friends
            </button>

            <button class="quick-card"
                    onclick="openPage('rooms')">
                <div class="q-icon">🌎</div>
                Rooms
            </button>

            <button class="quick-card"
                    onclick="openPage('profile')">
                <div class="q-icon">👤</div>
                Profile
            </button>

        </div>


        <div class="section-title">
            Friends Online
        </div>


        <div class="online-list">

            ${
                onlineFriends.length
                ?
                onlineFriends.map(f=>`

                    <div class="online-person"
                         onclick="openFriendProfile('${escapeHTML(f.username)}')">

                        <div class="person-avatar">

                            ${getInitial(f.name)}

                            <span class="status-dot"></span>

                        </div>

                        <span>
                            ${escapeHTML(f.name)}
                        </span>

                    </div>

                `).join("")
                :
                `<div class="muted">No friends online.</div>`
            }

        </div>


        <div class="section-title">
            Recent Activity
        </div>

        <div class="activity-card">

            <b>Welcome to Y-M Chat</b>

            <div class="muted" style="margin-top:5px">
                Your messenger journey starts here.
            </div>

        </div>


        <div class="feature-card">

            <b>💙 Y-M Chat Community</b>

            <div class="muted" style="margin-top:6px">
                Chat privately with friends or join public rooms.
            </div>

        </div>


        <div class="section-title" style="margin-top:20px">
            Popular Rooms
        </div>

        ${
            rooms.map(room=>`

                <div class="room-card"
                     onclick="openRoom('${room.id}')">

                    <div class="room-icon">
                        ${room.icon}
                    </div>

                    <div class="room-info">

                        <strong>
                            ${escapeHTML(room.name)}
                        </strong>

                        <small>
                            Public chat room
                        </small>

                    </div>

                    <div class="room-count">
                        ${room.members}
                    </div>

                </div>

            `).join("")
        }

    `;
}


function searchHome(event){

    if(event.key!=="Enter") return;

    const value=event.target.value
        .trim()
        .toLowerCase();

    if(value.includes("friend")){

        openPage("friends");

    }else if(value.includes("room") ||
             value.includes("chat room")){

        openPage("rooms");

    }else if(value.includes("profile")){

        openPage("profile");

    }else{

        openPage("chats");
    }
}


/* =========================================================
   CHAT DATA
========================================================= */

let chatData=[];

let currentChatUser=null;

let chatFilter="all";


function loadChatData(){

    try{

        const saved=
            JSON.parse(
                localStorage.getItem("ym_chat_data")
            );

        if(Array.isArray(saved)){

            chatData=saved;
            return;
        }

    }catch(e){}

    chatData=[

        {
            username:"ahmad",
            name:"Ahmad",
            online:true,
            unread:2,
            messages:[
                {
                    sender:"them",
                    text:"Hello! Welcome to Y-M Chat.",
                    time:"10:20"
                },
                {
                    sender:"me",
                    text:"Thanks Ahmad!",
                    time:"10:22"
                }
            ]
        },

        {
            username:"siti",
            name:"Siti",
            online:true,
            unread:1,
            messages:[
                {
                    sender:"them",
                    text:"Hi! How are you?",
                    time:"11:05"
                }
            ]
        },

        {
            username:"john",
            name:"John",
            online:false,
            unread:0,
            messages:[
                {
                    sender:"them",
                    text:"See you later.",
                    time:"Yesterday"
                }
            ]
        },

        {
            username:"maria",
            name:"Maria",
            online:true,
            unread:0,
            messages:[
                {
                    sender:"them",
                    text:"Nice to meet you!",
                    time:"Yesterday"
                }
            ]
        }

    ];

    saveChatData();
}


function saveChatData(){

    localStorage.setItem(
        "ym_chat_data",
        JSON.stringify(chatData)
    );
}


function getLastMessage(chat){

    if(!chat.messages || !chat.messages.length)
        return "No messages yet.";

    return chat.messages[
        chat.messages.length-1
    ].text;
}


function getLastTime(chat){

    if(!chat.messages || !chat.messages.length)
        return "";

    return chat.messages[
        chat.messages.length-1
    ].time || "";
}


function setChatFilter(filter){

    chatFilter=filter;

    document.querySelectorAll(
        "#chatFilterAll,#chatFilterUnread,#chatFilterOnline"
    ).forEach(btn=>{
        btn.classList.remove("active");
    });

    if(filter==="all")
        document.getElementById("chatFilterAll")
        .classList.add("active");

    if(filter==="unread")
        document.getElementById("chatFilterUnread")
        .classList.add("active");

    if(filter==="online")
        document.getElementById("chatFilterOnline")
        .classList.add("active");

    renderChats();
}


function renderChats(){

    const list=document.getElementById("chatList");

    if(!list) return;

    const search=
        (document.getElementById("chatSearch")?.value || "")
        .trim()
        .toLowerCase();

    let data=[...chatData];

    if(search){

        data=data.filter(chat=>
            chat.name.toLowerCase().includes(search) ||
            chat.username.toLowerCase().includes(search)
        );
    }

    if(chatFilter==="unread"){

        data=data.filter(chat=>chat.unread>0);
    }

    if(chatFilter==="online"){

        data=data.filter(chat=>chat.online);
    }

    if(!data.length){

        list.innerHTML=`

            <div class="empty">

                <div class="empty-icon">💬</div>

                No chats found.

            </div>

        `;

        updateGlobalUnread();

        return;
    }

    list.innerHTML=data.map(chat=>`

        <div class="list-card"
             onclick="openChat('${escapeHTML(chat.username)}')">

            <div class="list-avatar">

                ${getInitial(chat.name)}

                <span class="status-dot ${chat.online?"":"offline"}"></span>

            </div>

            <div class="list-info">

                <div class="list-name">
                    ${escapeHTML(chat.name)}
                </div>

                <div class="list-preview">
                    ${escapeHTML(getLastMessage(chat))}
                </div>

            </div>

            <div class="list-right">

                <div class="time">
                    ${escapeHTML(getLastTime(chat))}
                </div>

                ${
                    chat.unread>0
                    ?
                    `<span class="unread">${chat.unread}</span>`
                    :
                    ""
                }

            </div>

        </div>

    `).join("");

    updateGlobalUnread();
}


function openChat(username){

    const chat=
        chatData.find(c=>c.username===username);

    if(!chat) return;

    currentChatUser=username;

    chat.unread=0;

    saveChatData();

    document.getElementById("chatHeaderName")
        .textContent=chat.name;

    document.getElementById("chatHeaderStatus")
        .textContent=chat.online
        ? "Online"
        : "Offline";

    document.getElementById("chatHeaderAvatar")
        .textContent=getInitial(chat.name);

    document.getElementById("chatModal")
        .classList.remove("hidden");

    renderChatMessages();
    renderChats();
    updateGlobalUnread();

    setTimeout(()=>{

        document.getElementById("chatInput")
            ?.focus();

    },100);
}


function closeChat(){

    document.getElementById("chatModal")
        .classList.add("hidden");

    currentChatUser=null;
}


function renderChatMessages(){

    const container=
        document.getElementById("chatMessages");

    const chat=
        chatData.find(c=>
            c.username===currentChatUser
        );

    if(!container || !chat) return;

    if(!chat.messages.length){

        container.innerHTML=`

            <div class="empty">
                No messages yet.
            </div>

        `;

        return;
    }

    container.innerHTML=chat.messages.map(
        (message,index)=>`

        <div class="message-row ${
            message.sender==="me" ? "me" : ""
        }">

            <div>

                <div class="message-bubble">

                    <div class="message-text">
                        ${escapeHTML(message.text)}
                    </div>

                    <div class="message-time">
                        ${escapeHTML(message.time || "")}
                    </div>

                </div>

                ${
                    message.sender==="me"
                    ?
                    `<button
                        class="message-delete"
                        onclick="deleteMessage(${index})">
                        Delete
                    </button>`
                    :
                    ""
                }

            </div>

        </div>

    `).join("");

    container.scrollTop=container.scrollHeight;
}


function handleChatKey(event){

    if(event.key==="Enter"){

        event.preventDefault();

        sendMessage();
    }
}


function sendMessage(){

    if(!currentChatUser) return;

    const input=
        document.getElementById("chatInput");

    const text=input.value.trim();

    if(!text) return;

    const chat=
        chatData.find(c=>
            c.username===currentChatUser
        );

    if(!chat) return;

    const now=new Date();

    const time=
        now.toLocaleTimeString(
            [],
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        );

    chat.messages.push({

        sender:"me",
        text:text,
        time:time

    });

    input.value="";

    saveChatData();

    renderChatMessages();
    renderChats();
    updateGlobalUnread();
}


function deleteMessage(index){

    if(!currentChatUser) return;

    const chat=
        chatData.find(c=>
            c.username===currentChatUser
        );

    if(!chat) return;

    if(!chat.messages[index]) return;

    chat.messages.splice(index,1);

    saveChatData();

    renderChatMessages();
    renderChats();
}


function deleteCurrentChat(){

    if(!currentChatUser) return;

    askConfirm(
        "Delete Chat",
        "Delete this entire chat history?",
        ()=>{
            chatData=
                chatData.filter(
                    c=>c.username!==currentChatUser
                );

            saveChatData();

            closeConfirm();
            closeChat();

            renderChats();
            updateGlobalUnread();

            showToast("Chat deleted.");
        }
    );
}


function markChatRead(username){

    const chat=
        chatData.find(c=>c.username===username);

    if(chat){

        chat.unread=0;

        saveChatData();

        updateGlobalUnread();
        renderChats();
    }
}


function updateChatPreview(){

    renderChats();
}


function openChatUserProfile(){

    if(!currentChatUser) return;

    const chat=
        chatData.find(c=>
            c.username===currentChatUser
        );

    if(!chat) return;

    closeChat();

    openFriendProfile(chat.username);
}


function updateGlobalUnread(){

    const total=
        chatData.reduce(
            (sum,chat)=>sum+(chat.unread||0),
            0
        );

    const badge=
        document.getElementById("globalUnread");

    const navBadge=
        document.getElementById("navChatBadge");

    [badge,navBadge].forEach(el=>{

        if(!el) return;

        if(total>0){

            el.textContent=
                total>99 ? "99+" : total;

            el.classList.remove("hidden");

        }else{

            el.classList.add("hidden");
        }

    });
}

function addFriendDemo(){

    const name=prompt("Enter friend name:");

    if(!name || !name.trim()) return;

    const username=
        name.trim()
            .toLowerCase()
            .replace(/\s+/g,"");

    const data=getFriendData();

    if(data.friends.some(f=>f.username===username)){

        showToast("Friend already exists.");
        return;
    }

    data.friends.push({

        username:username,
        name:name.trim(),
        online:true

    });

    saveFriendData(data);

    renderFriends();
    renderHome();

    showToast("Friend added.");
}


function acceptFriend(username){

    const requests=getFriendRequests();

    const request=
        requests.find(r=>r.username===username);

    if(!request) return;

    const data=getFriendData();

    if(!data.friends.some(f=>f.username===username)){

        data.friends.push({

            username:request.username,
            name:request.name,
            online:true

        });
    }

    saveFriendData(data);

    saveFriendRequests(
        requests.filter(
            r=>r.username!==username
        )
    );

    renderFriends();
    renderHome();

    showToast("Friend request accepted.");
}


function declineFriend(username){

    const requests=getFriendRequests();

    saveFriendRequests(
        requests.filter(
            r=>r.username!==username
        )
    );

    renderFriends();

    showToast("Friend request declined.");
}


function removeFriend(username){

    const data=getFriendData();

    const friend=
        data.friends.find(
            f=>f.username===username
        );

    if(!friend) return;

    askConfirm(
        "Remove Friend",
        `Remove ${friend.name} from your friends?`,
        ()=>{

            data.friends=
                data.friends.filter(
                    f=>f.username!==username
                );

            saveFriendData(data);

            closeConfirm();

            renderFriends();
            renderHome();

            showToast("Friend removed.");
        }
    );
}


function openFriendProfile(username){

    const data=getFriendData();

    let friend=
        data.friends.find(
            f=>f.username===username
        );

    if(!friend){

        const chat=
            chatData.find(
                c=>c.username===username
            );

        if(chat){

            friend={
                username:chat.username,
                name:chat.name,
                online:chat.online
            };

        }else{

            return;
        }
    }

    const body=
        document.getElementById("friendProfileBody");

    body.innerHTML=`

        <div style="text-align:center">

            <div class="profile-avatar-large"
                 style="margin:0 auto">

                ${getInitial(friend.name)}

                <span class="status-dot ${
                    friend.online ? "" : "offline"
                }"></span>

            </div>

            <div class="profile-name">
                ${escapeHTML(friend.name)}
            </div>

            <div class="profile-username">
                @${escapeHTML(friend.username)}
            </div>

            <div class="muted" style="margin-top:7px">
                ${friend.online ? "Online" : "Offline"}
            </div>

            <div class="profile-actions">

                <button class="profile-action"
                        onclick="chatFromFriendProfile('${escapeHTML(friend.username)}')">
                    💬 Chat

                    Close

        .classList.remove("hidden");

function closeFriendProfile(){

    document.getElementById("friendProfileModal")
        .classList.add("hidden");
}


function chatFromFriendProfile(username){

    closeFriendProfile();

    openFriendChat(username);
}


function openFriendChat(username){

    let chat=
        chatData.find(
            c=>c.username===username
        );

    const friend=
        getFriendData().friends.find(
            f=>f.username===username
        );

    if(!chat){

        if(!friend){

            showToast("Friend not found.");
            return;
        }

        chat={

            username:friend.username,
            name:friend.name,
            online:friend.online,
            unread:0,
            messages:[]

        };

        chatData.push(chat);

        saveChatData();
    }

    openChat(username);
}

function editName(){

    const user=getCurrentUser();

    if(!user) return;

    const name=prompt(
        "Enter your new name:",
        user.name
    );

    if(!name || !name.trim()) return;

    const newName=name.trim();

    const users=getUsers();

    const index=
        users.findIndex(
            u=>u.username===user.username
        );

    if(index!==-1){

        users[index].name=newName;

        saveUsers(users);

        user.name=newName;

        localStorage.setItem(
            "ym_current_user",
            JSON.stringify(user)
        );

        renderProfile();
        renderHome();

        showToast("Name updated.");
    }
}


function changePassword(){

    const user=getCurrentUser();

    if(!user) return;

    const oldPassword=prompt(
        "Enter current password:"
    );

    if(oldPassword!==user.password){

        showToast("Wrong current password.");
        return;
    }

    const newPassword=prompt(
        "Enter new password:"
    );

    if(!newPassword ||
       newPassword.length<6){

        showToast("Password must be at least 6 characters.");
        return;
    }

    const users=getUsers();

    const index=
        users.findIndex(
            u=>u.username===user.username
        );

    if(index!==-1){

        users[index].password=newPassword;

        saveUsers(users);

        user.password=newPassword;

        localStorage.setItem(
            "ym_current_user",
            JSON.stringify(user)
        );

        showToast("Password changed.");
    }
}


function changeProfilePhoto(){

    const input=
        document.createElement("input");

    input.type="file";
    input.accept="image/*";

    input.onchange=function(){

        const file=this.files[0];

        if(!file) return;

        const reader=new FileReader();

        reader.onload=function(){

            localStorage.setItem(
                "ym_profile_photo",
                reader.result
            );

            renderProfile();
            renderHome();

            showToast("Profile photo updated.");
        };

        reader.readAsDataURL(file);
    };

    input.click();
}


function changeCoverPhoto(){

    confirmAction=null;
}


/* =========================================================
   LOGOUT
========================================================= */

function logout(){

    askConfirm(
        "Logout",
        "Are you sure you want to logout?",
        ()=>{

            localStorage.removeItem(
                "ym_current_user"
            );

            closeConfirm();

            document.getElementById("mainApp")
                .classList.add("hidden");

            document.getElementById("authScreen")
                .classList.remove("hidden");

            showLogin();

            showToast("Logged out.");
        }
    );
}


/* =========================================================
   MODAL OUTSIDE CLICK
========================================================= */

document.querySelectorAll(".modal")
    .forEach(modal=>{

        modal.addEventListener(
            "click",
            function(event){

                if(event.target===modal){

                    modal.classList.add("hidden");

                    if(modal.id==="chatModal"){
                        currentChatUser=null;
                    }

                    if(modal.id==="roomModal"){
                        currentRoomId=null;
                    }

                }

            }
        );

    });


/* =========================================================
   INITIALIZE
========================================================= */

createDemoUser();

const existingUser=getCurrentUser();

if(existingUser){

    startApp();

}else{

    document.getElementById("authScreen")
        .classList.remove("hidden");

    document.getElementById("mainApp")
        .classList.add("hidden");

    showLogin();
}

</script>
