<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YAM Chat V4.4</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#eef2f6;
    color:#222;
}

button,
input,
textarea{
    font-family:Arial,sans-serif;
}

button{
    cursor:pointer;
    border:0;
}

.hidden{
    display:none !important;
}

/* =========================
   LOGIN
========================= */

#authView{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:linear-gradient(135deg,#1976d2,#42a5f5);
}

.auth-box{
    width:100%;
    max-width:390px;
    background:white;
    border-radius:20px;
    padding:28px 22px;
    box-shadow:0 10px 30px rgba(0,0,0,.2);
}

.auth-logo{
    text-align:center;
    font-size:34px;
    font-weight:bold;
    color:#1976d2;
    margin-bottom:5px;
}

.auth-sub{
    text-align:center;
    color:#777;
    font-size:13px;
    margin-bottom:25px;
}

.auth-box input{
    width:100%;
    padding:13px;
    border:1px solid #ddd;
    border-radius:10px;
    margin-bottom:12px;
    outline:none;
}

.auth-box input:focus{
    border-color:#1976d2;
}

.auth-btn{
    width:100%;
    padding:13px;
    border-radius:10px;
    background:#1976d2;
    color:white;
    font-weight:bold;
}

.auth-switch{
    text-align:center;
    margin-top:15px;
    color:#1976d2;
    font-size:13px;
    cursor:pointer;
}

/* =========================
   APP
========================= */

#appView{
    min-height:100vh;
    padding-bottom:70px;
}

.topbar{
    height:58px;
    background:#1976d2;
    color:white;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 16px;
    position:sticky;
    top:0;
    z-index:100;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
}

.topbar-title{
    font-size:21px;
    font-weight:bold;
}

.topbar-user{
    font-size:12px;
    opacity:.9;
}

.main-content{
    max-width:700px;
    margin:auto;
    padding:12px;
}

/* =========================
   BOTTOM NAV
========================= */

.bottom-nav{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    height:65px;
    background:white;
    border-top:1px solid #ddd;
    display:flex;
    z-index:500;
    box-shadow:0 -2px 10px rgba(0,0,0,.08);
}

.nav-btn{
    flex:1;
    background:white;
    color:#777;
    font-size:11px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:3px;
}

.nav-btn .icon{
    font-size:21px;
}

.nav-btn.active{
    color:#1976d2;
    font-weight:bold;
}

/* =========================
   FEED
========================= */

.feed-create{
    background:white;
    border-radius:14px;
    padding:14px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
    margin-bottom:12px;
}

.feed-create-title{
    font-weight:bold;
    margin-bottom:10px;
    color:#1976d2;
}

#postText{
    width:100%;
    min-height:85px;
    resize:none;
    border:1px solid #ddd;
    border-radius:10px;
    padding:11px;
    outline:none;
}

#postText:focus{
    border-color:#1976d2;
}

.media-selected{
    margin-top:10px;
    padding:9px;
    border-radius:8px;
    background:#f1f5f9;
    font-size:12px;
    color:#555;
}

.create-actions{
    display:flex;
    gap:8px;
    margin-top:10px;
}

.create-actions button{
    flex:1;
    padding:10px;
    border-radius:9px;
    background:#e3f2fd;
    color:#1976d2;
    font-weight:bold;
}

.create-actions button.post-btn{
    background:#1976d2;
    color:white;
}

.feed-empty{
    text-align:center;
    padding:35px 15px;
    color:#888;
}

/* =========================
   POST
========================= */

.post-card{
    background:white;
    border-radius:14px;
    margin-bottom:14px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
    overflow:hidden;
}

.post-head{
    display:flex;
    align-items:center;
    padding:13px;
    gap:10px;
}

.avatar{
    width:43px;
    height:43px;
    border-radius:50%;
    object-fit:cover;
    background:#ddd;
}

.avatar-small{
    width:32px;
    height:32px;
}

.post-user{
    flex:1;
}

.post-user-name{
    font-weight:bold;
    font-size:14px;
}

.post-time{
    font-size:11px;
    color:#888;
    margin-top:3px;
}

.post-menu{
    width:32px;
    height:32px;
    background:#f2f2f2;
    border-radius:50%;
    font-size:18px;
}

.post-body{
    padding:0 13px 12px;
}

.post-text{
    font-size:14px;
    line-height:1.5;
    white-space:pre-wrap;
    word-break:break-word;
}

.post-media{
    width:100%;
    max-height:500px;
    object-fit:contain;
    display:block;
    background:#000;
    margin-top:10px;
}

.post-video{
    width:100%;
    max-height:500px;
    background:#000;
    margin-top:10px;
}

.post-stats{
    display:flex;
    justify-content:space-between;
    padding:9px 13px;
    color:#777;
    font-size:12px;
    border-top:1px solid #eee;
}

.post-buttons{
    display:flex;
    border-top:1px solid #eee;
}

.post-action{
    flex:1;
    padding:11px 5px;
    background:white;
    color:#666;
    font-size:13px;
    font-weight:bold;
}

.post-action.liked{
    color:#e53935;
}

.post-comments{
    border-top:1px solid #eee;
    padding:10px 13px;
}

.comment-box{
    display:flex;
    gap:7px;
    margin-bottom:10px;
}

.comment-input{
    flex:1;
    border:1px solid #ddd;
    border-radius:18px;
    padding:9px 12px;
    outline:none;
}

.comment-send{
    width:38px;
    border-radius:50%;
    background:#1976d2;
    color:white;
}

.comment{
    display:flex;
    gap:8px;
    margin-top:9px;
}

.comment-content{
    flex:1;
    background:#f1f3f5;
    border-radius:12px;
    padding:8px 10px;
}

.comment-name{
    font-size:12px;
    font-weight:bold;
}

.comment-text{
    font-size:13px;
    margin-top:3px;
    white-space:pre-wrap;
    word-break:break-word;
}

.comment-actions{
    margin-top:5px;
    display:flex;
    gap:8px;
}

.comment-actions button{
    background:transparent;
    font-size:10px;
    color:#777;
}

.hidden-comment{
    color:#999;
    font-size:12px;
    font-style:italic;
}

/* =========================
   DROPDOWN
========================= */

.dropdown{
    position:fixed;
    background:white;
    border-radius:10px;
    box-shadow:0 5px 20px rgba(0,0,0,.2);
    z-index:1000;
    min-width:190px;
    overflow:hidden;
}

.dropdown button{
    display:block;
    width:100%;
    padding:12px;
    text-align:left;
    background:white;
    font-size:13px;
}

.dropdown button:hover{
    background:#f1f5f9;
}

.dropdown button.danger{
    color:#d32f2f;
}

/* =========================
   PROFILE
========================= */

.profile-card{
    background:white;
    border-radius:16px;
    overflow:hidden;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
}

.cover{
    height:190px;
    background:linear-gradient(135deg,#1976d2,#64b5f6);
    background-size:cover;
    background-position:center;
    position:relative;
}

.cover-camera{
    position:absolute;
    top:12px;
    left:12px;
    width:40px;
    height:40px;
    border-radius:50%;
    background:rgba(0,0,0,.45);
    color:white;
    font-size:18px;
}

.profile-menu-btn{
    position:absolute;
    top:12px;
    right:12px;
    width:40px;
    height:40px;
    border-radius:50%;
    background:rgba(0,0,0,.45);
    color:white;
    font-size:20px;
}

.profile-photo-wrap{
    margin-top:-55px;
    position:relative;
    display:flex;
    justify-content:center;
}

.profile-photo{
    width:110px;
    height:110px;
    border-radius:50%;
    border:5px solid white;
    object-fit:cover;
    background:#ddd;
}

.photo-camera{
    position:absolute;
    bottom:4px;
    margin-left:78px;
    width:35px;
    height:35px;
    border-radius:50%;
    background:#1976d2;
    color:white;
}

.profile-info{
    text-align:center;
    padding:10px 20px 20px;
}

.profile-name{
    font-size:22px;
    font-weight:bold;
}

.profile-status{
    margin-top:5px;
    color:#1976d2;
    font-size:13px;
    cursor:pointer;
}

.profile-bio{
    margin-top:10px;
    color:#666;
    font-size:13px;
    line-height:1.5;
}

.profile-details{
    padding:0 20px 20px;
}

.profile-detail{
    padding:10px 0;
    border-bottom:1px solid #eee;
    font-size:13px;
}

.profile-detail b{
    display:inline-block;
    width:100px;
}

.profile-music{
    position:relative;
    z-index:20;
    margin:15px 20px;
    padding:14px;
    border-radius:14px;
    background:rgba(255,255,255,.94);
    box-shadow:0 3px 10px rgba(0,0,0,.18);
}

.profile-music-title{
    color:#1976d2;
    font-weight:bold;
    font-size:15px;
    margin-bottom:6px;
}

.profile-music-name{
    color:#555;
    font-size:12px;
    margin-bottom:10px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.profile-music audio{
    width:100%;
    height:42px;
    display:none;
}

.profile-music audio.ready{
    display:block;
}

.profile-music-actions{
    display:flex;
    gap:8px;
}

.profile-music-actions button{
    flex:1;
    padding:10px 8px;
    border:0;
    border-radius:8px;
    background:#1976d2;
    color:white;
    font-size:12px;
}

.profile-music-actions button.remove{
    background:#d32f2f;
}

.profile-music-hint{
    color:#777;
    font-size:11px;
    line-height:1.4;
    margin-top:9px;
}

/* =========================
   FRIENDS
========================= */

.section-card{
    background:white;
    border-radius:14px;
    padding:15px;
    margin-bottom:12px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.section-title{
    font-size:18px;
    font-weight:bold;
    margin-bottom:12px;
    color:#1976d2;
}

.friend-item{
    display:flex;
    align-items:center;
    gap:10px;
    padding:11px 0;
    border-bottom:1px solid #eee;
}

.friend-info{
    flex:1;
}

.friend-name{
    font-weight:bold;
    font-size:14px;
}

.friend-status{
    font-size:11px;
    color:#777;
    margin-top:3px;
}

.friend-chat{
    padding:8px 11px;
    border-radius:8px;
    background:#1976d2;
    color:white;
    font-size:12px;
}

/* =========================
   ROOMS
========================= */

.room-item{
    padding:14px;
    border-radius:12px;
    background:#f4f7fa;
    margin-bottom:9px;
    display:flex;
    align-items:center;
    gap:10px;
}

.room-icon{
    font-size:28px;
}

.room-info{
    flex:1;
}

.room-name{
    font-weight:bold;
}

.room-desc{
    color:#777;
    font-size:11px;
    margin-top:3px;
}

.room-open{
    padding:8px 11px;
    background:#1976d2;
    color:white;
    border-radius:8px;
    font-size:12px;
}

/* =========================
   OVERLAY
========================= */

.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    z-index:800;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:15px;
}

.modal{
    width:100%;
    max-width:500px;
    max-height:90vh;
    background:white;
    border-radius:16px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
}

.modal-head{
    padding:14px;
    background:#1976d2;
    color:white;
    display:flex;
    align-items:center;
}

.modal-title{
    flex:1;
    font-weight:bold;
}

.modal-close{
    width:32px;
    height:32px;
    border-radius:50%;
    background:rgba(255,255,255,.2);
    color:white;
}

.chat-messages{
    flex:1;
    overflow-y:auto;
    padding:15px;
    background:#eef2f6;
    min-height:300px;
}

.msg{
    margin-bottom:9px;
    display:flex;
}

.msg.mine{
    justify-content:flex-end;
}

.msg-bubble{
    max-width:75%;
    padding:9px 12px;
    border-radius:14px;
    background:white;
    font-size:13px;
    white-space:pre-wrap;
    word-break:break-word;
}

.msg.mine .msg-bubble{
    background:#1976d2;
    color:white;
}

.chat-input-row{
    display:flex;
    gap:7px;
    padding:10px;
    border-top:1px solid #ddd;
}

.chat-input{
    flex:1;
    border:1px solid #ddd;
    border-radius:20px;
    padding:10px 13px;
    outline:none;
}

.chat-send{
    width:42px;
    border-radius:50%;
    background:#1976d2;
    color:white;
}

/* =========================
   EDIT PROFILE
========================= */

.form-body{
    padding:15px;
    overflow-y:auto;
}

.form-group{
    margin-bottom:12px;
}

.form-group label{
    display:block;
    font-size:12px;
    font-weight:bold;
    margin-bottom:5px;
}

.form-group input,
.form-group textarea,
.form-group select{
    width:100%;
    border:1px solid #ddd;
    border-radius:9px;
    padding:10px;
    outline:none;
}

.form-group textarea{
    resize:vertical;
    min-height:70px;
}

.save-btn{
    width:100%;
    padding:12px;
    border-radius:9px;
    background:#1976d2;
    color:white;
    font-weight:bold;
}

/* =========================
   COMMENT MANAGEMENT
========================= */

.manage-list{
    padding:15px;
    overflow-y:auto;
}

.manage-user{
    padding:12px;
    border-bottom:1px solid #eee;
    display:flex;
    align-items:center;
    gap:10px;
}

.manage-user-info{
    flex:1;
}

.manage-user-name{
    font-weight:bold;
    font-size:13px;
}

.manage-user-status{
    font-size:11px;
    color:#777;
    margin-top:3px;
}

.manage-btn{
    padding:8px 10px;
    border-radius:8px;
    font-size:11px;
}

.manage-btn.block{
    background:#d32f2f;
    color:white;
}

.manage-btn.unblock{
    background:#2e7d32;
    color:white;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:500px){

    .main-content{
        padding:8px;
    }

    .cover{
        height:170px;
    }

    .post-card{
        border-radius:10px;
    }

    .profile-music{
        margin-left:12px;
        margin-right:12px;
    }
}
</style>
</head>

<body>

<!-- =========================
     AUTH
========================= -->

<div id="authView">

    <div class="auth-box">

        <div class="auth-logo">YAM</div>

        <div class="auth-sub">
            YAM Chat V4.4
        </div>

        <div id="loginForm">

            <input
                id="loginUsername"
                type="text"
                placeholder="Username"
                autocomplete="username">

            <input
                id="loginPassword"
                type="password"
                placeholder="Password"
                autocomplete="current-password">

            <button
                class="auth-btn"
                onclick="login();">
                LOGIN
            </button>

            <div
                class="auth-switch"
                onclick="showRegister();">
                Belum ada akaun? Daftar
            </div>

        </div>

        <div id="registerForm" class="hidden">

            <input
                id="registerUsername"
                type="text"
                placeholder="Username">

            <input
                id="registerName"
                type="text"
                placeholder="Nama">

            <input
                id="registerPassword"
                type="password"
                placeholder="Password">

            <button
                class="auth-btn"
                onclick="register();">
                DAFTAR
            </button>

            <div
                class="auth-switch"
                onclick="showLogin();">
                Sudah ada akaun? Login
            </div>

        </div>

    </div>

</div>


<!-- =========================
     APP
========================= -->

<div id="appView" class="hidden">

    <div class="topbar">

        <div class="topbar-title">
            YAM Chat
        </div>

        <div
            id="topbarUser"
            class="topbar-user">
        </div>

    </div>


    <main class="main-content">

        <!-- HOME -->

        <section id="homeView">

            <div class="feed-create">

                <div class="feed-create-title">
                    📝 Apa yang anda fikirkan?
                </div>

                <textarea
                    id="postText"
                    placeholder="Tulis sesuatu..."></textarea>

                <div
                    id="selectedMedia"
                    class="media-selected hidden">
                </div>

                <div class="create-actions">

                    <button
                        onclick="choosePostImage();">
                        🖼️ Gambar
                    </button>

                    <button
                        onclick="choosePostVideo();">
                        🎥 Video
                    </button>

                    <button
                        class="post-btn"
                        onclick="createPost();">
                        🚀 Post
                    </button>

                </div>

            </div>

            <div id="feedList"></div>

        </section>


        <!-- FRIENDS -->

        <section
            id="friendsView"
            class="hidden">

            <div class="section-card">

                <div class="section-title">
                    👥 Friends
                </div>

                <div id="friendsList"></div>

            </div>

        </section>


        <!-- ROOMS -->

        <section
            id="roomsView"
            class="hidden">

            <div class="section-card">

                <div class="section-title">
                    🌎 YAM Rooms
                </div>

                <div id="roomsList"></div>

            </div>

        </section>


        <!-- PROFILE -->

        <section
            id="profileView"
            class="hidden">

            <div class="profile-card">

                <div
                    id="profileCover"
                    class="cover">

                    <button
                        class="cover-camera"
                        onclick="changeCover();">
                        📷
                    </button>

                    <button
                        class="profile-menu-btn"
                        onclick="openProfileMenu();">
                        ⋮
                    </button>

                </div>

                <div class="profile-photo-wrap">

                    <img
                        id="profilePhoto"
                        class="profile-photo"
                        src=""
                        alt="Profile">

                    <button
                        class="photo-camera"
                        onclick="changeProfilePicture();">
                        📷
                    </button>

                </div>

                <div class="profile-info">

                    <div
                        id="profileName"
                        class="profile-name">
                    </div>

                    <div
                        id="profileStatus"
                        class="profile-status"
                        onclick="editStatus();">
                    </div>

                    <div
                        id="profileBio"
                        class="profile-bio">
                    </div>

                </div>

                <div
                    id="profileDetails"
                    class="profile-details">
                </div>

            </div>


            <!-- MUSIC PROFILE -->

            <div class="profile-music">

                <div class="profile-music-title">
                    🎵 Music Profile
                </div>

                <div
                    id="profileMusicName"
                    class="profile-music-name">
                    Belum ada lagu dipilih
                </div>

                <audio
                    id="profileMusicPlayer"
                    controls
                    preload="metadata">
                </audio>

                <div class="profile-music-actions">

                    <button
                        type="button"
                        onclick="changeProfileMusic();">
                        🎵 Pilih Lagu
                    </button>

                    <button
                        type="button"
                        class="remove"
                        onclick="removeProfileMusic();">
                        🗑️ Buang
                    </button>

                </div>

                <div class="profile-music-hint">
                    Pilih lagu dari phone. Browser biasanya perlukan pengguna tekan ▶️ untuk mula bermain.
                </div>

            </div>

        </section>

    </main>


    <!-- BOTTOM NAV -->

    <nav class="bottom-nav">

        <button
            class="nav-btn active"
            id="navHome"
            onclick="showView('home');">

            <span class="icon">🏠</span>
            Home

        </button>

        <button
            class="nav-btn"
            id="navFriends"
            onclick="showView('friends');">

            <span class="icon">👥</span>
            Friends

        </button>

        <button
            class="nav-btn"
            id="navRooms"
            onclick="showView('rooms');">

            <span class="icon">🌎</span>
            Rooms

        </button>

        <button
            class="nav-btn"
            id="navProfile"
            onclick="showView('profile');">

            <span class="icon">👤</span>
            Profile

        </button>

    </nav>

</div>


<!-- =========================
     HIDDEN FILE INPUTS
========================= -->

<input
    id="profilePictureInput"
    type="file"
    accept="image/*"
    style="display:none;">

<input
    id="coverInput"
    type="file"
    accept="image/*"
    style="display:none;">

<input
    id="profileMusicInput"
    type="file"
    accept="audio/*"
    style="display:none;">

<input
    id="postImageInput"
    type="file"
    accept="image/*"
    style="display:none;">

<input

<script>

/* =====================================================

/* =========================
   STORAGE HELPERS
========================= */

function getAccounts(){

    try{
        return JSON.parse(
            localStorage.getItem("yam_accounts") || "[]"
        );
    }catch(e){
        return [];
    }
}

function saveAccounts(accounts){

    localStorage.setItem(
        "yam_accounts",
        JSON.stringify(accounts)
    );
}

function getCurrentUser(){

    return localStorage.getItem("yam_current_user");
}

function setCurrentUser(username){

    localStorage.setItem(
        "yam_current_user",
        username
    );
}

function clearCurrentUser(){

    localStorage.removeItem(
        "yam_current_user"
    );
}

function getAccount(username){

    const accounts = getAccounts();

    return accounts.find(
        a => a.username === username
    );
}

function getDisplayName(username){

    const account = getAccount(username);

    return account
        ? (account.name || username)
        : username;
}


/* =========================
   DEFAULT AVATAR
========================= */

function defaultAvatar(){

    return "data:image/svg+xml;charset=UTF-8," +
    encodeURIComponent(`
        <svg xmlns="http://www.w3.org/2000/svg"
             width="200"
             height="200"
             viewBox="0 0 200 200">

            <rect width="200"
                  height="200"
                  fill="#e0e0e0"/>

            <circle
                cx="100"
                cy="75"
                r="40"
                fill="#9e9e9e"/>

            <path
                d="M35 180
                   C40 130 70 115 100 115
                   C130 115 160 130 165 180Z"
                fill="#9e9e9e"/>

        </svg>
    `);
}

function getProfilePicture(username){

    return localStorage.getItem(
        "yam_picture_" + username
    ) || defaultAvatar();
}


/* =========================
   AUTH
========================= */

function showLogin(){

    document.getElementById(
        "loginForm"
    ).classList.remove("hidden");

    document.getElementById(
        "registerForm"
    ).classList.add("hidden");
}

function showRegister(){

    document.getElementById(
        "loginForm"
    ).classList.add("hidden");

    document.getElementById(
        "registerForm"
    ).classList.remove("hidden");
}

function register(){

    const username =
        document.getElementById(
            "registerUsername"
        ).value.trim();

    const name =
        document.getElementById(
            "registerName"
        ).value.trim();

    const password =
        document.getElementById(
            "registerPassword"
        ).value;

    if(!username || !name || !password){

        alert("Sila lengkapkan semua maklumat.");
        return;
    }

    if(username.length < 3){

        alert("Username mesti sekurang-kurangnya 3 aksara.");
        return;
    }

    const accounts = getAccounts();

    if(accounts.some(
        a => a.username.toLowerCase()
        === username.toLowerCase()
    )){

        alert("Username sudah digunakan.");
        return;
    }

    accounts.push({
        username:username,
        name:name,
        password:password,
        birthday:"",
        location:"",
        job:"",
        gender:"",
        bio:""
    });

    saveAccounts(accounts);

    alert("Akaun YAM berjaya dibuat.");

    document.getElementById(
        "registerUsername"
    ).value = "";

    document.getElementById(
        "registerName"
    ).value = "";

    document.getElementById(
        "registerPassword"
    ).value = "";

    showLogin();
}

function login(){

    const username =
        document.getElementById(
            "loginUsername"
        ).value.trim();

    const password =
        document.getElementById(
            "loginPassword"
        ).value;

    const account = getAccount(username);

    if(!account){

        alert("Akaun tidak dijumpai.");
        return;
    }

    if(account.password !== password){

        alert("Password salah.");
        return;
    }

    setCurrentUser(account.username);

    startApp();
}

function logout(){

    if(!confirm("Logout dari YAM Chat?")){
        return;
    }

    clearCurrentUser();

    document.getElementById(
        "appView"
    ).classList.add("hidden");

    document.getElementById(
        "authView"
    ).classList.remove("hidden");

    showLogin();
}


/* =========================
   APP START
========================= */

function startApp(){

    document.getElementById(
        "authView"
    ).classList.add("hidden");

    document.getElementById(
        "appView"
    ).classList.remove("hidden");

    const user = getCurrentUser();

    document.getElementById(
        "topbarUser"
    ).innerText =
        getDisplayName(user);

    loadProfile();

    renderFeed();

    renderFriends();

    renderRooms();

    showView("home");
}


/* =========================
   NAVIGATION
========================= */

function showView(view){

    const views = [
        "homeView",
        "friendsView",
        "roomsView",
        "profileView"
    ];

    views.forEach(id => {

        document.getElementById(id)
            .classList.add("hidden");

    });

    const navs = [
        "navHome",
        "navFriends",
        "navRooms",
        "navProfile"
    ];

    navs.forEach(id => {

        document.getElementById(id)
            .classList.remove("active");

    });

    if(view === "home"){

        document.getElementById(
            "homeView"
        ).classList.remove("hidden");

        document.getElementById(
            "navHome"
        ).classList.add("active");

        renderFeed();
    }

    if(view === "friends"){

        document.getElementById(
            "friendsView"
        ).classList.remove("hidden");

        document.getElementById(
            "navFriends"
        ).classList.add("active");

        renderFriends();
    }

    if(view === "rooms"){

        document.getElementById(
            "roomsView"
        ).classList.remove("hidden");

        document.getElementById(
            "navRooms"
        ).classList.add("active");

        renderRooms();
    }

    if(view === "profile"){

        document.getElementById(
            "profileView"
        ).classList.remove("hidden");

        document.getElementById(
            "navProfile"
        ).classList.add("active");

        loadProfile();
    }
}


/* =====================================================
   SOCIAL FEED
===================================================== */

function getPosts(){

    try{

        return JSON.parse(
            localStorage.getItem(
                "yam_posts"
            ) || "[]"
        );

    }catch(e){

        return [];
    }
}

function savePosts(posts){

    localStorage.setItem(
        "yam_posts",
        JSON.stringify(posts)
    );
}


/* =========================
   POST MEDIA
========================= */

let selectedPostFile = null;
let selectedPostType = null;

function choosePostImage(){

    const input =
        document.getElementById(
            "postImageInput"
        );

    input.value = "";
    input.click();
}

function choosePostVideo(){

    const input =
        document.getElementById(
            "postVideoInput"
        );

    input.value = "";
    input.click();
}

function handlePostFile(file,type){

    if(!file){
        return;
    }

    if(type === "image" &&
       !file.type.startsWith("image/")){

        alert("Sila pilih gambar.");
        return;
    }

    if(type === "video" &&
       !file.type.startsWith("video/")){

        alert("Sila pilih video.");
        return;
    }

    const maxSize =
        type === "image"
        ? 3 * 1024 * 1024
        : 6 * 1024 * 1024;

    if(file.size > maxSize){

        alert(
            type === "image"
            ? "Gambar demo maksimum 3MB."
            : "Video demo maksimum 6MB."
        );

        return;
    }

    selectedPostFile = file;
    selectedPostType = type;

    const box =
        document.getElementById(
            "selectedMedia"
        );

    box.classList.remove("hidden");

    box.innerText =
        (type === "image" ? "🖼️ " : "🎥 ")
        + file.name
        + " — "
        + formatFileSize(file.size);
}

function formatFileSize(bytes){

    if(bytes < 1024){
        return bytes + " B";
    }

    if(bytes < 1024 * 1024){

        return (
            bytes / 1024
        ).toFixed(1)
        + " KB";
    }

    return (
        bytes / (1024 * 1024)
    ).toFixed(1)
    + " MB";
}


/* =========================
   CREATE POST
========================= */

function createPost(){

    const user = getCurrentUser();

    if(!user){
        return;
    }

    const text =
        document.getElementById(
            "postText"
        ).value.trim();

    if(!text && !selectedPostFile){

        alert(
            "Tulis sesuatu atau pilih gambar/video."
        );

        return;
    }

    const finishPost = function(
        mediaData
    ){

        const posts = getPosts();

        const post = {

            id:
                "post_"
                + Date.now()
                + "_"
                + Math.random()
                    .toString(36)
                    .slice(2,8),

            username:user,

            text:text,

            mediaType:
                selectedPostType || null,

            mediaData:
                mediaData || null,

            mediaName:
                selectedPostFile
                ? selectedPostFile.name
                : null,

            createdAt:Date.now(),

            likes:[],

            comments:[],

            blockedCommenters:[]

        };

        posts.unshift(post);

        try{

            savePosts(posts);

            document.getElementById(
                "postText"
            ).value = "";

            selectedPostFile = null;
            selectedPostType = null;

            const box =
                document.getElementById(
                    "selectedMedia"
                );

            box.classList.add("hidden");
            box.innerText = "";

            renderFeed();

            alert("🚀 Post berjaya diterbitkan.");

        }catch(error){

            alert(
                "Post gagal disimpan. Storage browser mungkin penuh."
            );
        }
    };

    if(selectedPostFile){

        const reader =
            new FileReader();

        reader.onload = function(e){

            finishPost(
                e.target.result
            );

        };

        reader.onerror = function(){

            alert("Fail media tidak dapat dibaca.");
        };

        reader.readAsDataURL(
            selectedPostFile
        );

    }else{

        finishPost(null);
    }
}


/* =========================
   TIME
========================= */

function formatPostTime(timestamp){

    const diff =
        Date.now() - timestamp;

    const minute =
        60 * 1000;

    const hour =
        60 * minute;

    const day =
        24 * hour;

    if(diff < minute){
        return "Baru sahaja";
    }

    if(diff < hour){

        return Math.floor(
            diff / minute
        ) + " minit lalu";
    }

    if(diff < day){

        return Math.floor(
            diff / hour
        ) + " jam lalu";
    }

    if(diff < 7 * day){

        return Math.floor(
            diff / day
        ) + " hari lalu";
    }

    return new Date(
        timestamp
    ).toLocaleDateString(
        "ms-MY"
    );
}


/* =========================
   SAFE TEXT
========================= */

function escapeHtml(value){

    return String(value || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/* =========================
   RENDER FEED
========================= */

function renderFeed(){

    const box =
        document.getElementById(
            "feedList"
        );

    if(!box){
        return;
    }

    const posts = getPosts();

    if(posts.length === 0){

        box.innerHTML = `
            <div class="feed-empty">
                📝 Belum ada post.<br>
                Jadilah orang pertama membuat post di YAM!
            </div>
        `;

        return;
    }

    box.innerHTML = "";

    posts.forEach(post => {

        box.appendChild(
            buildPostElement(post)
        );

    });
}


/* =========================
   BUILD POST
========================= */

function buildPostElement(post){

    const currentUser =
        getCurrentUser();

    const card =
        document.createElement(
            "div"
        );

    card.className =
        "post-card";

    const head =
        document.createElement(
            "div"
        );

    head.className =
        "post-head";

    const avatar =
        document.createElement(
            "img"
        );

    avatar.className =
        "avatar";

    avatar.src =
        getProfilePicture(
            post.username
        );

    const userBox =
        document.createElement(
            "div"
        );

    userBox.className =
        "post-user";

    const name =
        document.createElement(
            "div"
        );

    name.className =
        "post-user-name";

    name.textContent =
        getDisplayName(
            post.username
        );

    const time =
        document.createElement(
            "div"
        );

    time.className =
        "post-time";

    time.textContent =
        formatPostTime(
            post.createdAt
        );

    userBox.appendChild(name);
    userBox.appendChild(time);

    const menu =
        document.createElement(
            "button"
        );

    menu.className =
        "post-menu";

    menu.textContent = "⋮";

    menu.onclick = function(e){

        e.stopPropagation();

        openPostMenu(
            post.id,
            menu
        );
    };

    head.appendChild(avatar);
    head.appendChild(userBox);
    head.appendChild(menu);


    const body =
        document.createElement(
            "div"
        );

    body.className =
        "post-body";

    if(post.text){

        const text =
            document.createElement(
                "div"
            );

        text.className =
            "post-text";

        text.textContent =
            post.text;

        body.appendChild(text);
    }


    if(post.mediaType === "image" &&
       post.mediaData){

        const img =
            document.createElement(
                "img"
            );

        img.className =
            "post-media";

        img.src =
            post.mediaData;

        img.alt =
            post.mediaName || "Gambar post";

        body.appendChild(img);
    }


    if(post.mediaType === "video" &&
       post.mediaData){

        const video =
            document.createElement(
                "video"
            );

        video.className =
            "post-video";

        video.controls = true;

        video.preload = "metadata";

        video.src =
            post.mediaData;

        body.appendChild(video);
    }


    const stats =
        document.createElement(
            "div"
        );

    stats.className =
        "post-stats";

    const likeCount =
        post.likes
        ? post.likes.length
        : 0;

    const visibleComments =
        post.comments
        ? post.comments.filter(
            c => !c.hidden
        ).length
        : 0;

    const left =
        document.createElement(
            "span"
        );

    left.textContent =
        "❤️ "
        + likeCount
        + " Like";

    const right =
        document.createElement(
            "span"
        );

    right.textContent =
        "💬 "
        + visibleComments
        + " Komen";

    stats.appendChild(left);
    stats.appendChild(right);


    const buttons =
        document.createElement(
            "div"
        );

    buttons.className =
        "post-buttons";

    const likeBtn =
        document.createElement(
            "button"
        );

    likeBtn.className =
        "post-action";

    const hasLiked =
        post.likes &&
        post.likes.includes(
            currentUser
        );

    if(hasLiked){
        likeBtn.classList.add(
            "liked"
        );
    }

    likeBtn.textContent =
        hasLiked
        ? "❤️ Liked"
        : "🤍 Like";

    likeBtn.onclick = function(){

        toggleLike(
            post.id
        );
    };


    const commentBtn =
        document.createElement(
            "button"
        );

    commentBtn.className =
        "post-action";

    commentBtn.textContent =
        "💬 Komen";

    commentBtn.onclick =
        function(){

            const input =
                document.querySelector(
                    `[data-comment-input="${post.id}"]`
                );

            if(input){

                input.focus();

                input.scrollIntoView({
                    behavior:"smooth",
                    block:"center"
                });
            }
        };


    buttons.appendChild(likeBtn);
    buttons.appendChild(commentBtn);


    const commentsBox =
        document.createElement(
            "div"
        );

    commentsBox.className =
        "post-comments";


    const blocked =
        post.blockedCommenters &&
        post.blockedCommenters.includes(
            currentUser
        );


    if(!blocked){

        const commentBox =
            document.createElement(
                "div"
            );

        commentBox.className =
            "comment-box";

        const input =
            document.createElement(
                "input"
            );

        input.className =
            "comment-input";

        input.placeholder =
            "Tulis komen...";

        input.dataset.commentInput =
            post.id;

        input.onkeydown =
            function(e){

                if(e.key === "Enter"){

                    e.preventDefault();

                    addComment(
                        post.id
                    );
                }
            };


        const send =
            document.createElement(
                "button"
            );

        send.className =
            "comment-send";

        send.textContent =
            "➤";

        send.onclick =
            function(){

                addComment(
                    post.id
                );
            };


        commentBox.appendChild(input);
        commentBox.appendChild(send);

        commentsBox.appendChild(
            commentBox
        );

    }else{

        const blockedMessage =
            document.createElement(
                "div"
            );

        blockedMessage.className =
            "hidden-comment";

        blockedMessage.textContent =
            "🚫 Anda telah disekat daripada mengomen post ini.";

        commentsBox.appendChild(
            blockedMessage
        );
    }


    const comments =
        post.comments || [];

    comments.forEach(comment => {

        if(comment.hidden &&
           post.username !== currentUser){

            return;
        }

        commentsBox.appendChild(
            buildCommentElement(
                post,
                comment
            )
        );

    });


    card.appendChild(head);
    card.appendChild(body);
    card.appendChild(stats);
    card.appendChild(buttons);
    card.appendChild(commentsBox);

    return card;
}


/* =========================
   LIKE
========================= */

function toggleLike(postId){

    const user =
        getCurrentUser();

    const posts =
        getPosts();

    const post =
        posts.find(
            p => p.id === postId
        );

    if(!post){
        return;
    }

    if(!Array.isArray(post.likes)){
        post.likes = [];
    }

    const index =
        post.likes.indexOf(
            user
        );

    if(index >= 0){

        post.likes.splice(
            index,
            1
        );

    }else{

        post.likes.push(
            user
        );
    }

    savePosts(posts);

    renderFeed();
}


/* =========================
   COMMENTS
========================= */

function addComment(postId){

    const user =
        getCurrentUser();

    const posts =
        getPosts();

    const post =
        posts.find(
            p => p.id === postId
        );

    if(!post){
        return;
    }

    if(
        post.blockedCommenters &&
        post.blockedCommenters.includes(user)
    ){

        alert(
            "Anda telah disekat daripada mengomen post ini."
        );

        return;
    }

    const input =
        document.querySelector(
            `[data-comment-input="${postId}"]`
        );

    if(!input){
        return;
    }

    const text =
        input.value.trim();

    if(!text){
        return;
    }

    if(!Array.isArray(post.comments)){
        post.comments = [];
    }

    post.comments.push({

        id:
            "comment_"
            + Date.now()
            + "_"
            + Math.random()
                .toString(36)
                .slice(2,7),

        username:user,

        text:text,

        createdAt:Date.now(),

        hidden:false

    });

    savePosts(posts);

    renderFeed();
}


/* =========================
   BUILD COMMENT
========================= */

function buildCommentElement(
    post,
    comment
){

    const currentUser =
        getCurrentUser();

    const row =
        document.createElement(
            "div"
        );

    row.className =
        "comment";

    const avatar =
        document.createElement(
            "img"
        );

    avatar.className =
        "avatar avatar-small";

    avatar.src =
        getProfilePicture(
            comment.username
        );

    const content =
        document.createElement(
            "div"
        );

    content.className =
        "comment-content";

    if(comment.hidden){

        const hidden =
            document.createElement(
                "div"
            );

        hidden.className =
            "hidden-comment";

        hidden.textContent =
            "🙈 Komen ini disembunyikan oleh pemilik post.";

        content.appendChild(hidden);

    }else{

        const name =
            document.createElement(
                "div"
            );

        name.className =
            "comment-name";

        name.textContent =
            getDisplayName(
                comment.username
            );

        const text =
            document.createElement(
                "div"
            );

        text.className =
            "comment-text";

        text.textContent =
            comment.text;

        const actions =
            document.createElement(
                "div"
            );

        actions.className =
            "comment-actions";


        /* POST OWNER */

        if(post.username === currentUser){

            const hideBtn =
                document.createElement(
                    "button"
                );

            hideBtn.textContent =
                "🙈 Hide";

            hideBtn.onclick =
                function(){

                    toggleHideComment(
                        post.id,
                        comment.id
                    );
                };

            actions.appendChild(
                hideBtn
            );


            const blockBtn =
                document.createElement(
                    "button"
                );

            blockBtn.textContent =
                "🚫 Block user";

            blockBtn.onclick =
                function(){

                    blockCommenter(
                        post.id,
                        comment.username
                    );
                };

            actions.appendChild(
                blockBtn
            );
        }


        /* COMMENT OWNER */

        if(comment.username === currentUser){

            const deleteBtn =
                document.createElement(
                    "button"
                );

            deleteBtn.textContent =
                "🗑️ Delete";

            deleteBtn.onclick =
                function(){

                    deleteComment(
                        post.id,
                        comment.id
                    );
                };

            actions.appendChild(
                deleteBtn
            );
        }


        content.appendChild(name);
        content.appendChild(text);
        content.appendChild(actions);
    }

    row.appendChild(avatar);
    row.appendChild(content);

    return row;
}


/* =========================
   HIDE / UNHIDE COMMENT
========================= */

function toggleHideComment(
    postId,
    commentId
){

    const posts =
        getPosts();

    const post =
        posts.find(
            p => p.id === postId
        );

    if(!post){
        return;
    }

    if(post.username !== getCurrentUser()){

        alert(
            "Hanya pemilik post boleh hide komen."
        );

        return;
    }

    const comment =
        post.comments.find(
            c => c.id === commentId
        );

    if(!comment){
        return;
    }

    comment.hidden =
        !comment.hidden;

    savePosts(posts);

    renderFeed();
}


/* =========================
   DELETE COMMENT
========================= */

function deleteComment(
    postId,
    commentId
){

    const posts =
        getPosts();

    const post =
        posts.find(
            p => p.id === postId
        );

    if(!post){
        return;
    }

    const comment =
        post.comments.find(
            c => c.id === commentId
        );

    if(!comment){
        return;
    }

    if(
        comment.username !==
        getCurrentUser()
    ){

        alert(
            "Anda hanya boleh buang komen sendiri."
        );

        return;
    }

    if(!confirm(
        "Buang komen ini?"
    )){

        return;
    }

    post.comments =
        post.comments.filter(
            c => c.id !== commentId
        );

    savePosts(posts);

    renderFeed();
}


/* =========================
   BLOCK COMMENTER
========================= */

function blockCommenter(
    postId,
    username
){

    if(username === getCurrentUser()){

        alert(
            "Tidak boleh block diri sendiri."
        );

        return;
    }

    const posts =
        getPosts();

    const post =
        posts.find(
            p => p.id === postId
        );

    if(!post){
        return;
    }

    if(post.username !== getCurrentUser()){

        alert(
            "Hanya pemilik post boleh block commenter."
        );

        return;
    }

    if(!confirm(
        "Block "
        + getDisplayName(username)
        + " daripada komen post ini?"
    )){

        return;
    }

    if(!Array.isArray(
        post.blockedCommenters
    )){

        post.blockedCommenters = [];
    }

    if(
        !post.blockedCommenters.includes(
            username
        )
    ){

        post.blockedCommenters.push(
            username
        );
    }

    savePosts(posts);

    renderFeed();
}


/* =========================
   MANAGE COMMENT USERS
========================= */

function openCommentManagement(
    postId
){

    const posts =
        getPosts();

    const post =
        posts.find(
            p => p.id === postId
        );

    if(!post){
        return;
    }

    if(post.username !== getCurrentUser()){

        alert(
            "Hanya pemilik post boleh mengurus komen."
        );

        return;
    }

    const modal =
        document.getElementById(
            "modal"
        );

    const blocked =
        post.blockedCommenters || [];

    const users = [];

    (post.comments || []).forEach(
        comment => {

            if(
                comment.username !==
                post.username &&
                !users.includes(
                    comment.username
                )
            ){

                users.push(
                    comment.username
                );
            }
        }
    );

    blocked.forEach(
        username => {

            if(!users.includes(username)){

                users.push(username);
            }
        }
    );


    modal.innerHTML = `
        <div class="modal-head">
            <div class="modal-title">
                🚫 Pengurusan Komen
            </div>
            <button
                class="modal-close"
                onclick="closeOverlay();">
                ✕
            </button>
        </div>

        <div class="manage-list"
             id="manageList">
        </div>
    `;

    const list =
        document.getElementById(
            "manageList"
        );

    if(users.length === 0){

        list.innerHTML = `
            <div class="feed-empty">
                Belum ada pengguna untuk diurus.
            </div>
        `;

    }else{

        users.forEach(username => {

            const row =
                document.createElement(
                    "div"
                );

            row.className =
                "manage-user";

            const avatar =
                document.createElement(
                    "img"
                );

            avatar.className =
                "avatar avatar-small";

            avatar.src =
                getProfilePicture(
                    username
                );

            const info =
                document.createElement(
                    "div"
                );

            info.className =
                "manage-user-info";

            const name =
                document.createElement(
                    "div"
                );

            name.className =
                "manage-user-name";

            name.textContent =
                getDisplayName(
                    username
                );

            const status =
                document.createElement(
                    "div"
                );

            status.className =
                "manage-user-status";

            const isBlocked =
                blocked.includes(
                    username
                );

            status.textContent =
                isBlocked
                ? "🚫 Disekat"
                : "✅ Boleh komen";

            info.appendChild(name);
            info.appendChild(status);

            const btn =
                document.createElement(
                    "button"
                );

            btn.className =
                "manage-btn "
                + (
                    isBlocked
                    ? "unblock"
                    : "block"
                );

            btn.textContent =
                isBlocked
                ? "Unblock"
                : "Block";

            btn.onclick =
                function(){

                    toggleBlockUser(
                        postId,
                        username
                    );
                };

            row.appendChild(avatar);
            row.appendChild(info);
            row.appendChild(btn);

            list.appendChild(row);
        });
    }

    openOverlay();
}


/* =========================
   BLOCK / UNBLOCK
========================= */

function toggleBlockUser(
    postId,
    username
){

    const posts =
        getPosts();

    const post =
        posts.find(
            p => p.id === postId
        );

    if(!post){
        return;
    }

    if(!Array.isArray(
        post.blockedCommenters
    )){

        post.blockedCommenters = [];
    }

    const index =
        post.blockedCommenters.indexOf(
            username
        );

    if(index >= 0){

        post.blockedCommenters.splice(
            index,
            1
        );

    }else{

        post.blockedCommenters.push(
            username
        );
    }

    savePosts(posts);

    openCommentManagement(
        postId
    );

    renderFeed();
}

        getAccount(username);

        prompt(

        name.trim();

        getCurrentUser();

            "Password mesti sekurang-kurangnya 4 aksara."

        return;
    }

    const accounts =
        getAccounts();

    const target =
        accounts.find(
            a => a.username === username
        );

    target.password =
        newPassword;

    saveAccounts(accounts);

    alert(
        "Password berjaya ditukar."
    );
}

function saveProfilePicture(event){

    const file =
        event.target.files &&
        event.target.files[0];

    if(!file){
        return;
    }

    if(!file.type.startsWith("image/")){

        alert(
            "Sila pilih gambar."
        );

        return;
    }

    if(file.size > 3 * 1024 * 1024){

        alert(
            "Gambar maksimum 3MB."
        );

        return;
    }

    const reader =
        new FileReader();

    reader.onload =
        function(e){

            const username =
                getCurrentUser();

            try{

                localStorage.setItem(
                    "yam_picture_" + username,
                    e.target.result
                );

                loadProfile();

                renderFeed();

            }catch(error){

                alert(
                    "Gambar tidak dapat disimpan. Storage mungkin penuh."
                );
            }
        };

    reader.readAsDataURL(file);
}

function loadProfileMusic(){

    const username =
        getCurrentUser();

    const player =
        document.getElementById(
            "profileMusicPlayer"
        );

    const nameBox =
        document.getElementById(
            "profileMusicName"
        );

    if(
        !username ||
        !player ||
        !nameBox
    ){

        return;
    }

    const music =
        localStorage.getItem(
            "yam_music_" + username
        );

    const musicName =
        localStorage.getItem(
            "yam_music_name_" + username
        );

    if(music){

        player.src =
            music;

        player.classList.add(
            "ready"
        );

        nameBox.innerText =
            musicName ||
            "Lagu profile";

    }else{

        player.pause();

        player.removeAttribute(
            "src"
        );

        player.load();

        player.classList.remove(
            "ready"
        );

        nameBox.innerText =
            "Belum ada lagu dipilih";
    }
}

function removeProfileMusic(){

    const username =
        getCurrentUser();

    if(!username){
        return;

    const music =
        localStorage.getItem(
            "yam_music_" + username
        );

    if(!music){

        alert(
            "Belum ada lagu untuk dibuang."
        );

        return;
    }

    if(!confirm(
        "Buang lagu dari profile?"
    )){

        return;
    }

    const player =
        document.getElementById(
            "profileMusicPlayer"
        );

    if(player){

        player.pause();

        player.removeAttribute(
            "src"
        );

        player.load();

        player.classList.remove(
            "ready"
        );
    }

    localStorage.removeItem(
        "yam_music_" + username
    );

    localStorage.removeItem(
        "yam_music_name_" + username
    );

    loadProfileMusic();

    alert(
        "🎵 Lagu profile sudah dibuang."
    );
}

function renderRooms(){

    yamRooms.forEach(
        room => {

                );

            row.innerHTML = `
                <div class="room-icon">

function getRoomKey(country){

    return "yamroom_"
        + country;
}

function getRoomMessages(country){

    try{

        return JSON.parse(
            localStorage.getItem(
                getRoomKey(country)
            ) || "[]"
        );

    }catch(e){

        return [];
    }
}

function saveRoomMessages(
    country,
    messages
){

    localStorage.setItem(
        getRoomKey(country),
        JSON.stringify(messages)
    );
}

function openRoom(
    country,
    icon
){

    const modal =
        document.getElementById(
            "modal"
        );

    modal.innerHTML = `

        <div class="modal-head">

            <div class="modal-title">
                ${icon} ${escapeHtml(country)} Room
            </div>

            <button
                class="modal-close"
                onclick="closeOverlay();">
                ✕
            </button>

        </div>

        <div
            id="roomMessages"
            class="chat-messages">
        </div>

        <div class="chat-input-row">

            <input
                id="roomInput"
                class="chat-input"
                placeholder="Tulis mesej room...">

            <button
                class="chat-send"
                onclick="sendRoomMessage(
                    '${escapeHtml(country)}'
                );">
                ➤
            </button>

        </div>
    `;

    openOverlay();

    renderRoomMessages(
        country
    );

    const input =
        document.getElementById(
            "roomInput"
        );

    input.onkeydown =
        function(e){

            if(e.key === "Enter"){

                e.preventDefault();

                sendRoomMessage(
                    country
                );
            }
        };

    input.focus();
}

/* =====================================================
   OVERLAY
===================================================== */

function openOverlay(){

    document.getElementById(
        "overlay"
    ).classList.remove(
        "hidden"
    );
}

function closeOverlay(){

    document.getElementById(
        "overlay"
    ).classList.add(
        "hidden"
    );
}

document.getElementById(
    "overlay"
).addEventListener(
    "click",
    function(e){

        if(e.target === this){

            closeOverlay();
        }
    }
);
