<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YAM Chat V4.4.1</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#f1f3f6;
    color:#222;
}

button{
    border:0;
    cursor:pointer;
}

.hidden{
    display:none!important;
}

/* ================= LOGIN ================= */

#loginPage{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:linear-gradient(135deg,#111827,#2563eb);
}

.login-box{
    width:100%;
    max-width:400px;
    background:white;
    border-radius:22px;
    padding:28px 22px;
    box-shadow:0 15px 45px rgba(0,0,0,.25);
}

.logo{
    text-align:center;
    font-size:40px;
    font-weight:bold;
    color:#2563eb;
    margin-bottom:5px;
}

.subtitle{
    text-align:center;
    color:#777;
    margin-bottom:22px;
}

.input{
    width:100%;
    padding:14px;
    margin-bottom:12px;
    border:1px solid #ddd;
    border-radius:12px;
    outline:none;
}

.input:focus,
textarea:focus{
    border-color:#2563eb;
}

.primary-btn{
    width:100%;
    padding:14px;
    border-radius:12px;
    background:#2563eb;
    color:white;
    font-size:16px;
    font-weight:bold;
}

.secondary-btn{
    width:100%;
    margin-top:10px;
    padding:13px;
    border-radius:12px;
    background:#eef2ff;
    color:#2563eb;
    font-weight:bold;
}

/* ================= APP ================= */

#app{
    min-height:100vh;
    padding-bottom:75px;
}

.topbar{
    position:sticky;
    top:0;
    z-index:50;
    height:60px;
    background:white;
    border-bottom:1px solid #ddd;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 16px;
}

.top-logo{
    font-size:25px;
    font-weight:bold;
    color:#2563eb;
}

.top-user{
    font-size:14px;
    font-weight:bold;
    color:#555;
}

/* ================= SECTIONS ================= */

.page{
    display:none;
    max-width:650px;
    margin:auto;
    padding:15px;
}

.page.active{
    display:block;
}

/* ================= POST COMPOSER ================= */

.create-box{
    background:white;
    border-radius:18px;
    padding:15px;
    margin-bottom:16px;
    box-shadow:0 3px 12px rgba(0,0,0,.07);
}

.create-title{
    font-size:18px;
    font-weight:bold;
    margin-bottom:14px;
}

.post-options{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:9px;
    margin-bottom:14px;
}

.post-option{
    min-height:75px;
    border-radius:14px;
    background:#f3f4f6;
    border:2px solid transparent;
    font-size:14px;
    font-weight:bold;
    color:#333;
}

.post-option span{
    display:block;
    font-size:27px;
    margin-bottom:5px;
}

.post-option.active{
    background:#eef2ff;
    border-color:#2563eb;
    color:#2563eb;
}

.post-editor{
    border-top:1px solid #eee;
    padding-top:14px;
}

#postText{
    width:100%;
    min-height:110px;
    resize:vertical;
    border:1px solid #ddd;
    border-radius:13px;
    padding:13px;
    font-size:15px;
    outline:none;
}

.media-box{
    margin-top:12px;
    border:1px dashed #aaa;
    border-radius:13px;
    padding:12px;
    text-align:center;
    background:#fafafa;
}

.media-box img,
.media-box video{
    max-width:100%;
    max-height:300px;
    border-radius:10px;
}

.media-name{
    margin-top:8px;
    font-size:13px;
    color:#555;
    word-break:break-word;
}

.editor-actions{
    display:flex;
    gap:8px;
    margin-top:12px;
}

.editor-actions button{
    flex:1;
    padding:13px 8px;
    border-radius:11px;
    font-weight:bold;
}

.post-submit{
    background:#2563eb;
    color:white;
}

.cancel-btn{
    background:#eee;
    color:#333;
}

/* ================= POSTS ================= */

.post-card{
    background:white;
    border-radius:18px;
    margin-bottom:16px;
    overflow:hidden;
    box-shadow:0 3px 12px rgba(0,0,0,.07);
}

.post-head{
    display:flex;
    align-items:center;
    padding:14px;
    gap:10px;
}

.avatar{
    width:44px;
    height:44px;
    border-radius:50%;
    object-fit:cover;
    background:#ddd;
}

.avatar-default{
    width:44px;
    height:44px;
    border-radius:50%;
    background:#2563eb;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:19px;
    font-weight:bold;
}

.post-user{
    font-weight:bold;
}

.post-time{
    font-size:12px;
    color:#888;
    margin-top:3px;
}

.post-menu{
    margin-left:auto;
    font-size:22px;
    background:transparent;
}

.post-text{
    padding:0 14px 14px;
    white-space:pre-wrap;
    word-break:break-word;
}

.post-media{
    width:100%;
    display:block;
    max-height:500px;
    object-fit:contain;
    background:#111;
}

.post-actions{
    display:flex;
    border-top:1px solid #eee;
    border-bottom:1px solid #eee;
}

.post-actions button{
    flex:1;
    background:white;
    padding:13px 5px;
    font-weight:bold;
    color:#555;
}

.post-actions button:hover{
    background:#f5f5f5;
}

.post-actions .liked{
    color:#e11d48;
}

.like-count{
    padding:9px 14px 4px;
    font-size:13px;
    color:#666;
}

.comments{
    padding:8px 14px 14px;
}

.comment{
    background:#f3f4f6;
    border-radius:12px;
    padding:9px;
    margin-top:7px;
}

.comment-head{
    display:flex;
    justify-content:space-between;
    font-size:13px;
    font-weight:bold;
}

.comment-text{
    margin-top:4px;
    font-size:14px;
    white-space:pre-wrap;
    word-break:break-word;
}

.comment-hidden{
    color:#888;
    font-style:italic;
}

.comment-form{
    display:flex;
    gap:7px;
    margin-top:10px;
}

.comment-form input{
    flex:1;
    border:1px solid #ddd;
    border-radius:20px;
    padding:11px 13px;
    outline:none;
}

.comment-form button{
    border-radius:20px;
    padding:0 15px;
    background:#2563eb;
    color:white;
    font-weight:bold;
}

/* ================= FRIENDS ================= */

.friend-card,
.room-card,
.profile-card{
    background:white;
    border-radius:18px;
    padding:15px;
    margin-bottom:12px;
    box-shadow:0 3px 12px rgba(0,0,0,.06);
}

.friend-card{
    display:flex;
    align-items:center;
    gap:12px;
}

.friend-info{
    flex:1;
}

.friend-name{
    font-weight:bold;
}

.friend-status{
    font-size:13px;
    color:#777;
    margin-top:3px;
}

.chat-btn{
    background:#2563eb;
    color:white;
    padding:9px 13px;
    border-radius:10px;
}

/* ================= ROOMS ================= */

.room-card{
    cursor:pointer;
}

.room-title{
    font-weight:bold;
    font-size:17px;
}

.room-sub{
    color:#777;
    font-size:13px;
    margin-top:5px;
}

/* ================= PROFILE ================= */

.profile-cover{
    height:180px;
    border-radius:18px 18px 0 0;
    background:linear-gradient(135deg,#2563eb,#111827);
    background-size:cover;
    background-position:center;
    position:relative;
}

.profile-main{
    background:white;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 3px 12px rgba(0,0,0,.07);
}

.profile-picture-wrap{
    padding:0 18px;
    margin-top:-48px;
    position:relative;
}

.profile-picture{
    width:95px;
    height:95px;
    border-radius:50%;
    border:5px solid white;
    object-fit:cover;
    background:#2563eb;
}

.profile-name{
    font-size:22px;
    font-weight:bold;
    margin-top:8px;
}

.profile-status{
    color:#666;
    margin-top:5px;
    cursor:pointer;
}

.profile-bio{
    color:#555;
    margin-top:10px;
    white-space:pre-wrap;
}

.profile-buttons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    padding:15px;
}

.profile-buttons button{
    padding:11px;
    border-radius:10px;
    background:#eef2ff;
    color:#2563eb;
    font-weight:bold;
}

.music-box{
    margin:0 15px 15px;
    background:#f5f5f5;
    padding:12px;
    border-radius:12px;
}

.music-box audio{
    width:100%;
}

.info-list{
    padding:0 15px 15px;
}

.info-row{
    padding:10px 0;
    border-bottom:1px solid #eee;
}

/* ================= BOTTOM NAV ================= */

.bottom-nav{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    height:65px;
    background:white;
    border-top:1px solid #ddd;
    display:flex;
    z-index:100;
}

.bottom-nav button{
    flex:1;
    background:white;
    color:#777;
    font-size:12px;
}

.bottom-nav button span{
    display:block;
    font-size:22px;
    margin-bottom:2px;
}

.bottom-nav button.active{
    color:#2563eb;
    font-weight:bold;
}

/* ================= MODAL ================= */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.5);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:200;
}

.modal-box{
    width:100%;
    max-width:450px;
    max-height:85vh;
    overflow:auto;
    background:white;
    border-radius:18px;
    padding:18px;
}

.modal-title{
    font-size:19px;
    font-weight:bold;
    margin-bottom:15px;
}

.modal-close{
    width:100%;
    padding:12px;
    border-radius:10px;
    background:#eee;
    margin-top:12px;
}

.modal-list button{
    width:100%;
    padding:12px;
    margin-bottom:8px;
    border-radius:10px;
    background:#f3f4f6;
    text-align:left;
}

/* ================= CHAT ================= */

.chat-box{
    position:fixed;
    inset:0;
    background:#f1f3f6;
    z-index:150;
    display:none;
    flex-direction:column;
}

.chat-box.show{
    display:flex;
}

.chat-header{
    height:60px;
    background:white;
    border-bottom:1px solid #ddd;
    display:flex;
    align-items:center;
    padding:0 12px;
    gap:10px;
}

.chat-header button{
    background:transparent;
    font-size:23px;
}

.chat-messages{
    flex:1;
    overflow:auto;
    padding:15px;
}

.msg{
    max-width:78%;
    padding:10px 13px;
    border-radius:15px;
    margin-bottom:8px;
    word-break:break-word;
}

.msg.me{
    margin-left:auto;
    background:#2563eb;
    color:white;
}

.msg.them{
    background:white;
}

.chat-input{
    background:white;
    padding:10px;
    display:flex;
    gap:8px;
}

.chat-input input{
    flex:1;
    border:1px solid #ddd;
    border-radius:20px;
    padding:11px 14px;
    outline:none;
}

.chat-input button{
    background:#2563eb;
    color:white;
    border-radius:20px;
    padding:0 17px;
}

/* ================= RESPONSIVE ================= */

@media(max-width:450px){
    .post-options{
        gap:6px;
    }

    .post-option{
        font-size:12px;
        min-height:70px;
    }

    .post-option span{
        font-size:24px;
    }

    .profile-buttons{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<!-- ================= LOGIN ================= -->

<div id="loginPage">

    <div class="login-box">

        <div class="logo">YAM</div>
        <div class="subtitle">YAM Chat</div>

        <input
            id="loginUsername"
            class="input"
            placeholder="Username">

        <input
            id="loginPassword"
            class="input"
            type="password"
            placeholder="Password">

        <button
            class="primary-btn"
            onclick="login()">
            🔐 Login
        </button>

        <button
            class="secondary-btn"
            onclick="showRegister()">
            ➕ Daftar Akaun
        </button>

        <div
            id="registerArea"
            class="hidden"
            style="margin-top:18px;">

            <input
                id="regUsername"
                class="input"
                placeholder="Username baru">

            <input
                id="regPassword"
                class="input"
                type="password"
                placeholder="Password">

            <button
                class="primary-btn"
                onclick="register()">
                Daftar
            </button>

        </div>

    </div>

</div>


<!-- ================= APP ================= -->

<div id="app" class="hidden">

    <div class="topbar">
        <div class="top-logo">YAM</div>
        <div id="topUser" class="top-user"></div>
    </div>


    <!-- HOME -->

    <section
        id="homePage"
        class="page active">

        <div class="create-box">

            <div class="create-title">
                📝 Apa yang anda mahu post?
            </div>

            <!-- INI PILIHAN BESAR -->
            <div class="post-options">

                <button
                    id="optionText"
                    class="post-option active"
                    onclick="selectPostType('text')">

                    <span>📝</span>
                    TULISAN

                </button>

                <button
                    id="optionImage"
                    class="post-option"
                    onclick="selectPostType('image')">

                    <span>🖼️</span>
                    GAMBAR

                </button>

                <button
                    id="optionVideo"
                    class="post-option"
                    onclick="selectPostType('video')">

                    <span>🎥</span>
                    VIDEO

                </button>

            </div>


            <div
                id="postEditor"
                class="post-editor">

                <textarea
                    id="postText"
                    placeholder="Tulis sesuatu..."></textarea>

                <div
                    id="mediaBox"
                    class="media-box hidden">
                </div>

                <div class="editor-actions">

                    <button
                        class="cancel-btn"
                        onclick="cancelPost()">
                        ❌ Batal
                    </button>

                    <button
                        class="post-submit"
                        onclick="createPost()">
                        🚀 POST
                    </button>

                </div>

            </div>

        </div>


        <div id="feed"></div>

    </section>


    <!-- FRIENDS -->

    <section
        id="friendsPage"
        class="page">

        <div class="create-box">
            <div class="create-title">
                👥 Kawan
            </div>
        </div>

        <div id="friendsList"></div>

    </section>


    <!-- ROOMS -->

    <section
        id="roomsPage"
        class="page">

        <div class="create-box">
            <div class="create-title">
                🌎 Rooms
            </div>
        </div>

        <div id="roomsList"></div>

    </section>


    <!-- PROFILE -->

    <section
        id="profilePage"
        class="page">

        <div class="profile-main">

            <div
                id="profileCover"
                class="profile-cover">
            </div>

            <div class="profile-picture-wrap">

                <img
                    id="profilePicture"
                    class="profile-picture"
                    src=""
                    alt="Profile">

                <div
                    id="profileName"
                    class="profile-name">
                </div>

                <div
                    id="profileStatus"
                    class="profile-status"
                    onclick="editStatus()">
                </div>

                <div
                    id="profileBio"
                    class="profile-bio">
                </div>

            </div>


            <div class="profile-buttons">

                <button onclick="changeProfilePicture()">
                    🖼️ Tukar Gambar
                </button>

                <button onclick="changeCover()">
                    🌄 Tukar Cover
                </button>

                <button onclick="editProfile()">
                    ✏️ Edit Profile
                </button>

                <button onclick="changePassword()">
                    🔑 Password
                </button>

                <button onclick="openMusic()">
                    🎵 Music
                </button>

                <button onclick="logout()">
                    🚪 Logout
                </button>

            </div>


            <div
                id="musicArea"
                class="music-box hidden">
            </div>


            <div
                id="profileInfo"
                class="info-list">
            </div>

        </div>

    </section>


    <!-- BOTTOM NAV -->

    <nav class="bottom-nav">

        <button
            id="navHome"
            class="active"
            onclick="showPage('home')">
            <span>🏠</span>
            Home
        </button>

        <button
            id="navFriends"
            onclick="showPage('friends')">
            <span>👥</span>
            Friends
        </button>

        <button
            id="navRooms"
            onclick="showPage('rooms')">
            <span>🌎</span>
            Rooms
        </button>

        <button
            id="navProfile"
            onclick="showPage('profile')">
            <span>👤</span>
            Profile
        </button>

    </nav>

</div>


<!-- FILE INPUTS -->

<input
    id="postImageInput"
    type="file"
    accept="image/*"
    style="display:none;">

<input
    id="postVideoInput"
    type="file"
    accept="video/*"
    style="display:none;">

<input
    id="profileImageInput"
    type="file"
    accept="image/*"
    style="display:none;">

<input
    id="coverImageInput"
    type="file"
    accept="image/*"
    style="display:none;">

<input
    id="musicInput"
    type="file"
    accept="audio/*"
    style="display:none;">


<!-- MODAL -->

<div
    id="modal"
    class="modal hidden">

    <div class="modal-box">

        <div
            id="modalTitle"
            class="modal-title">
        </div>

        <div
            id="modalContent">
        </div>

        <button
            class="modal-close"
            onclick="closeModal()">
            Tutup
        </button>

    </div>

</div>


<!-- CHAT -->

<div
    id="chatBox"
    class="chat-box">

    <div class="chat-header">

        <button onclick="closeChat()">
            ←
        </button>

        <strong id="chatTitle"></strong>

    </div>

    <div
        id="chatMessages"
        class="chat-messages">
    </div>

    <div class="chat-input">

        <input
            id="chatInput"
            placeholder="Tulis mesej..."
            onkeydown="if(event.key==='Enter')sendChat();">

        <button onclick="sendChat()">
            Hantar
        </button>

    </div>

</div>


<script>

/* =========================================================
   YAM CHAT V4.4.1
========================================================= */

let currentUser = localStorage.getItem("yam_current_user") || null;

let selectedPostType = "text";
let selectedPostFile = null;

let currentChatUser = null;


/* =========================================================
   DEFAULT FRIENDS
========================================================= */

const friends = [
    "Ahmad",
    "Siti",
    "John"
];

const rooms = [
    {
        name:"🇲🇾 Malaysia",
        regions:"Sabah • Sarawak • Kuala Lumpur • Johor"
    },
    {
        name:"🇵🇭 Philippines",
        regions:"Manila • Cebu • Davao"
    },
    {
        name:"🇮🇩 Indonesia",
        regions:"Jakarta • Bali • Kalimantan"
    },
    {
        name:"🇸🇬 Singapore",
        regions:"Singapore"
    },
    {
        name:"🇧🇳 Brunei",
        regions:"Bandar Seri Begawan • Brunei"
    },
    {
        name:"🌎 World",
        regions:"International"
    }
];


/* =========================================================
   HELPERS
========================================================= */

function escapeHtml(value){
    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}

function getAccounts(){
    try{
        return JSON.parse(localStorage.getItem("yam_accounts") || "{}");
    }catch(e){
        return {};
    }
}

function saveAccounts(accounts){
    localStorage.setItem(
        "yam_accounts",
        JSON.stringify(accounts)
    );
}

function getPosts(){
    try{
        return JSON.parse(
            localStorage.getItem("yam_posts") || "[]"
        );
    }catch(e){
        return [];
    }
}

function savePosts(posts){
    localStorage.setItem(
        "yam_posts",
        JSON.stringify(posts)
    );
}

function getProfileData(username){

    const accounts = getAccounts();

    return accounts[username] || {
        username:username,
        name:username,
        status:"Online",
        bio:"",
        birthday:"",
        location:"",
        job:"",
        gender:""
    };
}

function getAvatar(username){

    return localStorage.getItem(
        "yam_picture_" + username
    ) || "";
}

function avatarHtml(username){

    const pic = getAvatar(username);

    if(pic){
        return `
            <img
                class="avatar"
                src="${pic}"
                alt="">
        `;
    }

    return `
        <div class="avatar-default">
            ${escapeHtml(
                String(username).charAt(0).toUpperCase()
            )}
        </div>
    `;
}

function formatTime(time){

    const date = new Date(time);

    return date.toLocaleString(
        "ms-MY",
        {
            day:"2-digit",
            month:"2-digit",
            year:"numeric",
            hour:"2-digit",
            minute:"2-digit"
        }
    );
}


/* =========================================================
   AUTH
========================================================= */

function showRegister(){

    document
        .getElementById("registerArea")
        .classList.toggle("hidden");
}

function register(){

    const username =
        document
            .getElementById("regUsername")
            .value
            .trim();

    const password =
        document
            .getElementById("regPassword")
            .value;

    if(!username || !password){
        alert("Sila isi username dan password.");
        return;
    }

    const accounts = getAccounts();

    if(accounts[username]){
        alert("Username sudah digunakan.");
        return;
    }

                🎥 ${escapeHtml(file.name)}
            </div>
        `;
    }
}


/* =========================================================
   FILE TO DATA URL
========================================================= */

function fileToDataURL(file){

    return new Promise(
        (resolve,reject)=>{

            const reader =
                new FileReader();

            reader.onload =
                ()=>resolve(reader.result);

            reader.onerror =
                ()=>reject(
                    new Error(
                        "Gagal membaca file."
                    )
                );

            reader.readAsDataURL(file);
        }
    );
}


/* =========================================================
   CREATE POST
========================================================= */

async function createPost(){

    const text =
        document
            .getElementById("postText")
            .value
            .trim();

    if(
        selectedPostType === "text" &&
        !text
    ){

        alert("Sila tulis sesuatu.");
        return;
    }

    if(
        (
            selectedPostType === "image" ||
            selectedPostType === "video"
        ) &&
        !selectedPostFile
    ){

        alert(
            "Sila pilih " +
            (
                selectedPostType === "image"
                ? "gambar"
                : "video"
            ) +
            " dahulu."
        );

        return;
    }

    let mediaData = null;

    if(selectedPostFile){

        try{

            mediaData =
                await fileToDataURL(
                    selectedPostFile
                );

        }catch(e){

            alert(
                "Tidak dapat membaca media."
            );

            return;
        }
    }

    const posts = getPosts();

    const post = {

        id:
            "post_" +
            Date.now() +
            "_" +
            Math.random()
                .toString(36)
                .slice(2,8),

        username:currentUser,

        text:text,

        mediaType:
            selectedPostType === "text"
            ? null
            : selectedPostType,

        mediaData:mediaData,

        mediaName:
            selectedPostFile
            ? selectedPostFile.name
            : null,

        createdAt:Date.now(),

        likes:[],

        comments:[],

        blockedCommenters:[]
    };

    posts.unshift(post);

    try{

        savePosts(posts);

    }catch(e){

        alert(
            "Storage browser penuh. Cuba guna media yang lebih kecil."
        );

        return;
    }

    cancelPost();

    renderFeed();

    alert("Post berjaya! 🚀");
}

/* =========================================================
   RENDER FEED
========================================================= */

function renderFeed(){

    const feed =
        document.getElementById("feed");

    const posts = getPosts();

    if(!posts.length){

        feed.innerHTML = `
            <div class="create-box"
                 style="text-align:center;color:#777;">
                Belum ada post lagi.<br>
                📝 Tulis sesuatu atau pilih 🖼️ Gambar / 🎥 Video.
            </div>
        `;

        return;
    }

    feed.innerHTML =
        posts
        .map(post => renderPost(post))
        .join("");
}


function renderPost(post){

    const profile =
        getProfileData(post.username);

    const liked =
        Array.isArray(post.likes) &&
        post.likes.includes(currentUser);

    let media = "";

    if(
        post.mediaType === "image" &&
        post.mediaData
    ){

        media = `
            <img
                class="post-media"
                src="${post.mediaData}"
                alt="Post image">
        `;
    }

    if(
        post.mediaType === "video" &&
        post.mediaData
    ){

        media = `
            <video
                class="post-media"
                src="${post.mediaData}"
                controls>
            </video>
        `;
    }

    const likesCount =
        Array.isArray(post.likes)
        ? post.likes.length
        : 0;

    const commentsHtml =
        renderComments(post);

    return `
        <article class="post-card">

            <div class="post-head">

                ${avatarHtml(post.username)}

                <div>

                    <div class="post-user">
                        ${escapeHtml(
                            profile.name ||
                            post.username
                        )}
                    </div>

                    <div class="post-time">
                        ${formatTime(post.createdAt)}
                    </div>

                </div>

                ${
                    post.username === currentUser
                    ? `
                        <button
                            class="post-menu"
                            onclick="postOwnerMenu('${post.id}')">
                            ⋮
                        </button>
                    `
                    : ""
                }

            </div>

            ${
                post.text
                ? `
                    <div class="post-text">
                        ${escapeHtml(post.text)}
                    </div>
                `
                : ""
            }

            ${media}

            <div class="like-count">
                ❤️ ${likesCount}
            </div>

            <div class="post-actions">

                <button
                    class="${liked ? "liked" : ""}"
                    onclick="toggleLike('${post.id}')">

                    ${liked ? "❤️ Liked" : "🤍 Like"}

                </button>

                <button
                    onclick="focusComment('${post.id}')">

                    💬 Komen

                </button>

                ${
                    post.username === currentUser
                    ? `
                        <button
                            onclick="manageComments('${post.id}')">
                            ⚙️ Komen
                        </button>
                    `
                    : ""
                }

            </div>

            <div class="comments">

                ${commentsHtml}

                <div class="comment-form">

                    <input
                        id="comment_${post.id}"
                        placeholder="Tulis komen...">

                    <button
                        onclick="addComment('${post.id}')">
                        Hantar
                    </button>

                </div>

            </div>

        </article>
    `;
}


/* =========================================================
   LIKE
========================================================= */

function toggleLike(postId){

    const posts = getPosts();

    const post =
        posts.find(p=>p.id === postId);

    if(!post) return;

    if(!Array.isArray(post.likes)){
        post.likes = [];
    }

    const index =
        post.likes.indexOf(currentUser);

    if(index >= 0){
        post.likes.splice(index,1);
    }else{
        post.likes.push(currentUser);
    }

    savePosts(posts);

    renderFeed();
}


/* =========================================================
   COMMENTS
========================================================= */

function addComment(postId){

    const input =
        document.getElementById(
            "comment_" + postId
        );

    if(!input) return;

    const text =
        input.value.trim();

    if(!text) return;

    const posts = getPosts();

    const post =
        posts.find(p=>p.id === postId);

    if(!post) return;

    if(!Array.isArray(post.comments)){
        post.comments = [];
    }

    if(!Array.isArray(post.blockedCommenters)){
        post.blockedCommenters = [];
    }

    if(
        post.blockedCommenters
            .includes(currentUser)
    ){

        alert(
            "Anda telah disekat daripada memberi komen pada post ini."
        );

        return;
    }

    post.comments.push({

        id:
            "comment_" +
            Date.now() +
            "_" +
            Math.random()
                .toString(36)
                .slice(2,7),

        username:currentUser,

        text:text,

        hidden:false,

        createdAt:Date.now()
    });

    savePosts(posts);

    renderFeed();
}


function renderComments(post){

    if(
        !Array.isArray(post.comments) ||
        !post.comments.length
    ){

        return "";
    }

    return post.comments
        .map(comment => {

            const profile =
                getProfileData(
                    comment.username
                );

            const isOwner =
                post.username === currentUser;

            const canDelete =
                comment.username === currentUser ||
                isOwner;

            if(
                comment.hidden &&
                !isOwner
            ){

                return `
                    <div class="comment">
                        <div class="comment-hidden">
                            Komen disembunyikan oleh pemilik post.
                        </div>
                    </div>
                `;
            }

            return `
                <div class="comment">

                    <div class="comment-head">

                        <span>
                            ${escapeHtml(
                                profile.name ||
                                comment.username
                            )}
                        </span>

                        ${
                            isOwner
                            ? `
                                <button
                                    onclick="commentMenu('${post.id}','${comment.id}')"
                                    style="background:none;font-size:16px;">
                                    ⋮
                                </button>
                            `
                            : canDelete
                            ? `
                                <button
                                    onclick="deleteComment('${post.id}','${comment.id}')"
                                    style="background:none;font-size:12px;">
                                    🗑️
                                </button>
                            `
                            : ""
                        }

                    </div>

                    <div class="comment-text">
                        ${escapeHtml(comment.text)}
                    </div>

                </div>
            `;
        })
        .join("");
}


/* =========================================================
   HIDE / UNHIDE / DELETE COMMENT
========================================================= */

function commentMenu(postId,commentId){

    const posts = getPosts();

    const post =
        posts.find(p=>p.id === postId);

    if(!post) return;

    const comment =
        post.comments.find(
            c=>c.id === commentId
        );

    if(!comment) return;

    const hidden =
        comment.hidden === true;

    openModal(
        "Pengurusan Komen",
        `
            <div class="modal-list">

                <button
                    onclick="toggleCommentHidden('${postId}','${commentId}')">
                    ${
                        hidden
                        ? "👁️ Tunjukkan Komen"
                        : "🙈 Hide Komen"
                    }
                </button>

                <button
                    onclick="deleteComment('${postId}','${commentId}')">
                    🗑️ Padam Komen
                </button>

                <button
                    onclick="blockCommenter('${postId}','${comment.username}')">
                    🚫 Block ${escapeHtml(comment.username)}
                </button>

            </div>
        `
    );
}


function toggleCommentHidden(postId,commentId){

    const posts = getPosts();

    const post =
        posts.find(p=>p.id === postId);

    if(!post) return;

    const comment =
        post.comments.find(
            c=>c.id === commentId
        );

    if(!comment) return;

    comment.hidden =
        !comment.hidden;

    savePosts(posts);

    closeModal();

    renderFeed();
}


function deleteComment(postId,commentId){

    const posts = getPosts();

    const post =
        posts.find(p=>p.id === postId);

    if(!post) return;

    const comment =
        post.comments.find(
            c=>c.id === commentId
        );

    if(!comment) return;

    if(
        comment.username !== currentUser &&
        post.username !== currentUser
    ){

        alert(
            "Anda tidak boleh padam komen ini."
        );

        return;
    }

    post.comments =
        post.comments.filter(
            c=>c.id !== commentId
        );

    savePosts(posts);

    closeModal();

    renderFeed();
}


/* =========================================================
   BLOCK COMMENTER
========================================================= */

function blockCommenter(postId,username){

    const posts = getPosts();

    const post =
        posts.find(p=>p.id === postId);

    if(!post) return;

    if(post.username !== currentUser){

        alert(
            "Hanya pemilik post boleh block commenter."
        );

        return;
    }

    if(!Array.isArray(post.blockedCommenters)){
        post.blockedCommenters = [];
    }

    if(
        !post.blockedCommenters
            .includes(username)
    ){

        post.blockedCommenters.push(username);
    }

    savePosts(posts);

    closeModal();

    alert(
        username +
        " telah diblock daripada komen post ini."
    );

    renderFeed();
}


function unblockCommenter(postId,username){

    const posts = getPosts();

    const post =
        posts.find(p=>p.id === postId);

    if(!post) return;

    post.blockedCommenters =
        (post.blockedCommenters || [])
        .filter(
            u=>u !== username
        );

    savePosts(posts);

    closeModal();

    renderFeed();
}


/* =========================================================
   COMMENT MANAGEMENT
========================================================= */

function manageComments(postId){

    const posts = getPosts();

    const post =
        posts.find(p=>p.id === postId);

    if(!post) return;

    const blocked =
        post.blockedCommenters || [];

    let html = "";

    if(blocked.length){

        html += `
            <div style="margin-bottom:12px;font-weight:bold;">
                🚫 Pengguna yang diblock
            </div>
        `;

        blocked.forEach(username=>{

            html += `
                <button
                    onclick="unblockCommenter('${postId}','${username}')">
                    ✅ Unblock ${escapeHtml(username)}
                </button>
            `;
        });

    }else{

        html = `
            <div style="color:#777;">
                Tiada pengguna yang diblock.
            </div>
        `;
    }

    openModal(
        "Pengurusan Komen",
        `<div class="modal-list">${html}</div>`
    );
}

function deletePost(postId){

    const post =

function sendRoomMessage(roomName){

    const input =
        document.getElementById(
            "roomMessage"
        );

    if(!input) return;

    const text =
        input.value.trim();

    if(!text) return;

    const key =
        "yamroom_" +
        roomName;

    let messages = [];

    try{
        messages =
            JSON.parse(
                localStorage.getItem(key) ||
                "[]"
            );
    }catch(e){
        messages = [];
    }

    messages.push({

        username:currentUser,

        text:text,

        createdAt:Date.now()

    });

    localStorage.setItem(
        key,
        JSON.stringify(messages)
    );

    input.value = "";

    alert("Mesej dihantar ke room demo.");

}

   MUSIC PROFILE
========================================================= */

function openMusic(){

    openModal(
        "🎵 Music Profile",
        `

            <p style="margin-bottom:12px;color:#666;">
                Pilih lagu/audio dari telefon untuk
                dimainkan pada profile demo.
            </p>

            <button
                class="primary-btn"
                onclick="chooseMusic()">
                🎵 Pilih Music
            </button>

            <div
                id="musicModalArea"
                style="margin-top:12px;">
            </div>

        `
    );
}


function chooseMusic(){

    document
        .getElementById("musicInput")
        .click();
}

document
    .getElementById("musicInput")
    .addEventListener(
        "change",
        async function(){

            const file =
                this.files && this.files[0];

            if(!file) return;

            if(file.size > 8 * 1024 * 1024){

                alert(
                    "Music terlalu besar. Maksimum 8MB."
                );

                return;
            }

            const data =
                await fileToDataURL(file);

            localStorage.setItem(
                "yam_music_" +
                currentUser,
                JSON.stringify({
                    name:file.name,
                    data:data
                })
            );

            renderMusic();

            const area =
                document.getElementById(
                    "musicModalArea"
                );

            if(area){

                area.innerHTML = `
                    <p>✅ Music disimpan.</p>
                `;
            }
        }
    );


function renderMusic(){

    const area =
        document.getElementById(
            "musicArea"
        );

    let music = null;

    try{

        music =
            JSON.parse(
                localStorage.getItem(
                    "yam_music_" +
                    currentUser
                ) || "null"
            );

    }catch(e){

        music = null;
    }

    if(!music){

        area.classList.add("hidden");
        area.innerHTML = "";
        return;
    }

    area.classList.remove("hidden");

    area.innerHTML = `

        <div style="font-weight:bold;margin-bottom:8px;">
            🎵 ${escapeHtml(music.name)}
        </div>

        <audio
            controls
            src="${music.data}">
        </audio>

        <button
            onclick="removeMusic()"
            style="
                margin-top:10px;
                padding:9px 12px;
                border-radius:9px;
                background:#eee;
            ">
            🗑️ Buang Music
        </button>

    `;
}


function removeMusic(){

    localStorage.removeItem(
        "yam_music_" +
        currentUser
    );

    renderMusic();

    closeModal();
}


/* =========================================================
   CHAT
========================================================= */

function openChat(username){

    currentChatUser = username;

    document
        .getElementById("chatTitle")
        .textContent =
        getProfileData(username).name ||
        username;

    document
        .getElementById("chatBox")
        .classList.add("show");

    renderChat();
}


function closeChat(){

    document
        .getElementById("chatBox")
        .classList.remove("show");

    currentChatUser = null;
}


function chatKey(){

    return (
        "yamchat_" +
        currentUser +
        "_" +
        currentChatUser
    );
}


function renderChat(){

    if(!currentChatUser) return;

    let messages = [];

    try{

        messages =
            JSON.parse(
                localStorage.getItem(
                    chatKey()
                ) || "[]"
            );

    }catch(e){

        messages = [];
    }

    const box =
        document.getElementById(
            "chatMessages"
        );

    box.innerHTML =
        messages
        .map(message=>{

            return `
                <div class="msg ${
                    message.username === currentUser
                    ? "me"
                    : "them"
                }">
                    ${escapeHtml(message.text)}
                </div>
            `;
        })
        .join("");

    box.scrollTop =
        box.scrollHeight;
}


function sendChat(){

    if(!currentChatUser) return;

    const input =
        document.getElementById(
            "chatInput"
        );

    const text =
        input.value.trim();

    if(!text) return;

    let messages = [];

    try{

        messages =
            JSON.parse(
                localStorage.getItem(
                    chatKey()
                ) || "[]"
            );

    }catch(e){

        messages = [];
    }

    messages.push({

        username:currentUser,

        text:text,

        createdAt:Date.now()

    });

    localStorage.setItem(
        chatKey(),
        JSON.stringify(messages)
    );

    input.value = "";

    renderChat();
}
