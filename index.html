<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YAM Chat V4.5</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

html,body{
    width:100%;
    overflow-x:hidden;
}

body{
    background:#eef2f7;
    color:#222;
}

button{
    border:0;
    cursor:pointer;
}

.hidden{
    display:none!important;
}

/* =========================
   LOGIN
========================= */

#loginPage{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:linear-gradient(135deg,#2563eb,#0f172a);
}

.login-box{
    width:100%;
    max-width:420px;
    background:white;
    padding:28px;
    border-radius:20px;
    box-shadow:0 15px 40px rgba(0,0,0,.25);
}

.logo{
    display:flex;
    align-items:baseline;
    justify-content:center;
    gap:6px;
    width:max-content;
    margin:0 auto 10px;
    padding:8px 16px;
    background:#2563eb;
    border-radius:14px;
    box-shadow:0 5px 15px rgba(0,0,0,.20);
    line-height:1;
}

.logo-yam{
    font-size:40px;
    font-weight:900;
    letter-spacing:1px;
    color:#ff4fa3;
}

.logo-chat{
    font-size:17px;
    font-weight:800;
    font-style:italic;
    letter-spacing:.7px;
    color:#ff4fa3;
    transform:skewX(-10deg);
}

.login-sub{
    text-align:center;
    color:#777;
    margin-bottom:25px;
}

.input{
    width:100%;
    padding:13px;
    border:1px solid #ddd;
    border-radius:10px;
    margin-bottom:12px;
    outline:none;
}

.input:focus{
    border-color:#2563eb;
}

.primary-btn{
    width:100%;
    padding:13px;
    border-radius:10px;
    background:#2563eb;
    color:white;
    font-weight:bold;
}

.secondary-btn{
    width:100%;
    padding:13px;
    border-radius:10px;
    background:#eef2ff;
    color:#2563eb;
    font-weight:bold;
    margin-top:10px;
}

/* =========================
   APP
========================= */

#app{
    display:none;
    min-height:100vh;
}

.topbar{
    position:sticky;
    top:0;
    z-index:100;
    height:52px;
    background:white;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 12px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.top-logo{
    display:flex;
    align-items:baseline;
    gap:5px;
    padding:6px 12px;
    background:#2563eb;
    border-radius:12px;
    box-shadow:0 3px 10px rgba(0,0,0,.18);
    line-height:1;
}

.top-logo .yam-text{
    font-size:30px;
    font-weight:900;
    letter-spacing:1px;
    color:#ff4fa3;
}

.top-logo .chat-text{
    font-size:15px;
    font-weight:800;
    font-style:italic;
    letter-spacing:.6px;
    color:#ff4fa3;
    transform:skewX(-8deg);
}

.top-user{
    font-weight:bold;
    color:#444;
    font-size:14px;
    max-width:45%;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.main{
    max-width:700px;
    margin:auto;
    padding:15px;
    padding-bottom:90px;
}

.page{
    display:none;
}

.page.active{
    display:block;
}

/* =========================
   PROFILE MODE
========================= */

body.profile-active .topbar{
    position:fixed;
    top:0;
    left:0;
    right:0;
    height:52px;
    background:#2563eb;
    box-shadow:0 2px 10px rgba(0,0,0,.15);
}

body.profile-active .top-logo{
    background:#2563eb;
    box-shadow:none;
}

body.profile-active .top-user{
    color:white;
}

body.profile-active .main{
    padding-top:0;
}

body.profile-active #profilePage{
    margin-top:0;
}

/* =========================
   HOME
========================= */

.create-box{
    background:white;
    border-radius:18px;
    padding:15px;
    box-shadow:0 3px 12px rgba(0,0,0,.06);
    margin-bottom:15px;
}

.create-title{
    font-size:18px;
    font-weight:bold;
    margin-bottom:12px;
}

.post-options{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
}

.post-option{
    padding:13px 5px;
    border-radius:12px;
    background:#f1f5f9;
    font-weight:bold;
    color:#334155;
}

.post-option.active{
    background:#2563eb;
    color:white;
}

.post-editor{
    margin-top:12px;
}

.post-editor textarea{
    width:100%;
    min-height:100px;
    resize:none;
    border:1px solid #ddd;
    border-radius:12px;
    padding:12px;
    outline:none;
}

.media-preview{
    margin-top:10px;
}

.media-preview img,
.media-preview video{
    width:100%;
    max-height:350px;
    object-fit:contain;
    border-radius:12px;
    background:#000;
}

.editor-actions{
    display:flex;
    gap:8px;
    margin-top:10px;
}

.editor-actions button{
    flex:1;
    padding:12px;
    border-radius:10px;
    font-weight:bold;
}

.cancel-btn{
    background:#eee;
}

.post-btn{
    background:#2563eb;
    color:white;
}

/* =========================
   POSTS
========================= */

.post-card{
    background:white;
    border-radius:18px;
    padding:15px;
    margin-bottom:15px;
    box-shadow:0 3px 12px rgba(0,0,0,.06);
}

.post-head{
    display:flex;
    align-items:center;
    gap:10px;
}

.avatar{
    width:45px;
    height:45px;
    border-radius:50%;
    object-fit:cover;
    background:#2563eb;
}

.avatar-small{
    width:35px;
    height:35px;
    border-radius:50%;
    object-fit:cover;
    background:#2563eb;
}

.post-user{
    font-weight:bold;
}

.post-time{
    font-size:12px;
    color:#888;
    margin-top:3px;
}

.post-menu{
    margin-left:auto;
    font-size:22px;
    background:transparent;
}

.post-text{
    margin:14px 0;
    white-space:pre-wrap;
    line-height:1.5;
}

.post-media{
    width:100%;
    max-height:450px;
    object-fit:contain;
    border-radius:12px;
    background:#000;
}

.post-actions{
    display:flex;
    gap:5px;
    margin-top:10px;
    border-top:1px solid #eee;
    padding-top:10px;
}

.post-actions button{
    flex:1;
    padding:9px 5px;
    border-radius:9px;
    background:#f1f5f9;
}

.post-actions button.liked{
    color:#2563eb;
    font-weight:bold;
}

.comments{
    margin-top:10px;
}

.comment{
    display:flex;
    gap:8px;
    margin-top:9px;
}

.comment-body{
    flex:1;
    background:#f1f5f9;
    border-radius:12px;
    padding:8px 10px;
}

.comment-name{
    font-weight:bold;
    font-size:13px;
}

.comment-text{
    margin-top:3px;
    white-space:pre-wrap;
}

.comment-input{
    display:flex;
    gap:7px;
    margin-top:10px;
}

.comment-input input{
    flex:1;
    border:1px solid #ddd;
    border-radius:10px;
    padding:10px;
}

.comment-input button{
    background:#2563eb;
    color:white;
    padding:0 15px;
    border-radius:10px;
}

/* =========================
   FRIENDS
========================= */

.section-title{
    font-size:22px;
    font-weight:bold;
    margin-bottom:15px;
}

.friend-card{
    background:white;
    border-radius:15px;
    padding:12px;
    margin-bottom:10px;
    display:flex;
    align-items:center;
    gap:12px;
    box-shadow:0 3px 10px rgba(0,0,0,.05);
}

.friend-info{
    flex:1;
}

.friend-name{
    font-weight:bold;
}

.friend-status{
    color:#777;
    font-size:13px;
    margin-top:4px;
}

.chat-btn{
    background:#2563eb;
    color:white;
    padding:9px 13px;
    border-radius:9px;
    font-weight:bold;
}

/* =========================
   ROOMS
========================= */

.room-card{
    background:white;
    padding:16px;
    border-radius:16px;
    margin-bottom:10px;
    box-shadow:0 3px 10px rgba(0,0,0,.05);
    cursor:pointer;
}

.room-name{
    font-weight:bold;
    font-size:17px;
}

.room-region{
    color:#777;
    margin-top:5px;
    font-size:13px;
}

/* =========================
   PROFILE
========================= */

#profilePage{
    margin-left:-15px;
    margin-right:-15px;
    margin-top:-15px;
}

.profile-main{
    position:relative;
    min-height:100vh;
    overflow:hidden;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
    background-image:linear-gradient(135deg,#2563eb,#111827);
    background-size:cover;
    background-position:center top;
    background-repeat:no-repeat;
}

.profile-main > *{
    position:relative;
    z-index:1;
}

.profile-cover{
    width:100vw;
    height:285px;
    margin-left:calc(50% - 50vw);
    margin-right:calc(50% - 50vw);
    background:transparent;
    position:relative;
    overflow:visible;
    z-index:30;
}

.cover-dark{
    position:absolute;
    inset:0;
    background:transparent;
    pointer-events:none;
}

.profile-music-button{
    position:absolute;
    top:58px;
    left:12px;
    width:42px;
    height:42px;
    border-radius:50%;
    background:rgba(255,255,255,.96);
    color:#222;
    font-size:20px;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 3px 12px rgba(0,0,0,.22);
    z-index:99998;
}

.profile-top-actions{
    position:absolute;
    top:58px;
    right:12px;
    display:flex;
    align-items:center;
    gap:7px;
    z-index:99998;
}

.profile-top-actions button{
    width:42px;
    height:42px;
    border-radius:50%;
    background:rgba(255,255,255,.96);
    color:#222;
    font-size:20px;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 3px 12px rgba(0,0,0,.22);
}

.profile-menu-wrap{
    position:relative;
}

.profile-menu{
    position:absolute;
    top:50px;
    right:0;
    width:220px;
    background:white;
    border-radius:14px;
    padding:6px;
    box-shadow:0 8px 25px rgba(0,0,0,.25);
    z-index:100000;
}

.profile-menu-item{
    padding:13px 12px;
    border-radius:9px;
    font-weight:600;
}

.profile-menu-item:hover{
    background:#f1f5f9;
}

.logout-item{
    color:#dc2626;
}

.profile-picture-wrap{
    padding:0 18px;
    margin-top:-75px;
    position:relative;
    z-index:20;
}

.profile-picture-box{
    position:relative;
    width:115px;
    height:115px;
}

.profile-picture{
    width:115px;
    height:115px;
    border-radius:50%;
    border:5px solid white;
    object-fit:cover;
    background:#2563eb;
    box-shadow:0 4px 14px rgba(0,0,0,.25);
}

.profile-picture-camera{
    position:absolute;
    right:-3px;
    bottom:-3px;
    width:40px;
    height:40px;
    border-radius:50%;
    background:#2563eb;
    color:white;
    font-size:19px;
    border:3px solid white;
    display:flex;
    align-items:center;
    justify-content:center;
}

.profile-name{
    font-size:25px;
    font-weight:bold;
    margin-top:10px;
    color:white;
    text-shadow:0 2px 6px rgba(0,0,0,.45);
}

.profile-username{
    color:rgba(255,255,255,.85);
    font-size:13px;
    margin-top:3px;
}

.profile-status{
    color:white;
    margin-top:8px;
}

.profile-bio{
    color:white;
    margin-top:10px;
    line-height:1.5;
    white-space:pre-wrap;
}

/* =========================
   PROFILE BUTTONS
========================= */

.profile-buttons{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:8px;
    padding:14px 16px;
}

.profile-buttons button{
    padding:12px 8px;
    border-radius:11px;
    background:rgba(255,255,255,.88);
    color:#2563eb;
    font-weight:bold;
}

/* =========================
   PROFILE CONTENT TABS
========================= */

.profile-content{
    margin:0 15px 15px;
    background:rgba(255,255,255,.94);
    border-radius:16px;
    overflow:hidden;
    box-shadow:0 3px 12px rgba(0,0,0,.12);
}

.profile-tabs{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    border-bottom:1px solid #ddd;
}

.profile-tab{
    padding:13px 4px;
    background:white;
    color:#777;
    font-weight:bold;
    font-size:13px;
}

.profile-tab.active{
    color:#2563eb;
    border-bottom:3px solid #2563eb;
}

.profile-tab-content{
    padding:12px;
}

/* =========================
   PROFILE MEDIA GRID
========================= */

.profile-media-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:5px;
}

.profile-media-item{
    aspect-ratio:1/1;
    background:#111827;
    border-radius:8px;
    overflow:hidden;
    position:relative;
}

.profile-media-item img,
.profile-media-item video{
    width:100%;
    height:100%;
    object-fit:cover;
}

.video-mark{
    position:absolute;
    right:6px;
    bottom:6px;
    background:rgba(0,0,0,.65);
    color:white;
    border-radius:50%;
    width:30px;
    height:30px;
    display:flex;
    align-items:center;
    justify-content:center;
}

/* =========================
   MARKET
========================= */

.market-add{
    width:100%;
    padding:12px;
    border-radius:10px;
    background:#2563eb;
    color:white;
    font-weight:bold;
    margin-bottom:12px;
}

.market-card{
    border:1px solid #e5e7eb;
    border-radius:14px;
    overflow:hidden;
    margin-bottom:12px;
    background:white;
}

.market-image{
    width:100%;
    height:210px;
    object-fit:cover;
    background:#f1f5f9;
}

.market-info{
    padding:12px;
}

.market-title{
    font-size:18px;
    font-weight:bold;
}

.market-price{
    color:#dc2626;
    font-size:19px;
    font-weight:bold;
    margin-top:5px;
}

.market-description{
    color:#555;
    line-height:1.45;
    margin-top:7px;
    white-space:pre-wrap;
}

.market-owner{
    color:#888;
    font-size:12px;
    margin-top:8px;
}

.market-actions{
    display:flex;
    gap:7px;
    margin-top:10px;
}

.market-actions button{
    flex:1;
    padding:9px;
    border-radius:9px;
    font-weight:bold;
}

.market-delete{
    background:#fee2e2;
    color:#dc2626;
}

/* =========================
   INFO
========================= */

.info-title{
    padding:15px 15px 5px;
    font-size:18px;
    font-weight:bold;
    color:white;
}

.info-list{
    padding:0 15px 15px;
}

.info-row{
    padding:12px 14px;
    margin-top:7px;
    border-bottom:1px solid rgba(255,255,255,.3);
    background:rgba(255,255,255,.78);
    border-radius:10px;
}

.info-label{
    color:#555;
    font-size:12px;
    margin-bottom:3px;
}

.info-value{
    font-weight:500;
    color:#222;
}

/* =========================
   MUSIC
========================= */

.music-box{
    margin:0 15px 15px;
    background:rgba(255,255,255,.90);
    padding:14px;
    border-radius:14px;
}

.music-title{
    font-weight:bold;
    margin-bottom:9px;
}

.music-box audio{
    width:100%;
}

.music-buttons{
    display:flex;
    gap:8px;
    margin-top:9px;
}

.music-buttons button{
    flex:1;
    padding:9px;
    border-radius:9px;
}

/* =========================
   BOTTOM NAV
========================= */

.bottom-nav{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    z-index:200;
    height:65px;
    background:white;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    box-shadow:0 -2px 12px rgba(0,0,0,.1);
}

.nav-btn{
    background:white;
    color:#777;
    font-size:12px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:3px;
}

.nav-btn span{
    font-size:21px;
}

.nav-btn.active{
    color:#2563eb;
    font-weight:bold;
}

/* =========================
   MODAL
========================= */

.modal-bg{
    position:fixed;
    inset:0;
    z-index:500;
    background:rgba(0,0,0,.55);
    display:none;
    align-items:center;
    justify-content:center;
    padding:18px;
}

.modal-bg.show{
    display:flex;
}

.modal{
    width:100%;
    max-width:500px;
    max-height:90vh;
    overflow:auto;
    background:white;
    border-radius:18px;
    padding:20px;
}

.modal-title{
    font-size:20px;
    font-weight:bold;
    margin-bottom:15px;
}

.modal-actions{
    display:flex;
    gap:8px;
    margin-top:15px;
}

.modal-actions button{
    flex:1;
    padding:12px;
    border-radius:10px;
    font-weight:bold;
}

.modal-ok{
    background:#2563eb;
    color:white;
}

.modal-cancel{
    background:#eee;
}

/* =========================
   CHAT
========================= */

.chat-overlay{
    position:fixed;
    inset:0;
    z-index:400;
    background:#eef2f7;
    display:none;
    flex-direction:column;
}

.chat-overlay.show{
    display:flex;
}

.chat-head{
    height:60px;
    background:white;
    display:flex;
    align-items:center;
    gap:10px;
    padding:0 12px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.chat-back{
    font-size:25px;
    background:transparent;
}

.chat-title{
    font-weight:bold;
}

.chat-body{
    flex:1;
    overflow:auto;
    padding:15px;
}

.chat-message{
    max-width:75%;
    padding:10px 12px;
    border-radius:15px;
    margin-bottom:9px;
    background:white;
}

.chat-message.mine{
    margin-left:auto;
    background:#2563eb;
    color:white;
}

.chat-foot{
    background:white;
    padding:10px;
    display:flex;
    gap:8px;
}

.chat-foot input{
    flex:1;
    padding:12px;
    border:1px solid #ddd;
    border-radius:12px;
}

.chat-foot button{
    padding:0 17px;
    border-radius:12px;
    background:#2563eb;
    color:white;
}

.empty{
    text-align:center;
    padding:35px 15px;
    color:#888;
    background:white;
    border-radius:16px;
}

@media(max-width:430px){

    .profile-cover{
        height:270px;
    }

    .profile-picture-box,
    .profile-picture{
        width:105px;
        height:105px;
    }

    .profile-picture-wrap{
        margin-top:-72px;
    }

    .profile-name{
        font-size:23px;
    }

    .profile-tab{
        font-size:11px;
    }

    .market-image{
        height:190px;
    }
}

@media(max-width:360px){

    .profile-cover{
        height:255px;
    }

    .profile-picture-wrap{
        margin-top:-68px;
        padding-left:15px;
        padding-right:15px;
    }

    .profile-tabs{
        grid-template-columns:repeat(4,1fr);
    }

    .profile-tab{
        font-size:10px;
    }
}
</style>
</head>

<body>

<!-- =========================
     LOGIN
========================= -->

<div id="loginPage">

<div class="login-box">

<div class="logo">
<span class="logo-yam">YAM</span>
<span class="logo-chat">CHAT</span>
</div>

<div class="login-sub">
Chat • Friends • Rooms • Social
</div>

<input id="loginUsername"
class="input"
placeholder="Username">

<input id="loginPassword"
class="input"
type="password"
placeholder="Password">

<button class="primary-btn"
onclick="login()">
🔐 LOGIN
</button>

<button class="secondary-btn"
onclick="register()">
📝 DAFTAR AKAUN
</button>

</div>
</div>


<!-- =========================
     APP
========================= -->

<div id="app">

<div class="topbar">

<div class="top-logo">
<span class="yam-text">YAM</span>
<span class="chat-text">CHAT</span>
</div>

<div id="topUser"
class="top-user"></div>

</div>

<main class="main">

<!-- HOME -->

<section id="homePage"
class="page active">

<div class="create-box">

<div class="create-title">
📝 Apa yang anda mahu post?
</div>

<div class="post-options">

<button id="textPostBtn"
class="post-option active"
onclick="selectPostType('text')">
📝 TULISAN
</button>

<button id="imagePostBtn"
class="post-option"
onclick="selectPostType('image')">

<script>

/* =====================================================
   YAM CHAT V4.5
===================================================== */

let currentUser =
localStorage.getItem("yam_current_user") || null;

let selectedPostType="text";
let selectedPostFile=null;
let currentChatUser=null;

let currentProfileTab="posts";

let selectedMarketImage=null;


const friends=[
"Ahmad",
"Siti",
"John"
];

const rooms=[
{name:"Malaysia",region:"🇲🇾 Malaysia"},
{name:"Philippines",region:"🇵🇭 Philippines"},
{name:"Indonesia",region:"🇮🇩 Indonesia"},
{name:"Singapore",region:"🇸🇬 Singapore"},
{name:"Brunei",region:"🇧🇳 Brunei"},
{name:"World",region:"🌎 World"}
];


/* =========================
   ACCOUNTS
========================= */

function getAccounts(){

return JSON.parse(
localStorage.getItem("yam_accounts")||"{}"
);

}

function saveAccounts(accounts){

localStorage.setItem(
"yam_accounts",
JSON.stringify(accounts)
);

}

function getProfileData(username){

const accounts=getAccounts();

if(accounts[username])
return accounts[username];

return{
username:username,
name:username,
password:"",
status:"Available",
bio:"",
birthday:"",
location:"",
job:"",
gender:""
};

}

function saveCurrentProfile(data){

const accounts=getAccounts();

accounts[currentUser]=data;

saveAccounts(accounts);

}


/* =========================
   SECURITY
========================= */

function escapeHtml(text){

return String(text??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =========================
   AVATAR
========================= */

function getAvatar(username){

return localStorage.getItem(
"yam_picture_"+username
)||"";

}

function avatarHtml(username){

const avatar=getAvatar(username);

if(avatar){

return`
<img class="avatar"
src="${avatar}"
alt="Profile">
`;

}

const profile=getProfileData(username);

const letter=
(profile.name||username||"?")
.charAt(0)
.toUpperCase();

return`
<div class="avatar"
style="
display:flex;
align-items:center;
justify-content:center;
color:white;
font-weight:bold;
font-size:18px;">
${escapeHtml(letter)}
</div>
`;

}


/* =========================
   TIME
========================= */

function timeAgo(timestamp){

const diff=Date.now()-timestamp;

const minute=Math.floor(diff/60000);

if(minute<1)
return"baru sahaja";

if(minute<60)
return minute+" minit lalu";

const hour=Math.floor(minute/60);

if(hour<24)
return hour+" jam lalu";

const day=Math.floor(hour/24);

return day+" hari lalu";

}


/* =========================
   LOGIN
========================= */

function login(){

const username=
document.getElementById("loginUsername")
.value.trim();

const password=
document.getElementById("loginPassword")
.value;

if(!username||!password){

alert("Sila isi username dan password.");

return;
}

const accounts=getAccounts();

if(!accounts[username]){

accounts[username]={
username:username,
name:username,
password:password,
status:"🟢 Available",
bio:"",
birthday:"",
location:"",
job:"",
gender:""
};

saveAccounts(accounts);

}

if(accounts[username].password!==password){

alert("Password tidak betul.");

return;
}

currentUser=username;

localStorage.setItem(
"yam_current_user",
currentUser
);

startApp();

}


function register(){

const username=
document.getElementById("loginUsername")
.value.trim();

const password=
document.getElementById("loginPassword")
.value;

if(!username||!password){

alert("Isi username dan password dahulu.");

return;
}

const accounts=getAccounts();

if(accounts[username]){

alert("Username sudah digunakan.");

return;
}

accounts[username]={
username:username,
name:username,
password:password,
status:"🟢 Available",
bio:"",
birthday:"",
location:"",
job:"",
gender:""
};

saveAccounts(accounts);

currentUser=username;

localStorage.setItem(
"yam_current_user",
currentUser
);

startApp();

}


/* =========================
   LOGOUT
========================= */

function logout(){

closeProfileMenu();

if(!confirm("Log Out dari YAM?"))
return;

document.body.classList.remove(
"profile-active"
);

localStorage.removeItem(
"yam_current_user"
);

currentUser=null;

document.getElementById("app")
.style.display="none";

document.getElementById("loginPage")
.style.display="flex";

}


/* =========================
   START
========================= */

function startApp(){

document.getElementById("loginPage")
.style.display="none";

document.getElementById("app")
.style.display="block";

renderProfile();
renderFeed();
renderFriends();
renderRooms();
renderMusic();

showPage("home");

}


/* =========================
   NAVIGATION
========================= */

function showPage(page){

closeProfileMenu();

document.body.classList.toggle(
"profile-active",
page==="profile"
);

document.querySelectorAll(".page")
.forEach(el=>{
el.classList.remove("active");
});

document.querySelectorAll(".nav-btn")
.forEach(el=>{
el.classList.remove("active");
});

if(page==="home"){

document.getElementById("homePage")
.classList.add("active");

document.getElementById("navHome")
.classList.add("active");

renderFeed();

}

if(page==="friends"){

document.getElementById("friendsPage")
.classList.add("active");

document.getElementById("navFriends")
.classList.add("active");

renderFriends();

}

if(page==="rooms"){

document.getElementById("roomsPage")
.classList.add("active");

document.getElementById("navRooms")
.classList.add("active");

renderRooms();

}

if(page==="profile"){

document.getElementById("profilePage")
.classList.add("active");

document.getElementById("navProfile")
.classList.add("active");

renderProfile();
renderMusic();

}

}


/* =========================
   POST TYPE
========================= */

function selectPostType(type){

selectedPostType=type;
selectedPostFile=null;

document.querySelectorAll(".post-option")
.forEach(btn=>{
btn.classList.remove("active");
});

if(type==="text"){

document.getElementById("textPostBtn")
.classList.add("active");

}

if(type==="image"){

document.getElementById("imagePostBtn")
.classList.add("active");

document.getElementById("postImageFile")
.click();

}

if(type==="video"){

document.getElementById("videoPostBtn")
.classList.add("active");

document.getElementById("postVideoFile")
.click();

}

}


document.getElementById("postImageFile")
.addEventListener("change",function(){

const file=this.files[0];

if(!file)return;

if(file.size>3*1024*1024){

alert("Gambar maksimum 3MB.");

this.value="";

return;
}

selectedPostFile=file;

const reader=new FileReader();

reader.onload=function(e){

document.getElementById("mediaPreview")
.innerHTML=
`<img src="${e.target.result}">`;

};

reader.readAsDataURL(file);

});


document.getElementById("postVideoFile")
.addEventListener("change",function(){

const file=this.files[0];

if(!file)return;

if(file.size>6*1024*1024){

alert("Video maksimum 6MB.");

this.value="";

return;
}

selectedPostFile=file;

const reader=new FileReader();

reader.onload=function(e){

document.getElementById("mediaPreview")
.innerHTML=
`<video src="${e.target.result}" controls></video>`;

};

reader.readAsDataURL(file);

});


/* =========================
   CREATE POST
========================= */

function createPost(){

const text=
document.getElementById("postText")
.value.trim();

if(selectedPostType==="text"&&!text){

alert("Tulis sesuatu dahulu.");

return;
}

if(
(
selectedPostType==="image"||
selectedPostType==="video"
)&&!selectedPostFile
){

alert("Sila pilih media dahulu.");

return;
}

function finish(media){

const posts=JSON.parse(
localStorage.getItem("yam_posts")||"[]"
);

posts.unshift({

id:Date.now(),
owner:currentUser,
text:text,
type:selectedPostType,
media:media,
time:Date.now(),
likes:[],
comments:[],
hiddenComments:false,
blockedUsers:[]

});

localStorage.setItem(
"yam_posts",
JSON.stringify(posts)
);

cancelPost();
renderFeed();

}

if(selectedPostFile){

const reader=new FileReader();

reader.onload=function(e){

finish(e.target.result);

};

reader.readAsDataURL(
selectedPostFile
);

}else{

finish("");

}

}


function cancelPost(){

document.getElementById("postText")
.value="";

document.getElementById("mediaPreview")
.innerHTML="";

document.getElementById("postImageFile")
.value="";

document.getElementById("postVideoFile")
.value="";

selectedPostFile=null;
selectedPostType="text";

document.querySelectorAll(".post-option")
.forEach(btn=>{
btn.classList.remove("active");
});

document.getElementById("textPostBtn")
.classList.add("active");

}


/* =========================
   FEED
========================= */

function renderFeed(){

const feed=
document.getElementById("feed");

const posts=JSON.parse(
localStorage.getItem("yam_posts")||"[]"
);

if(!posts.length){

feed.innerHTML=`
<div class="empty">
Belum ada post.<br>
Jadilah orang pertama post di YAM.
</div>
`;

return;
}

feed.innerHTML=posts.map(post=>{

const profile=
getProfileData(post.owner);

const liked=
(post.likes||[])
.includes(currentUser);

let media="";

if(post.type==="image"&&post.media){

media=`
<img class="post-media"
src="${post.media}">
`;

}

if(post.type==="video"&&post.media){

media=`
<video class="post-media"
src="${post.media}"
controls>
</video>
`;

}

const ownerMenu=
post.owner===currentUser
?
`
<button class="post-menu"
onclick="postOwnerMenu('${post.id}')">
⋮
</button>
`
:"";

return`

<article class="post-card">

<div class="post-head">

${avatarHtml(post.owner)}

<div>

<div class="post-user">
${escapeHtml(
profile.name||post.owner
)}
</div>

<div class="post-time">
${timeAgo(post.time)}
</div>

</div>

${ownerMenu}

</div>

${
post.text
?
`
<div class="post-text">
${escapeHtml(post.text)}
</div>
`
:""
}

${media}

<div class="post-actions">

<button
class="${liked?"liked":""}"
onclick="toggleLike('${post.id}')">

${liked?"💙":"🤍"}
${(post.likes||[]).length}

</button>

<button onclick="focusComment('${post.id}')">

💬
${(post.comments||[]).length}

</button>

</div>

<div
id="comments-${post.id}"
class="comments">

${renderComments(post)}

</div>

</article>

`;

}).join("");

}


/* =========================
   LIKE
========================= */

function toggleLike(id){

const posts=JSON.parse(
localStorage.getItem("yam_posts")||"[]"
);

const post=posts.find(
p=>String(p.id)===String(id)
);

if(!post)return;

post.likes=post.likes||[];

const index=
post.likes.indexOf(currentUser);

if(index>=0)
post.likes.splice(index,1);
else
post.likes.push(currentUser);

localStorage.setItem(
"yam_posts",
JSON.stringify(posts)
);

renderFeed();

}


/* =========================
   COMMENTS
========================= */

function renderComments(post){

let html="";

if(post.hiddenComments){

if(post.owner===currentUser){

html+=`
<div style="
padding:10px;
color:#777;
text-align:center;">
🔒 Komen disembunyikan
</div>
`;

}

}else{

(post.comments||[])
.forEach(comment=>{

const p=
getProfileData(comment.user);

const own=
comment.user===currentUser;

html+=`

<div class="comment">

${avatarHtml(comment.user)}

<div class="comment-body">

<div class="comment-name">
${escapeHtml(
p.name||comment.user
)}
</div>

<div class="comment-text">
${escapeHtml(comment.text)}
</div>

</div>

${
own||post.owner===currentUser
?
`
<button
onclick="commentMenu(
'${post.id}',
'${comment.id}'
)"
style="
background:transparent;
font-size:18px;">
⋮
</button>
`
:""
}

</div>

`;

});

}

html+=`

<div class="comment-input">

<input
id="comment-${post.id}"
placeholder="Tulis komen...">

<button
onclick="addComment('${post.id}')">
➤
</button>

</div>

`;

return html;

}


function addComment(id){

const input=
document.getElementById(
"comment-"+id
);

if(!input)return;

const text=input.value.trim();

if(!text)return;

const posts=JSON.parse(
localStorage.getItem("yam_posts")||"[]"
);

const post=posts.find(
p=>String(p.id)===String(id)
);

if(!post)return;

post.comments=post.comments||[];
post.blockedUsers=post.blockedUsers||[];

if(post.blockedUsers.includes(currentUser)){

alert(
"Anda telah diblock untuk komen pada post ini."
);

return;
}

post.comments.push({

id:Date.now(),
user:currentUser,
text:text,
time:Date.now()

});

localStorage.setItem(
"yam_posts",
JSON.stringify(posts)
);

renderFeed();

}


/* =========================
   COMMENT MENU
========================= */

function commentMenu(postId,commentId){

const posts=JSON.parse(
localStorage.getItem("yam_posts")||"[]"
);

const post=posts.find(
p=>String(p.id)===String(postId)
);

if(!post)return;

const comment=
(post.comments||[]).find(
c=>String(c.id)===String(commentId)
);

if(!comment)return;

const canManage=
comment.user===currentUser||
post.owner===currentUser;

if(!canManage)return;

let html="";

if(post.owner===currentUser){

html+=`

<button class="secondary-btn"
onclick="
toggleCommentVisibility('${postId}');
closeModal();
">

${
post.hiddenComments
?"👁️ Tunjukkan Komen"
:"🔒 Sembunyikan Komen"
}

</button>

`;

}

html+=`

<button class="secondary-btn"
onclick="
deleteComment('${postId}','${commentId}');
closeModal();
">

🗑️ Padam Komen

</button>

`;

if(
post.owner===currentUser&&
comment.user!==currentUser
){

html+=`

<button class="secondary-btn"
onclick="
blockCommenter('${postId}','${comment.user}');
closeModal();
">

🚫 Block Pengguna

</button>

`;

}

openModal("⚙️ Komen",html,function(){});

}


function deleteComment(postId,commentId){

const posts=JSON.parse(
localStorage.getItem("yam_posts")||"[]"
);

const post=posts.find(
p=>String(p.id)===String(postId)
);

if(!post)return;

const comment=
(post.comments||[]).find(
c=>String(c.id)===String(commentId)
);

if(!comment)return;

if(
comment.user!==currentUser&&
post.owner!==currentUser
)
return;

post.comments=
(post.comments||[]).filter(
c=>String(c.id)!==String(commentId)
);

localStorage.setItem(
"yam_posts",
JSON.stringify(posts)
);

renderFeed();

}


function toggleCommentVisibility(id){

const posts=JSON.parse(
localStorage.getItem("yam_posts")||"[]"
);

const post=posts.find(
p=>String(p.id)===String(id)
);

if(!post||post.owner!==currentUser)
return;

post.hiddenComments=!post.hiddenComments;

localStorage.setItem(
"yam_posts",
JSON.stringify(posts)
);

renderFeed();

}


function blockCommenter(postId,username){

const posts=JSON.parse(
localStorage.getItem("yam_posts")||"[]"
);

const post=posts.find(
p=>String(p.id)===String(postId)
);

if(!post||post.owner!==currentUser)
return;

post.blockedUsers=
post.blockedUsers||[];

if(!post.blockedUsers.includes(username))
post.blockedUsers.push(username);

post.comments=
(post.comments||[]).filter(
c=>c.user!==username
);

localStorage.setItem(
"yam_posts",
JSON.stringify(posts)
);

renderFeed();

}


/* =========================
   POST MENU
========================= */

function postOwnerMenu(id){

const html=`

<button class="secondary-btn"
onclick="
deletePost('${id}');
closeModal();
">

🗑️ Padam Post

</button>

`;

openModal("⚙️ Menu Post",html);

}


function deletePost(id){

const posts=JSON.parse(
localStorage.getItem("yam_posts")||"[]"
);

const post=posts.find(
p=>String(p.id)===String(id)
);

if(!post||post.owner!==currentUser)
return;

const updated=
posts.filter(
p=>String(p.id)!==String(id)
);

localStorage.setItem(
"yam_posts",
JSON.stringify(updated)
);

renderFeed();

}


function focusComment(id){

const input=
document.getElementById(
"comment-"+id
);

if(input)
input.focus();

}


/* =====================================================
   PROFILE TABS V4.5
===================================================== */

function showProfileTab(tab){

currentProfileTab=tab;

document.querySelectorAll(".profile-tab")
.forEach(btn=>{
btn.classList.remove("active");
});

if(tab==="posts")
document.getElementById("profileTabPosts")
.classList.add("active");

if(tab==="images")
document.getElementById("profileTabImages")
.classList.add("active");

if(tab==="videos")
document.getElementById("profileTabVideos")
.classList.add("active");

if(tab==="market")
document.getElementById("profileTabMarket")
.classList.add("active");

renderProfileContent();

}


/* =========================
   PROFILE CONTENT
========================= */

function renderProfileContent(){

const area=
document.getElementById("profileTabContent");

if(!area||!currentUser)
return;

if(currentProfileTab==="posts"){

renderProfilePosts(area);
return;

}

if(currentProfileTab==="images"){

renderProfileImages(area);

renderProfileContent();

.charAt(0)
.toUpperCase()}

</text>

</svg>
`);

}

document.getElementById(

).classList.add("show");

}


function closeChat(){

document.getElementById(
"chatOverlay"
).classList.remove("show");

currentChatUser=null;

}


function renderChat(){

if(!currentChatUser)return;

const body=
document.getElementById("chatBody");

const messages=JSON.parse(
localStorage.getItem(
chatKey()
)||"[]"
);

if(!messages.length){

body.innerHTML=`

<div class="empty">
Belum ada mesej.
</div>

`;

return;
}

body.innerHTML=
messages.map(msg=>{

const mine=
msg.user===currentUser;

return`

<div class="
chat-message
${mine?"mine":""}">

${escapeHtml(msg.text)}

</div>

`;

}).join("");

body.scrollTop=
body.scrollHeight;

}


function sendChat(){

if(!currentChatUser)return;

const input=
document.getElementById("chatInput");

const text=
input.value.trim();

if(!text)return;

const messages=JSON.parse(
localStorage.getItem(
chatKey()
)||"[]"
);

messages.push({
user:currentUser,
text:text,
time:Date.now()
});

localStorage.setItem(
chatKey(),
JSON.stringify(messages)
);

input.value="";

renderChat();

}


document.getElementById("chatInput")
.addEventListener("keydown",function(e){

if(e.key==="Enter")
sendChat();

});
