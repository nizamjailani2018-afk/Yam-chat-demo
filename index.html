<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Y-M Chat V1.3.1</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

html,body{
    width:100%;
    min-height:100%;
    overflow-x:hidden;
}

body{
    background:linear-gradient(135deg,#0d47a1,#1976d2,#42a5f5);
    padding:18px 10px;
    color:#222;
}

.app{
    width:100%;
    max-width:430px;
    margin:auto;
}

.card{
    background:#fff;
    border-radius:22px;
    padding:22px;
    box-shadow:0 10px 30px rgba(0,0,0,.18);
}

h1,h2,h3{
    color:#1565c0;
}

h2{
    margin-bottom:12px;
}

p{
    line-height:1.5;
}

button,
select,
input{
    width:100%;
    border:0;
    outline:none;
}

button{
    padding:12px;
    border-radius:12px;
    margin-top:10px;
    font-size:15px;
    cursor:pointer;
}

input,
select{
    padding:12px;
    border:1px solid #d5dbe1;
    border-radius:10px;
    background:#fff;
    font-size:14px;
}

input:focus,
select:focus{
    border-color:#1976d2;
}

label{
    display:block;
    margin:12px 0 6px;
    font-weight:bold;
    font-size:14px;
}

.btn-blue{
    background:#1976d2;
    color:#fff;
}

.btn-light{
    background:#e3f2fd;
    color:#1565c0;
}

.btn-gray{
    background:#eceff1;
    color:#37474f;
}

.btn-orange{
    background:#fb8c00;
    color:#fff;
}

.btn-green{
    background:#43a047;
    color:#fff;
}

.btn-disabled{
    background:#cfd8dc;
    color:#78909c;
    cursor:not-allowed;
}

.hidden{
    display:none !important;
}

.small{
    font-size:12px;
    color:#777;
}

.notice{
    background:#e3f2fd;
    color:#1565c0;
    padding:10px;
    border-radius:10px;
    margin-top:10px;
    font-size:13px;
}

.warning{
    background:#fff3e0;
    color:#e65100;
    padding:10px;
    border-radius:10px;
    margin-top:10px;
    font-size:13px;
}

.success{
    background:#e8f5e9;
    color:#2e7d32;
    padding:10px;
    border-radius:10px;
    margin-top:10px;
    font-size:13px;
}

.error{
    background:#ffebee;
    color:#c62828;
    padding:10px;
    border-radius:10px;
    margin-top:10px;
    font-size:13px;
}

.section{
    margin-top:18px;
    padding-top:15px;
    border-top:1px solid #eee;
}

.row{
    display:flex;
    gap:8px;
}

.row > *{
    flex:1;
}

.radio-box{
    display:flex;
    gap:8px;
    margin-top:8px;
}

.radio-box label{
    flex:1;
    margin:0;
    padding:10px;
    border:1px solid #ddd;
    border-radius:10px;
    font-weight:normal;
}

.radio-box input{
    width:auto;
}

.otp-channel{
    border:1px solid #ddd;
    border-radius:12px;
    padding:12px;
    margin-top:10px;
}

.phone-preview{
    margin-top:8px;
    padding:10px;
    border-radius:9px;
    background:#f5f5f5;
    color:#555;
    font-size:13px;
}

.language-box{
    margin-bottom:16px;
}

.language-title{
    font-size:13px;
    color:#555;
    margin-bottom:6px;
}

.footer{
    text-align:center;
    margin-top:18px;
    color:#fff;
    font-size:12px;
}

/* =====================================================
   HOME V1.3.1 - HEADER
   FRONT PAGE LOCKED
===================================================== */

.home-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    padding:10px 0 14px;
    border-bottom:1px solid #e5e7eb;
    margin-bottom:14px;
}

.home-brand{
    font-size:20px;
    font-weight:bold;
    color:#1565c0;
    white-space:nowrap;
}

.home-header-actions{
    display:flex;
    align-items:center;
    gap:6px;
}

.home-icon-btn{
    width:38px;
    height:38px;
    padding:0;
    margin:0;
    border-radius:10px;
    background:#f1f5f9;
    color:#1565c0;
    font-size:17px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.home-icon-btn:hover{
    background:#e3f2fd;
}

.home-language{
    width:auto;
    min-width:82px;
    padding:9px 7px;
    margin:0;
    font-size:11px;
    border-radius:10px;
}

.home-box{
    background:#fff;
    border-radius:22px;
    padding:18px;
    box-shadow:0 10px 30px rgba(0,0,0,.18);
}

.home-avatar{
    width:70px;
    height:70px;
    border-radius:50%;
    background:#1976d2;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:30px;
    font-weight:bold;
    margin:4px auto 12px;
}
</style>
</head>

<body>

<div class="app">

    <!-- =================================================
         FRONT PAGE - LOCKED
    ================================================== -->

    <div id="frontPage" class="card">

        <div class="language-box">

            <div class="language-title">
                🌐 <span data-i18n="chooseLanguage">
                    Choose Language
                </span>
            </div>

            <select id="masterLanguage"
                    onchange="changeMasterLanguage()">

                <option value="en">🇬🇧 English</option>
                <option value="ms">🇲🇾 Bahasa Malaysia</option>
                <option value="id">🇮🇩 Indonesia</option>
                <option value="fil">🇵🇭 Filipino</option>
                <option value="th">🇹🇭 ไทย</option>
                <option value="vi">🇻🇳 Tiếng Việt</option>
                <option value="zh">🇨🇳 中文</option>
                <option value="ja">🇯🇵 日本語</option>
                <option value="ko">🇰🇷 한국어</option>
                <option value="hi">🇮🇳 हिन्दी</option>
                <option value="ar">🌍 العربية</option>
                <option value="fr">🇫🇷 Français</option>
                <option value="es">🇪🇸 Español</option>
                <option value="pt">🇵🇹 Português</option>
                <option value="de">🇩🇪 Deutsch</option>
                <option value="it">🇮🇹 Italiano</option>
                <option value="nl">🇳🇱 Nederlands</option>
                <option value="ru">🇷🇺 Русский</option>
                <option value="tr">🇹🇷 Türkçe</option>
                <option value="sw">🌍 Kiswahili</option>

            </select>

        </div>

        <div id="frontPage">

            <h2 data-i18n="welcome">
                Welcome
            </h2>

            <button class="btn-blue"
                    onclick="showPage('loginPage')"
                    data-i18n="login">
                LOGIN
            </button>

            <button class="btn-light"
                    onclick="showPage('registerPage')"
                    data-i18n="register">
                REGISTER Y-M ID
            </button>

            <button class="btn-gray"
                    onclick="showPage('changePasswordPage')"
                    data-i18n="changePassword">
                🔑 CHANGE PASSWORD
            </button>

            <button class="btn-light"
                    onclick="showPage('securityPage')"
                    data-i18n="security">
                🛡️ SECURITY
            </button>

            <button class="btn-orange"
                    onclick="showPage('recoveryPage')"
                    data-i18n="forgotRecovery">
                🔐 FORGOT PASSWORD / RECOVERY
            </button>

        </div>

    </div>


    <!-- =================================================
         LOGIN
    ================================================== -->

    <div id="loginPage" class="card hidden">

        <h2 data-i18n="login">
            LOGIN
        </h2>

        <label data-i18n="ymid">
            Y-M ID
        </label>

        <input id="loginUsername"
               autocomplete="username"
               placeholder="Enter Y-M ID"
               data-i18n-placeholder="enterYmid">

        <label data-i18n="password">
            Password
        </label>

        <input id="loginPassword"
               type="password"
               autocomplete="current-password"
               placeholder="Enter password"
               data-i18n-placeholder="enterPassword">

        <div id="loginMessage"></div>

        <button class="btn-blue"
                onclick="loginUser()"
                data-i18n="login">
            LOGIN
        </button>

        <button class="btn-orange"
                onclick="showPage('recoveryPage')"
                data-i18n="forgotRecovery">
            🔐 FORGOT PASSWORD / RECOVERY
        </button>

        <button class="btn-light"
                onclick="showPage('frontPage')"
                data-i18n="back">
            BACK
        </button>

    </div>


    <!-- =================================================
         REGISTER
    ================================================== -->

    <div id="registerPage" class="card hidden">

        <h2 data-i18n="register">
            REGISTER Y-M ID
        </h2>

        <label data-i18n="name">
            Name
        </label>

        <input id="regName"
               placeholder="Enter your name"
               data-i18n-placeholder="enterName">

        <label data-i18n="ymid">
            Y-M ID
        </label>

        <input id="regUsername"
               placeholder="Create Y-M ID"
               data-i18n-placeholder="createYmid">

        <label data-i18n="password">
            Password
        </label>

        <input id="regPassword"
               type="password"
               placeholder="Create password"
               data-i18n-placeholder="createPassword">

        <label data-i18n="confirmPassword">
            Confirm Password
        </label>

        <input id="regConfirmPassword"
               type="password"
               placeholder="Confirm password"
               data-i18n-placeholder="confirmPasswordPlaceholder">

        <label data-i18n="country">
            Country
        </label>

        <select id="regCountry"
                onchange="updateCountryCode('regCountry','regCode','regPhone')">
        </select>

        <label data-i18n="phone">
            Phone
        </label>

        <div class="row">

            <select id="regCode"
                    onchange="updateFullPhone('regCode','regPhone')">
            </select>

            <input id="regPhone"
                   type="tel"
                   placeholder="Phone number"
                   data-i18n-placeholder="phoneNumber"
                   oninput="updateFullPhone('regCode','regPhone')">

        </div>

        <div id="regPhonePreview"
             class="phone-preview">
            +60
        </div>

        <label data-i18n="email">
            Email
        </label>

        <input id="regEmail"
               type="email"
               placeholder="Email"
               data-i18n-placeholder="emailPlaceholder">

        <label data-i18n="confirmEmail">
            Confirm Email
        </label>

        <input id="regConfirmEmail"
               type="email"
               placeholder="Confirm email"
               data-i18n-placeholder="confirmEmailPlaceholder">

        <div class="section">

            <h3 data-i18n="securityQuestions">
                Security Questions
            </h3>

            <label data-i18n="question1">
                Question 1
            </label>

            <select id="regQuestion1"></select>

            <input id="regAnswer1"
                   placeholder="Your answer"
                   data-i18n-placeholder="yourAnswer">

            <label data-i18n="question2">
                Question 2
            </label>

            <select id="regQuestion2"></select>

            <input id="regAnswer2"
                   placeholder="Your answer"
                   data-i18n-placeholder="yourAnswer">

        </div>

        <div id="registerMessage"></div>

        <button class="btn-green"
                onclick="registerUser()"
                data-i18n="createAccount">
            CREATE ACCOUNT
        </button>

        <button class="btn-light"
                onclick="showPage('frontPage')"
                data-i18n="back">
            BACK
        </button>

    </div>


    <!-- =================================================
         CHANGE PASSWORD
    ================================================== -->

    <div id="changePasswordPage" class="card hidden">

        <h2 data-i18n="changePassword">
            🔑 CHANGE PASSWORD
        </h2>

        <label data-i18n="ymid">
            Y-M ID
        </label>

        <input id="cpUsername"
               placeholder="Y-M ID"
               data-i18n-placeholder="enterYmid">

        <label data-i18n="oldPassword">
            Old Password
        </label>

        <input id="cpOldPassword"
               type="password"
               placeholder="Old password"
               data-i18n-placeholder="oldPasswordPlaceholder">

        <label data-i18n="newPassword">
            New Password
        </label>

        <input id="cpNewPassword"
               type="password"
               placeholder="New password"
               data-i18n-placeholder="newPasswordPlaceholder">

        <label data-i18n="confirmPassword">
            Confirm New Password
        </label>

        <input id="cpConfirmPassword"
               type="password"
               placeholder="Confirm new password"
               data-i18n-placeholder="confirmNewPasswordPlaceholder">

        <div id="changePasswordMessage"></div>

        <button class="btn-blue"
                onclick="changePassword()"
                data-i18n="changePassword">
            CHANGE PASSWORD
        </button>

        <button class="btn-light"
                onclick="showPage('frontPage')"
                data-i18n="back">
            BACK
        </button>

    </div>


    <!-- =================================================
         SECURITY
    ================================================== -->

    <div id="securityPage" class="card hidden">

        <h2 data-i18n="security">
            🛡️ SECURITY
        </h2>

        <p class="small"
           data-i18n="securityInfo">
            Security settings help protect your Y-M account.
        </p>

        <label data-i18n="ymid">
            Y-M ID
        </label>

        <input id="secUsername"
               placeholder="Y-M ID"
               data-i18n-placeholder="enterYmid">

        <label data-i18n="country">
            Country
        </label>

        <select id="secCountry"
                onchange="updateCountryCode('secCountry','secCode','secPhone')">
        </select>

        <label data-i18n="phone">
            Phone
        </label>

        <div class="row">

            <select id="secCode"
                    onchange="updateFullPhone('secCode','secPhone')">
            </select>

            <input id="secPhone"
                   type="tel"
                   placeholder="Phone number"
                   data-i18n-placeholder="phoneNumber"
                   oninput="updateFullPhone('secCode','secPhone')">

        </div>

        <div id="secPhonePreview"
             class="phone-preview">
            +60
        </div>

        <div class="section">

            <h3 data-i18n="securityQuestions">
                Security Questions
            </h3>

            <label data-i18n="question1">
                Question 1
            </label>

            <select id="secQuestion1"></select>

            <input id="secAnswer1"
                   placeholder="Your answer"
                   data-i18n-placeholder="yourAnswer">

            <label data-i18n="question2">
                Question 2
            </label>

            <select id="secQuestion2"></select>

            <input id="secAnswer2"
                   placeholder="Your answer"
                   data-i18n-placeholder="yourAnswer">

        </div>

        <div id="securityMessage"></div>

        <button class="btn-blue"
                onclick="saveSecurity()"
                data-i18n="saveSecurity">
            SAVE SECURITY
        </button>

        <button class="btn-light"
                onclick="showPage('frontPage')"
                data-i18n="back">
            BACK
        </button>

    </div>


    <!-- =================================================
         RECOVERY
    ================================================== -->

    <div id="recoveryPage" class="card hidden">

        <h2 data-i18n="forgotRecovery">
            🔐 FORGOT PASSWORD / RECOVERY
        </h2>

        <p class="small"
           data-i18n="recoveryInfo">
            Choose a recovery method.
        </p>

        <label data-i18n="ymid">
            Y-M ID
        </label>

        <input id="recoveryUsername"
               placeholder="Y-M ID"
               data-i18n-placeholder="enterYmid">

        <div class="otp-channel">

            <button class="btn-light"
                    onclick="startSecurityRecovery()"
                    data-i18n="securityQuestions">
                🛡️ SECURITY QUESTIONS
            </button>

            <button class="btn-light"
                    onclick="startPhoneRecovery()"
                    data-i18n="phoneOtp">
                📱 PHONE OTP
            </button>

            <button class="btn-light"
                    onclick="startEmailRecovery()"
                    data-i18n="emailOtp">
                📧 EMAIL OTP
            </button>

        </div>

        <div id="recoveryArea"></div>

        <div id="recoveryMessage"></div>

        <button class="btn-light"
                onclick="showPage('frontPage')"
                data-i18n="back">
            BACK
        </button>

    </div>


    <!-- =================================================
         HOME V1.3.1 - STEP 1 HEADER
    ================================================== -->

    <div id="homePage" class="hidden">

        <div class="home-box">

            <div class="home-header">

                <div class="home-brand">
                    Y-M Chat
                </div>

                <div class="home-header-actions">

                    <select id="homeLanguage"
                            class="home-language"
                            onchange="changeHomeLanguage()">

                        <option value="en">🇬🇧 EN</option>
                        <option value="ms">🇲🇾 BM</option>
                        <option value="id">🇮🇩 ID</option>
                        <option value="fil">🇵🇭 FIL</option>
                        <option value="th">🇹🇭 TH</option>
                        <option value="vi">🇻🇳 VI</option>
                        <option value="zh">🇨🇳 中文</option>
                        <option value="ja">🇯🇵 日本語</option>
                        <option value="ko">🇰🇷 한국어</option>
                        <option value="hi">🇮🇳 हिन्दी</option>
                        <option value="ar">🌍 العربية</option>
                        <option value="fr">🇫🇷 FR</option>
                        <option value="es">🇪🇸 ES</option>
                        <option value="pt">🇵🇹 PT</option>
                        <option value="de">🇩🇪 DE</option>
                        <option value="it">🇮🇹 IT</option>
                        <option value="nl">🇳🇱 NL</option>
                        <option value="ru">🇷🇺 RU</option>
                        <option value="tr">🇹🇷 TR</option>
                        <option value="sw">🌍 SW</option>

                    </select>

                    <button class="home-icon-btn"
                            onclick="homeSearch()"
                            title="Search">
                        🔍
                    </button>

                    <button class="home-icon-btn"
                            onclick="homeNotifications()"
                            title="Notifications">
                        🔔
                    </button>

                    <button class="home-icon-btn"
                            onclick="homeMessages()"
                            title="Messages">
                        ✉️
                    </button>

                </div>

            </div>


            <div class="home-avatar"
                 id="homeAvatar">
                Y
            </div>

            <h2>
                Y-M Chat
            </h2>

            <div class="success"
                 data-i18n="loginSuccess">
                Login successful.
            </div>

            <p id="welcomeUser"
               style="margin:10px 0;color:#555;">
            </p>

            <button class="btn-blue">
                🏠 <span data-i18n="home">HOME</span>
            </button>

            <button class="btn-light">
                👤 <span data-i18n="profile">PROFILE</span>
            </button>

            <button class="btn-light">
                👥 <span data-i18n="friend">FRIEND</span>
            </button>

            <button class="btn-light">
                🌍 <span data-i18n="room">ROOM</span>
            </button>

            <button class="btn-light">
                🛒 <span data-i18n="market">MARKET</span>
            </button>

            <button class="btn-orange"
                    onclick="logoutUser()">
                LOG OUT
            </button>

        </div>

    </div>

</div>


<div class="footer">
    © Y-M Chat
</div>


<script>

/* =========================================================
   LANGUAGE SYSTEM
========================================================= */

const translations = {

    en:{

        chooseLanguage:"Choose Language",
        welcome:"Welcome",
        login:"LOGIN",
        register:"REGISTER Y-M ID",
        changePassword:"🔑 CHANGE PASSWORD",
        security:"🛡️ SECURITY",
        forgotRecovery:"🔐 FORGOT PASSWORD / RECOVERY",

        ymid:"Y-M ID",
        password:"Password",
        oldPassword:"Old Password",
        newPassword:"New Password",
        confirmPassword:"Confirm Password",
        name:"Name",
        country:"Country",
        phone:"Phone",
        email:"Email",
        confirmEmail:"Confirm Email",

        enterYmid:"Enter Y-M ID",
        enterPassword:"Enter password",
        enterName:"Enter your name",
        createYmid:"Create Y-M ID",
        createPassword:"Create password",
        confirmPasswordPlaceholder:"Confirm password",
        phoneNumber:"Phone number",
        emailPlaceholder:"Email",
        confirmEmailPlaceholder:"Confirm email",
        oldPasswordPlaceholder:"Old password",
        newPasswordPlaceholder:"New password",
        confirmNewPasswordPlaceholder:"Confirm new password",
        yourAnswer:"Your answer",

        securityQuestions:"Security Questions",
        question1:"Question 1",
        question2:"Question 2",

        createAccount:"CREATE ACCOUNT",
        saveSecurity:"SAVE SECURITY",

        phoneOtp:"📱 PHONE OTP",
        emailOtp:"📧 EMAIL OTP",

        back:"BACK",
        home:"HOME",
        profile:"PROFILE",
        friend:"FRIEND",
        room:"ROOM",
        market:"MARKET",

        loginSuccess:"Login successful.",
        securityInfo:"Security settings help protect your Y-M account.",
        recoveryInfo:"Choose a recovery method."

    },

    ms:{

        chooseLanguage:"Pilih Bahasa",
        welcome:"Selamat Datang",
        login:"LOG MASUK",
        register:"DAFTAR Y-M ID",
        changePassword:"🔑 TUKAR KATA LALUAN",
        security:"🛡️ KESELAMATAN",
        forgotRecovery:"🔐 LUPA KATA LALUAN / PEMULIHAN",

        ymid:"Y-M ID",
        password:"Kata Laluan",
        oldPassword:"Kata Laluan Lama",
        newPassword:"Kata Laluan Baru",
        confirmPassword:"Sahkan Kata Laluan",
        name:"Nama",
        country:"Negara",
        phone:"Telefon",
        email:"Emel",
        confirmEmail:"Sahkan Emel",

        enterYmid:"Masukkan Y-M ID",
        enterPassword:"Masukkan kata laluan",
        enterName:"Masukkan nama",
        createYmid:"Cipta Y-M ID",
        createPassword:"Cipta kata laluan",
        confirmPasswordPlaceholder:"Sahkan kata laluan",
        phoneNumber:"Nombor telefon",
        emailPlaceholder:"Emel",
        confirmEmailPlaceholder:"Sahkan emel",
        oldPasswordPlaceholder:"Kata laluan lama",
        newPasswordPlaceholder:"Kata laluan baru",
        confirmNewPasswordPlaceholder:"Sahkan kata laluan baru",
        yourAnswer:"Jawapan anda",

        securityQuestions:"Soalan Keselamatan",
        question1:"Soalan 1",
        question2:"Soalan 2",

        createAccount:"CIPTA AKAUN",
        saveSecurity:"SIMPAN KESELAMATAN",

        phoneOtp:"📱 OTP TELEFON",
        emailOtp:"📧 OTP EMEL",

        back:"KEMBALI",
        home:"UTAMA",
        profile:"PROFIL",
        friend:"RAKAN",
        room:"BILIK",
        market:"PASAR",

        loginSuccess:"Log masuk berjaya.",
        securityInfo:"Tetapan keselamatan membantu melindungi akaun Y-M anda.",
        recoveryInfo:"Pilih kaedah pemulihan."

    }

};


/* =========================================================
   GLOBAL LANGUAGE
========================================================= */

let currentLanguage =
    localStorage.getItem("ym_language") || "en";


function applyLanguage(language){

    currentLanguage =
        translations[language]
        ? language
        : "en";

    localStorage.setItem(
        "ym_language",
        currentLanguage
    );

    document.documentElement.lang =
        currentLanguage;

    const dict =
        translations[currentLanguage];

    document
        .querySelectorAll("[data-i18n]")
        .forEach(el=>{

            const key =
                el.getAttribute("data-i18n");

            if(dict[key]){
                el.textContent =
                    dict[key];
            }

        });

    document
        .querySelectorAll("[data-i18n-placeholder]")
        .forEach(el=>{

            const key =
                el.getAttribute(
                    "data-i18n-placeholder"
                );

            if(dict[key]){
                el.placeholder =
                    dict[key];
            }

        });

    const master =
        document.getElementById(
            "masterLanguage"
        );

    if(master){
        master.value =
            currentLanguage;
    }

    updateSecurityQuestionsLanguage();

    syncHomeLanguage();
}

function fillCountrySelect(id){

        document.getElementById(id);

    select.innerHTML =
        '<option value="">Select country</option>';

    countries.forEach(country=>{

        const option =
            document.createElement("option");

        option.value =
            country[1];

        option.textContent =
            country[0];

        select.appendChild(
            option
        );

    });

}


function getCountryCode(countryId){

    const select =
        document.getElementById(countryId);

    if(!select) return "";

    const country =
        countries.find(
            c=>c[1] === select.value
        );

    return country
        ? country[2]
        : "";
}


function updateCountryCode(
    countryId,
    codeId,
    phoneId
){

    const code =
        document.getElementById(codeId);

    if(!code) return;

    const countryCode =
        getCountryCode(countryId);

    code.innerHTML = "";

    if(countryCode){

        const option =
            document.createElement("option");

        option.value =
            countryCode;

        option.textContent =
            countryCode;

        code.appendChild(
            option
        );

    }else{

        const option =
            document.createElement("option");

        option.value = "";
        option.textContent = "+";

        code.appendChild(
            option
        );

    }

    updateFullPhone(
        codeId,
        phoneId
    );

}


function updateFullPhone(
    codeId,
    phoneId
){

    const code =
        document.getElementById(codeId);

    const phone =
        document.getElementById(phoneId);

    if(!code || !phone) return;

    let previewId = "";

    if(phoneId === "regPhone"){
        previewId = "regPhonePreview";
    }

    if(phoneId === "secPhone"){
        previewId = "secPhonePreview";
    }

    const preview =
        document.getElementById(
            previewId
        );

    if(!preview) return;

    const number =
        phone.value.trim();

    preview.textContent =
        (code.value || "+") +
        (number
            ? " " + number
            : "");

}

function registerUser(){

        ).value.trim();

    const password =
        document.getElementById(

        ).value;

    const country =

    const code =

    const phone =

    const email =
        document.getElementById(
            "regEmail"
        ).value.trim();

    const confirmEmail =
        document.getElementById(
            "regConfirmEmail"
        ).value.trim();

    const q1 =
        document.getElementById(
            "regQuestion1"
        ).value;

    const q2 =
        document.getElementById(
            "regQuestion2"
        ).value;

    const a1 =
        document.getElementById(
            "regAnswer1"
        ).value.trim();

    const a2 =
        document.getElementById(
            "regAnswer2"
        ).value.trim();

    const message =
        document.getElementById(
            "registerMessage"
        );

    message.innerHTML = "";


    if(
        !name ||
        !username ||
        !password ||
        !confirmPassword ||
        !country ||
        !phone ||
        !email ||
        !confirmEmail ||
        !q1 ||
        !q2 ||
        !a1 ||
        !a2
    ){

        message.innerHTML =
            `<div class="error">
                ${
                    currentLanguage === "ms"
                    ? "Sila lengkapkan semua maklumat."
                    : "Please complete all information."
                }
            </div>`;

        return;

    }


    if(password.length < 6){

        message.innerHTML =
            `<div class="error">
                ${
                    currentLanguage === "ms"
                    ? "Kata laluan mesti sekurang-kurangnya 6 aksara."
                    : "Password must be at least 6 characters."
                }
            </div>`;

        return;

    }


    if(password !== confirmPassword){

        message.innerHTML =
            `<div class="error">
                ${
                    currentLanguage === "ms"
                    ? "Kata laluan tidak sepadan."
                    : "Passwords do not match."
                }
            </div>`;

        return;

    }


    if(email.toLowerCase() !==
       confirmEmail.toLowerCase()){

        message.innerHTML =
            `<div class="error">
                ${
                    currentLanguage === "ms"
                    ? "Emel tidak sepadan."
                    : "Emails do not match."
                }
            </div>`;

        return;

    }


    if(q1 === q2){

        message.innerHTML =
            `<div class="error">
                ${
                    currentLanguage === "ms"
                    ? "Sila pilih dua soalan keselamatan yang berbeza."
                    : "Please choose two different security questions."
                }
            </div>`;

        return;

    }


    const accounts =
        getAccounts();

    const exists =
        accounts.some(
            acc =>
            acc.username.toLowerCase()
            === username.toLowerCase()
        );

    if(exists){

        message.innerHTML =
            `<div class="error">
                ${
                    currentLanguage === "ms"
                    ? "Y-M ID tersebut sudah digunakan."
                    : "That Y-M ID is already in use."
                }
            </div>`;

        return;

    }


    const account = {

        name:name,
        username:username,
        password:password,

        language:
            currentLanguage || "en",

        country:country,
        countryCode:code,
        phone:phone,

        fullPhone:
            code + phone,

        email:email,

        question1:q1,
        answer1:a1.toLowerCase(),

        question2:q2,
        answer2:a2.toLowerCase(),

        phoneVerified:false,
        emailVerified:false,

        createdAt:
            new Date().toISOString()

    };


    accounts.push(account);

    saveAccounts(accounts);


    message.innerHTML =
        `<div class="success">
            ${
                currentLanguage === "ms"
                ? "Akaun berjaya dicipta. Anda boleh log masuk sekarang."
                : "Account created successfully. You can login now."
            }
        </div>`;


    document.getElementById(
        "regName"
    ).value = "";

    document.getElementById(
        "regUsername"
    ).value = "";

    document.getElementById(
        "regPassword"
    ).value = "";

    document.getElementById(
        "regConfirmPassword"
    ).value = "";

    document.getElementById(
        "regPhone"
    ).value = "";

    document.getElementById(
        "regEmail"
    ).value = "";

    document.getElementById(
        "regConfirmEmail"
    ).value = "";

    document.getElementById(
        "regAnswer1"
    ).value = "";

    document.getElementById(
        "regAnswer2"
    ).value = "";

}

    if(account.password !== password){

        message.innerHTML =
            `<div class="error">
                ${
                    currentLanguage === "ms"
                    ? "Kata laluan salah."
                    : "Incorrect password."
                }
            </div>`;

        return;

    localStorage.setItem(
        "ym_current_user",

    );


    applyLanguage(
        account.language || "en"
    );

        document.getElementById(
            "welcomeUser"

        welcome.textContent =
            account.name +
            " • @" +
            account.username;

        document.getElementById(
            "homeAvatar"
        );

            .charAt(0)

function changePassword(){

    const username =
        document.getElementById(
            "cpUsername"
        ).value.trim();

    const oldPassword =
        document.getElementById(
            "cpOldPassword"
        ).value;

    const newPassword =
        document.getElementById(
            "cpNewPassword"
        ).value;

    const confirmPassword =
        document.getElementById(
            "cpConfirmPassword"
        ).value;

    const message =
        document.getElementById(
            "changePasswordMessage"
        );

    message.innerHTML = "";


    const accounts =
        getAccounts();

    const index =
        accounts.findIndex(
            acc =>
            acc.username.toLowerCase()
            === username.toLowerCase()
        );


    if(index === -1){

        message.innerHTML =
            `<div class="error">
                ${
                    currentLanguage === "ms"
                    ? "Y-M ID tidak dijumpai."
                    : "Y-M ID not found."
                }
            </div>`;

        return;

    }


    if(
        accounts[index].password
        !== oldPassword
    ){

        message.innerHTML =
            `<div class="error">
                ${
                    currentLanguage === "ms"
                    ? "Kata laluan lama salah."
                    : "Old password is incorrect."
                }
            </div>`;

        return;

    }


    if(newPassword.length < 6){

        message.innerHTML =
            `<div class="error">
                ${
                    currentLanguage === "ms"
                    ? "Kata laluan baru mesti sekurang-kurangnya 6 aksara."
                    : "New password must be at least 6 characters."
                }
            </div>`;

        return;

    }


    if(newPassword !== confirmPassword){

        message.innerHTML =
            `<div class="error">
                ${
                    currentLanguage === "ms"
                    ? "Kata laluan baru tidak sepadan."
                    : "New passwords do not match."
                }
            </div>`;

        return;

    }


    accounts[index].password =
        newPassword;

    saveAccounts(accounts);


    message.innerHTML =
        `<div class="success">
            ${
                currentLanguage === "ms"
                ? "Kata laluan berjaya ditukar."
                : "Password changed successfully."
            }
        </div>`;

}

        ? "Notifications akan dibina kemudian."
        : "Notifications will be built later."
    );

}


function homeMessages(){

    alert(
        currentLanguage === "ms"
        ? "Messages akan dibina kemudian."
        : "Messages will be built later."
    );

}


/* =========================================================
   LOGOUT
========================================================= */

function logoutUser(){

    localStorage.removeItem(
        "ym_current_user"
    );

    showPage(
        "frontPage"
    );

}


/* =========================================================
   INITIALIZATION
========================================================= */

fillCountrySelect(
    "regCountry"
);

fillCountrySelect(
    "secCountry"
);

updateCountryCode(
    "regCountry",
    "regCode",
    "regPhone"
);

updateCountryCode(
    "secCountry",
    "secCode",
    "secPhone"
);

applyLanguage(
    currentLanguage
);


/* =========================================================
   SESSION RESTORE
========================================================= */

const savedUser =
    localStorage.getItem(
        "ym_current_user"
    );


if(savedUser){

    const accounts =
        getAccounts();

    const account =
        accounts.find(
            acc =>
            acc.username === savedUser
        );


    if(account){

        applyLanguage(
            account.language || "en"
        );


        const welcome =
            document.getElementById(
                "welcomeUser"
            );

        if(welcome){

            welcome.textContent =
                account.name +
                " • @" +
                account.username;

        }


        const avatar =
            document.getElementById(
                "homeAvatar"
            );

        if(avatar){

            avatar.textContent =
                (account.name || "Y")
                .charAt(0)
                .toUpperCase();

        }


        showPage(
            "homePage"
        );

    }

}

</script>
