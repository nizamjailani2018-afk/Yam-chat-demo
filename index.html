<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YAM Chat V2</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
}

body {
  background: #eef2f7;
}

.app {
  max-width: 480px;
  margin: auto;
  min-height: 100vh;
  background: white;
  position: relative;
}

.header {
  background: #1877f2;
  color: white;
  padding: 20px;
  font-size: 24px;
  font-weight: bold;
}

.search {
  width: calc(100% - 30px);
  margin: 15px;
  padding: 13px;
  border: 0;
  border-radius: 25px;
  background: #f0f2f5;
  font-size: 15px;
}

.section {
  padding: 0 15px 80px;
}

.title {
  font-size: 20px;
  font-weight: bold;
  margin: 10px 0;
}

.chat {
  display: flex;
  align-items: center;
  padding: 15px 5px;
  border-bottom: 1px solid #eee;
  cursor: pointer;
}

.avatar {
  width: 50px;
  height: 50px;
  border-radius: 50%;
  background: #1877f2;
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
  margin-right: 13px;
}

.name {
  font-weight: bold;
}

.message {
  color: #777;
  font-size: 14px;
  margin-top: 5px;
}

.online {
  color: #20a957;
  font-size: 12px;
  margin-top: 4px;
}

.bottom {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 480px;
  background: white;
  border-top: 1px solid #ddd;
  display: flex;
  justify-content: space-around;
  padding: 9px 0;
}

.nav {
  border: 0;
  background: none;
  color: #555;
  cursor: pointer;
}

.nav span {
  display: block;
  font-size: 22px;
  margin-bottom: 3px;
}

.chat-screen {
  display: none;
  min-height: 100vh;
  background: #f5f7fa;
  position: relative;
}

.chat-header {
  background: #1877f2;
  color: white;
  padding: 17px;
  display: flex;
  align-items: center;
  gap: 15px;
}

.back {
  font-size: 25px;
  cursor: pointer;
}

.chat-body {
  padding: 20px 15px 80px;
}

.bubble {
  max-width: 75%;
  padding: 11px 14px;
  border-radius: 18px;
  margin: 10px 0;
  background: white;
}

.me {
  margin-left: auto;
  background: #1877f2;
  color: white;
}

.input-area {
  position: fixed;
  bottom: 0;
  width: 100%;
  max-width: 480px;
  background: white;
  padding: 10px;
  display: flex;
  gap: 8px;
  border-top: 1px solid #ddd;
}

.input-area input {
  flex: 1;
  padding: 12px;
  border: 1px solid #ddd;
  border-radius: 22px;
}

.input-area button {
  border: 0;
  border-radius: 50%;
  width: 45px;
  background: #1877f2;
  color: white;
  font-size: 18px;
}
</style>
</head>

<body>

<div class="app">

  <div id="home">

    <div class="header">
      💬 YAM Chat
    </div>

    <input class="search"
           placeholder="🔍 Cari kawan atau mesej...">

    <div class="section">

      <div class="title">Chats</div>

      <div class="chat" onclick="openChat('Ahmad','A')">
        <div class="avatar">A</div>
        <div>
          <div class="name">Ahmad</div>
          <div class="message">Hai bro! Apa khabar?</div>
          <div class="online">● Online</div>
        </div>
      </div>

      <div class="chat" onclick="openChat('Siti','S')">
        <div class="avatar">S</div>
        <div>
          <div class="name">Siti</div>
          <div class="message">Jumpa nanti 👍</div>
          <div class="online">● Online</div>
        </div>
      </div>

      <div class="chat" onclick="openChat('John','J')">
        <div class="avatar">J</div>
        <div>
          <div class="name">John</div>
          <div class="message">Hello 👋</div>
          <div class="online">● Online</div>
        </div>
      </div>

    </div>

  </div>

  <div id="chatScreen" class="chat-screen">

    <div class="chat-header">
      <div class="back" onclick="closeChat()">‹</div>
      <div class="avatar" id="chatAvatar">A</div>
      <div>
        <b id="chatName">Ahmad</b>
        <div style="font-size:12px;">● Online</div>
      </div>
    </div>

    <div class="chat-body" id="messages">

      <div class="bubble">
        Hai! Selamat datang di YAM Chat 👋
      </div>

      <div class="bubble me">
        Hai Ahmad! 😎
      </div>

    </div>

    <div class="input-area">
      <input id="messageInput"
             placeholder="Tulis mesej..."
             onkeydown="if(event.key==='Enter') sendMessage()">

      <button onclick="sendMessage()">➤</button>
    </div>

  </div>

  <div class="bottom">

    <button class="nav" onclick="showPage('Chats')">
      <span>💬</span>
      Chats
    </button>

    <button class="nav" onclick="showPage('Friends')">
      <span>👥</span>
      Friends
    </button>

    <button class="nav" onclick="showPage('Rooms')">
      <span>🌏</span>
      Rooms
    </button>

    <button class="nav" onclick="showPage('Profile')">
      <span>👤</span>
      Profile
    </button>

  </div>

</div>

<script>

function openChat(name, letter) {
  document.getElementById("home").style.display = "none";
  document.getElementById("chatScreen").style.display = "block";

  document.getElementById("chatName").innerText = name;
  document.getElementById("chatAvatar").innerText = letter;
}

function closeChat() {
  document.getElementById("chatScreen").style.display = "none";
  document.getElementById("home").style.display = "block";
}

function sendMessage() {

  let input = document.getElementById("messageInput");
  let text = input.value.trim();

  if (text === "") return;

  let message = document.createElement("div");

  message.className = "bubble me";
  message.innerText = text;

  document.getElementById("messages").appendChild(message);

  input.value = "";

  window.scrollTo(0, document.body.scrollHeight);
}

function showPage(page) {
  alert("YAM Chat • " + page + " 🚀");
}

</script>

</body>
</html>
