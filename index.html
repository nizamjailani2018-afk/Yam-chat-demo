<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Y-M Chat V1</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

html,body{
    width:100%;
    min-height:100%;
}

body{
    background:linear-gradient(135deg,#0b1f3a,#1976d2,#42a5f5);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

/* MAIN */
.ym-container{
    width:100%;
    max-width:420px;
}

/* LOGO */
.logo-area{
    text-align:center;
    color:#fff;
    margin-bottom:20px;
}

.logo{
    font-size:42px;
    font-weight:900;
    letter-spacing:-2px;
    text-shadow:0 3px 8px rgba(0,0,0,.25);
}

.logo-y{
    color:#fff;
}

.logo-m{
    color:#ff4f9a;
}

.logo-chat{
    color:#fff;
}

.tagline{
    margin-top:6px;
    font-size:15px;
    opacity:.9;
}

/* CARD */
.front-card{
    background:#fff;
    border-radius:22px;
    padding:22px;
    box-shadow:0 15px 45px rgba(0,0,0,.30);
}

/* BUTTONS */
.main-button{
    width:100%;
    border:0;
    border-radius:12px;
    padding:14px;
    margin-bottom:10px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    transition:.15s;
}

.main-button:active{
    transform:scale(.98);
}

.login-button{
    background:#1877f2;
    color:#fff;
}

.register-button{
    background:#e8f2ff;
    color:#1877f2;
}

.password-button{
    background:#f3f3f3;
    color:#333;
}

.security-button{
    background:#f3f3f3;
    color:#333;
}

/* FORM */
.form-section{
    display:none;
    margin-top:15px;
    padding-top:15px;
    border-top:1px solid #eee;
}

.form-section.active{
    display:block;
}

.form-title{
    font-size:20px;
    font-weight:bold;
    margin-bottom:14px;
    color:#222;
}

.input{
    width:100%;
    padding:13px;
    border:1px solid #ddd;
    border-radius:10px;
    outline:none;
    font-size:15px;
    margin-bottom:10px;
}

.input:focus{
    border-color:#1877f2;
}

/* ACTION */
.action-button{
    width:100%;
    border:0;
    border-radius:10px;
    padding:12px;
    background:#1877f2;
    color:#fff;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

.back-button{
    width:100%;
    border:0;
    background:#eee;
    color:#444;
    border-radius:10px;
    padding:11px;
    margin-top:8px;
    cursor:pointer;
    font-weight:bold;
}

/* MESSAGE */
.message{
    min-height:20px;
    margin-top:10px;
    text-align:center;
    font-size:13px;
}

.success{
    color:#168a24;
}

.error{
    color:#d00000;
}

/* SECURITY INFO */
.security-info{
    font-size:14px;
    color:#555;
    line-height:1.5;
    margin-bottom:12px;
}

/* FOOTER */
.footer{
    text-align:center;
    color:#fff;
    font-size:12px;
    margin-top:15px;
    opacity:.8;
}
</style>
</head>

<body>

<div class="ym-container">

    <!-- LOGO -->
    <div class="logo-area">

        <div class="logo">
            <span class="logo-y">Y</span><span class="logo-m">-M</span>
            <span class="logo-chat"> Chat</span>
        </div>

        <div class="tagline">
            Sembang • Kawan • Komuniti
        </div>

    </div>


    <!-- MAIN CARD -->
    <div class="front-card">

        <!-- MAIN MENU -->

        <button
            class="main-button login-button"
            onclick="showSection('loginSection')">
            LOGIN
        </button>

        <button
            class="main-button register-button"
            onclick="showSection('registerSection')">
            DAFTAR Y-M ID
        </button>

        <button
            class="main-button password-button"
            onclick="showSection('passwordSection')">
            🔑 CHANGE PASSWORD
        </button>

        <button
            class="main-button security-button"
            onclick="showSection('securitySection')">
            🛡️ SECURITY
        </button>


        <!-- LOGIN -->
        <div id="loginSection" class="form-section">

            <div class="form-title">
                Login Y-M Chat
            </div>

            <input
                id="loginId"
                class="input"
                type="text"
                placeholder="Y-M ID">

            <input
                id="loginPassword"
                class="input"
                type="password"
                placeholder="Password">

            <button
                class="action-button"
                onclick="login()">
                LOGIN
            </button>

            <button
                class="back-button"
                onclick="closeSections()">
                Kembali
            </button>

            <div id="loginMessage" class="message"></div>

        </div>


        <!-- REGISTER -->
        <div id="registerSection" class="form-section">

            <div class="form-title">
                Daftar Y-M ID
            </div>

            <input
                id="registerId"
                class="input"
                type="text"
                placeholder="Pilih Y-M ID">

            <input
                id="registerPassword"
                class="input"
                type="password"
                placeholder="Password">

            <input
                id="registerConfirm"
                class="input"
                type="password"
                placeholder="Ulang Password">

            <button
                class="action-button"
                onclick="registerAccount()">
                DAFTAR
            </button>

            <button
                class="back-button"
                onclick="closeSections()">
                Kembali
            </button>

            <div id="registerMessage" class="message"></div>

        </div>


        <!-- CHANGE PASSWORD -->
        <div id="passwordSection" class="form-section">

            <div class="form-title">
                Change Password
            </div>

            <input
                id="changeId"
                class="input"
                type="text"
                placeholder="Y-M ID">

            <input
                id="oldPassword"
                class="input"
                type="password"
                placeholder="Password Lama">

            <input
                id="newPassword"
                class="input"
                type="password"
                placeholder="Password Baru">

            <input
                id="confirmNewPassword"
                class="input"
                type="password"
                placeholder="Ulang Password Baru">

            <button
                class="action-button"
                onclick="changePassword()">
                TUKAR PASSWORD
            </button>

            <button
                class="back-button"
                onclick="closeSections()">
                Kembali
            </button>

            <div id="passwordMessage" class="message"></div>

        </div>


        <!-- SECURITY -->
        <div id="securitySection" class="form-section">

            <div class="form-title">
                🛡️ Security
            </div>

            <div class="security-info">
                Security Y-M Chat akan digunakan untuk
                membantu melindungi akaun dan pemulihan
                Y-M ID.
            </div>

            <input
                id="securityId"
                class="input"
                type="text"
                placeholder="Y-M ID">

            <input
                id="securityAnswer"
                class="input"
                type="text"
                placeholder="Kod / Jawapan Keselamatan">

            <button
                class="action-button"
                onclick="saveSecurity()">
                SIMPAN SECURITY
            </button>

            <button
                class="back-button"
                onclick="closeSections()">
                Kembali
            </button>

            <div id="securityMessage" class="message"></div>

        </div>

    </div>


    <div class="footer">
        © 2026 Y-M Chat
    </div>

</div>


<script>

/* =========================
   SECTION CONTROL
========================= */

function showSection(sectionId){

    closeSections();

    const section=document.getElementById(sectionId);

    if(section){
        section.classList.add("active");
    }

}

function closeSections(){

    document
    .querySelectorAll(".form-section")
    .forEach(function(section){

        section.classList.remove("active");

    });

}


/* =========================
   ACCOUNT DATABASE
========================= */

function getAccounts(){

    try{

        return JSON.parse(
            localStorage.getItem("ym_accounts") || "{}"
        );

    }catch(error){

        return {};

    }

}

function saveAccounts(accounts){

    localStorage.setItem(
        "ym_accounts",
        JSON.stringify(accounts)
    );

}


/* =========================
   REGISTER
========================= */

function registerAccount(){

    const id=
        document.getElementById("registerId")
        .value.trim();

    const password=
        document.getElementById("registerPassword")
        .value;

    const confirm=
        document.getElementById("registerConfirm")
        .value;

    const message=
        document.getElementById("registerMessage");


    message.className="message";


    if(id.length<3){

        message.textContent=
            "Y-M ID mesti sekurang-kurangnya 3 aksara.";

        message.classList.add("error");

        return;

    }


    if(/\s/.test(id)){

        message.textContent=
            "Y-M ID tidak boleh mempunyai ruang.";

        message.classList.add("error");

        return;

    }


    if(password.length<4){

        message.textContent=
            "Password mesti sekurang-kurangnya 4 aksara.";

        message.classList.add("error");

        return;

    }


    if(password!==confirm){

        message.textContent=
            "Password tidak sama.";

        message.classList.add("error");

        return;

    }


    const accounts=getAccounts();


    const existing=
        Object.keys(accounts)
        .find(function(key){

            return key.toLowerCase()===id.toLowerCase();

        });


    if(existing){

        message.textContent=
            "Y-M ID sudah digunakan.";

        message.classList.add("error");

        return;

    }


    accounts[id]={

        password:password,

        security:"",

        createdAt:Date.now()

    };


    saveAccounts(accounts);


    message.textContent=
        "Y-M ID berjaya didaftarkan.";

    message.classList.add("success");


    document.getElementById("registerPassword").value="";
    document.getElementById("registerConfirm").value="";

}


/* =========================
   LOGIN
========================= */

function login(){

    const id=
        document.getElementById("loginId")
        .value.trim();

    const password=
        document.getElementById("loginPassword")
        .value;

    const message=
        document.getElementById("loginMessage");


    message.className="message";


    if(!id||!password){

        message.textContent=
            "Sila isi Y-M ID dan password.";

        message.classList.add("error");

        return;

    }


    const accounts=getAccounts();


    const accountKey=
        Object.keys(accounts)
        .find(function(key){

            return key.toLowerCase()===id.toLowerCase();

        });


    if(!accountKey){

        message.textContent=
            "Y-M ID tidak dijumpai.";

        message.classList.add("error");

        return;

    }


    if(
        String(accounts[accountKey].password)!==
        String(password)
    ){

        message.textContent=
            "Password tidak betul.";

        message.classList.add("error");

        return;

    }


    localStorage.setItem(
        "ym_current_user",
        accountKey
    );


    message.textContent=
        "Login berjaya.";

    message.classList.add("success");


    /*
       BUAT MASA INI KITA BELUM
       BINA HOME.
       SELEPAS LOGIN, KITA TUNJUK
       STATUS SAHAJA.
    */

    setTimeout(function(){

        alert(
            "Selamat datang ke Y-M Chat, @"+
            accountKey+
            "!"
        );

    },300);

}


/* =========================
   CHANGE PASSWORD
========================= */

function changePassword(){

    const id=
        document.getElementById("changeId")
        .value.trim();

    const oldPassword=
        document.getElementById("oldPassword")
        .value;

    const newPassword=
        document.getElementById("newPassword")
        .value;

    const confirm=
        document.getElementById("confirmNewPassword")
        .value;

    const message=
        document.getElementById("passwordMessage");


    message.className="message";


    if(!id||!oldPassword||!newPassword||!confirm){

        message.textContent=
            "Sila lengkapkan semua ruangan.";

        message.classList.add("error");

        return;

    }


    const accounts=getAccounts();


    const accountKey=
        Object.keys(accounts)
        .find(function(key){

            return key.toLowerCase()===id.toLowerCase();

        });


    if(!accountKey){

        message.textContent=
            "Y-M ID tidak dijumpai.";

        message.classList.add("error");

        return;

    }


    if(
        String(accounts[accountKey].password)!==
        String(oldPassword)
    ){

        message.textContent=
            "Password lama tidak betul.";

        message.classList.add("error");

        return;

    }


    if(newPassword.length<4){

        message.textContent=
            "Password baru mesti sekurang-kurangnya 4 aksara.";

        message.classList.add("error");

        return;

    }


    if(newPassword!==confirm){

        message.textContent=
            "Password baru tidak sama.";

        message.classList.add("error");

        return;

    }


    accounts[accountKey].password=
        newPassword;


    saveAccounts(accounts);


    message.textContent=
        "Password berjaya ditukar.";

    message.classList.add("success");


    document.getElementById("oldPassword").value="";
    document.getElementById("newPassword").value="";
    document.getElementById("confirmNewPassword").value="";

}


/* =========================
   SECURITY
========================= */

function saveSecurity(){

    const id=
        document.getElementById("securityId")
        .value.trim();

    const answer=
        document.getElementById("securityAnswer")
        .value.trim();

    const message=
        document.getElementById("securityMessage");


    message.className="message";


    if(!id||!answer){

        message.textContent=
            "Sila isi Y-M ID dan kod keselamatan.";

        message.classList.add("error");

        return;

    }


    const accounts=getAccounts();


    const accountKey=
        Object.keys(accounts)
        .find(function(key){

            return key.toLowerCase()===id.toLowerCase();

        });


    if(!accountKey){

        message.textContent=
            "Y-M ID tidak dijumpai.";

        message.classList.add("error");

        return;

    }


    accounts[accountKey].security=answer;


    saveAccounts(accounts);


    message.textContent=
        "Security berjaya disimpan.";

    message.classList.add("success");

}


/* =========================
   START
========================= */

closeSections();

</script>

</body>
</html>
