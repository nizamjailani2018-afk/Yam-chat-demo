<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Y-M Chat V1.9.4</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

html,body{
    width:100%;
    min-height:100%;
    background:#eef3f8;
    color:#222;
}

button,input,select{
    font:inherit;
}

button{
    cursor:pointer;
}

.hidden{
    display:none!important;
}

#app{
    width:100%;
    max-width:480px;
    min-height:100vh;
    margin:auto;
    background:#fff;
    position:relative;
    overflow-x:hidden;
}

/* =========================
   AUTH
========================= */

.auth-page{
    min-height:100vh;
    padding:35px 22px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    background:linear-gradient(180deg,#1976d2,#0d47a1);
}

.logo{
    text-align:center;
    color:#fff;
    font-size:38px;
    font-weight:bold;
    margin-bottom:8px;
}

.logo-sub{
    text-align:center;
    color:#dcecff;
    margin-bottom:28px;
    font-size:14px;
}

.auth-box{
    background:#fff;
    border-radius:18px;
    padding:24px 20px;
    box-shadow:0 10px 30px rgba(0,0,0,.18);
}

.auth-box h2{
    text-align:center;
    margin-bottom:20px;
    color:#1976d2;
}

.input-group{
    margin-bottom:14px;
}

.input-group label{
    display:block;
    font-size:13px;
    color:#555;
    margin-bottom:6px;
}

.input-group input,
.input-group select{
    width:100%;
    padding:13px;
    border:1px solid #d4dce5;
    border-radius:10px;
    outline:none;
    background:#fff;
}

.input-group input:focus,
.input-group select:focus{
    border-color:#1976d2;
}

.primary-btn{
    width:100%;
    border:0;
    padding:13px;
    border-radius:10px;
    background:#1976d2;
    color:#fff;
    font-weight:bold;
    margin-top:5px;
}

.primary-btn:active{
    transform:scale(.98);
}

.auth-links{
    text-align:center;
    margin-top:17px;
}

.auth-links button{
    border:0;
    background:none;
    color:#1976d2;
    margin:5px;
}

.demo-note{
    margin-top:18px;
    padding:12px;
    border-radius:10px;
    background:#f1f7ff;
    color:#555;
    font-size:12px;
    line-height:1.5;
}

/* =========================
   HEADER
========================= */

.top-header{
    height:62px;
    background:#1976d2;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 16px;
    position:sticky;
    top:0;
    z-index:20;
}

.top-header h1{
    font-size:21px;
}

.header-btn{
    width:38px;
    height:38px;
    border-radius:50%;
    border:0;
    background:rgba(255,255,255,.16);
    color:#fff;
    font-size:18px;
}

.header-user{
    display:flex;
    align-items:center;
    gap:9px;
}

.header-avatar{
    width:36px;
    height:36px;
    border-radius:50%;
    background:#fff;
    color:#1976d2;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
}

/* =========================
   CONTENT
========================= */

.content{
    padding:16px;
    padding-bottom:88px;
    min-height:calc(100vh - 62px);
}

.page-title{
    font-size:23px;
    margin-bottom:5px;
}

.page-subtitle{
    color:#777;
    font-size:13px;
    margin-bottom:16px;
}

.card{
    background:#fff;
    border:1px solid #e4e9ee;
    border-radius:15px;
    padding:15px;
    margin-bottom:14px;
    box-shadow:0 2px 8px rgba(0,0,0,.04);
}

/* =========================
   HOME
========================= */

.welcome-card{
    background:linear-gradient(135deg,#1976d2,#42a5f5);
    color:#fff;
    border:0;
}

.welcome-card h2{
    font-size:23px;
    margin-bottom:7px;
}

.welcome-card p{
    font-size:13px;
    line-height:1.5;
    opacity:.95;
}

.status-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.status-left{
    display:flex;
    align-items:center;
    gap:10px;
}

.status-dot{
    width:11px;
    height:11px;
    border-radius:50%;
    background:#2eaf5d;
}

.status-text strong{
    display:block;
}

.status-text span{
    font-size:12px;
    color:#777;
}

.quick-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:11px;
}

.quick-btn{
    padding:16px 10px;
    border:1px solid #e0e6ed;
    border-radius:13px;
    background:#fff;
    text-align:center;
}

.quick-icon{
    font-size:25px;
    margin-bottom:6px;
}

.quick-btn strong{
    display:block;
    font-size:14px;
}

.quick-btn span{
    display:block;
    font-size:11px;
    color:#777;
    margin-top:3px;
}

/* =========================
   SEARCH
========================= */

.search-box{
    margin-bottom:14px;
}

.search-box input{
    width:100%;
    padding:12px 14px;
    border:1px solid #d9e0e7;
    border-radius:12px;
    outline:none;
}

/* =========================
   CHAT LIST
========================= */

.list-item{
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px 4px;
    border-bottom:1px solid #edf0f3;
    cursor:pointer;
}

.list-item:last-child{
    border-bottom:0;
}

.avatar{
    width:48px;
    height:48px;
    border-radius:50%;
    background:#1976d2;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
    flex-shrink:0;
}

.list-info{
    flex:1;
    min-width:0;
}

.list-info strong{
    display:block;
    margin-bottom:4px;
}

.list-info span{
    display:block;
    font-size:12px;
    color:#777;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.online-dot{
    width:9px;
    height:9px;
    border-radius:50%;
    background:#2eaf5d;
    flex-shrink:0;
}

/* =========================
   CHAT
========================= */

.chat-screen{
    position:fixed;
    inset:0;
    background:#eef3f8;
    z-index:50;
    max-width:480px;
    margin:auto;
}

.chat-header{
    height:62px;
    background:#1976d2;
    color:#fff;
    display:flex;
    align-items:center;
    gap:10px;
    padding:0 12px;
}

.back-btn{
    border:0;
    background:none;
    color:#fff;
    font-size:24px;
    width:35px;
}

.chat-user-info{
    flex:1;
}

.chat-user-info strong{
    display:block;
}

.chat-user-info span{
    font-size:11px;
    opacity:.85;
}

.chat-menu-btn{
    border:0;
    background:none;
    color:#fff;
    font-size:22px;
}

.messages{
    position:absolute;
    top:62px;
    bottom:68px;
    left:0;
    right:0;
    padding:14px;
    overflow-y:auto;
}

.message-row{
    display:flex;
    margin-bottom:9px;
}

.message-row.me{
    justify-content:flex-end;
}

.message{
    max-width:76%;
    padding:9px 12px;
    border-radius:15px;
    background:#fff;
    box-shadow:0 1px 3px rgba(0,0,0,.08);
}

.message-row.me .message{
    background:#1976d2;
    color:#fff;
}

.message-time{
    display:block;
    font-size:9px;
    opacity:.65;
    margin-top:4px;
    text-align:right;
}

.chat-input-area{
    position:absolute;
    bottom:0;
    left:0;
    right:0;
    height:68px;
    background:#fff;
    border-top:1px solid #dfe5eb;
    padding:9px;
    display:flex;
    gap:7px;
}

.chat-input-area input{
    flex:1;
    border:1px solid #d7dfe7;
    border-radius:22px;
    padding:0 14px;
    outline:none;
}

.send-btn{
    width:48px;
    border:0;
    border-radius:50%;
    background:#1976d2;
    color:#fff;
}

/* =========================
   ROOMS
========================= */

.rooms-grid{
    display:grid;
    gap:12px;
}

.room-card{
    border:1px solid #e1e7ed;
    border-radius:15px;
    padding:14px;
    display:flex;
    align-items:center;
    gap:12px;
    cursor:pointer;
    background:#fff;
    transition:.15s;
}

.room-card:active{
    transform:scale(.98);
}

.room-icon{
    width:50px;
    height:50px;
    border-radius:14px;
    background:#e8f2ff;
    color:#1976d2;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:25px;
    flex-shrink:0;
}

.room-info{
    flex:1;
}

.room-info strong{
    display:block;
    margin-bottom:5px;
}

.room-info span{
    color:#777;
    font-size:12px;
}

.room-arrow{
    color:#aaa;
    font-size:22px;
}

.room-chat-screen{
    position:fixed;
    inset:0;
    max-width:480px;
    margin:auto;
    background:#eef3f8;
    z-index:60;
}

.room-chat-header{
    height:64px;
    background:#1976d2;
    color:#fff;
    display:flex;
    align-items:center;
    gap:10px;
    padding:0 12px;
}

.room-header-info{
    flex:1;
}

.room-header-info strong{
    display:block;
}

.room-header-info span{
    font-size:11px;
    opacity:.9;
}

.room-members{
    padding:10px 14px;
    background:#fff;
    border-bottom:1px solid #dde4ea;
    font-size:12px;
    color:#666;
}

.room-messages{
    position:absolute;
    top:100px;
    bottom:68px;
    left:0;
    right:0;
    overflow-y:auto;
    padding:12px;
}

.room-message{
    display:flex;
    gap:8px;
    margin-bottom:12px;
}

.room-message-avatar{
    width:35px;
    height:35px;
    border-radius:50%;
    background:#1976d2;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:12px;
    font-weight:bold;
    flex-shrink:0;
}

.room-message-content{
    max-width:78%;
}

.room-message-name{
    font-size:11px;
    color:#1976d2;
    font-weight:bold;
    margin-bottom:3px;
}

.room-message-bubble{
    background:#fff;
    border-radius:12px;
    padding:8px 10px;
    box-shadow:0 1px 3px rgba(0,0,0,.06);
    font-size:13px;
}

.room-message-time{
    font-size:9px;
    color:#999;
    margin-top:3px;
}

.room-message.me{
    flex-direction:row-reverse;
}

.room-message.me .room-message-content{
    text-align:right;
}

.room-message.me .room-message-name{
    color:#1976d2;
}

.room-input-area{
    position:absolute;
    bottom:0;
    left:0;
    right:0;
    height:68px;
    background:#fff;
    border-top:1px solid #dfe5eb;
    padding:9px;
    display:flex;
    gap:7px;
}

.room-input-area input{
    flex:1;
    border:1px solid #d7dfe7;
    border-radius:22px;
    padding:0 14px;
    outline:none;
}

/* =========================
   FRIENDS
========================= */

.friend-actions{
    display:flex;
    gap:7px;
}

.small-btn{
    border:0;
    background:#e8f2ff;
    color:#1976d2;
    border-radius:9px;
    padding:7px 10px;
    font-size:11px;
}

/* =========================
   PROFILE
========================= */

.cover{
    height:170px;
    background:linear-gradient(135deg,#1976d2,#64b5f6);
    position:relative;
}

.cover-edit,
.avatar-edit{
    position:absolute;
    width:38px;
    height:38px;
    border-radius:50%;
    border:2px solid #fff;
    background:#1976d2;
    color:#fff;
}

.cover-edit{
    right:12px;
    top:12px;
}

.profile-main{
    padding:0 16px 16px;
}

.profile-avatar-wrap{
    position:relative;
    width:92px;
    margin-top:-46px;
    margin-bottom:10px;
}

.profile-avatar{
    width:92px;
    height:92px;
    border-radius:50%;
    border:4px solid #fff;
    background:#1976d2;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:30px;
    font-weight:bold;
}

.avatar-edit{
    right:-3px;
    bottom:0;
}

.profile-name{
    font-size:22px;
    font-weight:bold;
}

.username{
    color:#777;
    font-size:13px;
    margin-top:3px;
}

.profile-buttons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:9px;
    margin-top:15px;
}

.profile-btn{
    border:1px solid #dfe5eb;
    background:#fff;
    border-radius:10px;
    padding:11px;
}

.profile-section{
    margin-top:18px;
}

.profile-section h3{
    font-size:15px;
    margin-bottom:10px;
}

.info-row{
    padding:10px 0;
    border-bottom:1px solid #edf0f3;
    display:flex;
    justify-content:space-between;
    gap:10px;
}

.info-row:last-child{
    border-bottom:0;
}

.info-row span{
    color:#777;
    font-size:12px;
}

.public-badge{
    color:#2e7d32!important;
    font-weight:bold;
}

/* =========================
   SETTINGS
========================= */

.setting-row{
    padding:14px 0;
    border-bottom:1px solid #edf0f3;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
}

.setting-row:last-child{
    border-bottom:0;
}

.setting-info strong{
    display:block;
    font-size:14px;
}

.setting-info span{
    display:block;
    color:#777;
    font-size:11px;
    margin-top:4px;
}

.setting-row select{
    border:1px solid #d8e0e8;
    border-radius:8px;
    padding:7px;
}

/* =========================
   BOTTOM NAV
========================= */

.bottom-nav{
    position:fixed;
    bottom:0;
    left:50%;
    transform:translateX(-50%);
    width:100%;
    max-width:480px;
    height:70px;
    background:#fff;
    border-top:1px solid #dfe5eb;
    display:grid;
    grid-template-columns:repeat(5,1fr);
    z-index:30;
}

.nav-btn{
    border:0;
    background:#fff;
    color:#8a939d;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:4px;
    font-size:10px;
}

.nav-icon{
    font-size:20px;
}

.nav-btn.active{
    color:#1976d2;
    font-weight:bold;
}

/* =========================
   TOAST
========================= */

.toast{
    position:fixed;
    left:50%;
    bottom:82px;
    transform:translateX(-50%) translateY(20px);
    background:#222;
    color:#fff;
    padding:10px 15px;
    border-radius:20px;
    font-size:12px;
    opacity:0;
    pointer-events:none;
    transition:.25s;
    z-index:100;
    max-width:90%;
    text-align:center;
}

.toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

/* =========================
   MODAL
========================= */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.45);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:90;
}

.modal-box{
    width:100%;
    max-width:430px;
    background:#fff;
    border-radius:16px;
    padding:20px;
}

.modal-box h3{
    margin-bottom:14px;
}

.modal-actions{
    display:flex;
    gap:8px;
    margin-top:14px;
}

.modal-actions button{
    flex:1;
    padding:11px;
    border-radius:9px;
    border:0;
}

.cancel-btn{
    background:#edf1f5;
}

.confirm-btn{
    background:#1976d2;
    color:#fff;
}

.danger-btn{
    background:#d32f2f;
    color:#fff;
}

/* =========================
   EMPTY
========================= */

.empty{
    text-align:center;
    padding:30px 10px;
    color:#888;
}

.empty-icon{
    font-size:35px;
    margin-bottom:8px;
}

/* =========================
   DESKTOP
========================= */

@media(min-width:600px){
    body{
        padding:20px 0;
    }

    #app{
        min-height:calc(100vh - 40px);
        border-radius:18px;
        box-shadow:0 5px 30px rgba(0,0,0,.08);
    }

    .bottom-nav{
        bottom:20px;
    }

    .chat-screen,
    .room-chat-screen{
        top:20px;
        bottom:20px;
        border-radius:18px;
        overflow:hidden;
    }
}
</style>
</head>

<body>

<div id="app">

<!-- =========================
     AUTH
========================= -->

<div id="authPage" class="auth-page">

    <div class="logo">Y-M Chat</div>
    <div class="logo-sub">Connect • Chat • Meet</div>

    <div class="auth-box">

        <div id="loginForm">

            <h2>Welcome Back</h2>

            <div class="input-group">
                <label>Username</label>
                <input id="loginUsername" type="text" placeholder="Enter username">
            </div>

            <div class="input-group">
                <label>Password</label>
                <input id="loginPassword" type="password" placeholder="Enter password">
            </div>

            <button class="primary-btn" onclick="login()">Login</button>

            <div class="auth-links">
                <button onclick="showRegister()">Create Account</button>
                <button onclick="showForgot()">Forgot Password?</button>
            </div>

            <div class="demo-note">
                <strong>Demo accounts</strong><br>
                ahmad / 123456<br>
                siti / 123456<br>
                john / 123456
            </div>

        </div>

        <div id="registerForm" class="hidden">

            <h2>Create Account</h2>

            <div class="input-group">
                <label>Name</label>
                <input id="regName" type="text" placeholder="Your name">
            </div>

            <div class="input-group">
                <label>Username</label>
                <input id="regUsername" type="text" placeholder="Choose username">
            </div>

            <div class="input-group">
                <label>Password</label>
                <input id="regPassword" type="password" placeholder="Minimum 6 characters">
            </div>

            <div class="input-group">
                <label>Security Question</label>
                <select id="regQuestion">
                    <option value="">Choose question</option>
                    <option>What is your favourite colour?</option>
                    <option>What is your favourite food?</option>
                    <option>What is your favourite place?</option>
                    <option>What is your favourite animal?</option>
                </select>
            </div>

            <div class="input-group">
                <label>Security Answer</label>
                <input id="regAnswer" type="text" placeholder="Your answer">
            </div>

            <button class="primary-btn" onclick="registerUser()">Register</button>

            <div class="auth-links">
                <button onclick="showLogin()">Already have an account?</button>
            </div>

        </div>

        <div id="forgotForm" class="hidden">

            <h2>Reset Password</h2>

            <div class="input-group">
                <label>Username</label>
                <input id="forgotUsername" type="text" placeholder="Enter username">
            </div>

            <button class="primary-btn" onclick="verifySecurity()">Verify Account</button>

            <div class="auth-links">
                <button onclick="showLogin()">Back to Login</button>
            </div>

        </div>

        <div id="resetForm" class="hidden">

            <h2>Change Password</h2>

            <div id="securityQuestionText"
                 style="font-size:13px;color:#555;margin-bottom:12px;">
            </div>

            <div class="input-group">
                <label>Security Answer</label>
                <input id="forgotAnswer" type="text" placeholder="Enter your answer">
            </div>

            <div class="input-group">
                <label>New Password</label>
                <input id="newPassword" type="password" placeholder="Minimum 6 characters">
            </div>

            <button class="primary-btn" onclick="resetPassword()">Change Password</button>

            <div class="auth-links">
                <button onclick="showLogin()">Back to Login</button>
            </div>

        </div>

    </div>
</div>


<!-- =========================
     MAIN APP
========================= -->

<div id="mainApp" class="hidden">

    <div class="top-header">

        <h1 id="headerTitle">Home</h1>

        <div class="header-user">
            <div id="headerAvatar" class="header-avatar">N</div>
            <button class="header-btn" onclick="openSettings()">⚙</button>
        </div>

    </div>

    <div id="content" class="content"></div>

    <div class="bottom-nav">

        <button class="nav-btn active" id="navHome" onclick="showPage('home')">
            <span class="nav-icon">⌂</span>
            <span>Home</span>
        </button>

        <button class="nav-btn" id="navChats" onclick="showPage('chats')">
            <span class="nav-icon">💬</span>
            <span>Chats</span>
        </button>

        <button class="nav-btn" id="navFriends" onclick="showPage('friends')">
            <span class="nav-icon">👥</span>
            <span>Friends</span>
        </button>

        <button class="nav-btn" id="navRooms" onclick="showPage('rooms')">
            <span class="nav-icon">🌍</span>
            <span>Rooms</span>
        </button>

        <button class="nav-btn" id="navProfile" onclick="showPage('profile')">
            <span class="nav-icon">👤</span>
            <span>Profile</span>
        </button>

    </div>

</div>


<!-- =========================
     PRIVATE CHAT
========================= -->

function initialize(){

function saveUsers(users){

/* =========================

========================= */

function login(){

    const username =
        document.getElementById("loginUsername")
        .value
        .trim()
        .toLowerCase();

    const password =
        document.getElementById("loginPassword")
        .value;

    if(!username || !password){

        showToast("Please enter username and password.");

        return;
    }

    const users = getUsers();

    const user = users.find(
        u =>
        u.username.toLowerCase() === username &&
        u.password === password
    );

    if(!user){

        showToast("Invalid username or password.");

        return;
    }

    currentUser = user;

    localStorage.setItem(
        CURRENT_KEY,
        JSON.stringify(user)
    );

    showMainApp();

    showToast("Welcome to Y-M Chat!");

}


/* =========================
   REGISTER
========================= */

function registerUser(){

    const name =
        document.getElementById("regName")
        .value
        .trim();

    const username =
        document.getElementById("regUsername")
        .value
        .trim()
        .toLowerCase();

    const password =
        document.getElementById("regPassword")
        .value;

    const question =
        document.getElementById("regQuestion")
        .value;

    const answer =
        document.getElementById("regAnswer")
        .value
        .trim()
        .toLowerCase();

    if(!name || !username || !password || !question || !answer){

        showToast("Please complete all fields.");

        return;
    }

    if(password.length < 6){

        showToast("Password must be at least 6 characters.");

        return;
    }

    const users = getUsers();

    if(users.some(u => u.username.toLowerCase() === username)){

        showToast("Username already exists.");

        return;
    }

    const newUser = {
        name,
        username,
        password,
        question,
        answer,
        status:"Online"
    };

    users.push(newUser);

    saveUsers(users);

    currentUser = newUser;

    localStorage.setItem(
        CURRENT_KEY,
        JSON.stringify(newUser)
    );

    showMainApp();

    showToast("Account created successfully!");

}


/* =========================
   FORGOT PASSWORD
========================= */

function verifySecurity(){

    const username =
        document.getElementById("forgotUsername")
        .value
        .trim()
        .toLowerCase();

    if(!username){

        showToast("Enter your username.");

        return;
    }

    const users = getUsers();

    const user = users.find(
        u => u.username.toLowerCase() === username
    );

    if(!user){

        showToast("Username not found.");

        return;
    }

    window.resetUsername = username;

    document.getElementById("securityQuestionText").innerHTML =
        "<strong>Security Question:</strong><br>" +
        user.question;

    hideAllAuth();

    document.getElementById("resetForm")
        .classList.remove("hidden");

}

function resetPassword(){

    const answer =
        document.getElementById("forgotAnswer")
        .value
        .trim()
        .toLowerCase();

    const newPassword =
        document.getElementById("newPassword")
        .value;

    if(!answer || !newPassword){

        showToast("Please complete all fields.");

        return;
    }

    if(newPassword.length < 6){

        showToast("Password must be at least 6 characters.");

        return;
    }

    const users = getUsers();

    const index = users.findIndex(
        u =>
        u.username.toLowerCase() ===
        window.resetUsername
    );

    if(index === -1){

        showToast("Account not found.");

        return;
    }

    if(users[index].answer.toLowerCase() !== answer){

        showToast("Incorrect security answer.");

        return;
    }

    users[index].password = newPassword;

    saveUsers(users);

    showToast("Password changed successfully.");

    document.getElementById("forgotAnswer").value = "";
    document.getElementById("newPassword").value = "";

    showLogin();

}

/* =========================
   PRIVATE CHAT
========================= */

function openChat(username){

    const users = getUsers();

    const user =
        users.find(u => u.username === username);

    if(!user) return;

    activeChatUser = user;

    document.getElementById("chatName")
        .textContent = user.name;

    document.getElementById("chatStatus")
        .textContent = user.status || "Online";

    document.getElementById("chatAvatar")
        .textContent =
        user.name.charAt(0).toUpperCase();

    document.getElementById("chatScreen")
        .classList.remove("hidden");

    renderMessages();

}

function closeChat(){

    document.getElementById("chatScreen")
        .classList.add("hidden");

    activeChatUser = null;

}

function getChatKey(){

    if(!activeChatUser || !currentUser)
        return null;

    return [
        currentUser.username,
        activeChatUser.username
    ].sort().join("_");

}

function getChats(){

    return JSON.parse(
        localStorage.getItem(CHATS_KEY) || "{}"
    );

}

function saveChats(chats){

    localStorage.setItem(
        CHATS_KEY,
        JSON.stringify(chats)
    );

}

function renderMessages(){

    const box =
        document.getElementById("messages");

    const chats = getChats();

    const key = getChatKey();

    const messages = chats[key] || [];

    if(!messages.length){

        box.innerHTML = `
            <div class="empty">
                <div class="empty-icon">👋</div>
                Start a conversation.
            </div>
        `;

        return;
    }

    box.innerHTML = messages.map((m,index) => `

        <div class="message-row ${m.from === currentUser.username ? 'me' : ''}">

            <div class="message">

                ${escapeHTML(m.text)}

                <span class="message-time">
                    ${escapeHTML(m.time)}
                    ${m.from === currentUser.username
                        ? ` · <button
                            onclick="deleteMessage(${index})"
                            style="border:0;background:none;color:inherit;font-size:9px;">
                            Delete
                          </button>`
                        : ""}
                </span>

            </div>

        </div>

    `).join("");

    box.scrollTop = box.scrollHeight;

}

function sendMessage(){

    const input =
        document.getElementById("chatInput");

    const text =
        input.value.trim();

    if(!text || !activeChatUser)
        return;

    const chats = getChats();

    const key = getChatKey();

    if(!chats[key])
        chats[key] = [];

    const now =
        new Date()
        .toLocaleTimeString([],{
            hour:"2-digit",
            minute:"2-digit"
        });

    chats[key].push({
        from:currentUser.username,
        text,
        time:now
    });

    saveChats(chats);

    input.value = "";

    renderMessages();

}

function deleteMessage(index){

    const chats = getChats();

    const key = getChatKey();

    if(!chats[key]) return;

    chats[key].splice(index,1);

    saveChats(chats);

    renderMessages();

    showToast("Message deleted.");

}

        "Delete Chat",
        deleteWholeChat
    );

}

function deleteWholeChat(){

    const chats = getChats();

    const key = getChatKey();

    if(key && chats[key]){

        delete chats[key];

        saveChats(chats);

    }

    closeModal();
    closeChat();

    showToast("Chat deleted.");

    showPage("chats");

}

            room =>
            room.name.toLowerCase().includes(value) ||
            room.description.toLowerCase().includes(value)
        );

    renderRoomList(filtered);

}


/* =========================
   OPEN ROOM
========================= */

function openRoom(roomId){

    const room =
        rooms.find(r => r.id === roomId);

    if(!room) return;

    activeRoom = room;

    document.getElementById("roomChatTitle")
        .textContent = room.icon + " " + room.name;

    document.getElementById("roomChatSubtitle")
        .textContent = "Public Chat Room";

    document.getElementById("roomMembers")
        .textContent =
        "🟢 " +
        room.members +
        " members online";

    document.getElementById("roomChatScreen")
        .classList.remove("hidden");

    renderRoomMessages();

}

function closeRoom(){

    document.getElementById("roomChatScreen")
        .classList.add("hidden");

    activeRoom = null;

}

function renderRoomMessages(){

    const box =
        document.getElementById("roomMessages");

    if(!activeRoom)
        return;

    if(!roomMessages[activeRoom.id]){
        roomMessages[activeRoom.id] = [];
    }

    const messages =
        roomMessages[activeRoom.id];

    box.innerHTML = messages.map(m => {

        const isMe =
            m.name === currentUser.name;

        return `

            <div class="room-message ${isMe ? 'me' : ''}">

                <div class="room-message-avatar">
                    ${escapeHTML(m.name.charAt(0).toUpperCase())}
                </div>

                <div class="room-message-content">

                    <div class="room-message-name">
                        ${escapeHTML(m.name)}
                    </div>

                    <div class="room-message-bubble">
                        ${escapeHTML(m.text)}
                    </div>

                    <div class="room-message-time">
                        ${escapeHTML(m.time)}
                    </div>

                </div>

            </div>

        `;

    }).join("");

    box.scrollTop = box.scrollHeight;

}

function sendRoomMessage(){

    const input =
        document.getElementById("roomInput");

    const text =
        input.value.trim();

    if(!text || !activeRoom)
        return;

    if(!roomMessages[activeRoom.id]){
        roomMessages[activeRoom.id] = [];
    }

    const now =
        new Date()
        .toLocaleTimeString([],{
            hour:"2-digit",
            minute:"2-digit"
        });

    roomMessages[activeRoom.id].push({
        name:currentUser.name,
        text:text,
        time:now
    });

    input.value = "";

    renderRoomMessages();

}

function changeName(){

    openModal(
        "Change Name",
        `
        <div class="input-group">
            <label>New Name</label>

                   type="text"
                   value="${escapeHTML(currentUser.name)}">
        </div>
        `,
        "Save",
        saveNewName
    );

}

function saveNewName(){

    const name =
        document.getElementById("modalName")
        .value
        .trim();

    if(!name){

        showToast("Name cannot be empty.");

        return;
    }

    const users = getUsers();

    const index =
        users.findIndex(
            u => u.username === currentUser.username
        );

    if(index !== -1){

        users[index].name = name;

        currentUser = users[index];

        saveUsers(users);

        localStorage.setItem(
            CURRENT_KEY,
            JSON.stringify(currentUser)
        );

    }

    closeModal();

    updateHeaderUser();

    renderProfile();

    showToast("Name updated.");

}

function changePasswordFromProfile(){

    openModal(
        "Change Password",
        `
        <div class="input-group">
            <label>Current Password</label>
            <input id="oldPassword"
                   type="password">
        </div>

        <div class="input-group">

            <input id="profileNewPassword"
                   type="password">
        </div>
        `,
        "Save",

}

function saveNewPassword(){

    const oldPassword =
        document.getElementById("oldPassword")
        .value;

    const newPassword =
        document.getElementById("profileNewPassword")
        .value;

    if(oldPassword !== currentUser.password){

        showToast("Current password is incorrect.");

        return;
    }

    if(newPassword.length < 6){

        showToast("Password must be at least 6 characters.");

        return;
    }

    const users = getUsers();

    const index =
        users.findIndex(
            u => u.username === currentUser.username
        );

    if(index !== -1){

        users[index].password = newPassword;

        currentUser = users[index];

        saveUsers(users);

        localStorage.setItem(
            CURRENT_KEY,
            JSON.stringify(currentUser)
        );

    }

    closeModal();

    showToast("Password updated.");

}

/* =========================
   MODAL
========================= */

let modalAction = null;

function openModal(
    title,
    body,
    confirmText,
    action
){

    document.getElementById("modalTitle")
        .textContent = title;

    document.getElementById("modalBody")
        .innerHTML = body;

    document.getElementById("modalConfirm")
        .textContent = confirmText;

    modalAction = action;

    document.getElementById("modal")
        .classList.remove("hidden");

}

function confirmModal(){

    if(typeof modalAction === "function"){

        modalAction();

    }

}

function closeModal(){

    document.getElementById("modal")
        .classList.add("hidden");

    modalAction = null;

}


/* =========================
   TOAST
========================= */

let toastTimer = null;

function showToast(message){

    const toast =
        document.getElementById("toast");

    toast.textContent = message;

    toast.classList.add("show");

    clearTimeout(toastTimer);

    toastTimer = setTimeout(() => {

        toast.classList.remove("show");

    },2500);

}


/* =========================
   SAFE HTML
========================= */

function escapeHTML(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}

function escapeJS(value){

    return String(value)
        .replace(/\\/g,"\\\\")
        .replace(/'/g,"\\'")
        .replace(/"/g,"&quot;");

}
