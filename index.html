<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Y-M Chat V2.0</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#eef3f8;color:#222}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

.app{
 max-width:480px;min-height:100vh;margin:auto;background:#fff;
 position:relative;overflow:hidden
}

/* AUTH */
.auth{
 min-height:100vh;padding:25px;display:flex;align-items:center;
 justify-content:center;background:linear-gradient(135deg,#1976d2,#42a5f5)
}
.authbox{
 width:100%;background:#fff;border-radius:22px;padding:28px 22px;
 box-shadow:0 10px 35px #0003
}
.logo{text-align:center;font-size:42px;font-weight:bold;color:#1976d2}
.subtitle{text-align:center;color:#777;margin:5px 0 25px}
.authbox h2{text-align:center;margin-bottom:18px}
.input{
 width:100%;padding:13px;border:1px solid #ddd;border-radius:11px;
 margin-bottom:11px;outline:0
}
.input:focus{border-color:#1976d2}
.primary{
 width:100%;padding:13px;border:0;border-radius:11px;
 background:#1976d2;color:#fff;font-weight:bold
}
.switch{text-align:center;color:#777;margin-top:17px}
.switch span{color:#1976d2;font-weight:bold;cursor:pointer}

/* HEADER */
.header{
 height:62px;background:#1976d2;color:#fff;display:flex;
 align-items:center;justify-content:space-between;padding:0 15px;
 position:sticky;top:0;z-index:20
}
.title{font-size:20px;font-weight:bold}
.headerbuttons{display:flex;gap:8px}
.icon{
 width:38px;height:38px;border:0;border-radius:50%;
 background:#ffffff22;color:#fff
}
.content{min-height:calc(100vh - 62px);padding-bottom:75px;background:#f5f7fa}

/* NAV */
.bottom{
 position:fixed;bottom:0;left:50%;transform:translateX(-50%);
 width:100%;max-width:480px;height:68px;background:#fff;
 border-top:1px solid #ddd;display:grid;grid-template-columns:repeat(5,1fr);
 z-index:30
}
.nav{border:0;background:#fff;color:#777;font-size:10px}
.nav div{font-size:20px}
.nav.active{color:#1976d2;font-weight:bold}

/* GENERAL */
.section{padding:15px;font-size:18px;font-weight:bold}
.card{
 background:#fff;margin:8px 10px;padding:13px;border-radius:14px
}
.row{display:flex;align-items:center;gap:11px}
.flex{flex:1}
.avatar{
 width:48px;height:48px;border-radius:50%;background:#1976d2;color:#fff;
 display:flex;align-items:center;justify-content:center;font-weight:bold;
 overflow:hidden;flex-shrink:0
}
.avatar img{width:100%;height:100%;object-fit:cover}
.small{font-size:13px;color:#888}
.blue{color:#1976d2}
.btn{
 border:0;border-radius:9px;padding:9px 12px;background:#1976d2;color:#fff
}
.lightbtn{
 border:0;border-radius:9px;padding:9px 12px;background:#eaf2fb;color:#1976d2
}
.empty{text-align:center;padding:40px 20px;color:#888}

/* HOME */
.homeuser{background:#fff;padding:14px;display:flex;gap:10px;align-items:center}
.postbox{background:#fff;margin:9px;padding:12px;border-radius:14px}
.postbox textarea{
 width:100%;height:75px;border:1px solid #ddd;border-radius:10px;
 padding:10px;resize:none
}
.posttools{display:flex;gap:7px;margin-top:8px}
.posttools .flex{display:flex;justify-content:flex-end}
.post{background:#fff;margin:9px;padding:13px;border-radius:14px}
.posthead{display:flex;gap:10px;align-items:center}
.posttext{margin-top:11px;line-height:1.5;white-space:pre-wrap}

/* CHAT */
.chatScreen,.roomScreen{
 position:fixed;inset:0;max-width:480px;margin:auto;
 background:#eef3f8;z-index:60;display:flex;flex-direction:column
}
.chathead{
 height:62px;background:#1976d2;color:#fff;display:flex;
 align-items:center;gap:9px;padding:0 10px
}
.back{border:0;background:transparent;color:#fff;font-size:29px}
.chatbody{flex:1;overflow-y:auto;padding:14px}
.msg{
 max-width:78%;padding:10px 12px;border-radius:15px;
 margin-bottom:8px;line-height:1.4
}
.msg.me{margin-left:auto;background:#1976d2;color:#fff;border-bottom-right-radius:4px}
.msg.other{background:#fff;border-bottom-left-radius:4px}
.msg small{display:block;font-size:9px;opacity:.65;margin-top:4px}
.chatinput{background:#fff;padding:9px;display:flex;gap:7px}
.chatinput input{
 flex:1;border:1px solid #ddd;border-radius:22px;padding:11px 14px
}
.send{width:44px;border:0;border-radius:50%;background:#1976d2;color:#fff}

/* ROOMS */
.banner{
 margin:10px;padding:16px;border-radius:14px;background:#1976d2;color:#fff
}
.country{
 background:#fff;margin:7px 10px;border-radius:13px;padding:13px;
 display:flex;align-items:center;gap:10px
}
.countryicon{
 width:45px;height:45px;border-radius:11px;background:#eaf2fb;
 display:flex;align-items:center;justify-content:center;font-size:22px
}
.country .flex{min-width:0}
.state{
 background:#f8fafc;margin:5px 0 5px 15px;padding:11px;border-radius:10px;
 display:flex;align-items:center;gap:8px
}
.roommembers{font-size:12px;color:#888}

/* PROFILE */
.cover{
 height:170px;background:linear-gradient(135deg,#1976d2,#90caf9);
 position:relative;background-size:cover;background-position:center
}
.coverbtn{
 position:absolute;right:10px;top:10px;border:0;border-radius:9px;
 padding:8px;background:#0007;color:#fff
}
.profile{background:#fff;padding:0 15px 18px;position:relative}
.pavatar{
 width:88px;height:88px;margin-top:-44px;border:4px solid #fff;
 border-radius:50%;background:#1976d2;color:#fff;overflow:hidden;
 display:flex;align-items:center;justify-content:center;font-size:25px;font-weight:bold
}
.pavatar img{width:100%;height:100%;object-fit:cover}
.editavatar{
 position:absolute;left:80px;top:8px;width:30px;height:30px;
 border:0;border-radius:50%;background:#1976d2;color:#fff
}
.pname{font-size:21px;font-weight:bold;margin-top:8px}
.profilebuttons{
 display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:14px
}
.info{background:#fff;margin-top:9px;padding:14px}
.inforow{padding:11px 0;border-bottom:1px solid #eee}
.inforow:last-child{border:0}

/* MARKET */
.market{
 background:#fff;margin:9px;padding:12px;border-radius:14px
}
.marketpic{
 height:150px;border-radius:10px;background:#ddd;
 display:flex;align-items:center;justify-content:center;color:#777;margin-bottom:10px
}
.price{font-size:19px;font-weight:bold;color:#1976d2}

/* NOTIFICATION */
.notice{
 background:#fff;margin:7px 10px;padding:12px;border-radius:13px;
 display:flex;gap:10px
}
.noticeicon{
 width:40px;height:40px;border-radius:50%;background:#eaf2fb;
 display:flex;align-items:center;justify-content:center
}

/* MODAL */
.modal{
 position:fixed;inset:0;background:#0007;z-index:100;
 display:flex;align-items:center;justify-content:center;padding:20px
}
.modalbox{
 width:100%;max-width:400px;background:#fff;border-radius:17px;padding:20px
}
.modalactions{display:flex;gap:8px;margin-top:10px}
.modalactions button{flex:1;padding:11px;border:0;border-radius:10px}
.cancel{background:#eee}
.save{background:#1976d2;color:#fff}
</style>
</head>

<body>

<div class="app">

<!-- AUTH -->
<div id="auth" class="auth">
 <div class="authbox">
  <div class="logo">Y-M</div>
  <div class="subtitle">Chat • Friends • Rooms • Market</div>

  <div id="loginBox">
   <h2>Log In</h2>
   <input id="loginUser" class="input" placeholder="Username">
   <input id="loginPass" class="input" type="password" placeholder="Password">
   <button class="primary" onclick="login()">Log In</button>
   <div class="switch">Belum ada akaun?
    <span onclick="showRegister()">Register</span>
   </div>
  </div>

  <div id="registerBox" class="hidden">
   <h2>Register</h2>
   <input id="regName" class="input" placeholder="Nama">
   <input id="regUser" class="input" placeholder="Username">
   <input id="regPass" class="input" type="password" placeholder="Password">
   <button class="primary" onclick="register()">Create Account</button>
   <div class="switch">Sudah ada akaun?
    <span onclick="showLogin()">Log In</span>
   </div>
  </div>
 </div>
</div>

<!-- APP -->
<div id="main" class="hidden">

 <div class="header">
  <div id="headerTitle" class="title">Y-M Chat</div>
  <div class="headerbuttons">
   <button class="icon" onclick="page('notifications')">🔔</button>
  </div>
 </div>

 <div id="content" class="content"></div>

 <div class="bottom">
  <button id="nHome" class="nav active" onclick="page('home')"><div>🏠</div>Home</button>
  <button id="nChats" class="nav" onclick="page('chats')"><div>💬</div>Chats</button>
  <button id="nFriends" class="nav" onclick="page('friends')"><div>👥</div>Friends</button>
  <button id="nRooms" class="nav" onclick="page('rooms')"><div>🌎</div>Rooms</button>
  <button id="nProfile" class="nav" onclick="page('profile')"><div>👤</div>Profile</button>
 </div>
</div>

<!-- PRIVATE CHAT -->
<div id="chatScreen" class="chatScreen hidden">
 <div class="chathead">
  <button class="back" onclick="closeChat()">‹</button>
  <div id="chatAvatar" class="avatar">A</div>
  <div class="flex">
   <b id="chatName">Chat</b>
   <small>🟢 Online</small>
  </div>
  <button class="icon" onclick="deleteChat()">🗑</button>
 </div>
 <div id="chatBody" class="chatbody"></div>
 <div class="chatinput">
  <input id="chatInput" placeholder="Tulis mesej..."
   onkeydown="if(event.key==='Enter')sendChat()">
  <button class="send" onclick="sendChat()">➤</button>
 </div>
</div>

<!-- ROOM -->
<div id="roomScreen" class="roomScreen hidden">
 <div class="chathead">
  <button class="back" onclick="closeRoom()">‹</button>
  <div class="countryicon">🌎</div>
  <div class="flex">
   <b id="roomTitle">Room</b>
   <small>Public Room</small>
  </div>
 </div>
 <div id="roomBody" class="chatbody"></div>
 <div class="chatinput">
  <input id="roomInput" placeholder="Tulis dalam room..."
   onkeydown="if(event.key==='Enter')sendRoom()">
  <button class="send" onclick="sendRoom()">➤</button>
 </div>
</div>

<!-- MODAL -->
<div id="modal" class="modal hidden">
 <div class="modalbox">
  <h3 id="modalTitle">Edit</h3>
  <div id="modalBody"></div>
  <div class="modalactions">
   <button class="cancel" onclick="closeModal()">Cancel</button>
   <button id="modalSave" class="save">Save</button>
  </div>
 </div>
</div>

</div>

<script>

/* =========================================================
   DATA
========================================================= */

const demoUsers=[
 {name:"Ahmad",username:"ahmad",password:"1234",avatar:"",cover:""},
 {name:"Siti",username:"siti",password:"1234",avatar:"",cover:""},
 {name:"John",username:"john",password:"1234",avatar:"",cover:""}
];

let users=JSON.parse(localStorage.getItem("ym_users"))||demoUsers;
let current=JSON.parse(localStorage.getItem("ym_current"))||null;
let posts=JSON.parse(localStorage.getItem("ym_posts"))||[];
let notices=JSON.parse(localStorage.getItem("ym_notices"))||[
 {title:"Selamat datang",text:"Selamat datang ke Y-M Chat.",time:"Hari ini"},
 {title:"Rooms",text:"Country dan state rooms tersedia.",time:"Hari ini"}
];

let activeChat=null;
let activeRoom=null;

/* =========================================================
   COUNTRY / STATE DATA
========================================================= */

const countries=[
 {
  name:"Malaysia",
  states:[
   "Johor","Kedah","Kelantan","Melaka","Negeri Sembilan",
   "Pahang","Perak","Perlis","Pulau Pinang","Sabah",
   "Sarawak","Selangor","Terengganu","Kuala Lumpur",
   "Putrajaya","Labuan"
  ]
 },
 {
  name:"Indonesia",
  states:[
   "Aceh","Bali","Banten","Bengkulu","Jakarta",
   "Jambi","Jawa Barat","Jawa Tengah","Jawa Timur",
   "Kalimantan Barat","Kalimantan Selatan","Kalimantan Tengah",
   "Kalimantan Timur","Kalimantan Utara","Kepulauan Riau",
   "Lampung","Maluku","Maluku Utara","Nusa Tenggara Barat",
   "Nusa Tenggara Timur","Papua","Papua Barat","Riau",
   "Sulawesi Selatan","Sulawesi Tengah","Sulawesi Tenggara",
   "Sulawesi Utara","Sumatera Barat","Sumatera Selatan",
   "Sumatera Utara","Yogyakarta"
  ]
 },
 {
  name:"Philippines",
  states:[
   "Ilocos Region","Cagayan Valley","Central Luzon",
   "CALABARZON","MIMAROPA","Bicol Region",
   "Western Visayas","Central Visayas","Eastern Visayas",
   "Zamboanga Peninsula","Northern Mindanao",
   "Davao Region","SOCCSKSARGEN","Caraga",
   "BARMM","Metro Manila"
  ]
 },
 {
  name:"Brunei",
  states:[
   "Brunei-Muara","Belait","Tutong","Temburong"
  ]
 },
 {
  name:"Singapore",
  states:[
   "Central Region","East Region","North Region",
   "North-East Region","West Region"
  ]
 },
 {
  name:"Thailand",
  states:[
   "Bangkok","Chiang Mai","Chon Buri","Phuket",
   "Krabi","Khon Kaen","Songkhla","Surat Thani"
  ]
 },
 {
  name:"United States",
  states:[
   "California","Texas","New York","Florida","Washington",
   "Nevada","Hawaii","Alaska","Illinois","New Jersey"
  ]
 },
 {
  name:"United Kingdom",
  states:[
   "England","Scotland","Wales","Northern Ireland"
  ]
 },
 {
  name:"Australia",
  states:[
   "New South Wales","Queensland","South Australia",
   "Tasmania","Victoria","Western Australia",
   "Northern Territory","Australian Capital Territory"
  ]
 },
 {
  name:"Japan",
  states:[
   "Tokyo","Osaka","Kyoto","Hokkaido","Aichi",
   "Fukuoka","Okinawa","Hiroshima"
  ]
 }
];

/* =========================================================
   START
========================================================= */

window.onload=()=>{
 if(current)openApp();
 else showLogin();
};

function showLogin(){
 document.getElementById("loginBox").classList.remove("hidden");
 document.getElementById("registerBox").classList.add("hidden");
}

function showRegister(){
 document.getElementById("loginBox").classList.add("hidden");
 document.getElementById("registerBox").classList.remove("hidden");
}

function register(){

 const name=document.getElementById("regName").value.trim();
 const username=document.getElementById("regUser").value.trim().toLowerCase();
 const password=document.getElementById("regPass").value;

 if(!name||!username||!password){
  alert("Sila isi semua maklumat.");
  return;
 }

 if(username.length<3){
  alert("Username minimum 3 aksara.");
  return;
 }

 if(users.some(u=>u.username===username)){
  alert("Username sudah digunakan.");
  return;
 }

 const u={
  name,username,password,avatar:"",cover:""
 };

 users.push(u);
 saveUsers();

 alert("Register berjaya. Sila Log In.");

 document.getElementById("regName").value="";
 document.getElementById("regUser").value="";
 document.getElementById("regPass").value="";

 showLogin();
}

function login(){

 const username=document.getElementById("loginUser").value.trim().toLowerCase();
 const password=document.getElementById("loginPass").value;

 const u=users.find(x=>x.username===username&&x.password===password);

 if(!u){
  alert("Username atau password salah.");
  return;
 }

 current=u;
 localStorage.setItem("ym_current",JSON.stringify(current));

 openApp();
}

function logout(){

 localStorage.removeItem("ym_current");
 current=null;

 document.getElementById("main").classList.add("hidden");
 document.getElementById("auth").classList.remove("hidden");

 showLogin();
}

/* =========================================================
   APP
========================================================= */

function openApp(){

 document.getElementById("auth").classList.add("hidden");
 document.getElementById("main").classList.remove("hidden");

 page("home");
}

function activeNav(name){

 document.querySelectorAll(".nav")
 .forEach(x=>x.classList.remove("active"));

 const map={
  home:"nHome",
  chats:"nChats",
  friends:"nFriends",
  rooms:"nRooms",
  profile:"nProfile"
 };

 if(map[name])document.getElementById(map[name]).classList.add("active");
}

function page(name){

 closeChat();
 closeRoom();

 activeNav(name);

 const title={
  home:"Y-M Chat",
  chats:"Chats",
  friends:"Friends",
  rooms:"Rooms",
  profile:"Profile",
  market:"Market",
  notifications:"Notifications"
 };

 document.getElementById("headerTitle").innerText=title[name]||"Y-M Chat";

 if(name==="home")renderHome();
 if(name==="chats")renderChats();
 if(name==="friends")renderFriends();
 if(name==="rooms")renderRooms();
 if(name==="profile")renderProfile();
 if(name==="market")renderMarket();
 if(name==="notifications")renderNotifications();
}

/* =========================================================
   HOME
========================================================= */

function renderHome(){

 let avatar=current.avatar
 ?`<img src="${safe(current.avatar)}">`
 :initial(current.name);

 let html=`

 <div class="homeuser">
  <div class="avatar">${avatar}</div>
  <div>
   <b>${safe(current.name)}</b>
   <div class="small">@${safe(current.username)}</div>
  </div>
 </div>

 <div class="postbox">
  <textarea id="postText" placeholder="Apa yang anda fikirkan?"></textarea>

  <div class="posttools">
   <button class="lightbtn" onclick="photoInfo()">📷 Photo</button>
   <button class="lightbtn" onclick="videoInfo()">🎥 Video</button>
   <div class="flex">
    <button class="btn" onclick="createPost()">Post</button>
   </div>
  </div>
 </div>
 `;

 if(!posts.length){
  html+=`<div class="empty">Belum ada post.</div>`;
 }else{

  posts.slice().reverse().forEach(p=>{
   html+=`

   <div class="post">

    <div class="posthead">
     <div class="avatar">
      ${p.avatar?`<img src="${safe(p.avatar)}">`:initial(p.name)}
     </div>

     <div>
      <b>${safe(p.name)}</b>
      <div class="small">${safe(p.time)}</div>
     </div>
    </div>

    <div class="posttext">${safe(p.text)}</div>

   </div>

   `;
  });
 }

 html+=`
 <div class="section">🛒 Market</div>
 <div class="card" onclick="page('market')">
  <b>Y-M Market</b>
  <div class="small">Jual • Beli • Swap</div>
 </div>
 `;

 document.getElementById("content").innerHTML=html;
}

function createPost(){

 const input=document.getElementById("postText");
 const text=input.value.trim();

 if(!text){
  alert("Tulis sesuatu dahulu.");
  return;
 }

 posts.push({
  name:current.name,
  avatar:current.avatar,
  text,
  time:new Date().toLocaleString("ms-MY")
 });

 localStorage.setItem("ym_posts",JSON.stringify(posts));

 renderHome();
}

function photoInfo(){
 alert("Upload gambar akan disambungkan ke server/storage sebenar nanti.");
}

function videoInfo(){
 alert("Upload video akan disambungkan ke server/storage sebenar nanti.");
}

/* =========================================================
   CHATS
========================================================= */

function renderChats(){

 let html=`<div class="section">Recent Chats</div>`;

 const list=users.filter(u=>u.username!==current.username);

 if(!list.length)html+=`<div class="empty">Belum ada pengguna lain.</div>`;

 list.forEach(u=>{

  const data=getChat(u.username);
  const last=data.length?data[data.length-1].text:"Belum ada mesej";

  html+=`

  <div class="card row">

   <div class="avatar">
    ${u.avatar?`<img src="${safe(u.avatar)}">`:initial(u.name)}
   </div>

   <div class="flex">
    <b>${safe(u.name)}</b>
    <div class="small">${safe(last)}</div>
   </div>

   <button class="btn" onclick="openChat('${safeAttr(u.username)}')">
    Chat
   </button>

  </div>

  `;
 });

 document.getElementById("content").innerHTML=html;
}

function chatKey(username){
 return "ym_chat_"+current.username+"_"+username;
}

function getChat(username){
 return JSON.parse(localStorage.getItem(chatKey(username)))||[];
}

function saveChat(username,data){
 localStorage.setItem(chatKey(username),JSON.stringify(data));
}

function openChat(username){

 activeChat=users.find(u=>u.username===username);

 if(!activeChat)return;

 document.getElementById("chatName").innerText=activeChat.name;

 document.getElementById("chatAvatar").innerHTML=
 activeChat.avatar
 ?`<img src="${safe(activeChat.avatar)}">`
 :initial(activeChat.name);

 document.getElementById("chatScreen").classList.remove("hidden");

 renderChat();
}

function closeChat(){
 document.getElementById("chatScreen").classList.add("hidden");
}

function renderChat(){

 const box=document.getElementById("chatBody");
 const data=getChat(activeChat.username);

 if(!data.length){
  box.innerHTML=`<div class="empty">Belum ada mesej.</div>`;
  return;
 }

 box.innerHTML=data.map(m=>`

  <div class="msg ${m.sender==="me"?"me":"other"}">
   ${safe(m.text)}
   <small>${m.sender==="me"?"You":safe(activeChat.name)}</small>
  </div>

 `).join("");

 box.scrollTop=box.scrollHeight;
}

function sendChat(){

 const input=document.getElementById("chatInput");
 const text=input.value.trim();

 if(!text)return;

 const data=getChat(activeChat.username);

 data.push({
  sender:"me",
  text
 });

 saveChat(activeChat.username,data);

 input.value="";
 renderChat();
}

function deleteChat(){

 if(!confirm("Padam semua mesej chat ini?"))return;

 saveChat(activeChat.username,[]);
 renderChat();
}

/* =========================================================
   FRIENDS
========================================================= */

function renderFriends(){

 let html=`<div class="section">Friends</div>`;

 users.filter(u=>u.username!==current.username).forEach(u=>{

  html+=`

  <div class="card row">

   <div class="avatar">
    ${u.avatar?`<img src="${safe(u.avatar)}">`:initial(u.name)}
   </div>

   <div class="flex">
    <b>${safe(u.name)}</b>
    <div class="small">@${safe(u.username)}</div>
   </div>

   <button class="btn" onclick="openChat('${safeAttr(u.username)}')">
    Message
   </button>

  </div>

  `;
 });

 document.getElementById("content").innerHTML=html;
}

/* =========================================================
   ROOMS
========================================================= */

function renderRooms(){

 let html=`

 <div class="banner">
  <b>🌎 Y-M Public Rooms</b>
  <div style="font-size:13px;margin-top:5px">
   Country → State / Region → Room
  </div>
 </div>

 `;

 countries.forEach((country,index)=>{

  html+=`

  <div class="country">

   <div class="countryicon">🌎</div>

   <div class="flex">
    <b>${safe(country.name)}</b>
    <div class="small">${country.states.length} State/Region</div>
   </div>

   <button class="lightbtn"
    onclick="toggleCountry(${index})">
    Open
   </button>

  </div>

  <div id="country${index}" class="hidden">

  `;

  country.states.forEach(state=>{

   html+=`

   <div class="state">

    <span>📍</span>

    <div class="flex">
     <b>${safe(state)}</b>
     <div class="roommembers">Public Room</div>
    </div>

    <button class="btn"
     onclick="openRoom('${safeAttr(country.name)}','${safeAttr(state)}')">
     Join
    </button>

   </div>

   `;

  });

  html+=`</div>`;

 });

 document.getElementById("content").innerHTML=html;
}

function toggleCountry(index){

 const el=document.getElementById("country"+index);

 el.classList.toggle("hidden");
}

/* =========================================================
   ROOM CHAT
========================================================= */

function roomKey(country,state){
 return "ym_room_"+country+"_"+state;
}

function openRoom(country,state){

 activeRoom={country,state};

 document.getElementById("roomTitle").innerText=
 country+" • "+state;

 document.getElementById("roomScreen").classList.remove("hidden");

 renderRoom();
}

function closeRoom(){
 document.getElementById("roomScreen").classList.add("hidden");
}

function renderRoom(){

 const key=roomKey(activeRoom.country,activeRoom.state);

 let data=JSON.parse(localStorage.getItem(key));

 if(!data){

  data=[
   {
    name:"Y-M System",
    text:"Selamat datang ke room "+
         activeRoom.country+" • "+activeRoom.state
   },
   {
    name:"Ahmad",
    text:"Hello semua 👋"
   }
  ];

  localStorage.setItem(key,JSON.stringify(data));
 }

 const box=document.getElementById("roomBody");

 box.innerHTML=data.map(m=>`

  <div class="msg other">
   <b class="blue">${safe(m.name)}</b>
   <div>${safe(m.text)}</div>
   <small>Public Room</small>
  </div>

 `).join("");

 box.scrollTop=box.scrollHeight;
}

function sendRoom(){

 const input=document.getElementById("roomInput");
 const text=input.value.trim();

 if(!text)return;

 const key=roomKey(activeRoom.country,activeRoom.state);
 const data=JSON.parse(localStorage.getItem(key))||[];

 data.push({
  name:current.name,
  text
 });

 localStorage.setItem(key,JSON.stringify(data));

 input.value="";
 renderRoom();
}

========================================================= */

function changeName(){

 openModal(
  "Tukar Nama",
  `<input id="mName" class="input" value="${safeAttr(current.name)}">`,
  ()=>{
   const v=document.getElementById("mName").value.trim();

   if(!v){
    alert("Nama tidak boleh kosong.");
    return;
   }

   current.name=v;
   updateUser();
   closeModal();
   renderProfile();
  }
 );
}

   alert("Password berjaya ditukar.");

 );
}

function saveUsers(){

}

function updateUser(){

 users=users.map(u=>
  u.username===current.username?current:u
 );

 saveUsers();

 localStorage.setItem(
  "ym_current",
  JSON.stringify(current)
 );
}

/* =========================================================
   HELPERS
========================================================= */

function initial(name){
 return safe(String(name||"?").charAt(0).toUpperCase());
}

function safe(text){
 return String(text??"")
 .replace(/&/g,"&amp;")
 .replace(/</g,"&lt;")
 .replace(/>/g,"&gt;")
 .replace(/"/g,"&quot;")
 .replace(/'/g,"&#039;");
}

function safeAttr(text){
 return String(text??"")
 .replace(/\\/g,"\\\\")
 .replace(/'/g,"\\'")
 .replace(/"/g,"&quot;");
}
