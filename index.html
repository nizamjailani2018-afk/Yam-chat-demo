<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Y-M Chat V1.9.2</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#eef3f8;
    color:#222;
}

button,input,textarea{
    font:inherit;
}

button{
    cursor:pointer;
}

.app{
    width:100%;
    max-width:480px;
    min-height:100vh;
    margin:auto;
    background:#fff;
    position:relative;
    overflow:hidden;
}

/* ================= LOGIN ================= */

.auth{
    min-height:100vh;
    padding:35px 25px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,#1976d2,#42a5f5);
}

.auth-box{
    width:100%;
    background:white;
    border-radius:22px;
    padding:28px 22px;
    box-shadow:0 10px 35px rgba(0,0,0,.2);
}

.logo{
    text-align:center;
    font-size:42px;
    font-weight:bold;
    color:#1976d2;
    margin-bottom:5px;
}

.logo-sub{
    text-align:center;
    color:#777;
    margin-bottom:25px;
}

.auth-box h2{
    text-align:center;
    margin-bottom:20px;
}

.auth-input{
    width:100%;
    padding:14px;
    border:1px solid #ddd;
    border-radius:12px;
    margin-bottom:12px;
    outline:none;
}

.auth-input:focus{
    border-color:#1976d2;
}

.main-btn{
    width:100%;
    padding:14px;
    border:0;
    border-radius:12px;
    background:#1976d2;
    color:white;
    font-weight:bold;
    margin-top:5px;
}

.auth-switch{
    text-align:center;
    margin-top:18px;
    color:#777;
}

.auth-switch span{
    color:#1976d2;
    font-weight:bold;
    cursor:pointer;
}

/* ================= APP ================= */

.hidden{
    display:none!important;
}

.header{
    height:62px;
    background:#1976d2;
    color:white;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 17px;
    position:sticky;
    top:0;
    z-index:20;
}

.header-title{
    font-size:20px;
    font-weight:bold;
}

.header-actions{
    display:flex;
    gap:10px;
}

.icon-btn{
    border:0;
    background:rgba(255,255,255,.15);
    color:white;
    width:38px;
    height:38px;
    border-radius:50%;
}

.content{
    padding-bottom:72px;
    min-height:calc(100vh - 62px);
    background:#f5f7fa;
}

/* ================= HOME ================= */

.home-profile{
    background:white;
    padding:15px;
    display:flex;
    gap:12px;
    align-items:center;
}

.avatar{
    width:48px;
    height:48px;
    border-radius:50%;
    background:#1976d2;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
    overflow:hidden;
}

.avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.home-name{
    font-weight:bold;
}

.home-user{
    color:#777;
    font-size:13px;
}

.post-box{
    background:white;
    margin:10px;
    padding:12px;
    border-radius:14px;
}

.post-box textarea{
    width:100%;
    min-height:70px;
    border:1px solid #ddd;
    border-radius:10px;
    padding:10px;
    resize:none;
}

.post-actions{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:8px;
}

.small-btn{
    border:0;
    background:#eaf2fb;
    color:#1976d2;
    padding:8px 12px;
    border-radius:10px;
    font-weight:bold;
}

.post-btn{
    border:0;
    background:#1976d2;
    color:white;
    padding:9px 18px;
    border-radius:10px;
    font-weight:bold;
}

.post{
    background:white;
    margin:10px;
    padding:14px;
    border-radius:14px;
}

.post-head{
    display:flex;
    gap:10px;
    align-items:center;
}

.post-time{
    font-size:12px;
    color:#999;
}

.post-text{
    margin-top:12px;
    line-height:1.5;
}

/* ================= CHAT LIST ================= */

.section-title{
    padding:15px;
    font-size:18px;
    font-weight:bold;
}

.chat-item,
.friend-item,
.room-item,
.market-item,
.notification-item{
    background:white;
    margin:7px 10px;
    padding:12px;
    border-radius:13px;
    display:flex;
    align-items:center;
    gap:12px;
}

.chat-info{
    flex:1;
}

.chat-info strong{
    display:block;
}

.chat-info span{
    font-size:13px;
    color:#888;
}

.open-btn{
    border:0;
    background:#1976d2;
    color:white;
    padding:8px 12px;
    border-radius:9px;
}

/* ================= CHAT SCREEN ================= */

.chat-screen{
    position:fixed;
    inset:0;
    background:#eef3f8;
    z-index:50;
    max-width:480px;
    margin:auto;
    display:flex;
    flex-direction:column;
}

.chat-header{
    height:62px;
    background:#1976d2;
    color:white;
    display:flex;
    align-items:center;
    gap:10px;
    padding:0 12px;
}

.chat-back{
    border:0;
    background:transparent;
    color:white;
    font-size:24px;
}

.chat-person{
    flex:1;
}

.chat-person small{
    display:block;
    opacity:.8;
}

.chat-messages{
    flex:1;
    padding:15px;
    overflow-y:auto;
}

.message{
    max-width:78%;
    padding:10px 12px;
    margin-bottom:9px;
    border-radius:15px;
    line-height:1.4;
}

.message.me{
    margin-left:auto;
    background:#1976d2;
    color:white;
    border-bottom-right-radius:4px;
}

.message.other{
    background:white;
    border-bottom-left-radius:4px;
}

.message small{
    display:block;
    font-size:10px;
    opacity:.7;
    margin-top:4px;
}

.chat-input{
    background:white;
    padding:9px;
    display:flex;
    gap:8px;
}

.chat-input input{
    flex:1;
    border:1px solid #ddd;
    border-radius:20px;
    padding:11px 14px;
}

.send-btn{
    width:45px;
    border:0;
    border-radius:50%;
    background:#1976d2;
    color:white;
}

/* ================= ROOMS ================= */

.room-banner{
    background:#1976d2;
    color:white;
    margin:10px;
    padding:17px;
    border-radius:15px;
}

.room-item{
    display:flex;
}

.room-icon{
    width:45px;
    height:45px;
    border-radius:12px;
    background:#e8f2ff;
    color:#1976d2;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:21px;
}

.room-info{
    flex:1;
}

.room-info strong{
    display:block;
}

.room-info small{
    color:#888;
}

/* ================= ROOM CHAT ================= */

.room-chat{
    position:fixed;
    inset:0;
    background:#eef3f8;
    z-index:55;
    max-width:480px;
    margin:auto;
    display:flex;
    flex-direction:column;
}

.room-messages{
    flex:1;
    overflow-y:auto;
    padding:12px;
}

.room-message{
    background:white;
    border-radius:12px;
    padding:9px 11px;
    margin-bottom:8px;
}

.room-message strong{
    color:#1976d2;
}

.room-message small{
    display:block;
    color:#999;
}

/* ================= PROFILE ================= */

.profile-cover{
    height:170px;
    background:linear-gradient(135deg,#1976d2,#90caf9);
    position:relative;
}

.cover-edit{
    position:absolute;
    right:12px;
    top:12px;
    border:0;
    background:rgba(0,0,0,.4);
    color:white;
    padding:8px 11px;
    border-radius:10px;
}

.profile-main{
    background:white;
    padding:0 15px 18px;
    position:relative;
}

.profile-avatar{
    width:88px;
    height:88px;
    border-radius:50%;
    background:#1976d2;
    color:white;
    border:4px solid white;
    margin-top:-44px;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    font-size:25px;
    font-weight:bold;
}

.profile-avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.profile-name{
    margin-top:8px;
    font-size:21px;
    font-weight:bold;
}

.profile-username{
    color:#777;
    margin-top:3px;
}

.profile-buttons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-top:15px;
}

.profile-btn{
    border:0;
    padding:10px;
    border-radius:10px;
    background:#eaf2fb;
    color:#1976d2;
    font-weight:bold;
}

.profile-info{
    background:white;
    margin-top:10px;
    padding:15px;
}

.info-row{
    padding:12px 0;
    border-bottom:1px solid #eee;
}

.info-row:last-child{
    border-bottom:0;
}

.info-row small{
    display:block;
    color:#999;
    margin-bottom:3px;
}

/* ================= MARKET ================= */

.market-item{
    display:block;
}

.market-img{
    width:100%;
    height:160px;
    background:#ddd;
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#777;
    margin-bottom:10px;
}

.market-price{
    color:#1976d2;
    font-size:19px;
    font-weight:bold;
    margin-top:5px;
}

.market-meta{
    color:#777;
    font-size:13px;
    margin-top:5px;
}

/* ================= NOTIFICATION ================= */

.notification-item{
    align-items:flex-start;
}

.notification-icon{
    width:40px;
    height:40px;
    border-radius:50%;
    background:#eaf2fb;
    color:#1976d2;
    display:flex;
    align-items:center;
    justify-content:center;
}

.notification-info{
    flex:1;
}

.notification-info strong{
    display:block;
}

.notification-info small{
    color:#999;
}

/* ================= BOTTOM NAV ================= */

.bottom-nav{
    position:fixed;
    bottom:0;
    left:50%;
    transform:translateX(-50%);
    width:100%;
    max-width:480px;
    height:66px;
    background:white;
    border-top:1px solid #ddd;
    display:grid;
    grid-template-columns:repeat(5,1fr);
    z-index:30;
}

.nav-btn{
    border:0;
    background:white;
    color:#777;
    font-size:11px;
}

.nav-btn div{
    font-size:21px;
    margin-bottom:2px;
}

.nav-btn.active{
    color:#1976d2;
    font-weight:bold;
}

/* ================= MODAL ================= */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.45);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:100;
    padding:20px;
}

.modal-box{
    background:white;
    width:100%;
    max-width:400px;
    border-radius:18px;
    padding:20px;
}

.modal-box h3{
    margin-bottom:15px;
}

.modal-input{
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:10px;
    margin-bottom:10px;
}

.modal-actions{
    display:flex;
    gap:8px;
    margin-top:8px;
}

.modal-actions button{
    flex:1;
    padding:11px;
    border:0;
    border-radius:10px;
}

.cancel-btn{
    background:#eee;
}

.confirm-btn{
    background:#1976d2;
    color:white;
}

.empty{
    text-align:center;
    padding:40px 20px;
    color:#888;
}
</style>
</head>

<body>

<div class="app">

<!-- ================= AUTH ================= -->

<div id="authPage" class="auth">

    <div class="auth-box">

        <div class="logo">Y-M</div>
        <div class="logo-sub">Chat • Friends • Rooms • Market</div>

        <div id="loginForm">

            <h2>Log In</h2>

            <input
                id="loginUsername"
                class="auth-input"
                type="text"
                placeholder="Username"
            >

            <input
                id="loginPassword"
                class="auth-input"
                type="password"
                placeholder="Password"
            >

            <button class="main-btn" onclick="login()">
                Log In
            </button>

            <div class="auth-switch">
                Belum ada akaun?
                <span onclick="showRegister()">Register</span>
            </div>

        </div>


        <div id="registerForm" class="hidden">

            <h2>Create Account</h2>

            <input
                id="regName"
                class="auth-input"
                type="text"
                placeholder="Nama"
            >

            <input
                id="regUsername"
                class="auth-input"
                type="text"
                placeholder="Username"
            >

            <input
                id="regPassword"
                class="auth-input"
                type="password"
                placeholder="Password"
            >

            <button class="main-btn" onclick="register()">
                Register
            </button>

            <div class="auth-switch">
                Sudah ada akaun?
                <span onclick="showLogin()">Log In</span>
            </div>

        </div>

    </div>

</div>


<!-- ================= MAIN APP ================= -->

<div id="mainApp" class="hidden">

    <div class="header">

        <div id="headerTitle" class="header-title">
            Y-M Chat
        </div>

        <div class="header-actions">

            <button class="icon-btn" onclick="showPage('notifications')">
                🔔
            </button>

        </div>

    </div>


    <div id="content" class="content"></div>


    <div class="bottom-nav">

        <button id="navHome"
                class="nav-btn active"
                onclick="showPage('home')">
            <div>🏠</div>
            Home
        </button>

        <button id="navChats"
                class="nav-btn"
                onclick="showPage('chats')">
            <div>💬</div>
            Chats
        </button>

        <button id="navFriends"
                class="nav-btn"
                onclick="showPage('friends')">
            <div>👥</div>
            Friends
        </button>

        <button id="navRooms"
                class="nav-btn"
                onclick="showPage('rooms')">
            <div>🌎</div>
            Rooms
        </button>

        <button id="navProfile"
                class="nav-btn"
                onclick="showPage('profile')">
            <div>👤</div>
            Profile
        </button>

    </div>

</div>


<!-- ================= CHAT SCREEN ================= -->

<div id="chatScreen" class="chat-screen hidden">

    <div class="chat-header">

        <button class="chat-back" onclick="closeChat()">
            ‹
        </button>

        <div class="avatar" id="chatAvatar">
            A
        </div>

        <div class="chat-person">
            <strong id="chatName">Ahmad</strong>
            <small>Online</small>
        </div>

        <button class="icon-btn" onclick="clearChat()">
            🗑
        </button>

    </div>


    <div id="chatMessages" class="chat-messages"></div>


    <div class="chat-input">

        <input
            id="chatText"
            type="text"
            placeholder="Tulis mesej..."
            onkeydown="if(event.key==='Enter')sendMessage()"
        >

        <button class="send-btn" onclick="sendMessage()">
            ➤
        </button>

    </div>

</div>


<!-- ================= ROOM CHAT ================= -->

<div id="roomChat" class="room-chat hidden">

    <div class="chat-header">

        <button class="chat-back" onclick="closeRoom()">
            ‹
        </button>

        <div class="room-icon">
            🌎
        </div>

        <div class="chat-person">
            <strong id="roomChatName">
                Malaysia
            </strong>

            <small>Public Room</small>
        </div>

    </div>


    <div id="roomMessages" class="room-messages"></div>


    <div class="chat-input">

        <input
            id="roomText"
            type="text"
            placeholder="Tulis dalam room..."
            onkeydown="if(event.key==='Enter')sendRoomMessage()"
        >

        <button class="send-btn" onclick="sendRoomMessage()">
            ➤
        </button>

    </div>

</div>


<!-- ================= MODAL ================= -->

<div id="modal" class="modal hidden">

    <div class="modal-box">

        <h3 id="modalTitle">
            Edit
        </h3>

        <div id="modalBody"></div>

        <div class="modal-actions">

            <button class="cancel-btn" onclick="closeModal()">
                Cancel
            </button>

            <button class="confirm-btn" id="modalConfirm">
                Save
            </button>

        </div>

    </div>

</div>


</div>


<script>

/* =========================================================
   DATA
========================================================= */

let currentUser = null;
let currentChatUser = null;
let currentRoom = null;

const defaultUsers = [
    {
        name:"Ahmad",
        username:"ahmad",
        password:"1234",
        avatar:"",
        cover:""
    },
    {
        name:"Siti",
        username:"siti",
        password:"1234",
        avatar:"",
        cover:""
    },
    {
        name:"John",
        username:"john",
        password:"1234",
        avatar:"",
        cover:""
    }
];


const defaultChats = {
    ahmad:[
        {
            sender:"other",
            text:"Hello! Selamat datang di Y-M Chat."
        }
    ],
    siti:[
        {
            sender:"other",
            text:"Hi Nizam!"
        }
    ],
    john:[
        {
            sender:"other",
            text:"Welcome bro."
        }
    ]
};


const defaultRooms = [
    {
        name:"Malaysia",
        members:"1,248"
    },
    {
        name:"Sabah",
        members:"892"
    },
    {
        name:"Sarawak",
        members:"651"
    },
    {
        name:"Kuala Lumpur",
        members:"534"
    },
    {
        name:"Philippines",
        members:"743"
    },
    {
        name:"Indonesia",
        members:"1,102"
    },
    {
        name:"Singapore",
        members:"428"
    },
    {
        name:"Brunei",
        members:"317"
    },
    {
        name:"World",
        members:"3,821"
    }
];


const defaultNotifications = [
    {
        title:"Selamat datang",
        text:"Selamat datang ke Y-M Chat.",
        time:"Baru sahaja"
    },
    {
        title:"Rooms",
        text:"Room Malaysia dan Sabah sudah tersedia.",
        time:"Hari ini"
    }
];


let users =
    JSON.parse(localStorage.getItem("ym_users")) ||
    defaultUsers;

let chats =
    JSON.parse(localStorage.getItem("ym_chats")) ||
    defaultChats;

let posts =
    JSON.parse(localStorage.getItem("ym_posts")) ||
    [];

let notifications =
    JSON.parse(localStorage.getItem("ym_notifications")) ||
    defaultNotifications;


/* =========================================================
   START
========================================================= */

window.onload = function(){

    const saved =
        JSON.parse(localStorage.getItem("ym_current_user"));

    if(saved){

        currentUser = saved;

        openMainApp();

    }else{

        showLogin();

    }

};


/* =========================================================
   AUTH
========================================================= */

function showLogin(){

    document.getElementById("loginForm")
        .classList.remove("hidden");

    document.getElementById("registerForm")
        .classList.add("hidden");

}


function showRegister(){

    document.getElementById("loginForm")
        .classList.add("hidden");

    document.getElementById("registerForm")
        .classList.remove("hidden");

}


function register(){

    const name =
        document.getElementById("regName").value.trim();

    const username =
        document.getElementById("regUsername").value
        .trim()
        .toLowerCase();

    const password =
        document.getElementById("regPassword").value;

    if(!name || !username || !password){

        alert("Sila isi semua maklumat.");

        return;

    }

    if(username.length < 3){

        alert("Username mesti sekurang-kurangnya 3 huruf.");

        return;

    }

    const exists =
        users.some(u => u.username === username);

    if(exists){

        alert("Username sudah digunakan.");

        return;

    }

    const newUser = {

        name:name,
        username:username,
        password:password,
        avatar:"",
        cover:""

    };

    users.push(newUser);

    localStorage.setItem(
        "ym_users",
        JSON.stringify(users)
    );

    chats[username] = [];

    localStorage.setItem(
        "ym_chats",
        JSON.stringify(chats)
    );

    alert("Register berjaya. Sekarang boleh Log In.");

    document.getElementById("regName").value="";
    document.getElementById("regUsername").value="";
    document.getElementById("regPassword").value="";

    showLogin();

}


function login(){

    const username =
        document.getElementById("loginUsername")
        .value
        .trim()
        .toLowerCase();

    const password =
        document.getElementById("loginPassword")
        .value;

    if(!username || !password){

        alert("Sila masukkan username dan password.");

        return;

    }

    const user =
        users.find(
            u =>
            u.username === username &&
            u.password === password
        );

    if(!user){

        alert("Username atau password salah.");

        return;

    }

    currentUser = user;

    localStorage.setItem(
        "ym_current_user",
        JSON.stringify(currentUser)
    );

    openMainApp();

}


function logout(){

    localStorage.removeItem("ym_current_user");

    currentUser = null;

    document.getElementById("mainApp")
        .classList.add("hidden");

    document.getElementById("authPage")
        .classList.remove("hidden");

    showLogin();

}


/* =========================================================
   MAIN APP
========================================================= */

function openMainApp(){

    document.getElementById("authPage")
        .classList.add("hidden");

    document.getElementById("mainApp")
        .classList.remove("hidden");

    showPage("home");

}


/* =========================================================
   NAVIGATION
========================================================= */

function setActiveNav(page){

    document.querySelectorAll(".nav-btn")
        .forEach(btn => btn.classList.remove("active"));

    const map = {

        home:"navHome",
        chats:"navChats",
        friends:"navFriends",
        rooms:"navRooms",
        profile:"navProfile"

    };

    if(map[page]){

        document
            .getElementById(map[page])
            .classList.add("active");

    }

}


function showPage(page){

    closeChat();
    closeRoom();

    setActiveNav(page);

    const content =
        document.getElementById("content");

    if(page === "home"){

        document.getElementById("headerTitle")

function createPost(){

    const textarea =
        document.getElementById("postText");

    const text =
        textarea.value.trim();

    if(!text){

        alert("Tulis sesuatu dahulu.");

        return;

    }

    posts.push({

        name:currentUser.name,
        avatar:currentUser.avatar,
        text:text,
        time:new Date().toLocaleString("ms-MY")

    });

    localStorage.setItem(
        "ym_posts",
        JSON.stringify(posts)
    );

    textarea.value="";

    renderHome();

}

function renderChats(){

/* =========================================================
   OPEN CHAT
========================================================= */

function openChat(username){

    currentChatUser =
        users.find(u => u.username === username);

    if(!currentChatUser){

        return;

    }

    document.getElementById("chatName")
        .innerText = currentChatUser.name;

    document.getElementById("chatAvatar")
        .innerHTML =
        currentChatUser.avatar
        ? `<img src="${currentChatUser.avatar}">`
        : currentChatUser.name.charAt(0).toUpperCase();


    document.getElementById("chatScreen")
        .classList.remove("hidden");

    renderMessages();

}


function closeChat(){

    document.getElementById("chatScreen")
        .classList.add("hidden");

}


function renderMessages(){

    if(!currentChatUser){

        return;

    }

    const key =
        currentChatUser.username;

    if(!chats[key]){

        chats[key] = [];

    }

    const box =
        document.getElementById("chatMessages");

    if(chats[key].length === 0){

        box.innerHTML = `
            <div class="empty">
                Belum ada mesej.
            </div>
        `;

        return;

    }


    box.innerHTML =
        chats[key].map(message => `

            <div class="message ${message.sender}">

                ${escapeHTML(message.text)}

                <small>
                    ${message.sender === "me"
                        ? "You"
                        : currentChatUser.name
                    }
                </small>

            </div>

        `).join("");


    box.scrollTop = box.scrollHeight;

}


function sendMessage(){

    if(!currentChatUser){

        return;

    }

    const input =
        document.getElementById("chatText");

    const text =
        input.value.trim();

    if(!text){

        return;

    }

    const key =
        currentChatUser.username;

    if(!chats[key]){

        chats[key] = [];

    }

    chats[key].push({

        sender:"me",
        text:text

    });


    localStorage.setItem(
        "ym_chats",
        JSON.stringify(chats)
    );

    input.value="";

    renderMessages();

}


function clearChat(){

    if(!currentChatUser){

        return;

    }

    const yes =
        confirm("Padam semua mesej chat ini?");

    if(!yes){

        return;

    }

    chats[currentChatUser.username] = [];

    localStorage.setItem(
        "ym_chats",
        JSON.stringify(chats)
    );

    renderMessages();

}

function getRoomKey(){

    return "ym_room_" +
        currentRoom
        .replace(/\s+/g,"_")
        .toLowerCase();

}

    const key = getRoomKey();

    const messages =
        JSON.parse(localStorage.getItem(key)) || [

            {
                name:"Y-M System",
                text:"Selamat datang di room " +
                     currentRoom + "."
            },

            {
                name:"Ahmad",
                text:"Hello semua 👋"

        document.getElementById("roomMessages");

                <div>
                    ${escapeHTML(m.text)}

}


function sendRoomMessage(){

        document.getElementById("roomText");

    const text =
        input.value.trim();

    if(!text){

    }

    const key = getRoomKey();

    const messages =
        JSON.parse(localStorage.getItem(key)) || [];

    messages.push({

        name:currentUser.name,
        text:text

    });

    localStorage.setItem(
        key,
        JSON.stringify(messages)
    );

function changeName(){

    openModal(
        "Tukar Nama",
        `

                id="modalName"
                class="modal-input"
                value="${escapeHTML(currentUser.name)}"

                return;

            currentUser.name = value;

        }
    );

}


function changePassword(){

    openModal(
        "Tukar Password",
        `
            <input
                id="modalPassword"
                class="modal-input"
                type="password"
                placeholder="Password baru"
            >

        function(){

            const value =
                document.getElementById("modalPassword")

            if(value.length < 4){

            }

            users =

/* =========================================================

========================================================= */

function saveCurrentUser(){

    users =
        users.map(u =>
            u.username === currentUser.username
            ? currentUser
            : u
        );

    localStorage.setItem(
        "ym_users",
        JSON.stringify(users)
    );

    localStorage.setItem(
        "ym_current_user",
        JSON.stringify(currentUser)
    );

}


/* =========================================================
   MODAL
========================================================= */

function openModal(title,body,callback){

    document.getElementById("modalTitle")
        .innerText = title;

    document.getElementById("modalBody")
        .innerHTML = body;

    document.getElementById("modalConfirm")
        .onclick = callback;

    document.getElementById("modal")
        .classList.remove("hidden");

}


function closeModal(){

    document.getElementById("modal")
        .classList.add("hidden");

}


/* =========================================================
   SECURITY / HTML ESCAPE
========================================================= */

function escapeHTML(text){

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}
