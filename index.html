<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Y-M Chat - Home V1.0</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#eef2f7;
    color:#222;
}

.app{
    width:100%;
    max-width:480px;
    min-height:100vh;
    margin:auto;
    background:#f5f7fa;
    position:relative;
    padding-bottom:75px;
}

/* HEADER */

.header{
    height:62px;
    background:#1976d2;
    color:white;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 15px;
    position:sticky;
    top:0;
    z-index:20;
    box-shadow:0 2px 8px rgba(0,0,0,.18);
}

.logo{
    font-size:23px;
    font-weight:bold;
}

.logo span{
    font-size:12px;
    opacity:.85;
    display:block;
}

.header-actions{
    display:flex;
    gap:8px;
}

.icon-btn{
    width:40px;
    height:40px;
    border:none;
    border-radius:50%;
    background:rgba(255,255,255,.16);
    color:white;
    font-size:20px;
    cursor:pointer;
}

.icon-btn:active{
    transform:scale(.95);
}

/* PROFILE BAR */

.profile-bar{
    background:white;
    padding:13px 15px;
    display:flex;
    align-items:center;
    gap:11px;
    border-bottom:1px solid #ddd;
}

.avatar{
    width:45px;
    height:45px;
    border-radius:50%;
    background:#1976d2;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
    font-size:18px;
    overflow:hidden;
    flex-shrink:0;
}

.avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.profile-info{
    flex:1;
}

.profile-name{
    font-weight:bold;
    font-size:15px;
}

.profile-id{
    color:#777;
    font-size:12px;
    margin-top:3px;
}

/* NOTICE */

.notice{
    margin:12px;
    background:#e3f2fd;
    border:1px solid #bbdefb;
    border-radius:10px;
    padding:11px;
    color:#1565c0;
    font-size:13px;
}

/* CREATE POST */

.create-post{
    background:white;
    margin:12px;
    border-radius:12px;
    padding:13px;
    box-shadow:0 1px 4px rgba(0,0,0,.08);
}

.create-top{
    display:flex;
    gap:10px;
    align-items:flex-start;
}

.mini-avatar{
    width:40px;
    height:40px;
    border-radius:50%;
    background:#1976d2;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
    flex-shrink:0;
}

.post-input{
    flex:1;
    min-height:42px;
    border:1px solid #ddd;
    border-radius:22px;
    padding:11px 14px;
    outline:none;
    resize:none;
    font-size:14px;
}

.post-input:focus{
    border-color:#1976d2;
}

.media-preview{
    margin-top:10px;
    display:none;
    border-radius:10px;
    overflow:hidden;
    background:#f1f1f1;
}

.media-preview img,
.media-preview video{
    width:100%;
    max-height:280px;
    object-fit:cover;
    display:block;
}

.create-actions{
    display:flex;
    margin-top:12px;
    border-top:1px solid #eee;
    padding-top:10px;
    gap:5px;
}

.media-btn{
    flex:1;
    border:none;
    background:white;
    padding:9px 3px;
    border-radius:8px;
    cursor:pointer;
    font-size:12px;
    color:#444;
}

.media-btn:hover{
    background:#f2f5f8;
}

.post-btn{
    background:#1976d2;
    color:white;
    font-weight:bold;
}

input[type="file"]{
    display:none;
}

/* FEED */

.feed-title{
    padding:4px 14px 8px;
    font-size:16px;
    font-weight:bold;
}

.post-card{
    background:white;
    margin:0 12px 12px;
    border-radius:12px;
    box-shadow:0 1px 5px rgba(0,0,0,.08);
    overflow:hidden;
}

.post-head{
    display:flex;
    align-items:center;
    padding:13px;
    gap:10px;
}

.post-user{
    flex:1;
}

.post-user-name{
    font-size:14px;
    font-weight:bold;
}

.post-time{
    color:#888;
    font-size:11px;
    margin-top:3px;
}

.more-btn{
    border:none;
    background:white;
    font-size:20px;
    color:#777;
    cursor:pointer;
}

.post-text{
    padding:0 13px 13px;
    font-size:14px;
    line-height:1.5;
    white-space:pre-wrap;
}

.post-media{
    width:100%;
    background:#000;
}

.post-media img,
.post-media video{
    width:100%;
    max-height:430px;
    display:block;
    object-fit:contain;
}

.post-stats{
    padding:9px 13px;
    color:#777;
    font-size:12px;
    border-bottom:1px solid #eee;
}

.post-actions{
    display:flex;
}

.post-action{
    flex:1;
    border:none;
    background:white;
    padding:11px 5px;
    cursor:pointer;
    color:#555;
    font-size:13px;
}

.post-action:hover{
    background:#f4f6f8;
}

.post-action.liked{
    color:#1976d2;
    font-weight:bold;
}

/* EMPTY */

.empty{
    text-align:center;
    padding:35px 20px;
    color:#888;
}

.empty-icon{
    font-size:42px;
    margin-bottom:10px;
}

/* NOTIFICATION */

.notification-panel{
    position:fixed;
    top:62px;
    right:calc(50% - 230px);
    width:310px;
    max-width:calc(100% - 30px);
    background:white;
    border-radius:0 0 12px 12px;
    box-shadow:0 4px 15px rgba(0,0,0,.2);
    display:none;
    z-index:30;
    overflow:hidden;
}

.notification-panel.show{
    display:block;
}

.notification-head{
    padding:13px;
    font-weight:bold;
    border-bottom:1px solid #eee;
}

.notification-item{
    padding:12px;
    border-bottom:1px solid #eee;
    font-size:13px;
}

.notification-item small{
    display:block;
    color:#888;
    margin-top:4px;
}

/* BOTTOM NAV */

.bottom-nav{
    position:fixed;
    bottom:0;
    left:50%;
    transform:translateX(-50%);
    width:100%;
    max-width:480px;
    height:68px;
    background:white;
    border-top:1px solid #ddd;
    display:flex;
    z-index:25;
    box-shadow:0 -2px 8px rgba(0,0,0,.08);
}

.nav-btn{
    flex:1;
    border:none;
    background:white;
    color:#777;
    cursor:pointer;
    font-size:11px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:4px;
}

.nav-icon{
    font-size:21px;
}

.nav-btn.active{
    color:#1976d2;
    font-weight:bold;
}

/* MODAL */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.45);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:50;
    padding:20px;
}

.modal.show{
    display:flex;
}

.modal-box{
    width:100%;
    max-width:390px;
    background:white;
    border-radius:14px;
    padding:18px;
}

.modal-title{
    font-size:18px;
    font-weight:bold;
    margin-bottom:15px;
}

.modal-btn{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    margin-top:8px;
    cursor:pointer;
    background:#1976d2;
    color:white;
    font-weight:bold;
}

.modal-btn.secondary{
    background:#eee;
    color:#333;
}

.comment-input{
    width:100%;
    border:1px solid #ddd;
    border-radius:8px;
    padding:11px;
    resize:none;
    min-height:80px;
    outline:none;
}

/* RESPONSIVE */

@media(max-width:480px){
    .notification-panel{
        right:15px;
    }
}
</style>
</head>

<body>

<div class="app">

    <!-- HEADER -->
    <header class="header">

        <div class="logo">
            Y-M Chat
            <span>Home</span>
        </div>

        <div class="header-actions">
            <button class="icon-btn" onclick="toggleNotifications()">🔔</button>
            <button class="icon-btn" onclick="openMenu()">⋮</button>
        </div>

    </header>

    <!-- NOTIFICATION PANEL -->
    <div id="notificationPanel" class="notification-panel">

        <div class="notification-head">
            🔔 Notifications
        </div>

        <div class="notification-item">
            Selamat datang di Y-M Chat.
            <small>Baru sahaja</small>
        </div>

        <div class="notification-item">
            Home V1.0 sedang aktif.
            <small>Hari ini</small>
        </div>

    </div>

    <!-- PROFILE BAR -->
    <section class="profile-bar">

        <div class="avatar" id="topAvatar">
            Y
        </div>

        <div class="profile-info">
            <div class="profile-name" id="topName">
                Y-M User
            </div>

            <div class="profile-id" id="topId">
                @ymuser
            </div>
        </div>

    </section>

    <!-- NOTICE -->
    <div class="notice">
        👋 Selamat datang ke <b>Y-M Chat</b>. Kongsi apa yang sedang anda lakukan.
    </div>

    <!-- CREATE POST -->
    <section class="create-post">

        <div class="create-top">

            <div class="mini-avatar" id="miniAvatar">
                Y
            </div>

            <textarea
                id="postInput"
                class="post-input"
                placeholder="Apa yang anda fikirkan?"
            ></textarea>

        </div>

        <div id="mediaPreview" class="media-preview"></div>

        <div class="create-actions">

            <button
                class="media-btn"
                onclick="document.getElementById('imageInput').click()">
                🖼️ Foto
            </button>

            <button
                class="media-btn"
                onclick="document.getElementById('videoInput').click()">
                🎥 Video
            </button>

            <button
                class="media-btn post-btn"
                onclick="createPost()">
                ➤ Post
            </button>

        </div>

        <input
            type="file"
            id="imageInput"
            accept="image/*"
            onchange="previewImage(event)"
        >

        <input
            type="file"
            id="videoInput"
            accept="video/*"
            onchange="previewVideo(event)"
        >

    </section>

    <!-- FEED -->
    <div class="feed-title">
        📰 Y-M Feed
    </div>

    <main id="feed"></main>

</div>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">

    <button class="nav-btn active" onclick="goHome()">
        <span class="nav-icon">🏠</span>
        Home
    </button>

    <button class="nav-btn" onclick="openFriends()">
        <span class="nav-icon">👥</span>
        Friends
    </button>

    <button class="nav-btn" onclick="openChat()">
        <span class="nav-icon">💬</span>
        Chat
    </button>

    <button class="nav-btn" onclick="openRooms()">
        <span class="nav-icon">🌎</span>
        Rooms
    </button>

    <button class="nav-btn" onclick="openProfile()">
        <span class="nav-icon">👤</span>
        Profile
    </button>

</nav>

<!-- COMMENT MODAL -->
<div id="commentModal" class="modal">

    <div class="modal-box">

        <div class="modal-title">
            💬 Comment
        </div>

        <textarea
            id="commentInput"
            class="comment-input"
            placeholder="Tulis komen..."
        ></textarea>

        <button
            class="modal-btn"
            onclick="submitComment()">
            Hantar Comment
        </button>

        <button
            class="modal-btn secondary"
            onclick="closeCommentModal()">
            Batal
        </button>

    </div>

</div>

<script>

/* =========================================================
   Y-M CHAT HOME V1.0
   MODULE: 02-HOME

   NOTE:
   Module ini berdiri sendiri.
   Security Core V1.0 tidak diubah.
========================================================= */


/* -------------------------
   GLOBAL DATA
------------------------- */

let posts = [];

let selectedMedia = null;

let selectedMediaType = null;

let commentPostId = null;


/* -------------------------
   USER DATA
------------------------- */

function getCurrentUser(){

    let current = localStorage.getItem("ym_current_user");

    if(current){

        try{

            return JSON.parse(current);

        }catch(e){

            return null;

        }

    }

    return null;
}


/* -------------------------
   DISPLAY USER
------------------------- */

function loadUser(){

    const user = getCurrentUser();

    if(!user){

        document.getElementById("topName").textContent =
            "Y-M User";

        document.getElementById("topId").textContent =
            "@ymuser";

        document.getElementById("topAvatar").textContent =
            "Y";

        document.getElementById("miniAvatar").textContent =
            "Y";

        return;

    }

    const name =
        user.name ||
        user.username ||
        "Y-M User";

    const username =
        user.username ||
        "ymuser";

    document.getElementById("topName").textContent =
        name;

    document.getElementById("topId").textContent =
        "@" + username;

    const letter =
        name.charAt(0).toUpperCase();

    document.getElementById("topAvatar").textContent =
        letter;

    document.getElementById("miniAvatar").textContent =
        letter;
}


/* -------------------------
   LOAD POSTS
------------------------- */

function loadPosts(){

    const saved =
        localStorage.getItem("ym_home_posts");

    if(saved){

        try{

            posts = JSON.parse(saved);

        }catch(e){

            posts = [];

        }

    }

    renderPosts();
}


/* -------------------------
   SAVE POSTS
------------------------- */

function savePosts(){

    localStorage.setItem(
        "ym_home_posts",
        JSON.stringify(posts)
    );

}


/* -------------------------
   FORMAT TIME
------------------------- */

function formatTime(timestamp){

    const date =
        new Date(timestamp);

    const now =
        new Date();

    const diff =
        now - date;

    const minutes =
        Math.floor(diff / 60000);

    if(minutes < 1){

        return "Baru sahaja";

    }

    if(minutes < 60){

        return minutes + " minit lalu";

    }

    const hours =
        Math.floor(minutes / 60);

    if(hours < 24){

        return hours + " jam lalu";

    }

    const days =
        Math.floor(hours / 24);

    if(days < 7){

        return days + " hari lalu";

    }

    return date.toLocaleDateString();

}


/* -------------------------
   CREATE POST
------------------------- */

function createPost(){

    const text =
        document.getElementById("postInput")
        .value.trim();

    if(!text && !selectedMedia){

        alert("Sila tulis sesuatu atau pilih foto/video.");

        return;

    }

    const user =
        getCurrentUser();

    const name =
        user && user.name
        ? user.name
        : "Y-M User";

    const username =
        user && user.username
        ? user.username
        : "ymuser";

    const post = {

        id:
            Date.now(),

        userName:
            name,

        username:
            username,

        text:
            text,

        media:
            selectedMedia,

        mediaType:
            selectedMediaType,

        time:
            Date.now(),

        likes:
            0,

        liked:
            false,

        comments:
            []

    };

    posts.unshift(post);

    savePosts();

    document.getElementById("postInput").value =
        "";

    selectedMedia =
        null;

    selectedMediaType =
        null;

    document.getElementById("mediaPreview").style.display =
        "none";

    document.getElementById("mediaPreview").innerHTML =
        "";

    renderPosts();

}


/* -------------------------
   RENDER POSTS
------------------------- */

function renderPosts(){

    const feed =
        document.getElementById("feed");

    feed.innerHTML =
        "";

    if(posts.length === 0){

        feed.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    📰
                </div>

                <div>
                    Belum ada post.
                </div>

                <small>
                    Jadilah orang pertama membuat post.
                </small>

            </div>

        `;

        return;

    }

    posts.forEach(post => {

        const card =
            document.createElement("article");

        card.className =
            "post-card";

        const letter =
            (post.userName || "Y")
            .charAt(0)
            .toUpperCase();

        let mediaHTML =
            "";

        if(post.media && post.mediaType === "image"){

            mediaHTML = `

                <div class="post-media">

                    <img
                        src="${post.media}"
                        alt="Post image"
                    >

                </div>

            `;

        }

        if(post.media && post.mediaType === "video"){

            mediaHTML = `

                <div class="post-media">

                    <video
                        src="${post.media}"
                        controls
                    ></video>

                </div>

            `;

        }

        const commentCount =
            post.comments
            ? post.comments.length
            : 0;

        card.innerHTML = `

            <div class="post-head">

                <div class="avatar">
                    ${letter}
                </div>

                <div class="post-user">

                    <div class="post-user-name">
                        ${escapeHTML(post.userName)}
                    </div>

                    <div class="post-time">
                        @${escapeHTML(post.username)}
                        ·
                        ${formatTime(post.time)}
                    </div>

                </div>

                <button
                    class="more-btn"
                    onclick="postMenu(${post.id})">
                    ⋮
                </button>

            </div>

            ${
                post.text
                ?
                `<div class="post-text">
                    ${escapeHTML(post.text)}
                </div>`
                :
                ""
            }

            ${mediaHTML}

            <div class="post-stats">

                ❤️ ${post.likes || 0}
                &nbsp;&nbsp;
                💬 ${commentCount}

            </div>

            <div class="post-actions">

                <button
                    class="post-action ${post.liked ? "liked" : ""}"
                    onclick="likePost(${post.id})">

                    ${post.liked ? "💙 Liked" : "👍 Like"}

                </button>

                <button
                    class="post-action"
                    onclick="openComment(${post.id})">

                    💬 Comment

                </button>

                <button
                    class="post-action"
                    onclick="sharePost(${post.id})">

                    ↗️ Share

                </button>

            </div>

        `;

        feed.appendChild(card);

    });

}


/* -------------------------
   ESCAPE HTML
------------------------- */

function escapeHTML(text){

    if(!text){

        return "";

    }

    return text
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* -------------------------
   LIKE POST
------------------------- */

function likePost(id){

    const post =
        posts.find(p => p.id === id);

    if(!post){

        return;

    }

    if(post.liked){

        post.likes =
            Math.max(0, post.likes - 1);

        post.liked =
            false;

    }else{

        post.likes =
            (post.likes || 0) + 1;

        post.liked =
            true;

    }

    savePosts();

    renderPosts();

}


/* -------------------------
   COMMENT
------------------------- */

function openComment(id){

    commentPostId =
        id;

    document.getElementById("commentInput").value =
        "";

    document.getElementById("commentModal")
        .classList.add("show");

}

function closeCommentModal(){

    document.getElementById("commentModal")
        .classList.remove("show");

    commentPostId =
        null;

}

function submitComment(){

    const text =
        document.getElementById("commentInput")
        .value.trim();

    if(!text){

        alert("Sila tulis komen.");

        return;

    }

    const post =
        posts.find(p => p.id === commentPostId);

    if(!post){

        return;

    }

    if(!post.comments){

        post.comments = [];

    }

    const user =
        getCurrentUser();

    post.comments.push({

        user:
            user && user.name
            ? user.name
            : "Y-M User",

        text:
            text,

        time:
            Date.now()

    });

    savePosts();

    closeCommentModal();

    renderPosts();

}


/* -------------------------
   SHARE
------------------------- */

function sharePost(id){

    const post =
        posts.find(p => p.id === id);

    if(!post){

        return;

    }

    const shareText =
        post.text ||
        "Post dari Y-M Chat";

    if(navigator.share){

        navigator.share({

            title:
                "Y-M Chat",

            text:
                shareText

        }).catch(() => {});

    }else{

        alert(
            "Share: " +
            shareText
        );

    }

}


/* -------------------------
   POST MENU
------------------------- */

function postMenu(id){

    const post =
        posts.find(p => p.id === id);

    if(!post){

        return;

    }

    const user =
        getCurrentUser();

    const currentUsername =
        user && user.username
        ? user.username
        : "ymuser";

    if(post.username === currentUsername){

        const remove =
            confirm(
                "Padam post ini?"
            );

        if(remove){

            posts =
                posts.filter(
                    p => p.id !== id
                );

            savePosts();

            renderPosts();

        }

    }else{

        alert(
            "Menu post pengguna lain akan dikembangkan kemudian."
        );

    }

}


/* -------------------------
   IMAGE PREVIEW
------------------------- */

function previewImage(event){

    const file =
        event.target.files[0];

    if(!file){

        return;

    }

    const reader =
        new FileReader();

    reader.onload =
        function(e){

            selectedMedia =
                e.target.result;

            selectedMediaType =
                "image";

            const preview =
                document.getElementById("mediaPreview");

            preview.innerHTML = `

                <img
                    src="${selectedMedia}"
                    alt="Preview"
                >

            `;

            preview.style.display =
                "block";

        };

    reader.readAsDataURL(file);

}


/* -------------------------
   VIDEO PREVIEW
------------------------- */

function previewVideo(event){

    const file =
        event.target.files[0];

    if(!file){

        return;

    }

    const reader =
        new FileReader();

    reader.onload =
        function(e){

            selectedMedia =
                e.target.result;

            selectedMediaType =
                "video";

            const preview =
                document.getElementById("mediaPreview");

            preview.innerHTML = `

                <video
                    src="${selectedMedia}"
                    controls
                ></video>

            `;

            preview.style.display =
                "block";

        };

    reader.readAsDataURL(file);

}


/* -------------------------
   NOTIFICATIONS
------------------------- */

function toggleNotifications(){

    const panel =
        document.getElementById(
            "notificationPanel"
        );

    panel.classList.toggle("show");

}


/* -------------------------
   MAIN MENU
------------------------- */

function openMenu(){

    alert(
        "Y-M Chat Menu\n\n" +
        "• Settings\n" +
        "• Security\n" +

/* -------------------------
   CLOSE NOTIFICATION
   WHEN CLICK OUTSIDE
------------------------- */

document.addEventListener(
    "click",
    function(event){

        const panel =
            document.getElementById(
                "notificationPanel"
            );

        const header =
            document.querySelector(
                ".header"
            );

        if(
            !panel.contains(event.target) &&
            !header.contains(event.target)
        ){

            panel.classList.remove("show");

        }

    }
);
