<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Y-M Chat V2.0</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Arial,sans-serif;
  background:#e9e9e9;
  color:#222;
}
button,input{font:inherit}

.hidden{display:none!important}

/* LOGIN */
#loginPage{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:linear-gradient(#f5f5f5,#d9d9d9);
}
.loginBox{
  width:100%;
  max-width:390px;
  background:white;
  border:1px solid #aaa;
  border-radius:8px;
  box-shadow:0 4px 18px #999;
  overflow:hidden;
}
.loginHead{
  background:#5b2a91;
  color:white;
  padding:22px;
  text-align:center;
}
.logo{
  font-size:32px;
  font-weight:bold;
}
.sub{font-size:13px;margin-top:5px}
.loginBody{padding:22px}
.loginBody input{
  width:100%;
  padding:12px;
  margin-bottom:12px;
  border:1px solid #aaa;
  border-radius:4px;
}
.btn{
  border:0;
  border-radius:4px;
  padding:11px 15px;
  cursor:pointer;
  font-weight:bold;
}
.btnPurple{
  width:100%;
  background:#5b2a91;
  color:white;
}
.btnGray{
  background:#ddd;
  color:#222;
}
.loginLinks{
  margin-top:15px;
  text-align:center;
  font-size:13px;
}
.loginLinks button{
  background:none;
  border:0;
  color:#5b2a91;
  cursor:pointer;
}

/* APP */
#app{
  min-height:100vh;
  display:flex;
  flex-direction:column;
}
.topbar{
  height:58px;
  background:#5b2a91;
  color:white;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 15px;
}
.topLogo{
  font-size:22px;
  font-weight:bold;
}
.userTop{
  display:flex;
  align-items:center;
  gap:9px;
}
.statusDot{
  width:11px;
  height:11px;
  background:#24b84b;
  border-radius:50%;
  display:inline-block;
}
.menuBtn{
  background:rgba(255,255,255,.15);
  border:1px solid rgba(255,255,255,.4);
  color:white;
  padding:7px 10px;
  border-radius:4px;
  cursor:pointer;
}

.main{
  flex:1;
  display:flex;
  max-width:1100px;
  width:100%;
  margin:auto;
  background:white;
  min-height:calc(100vh - 58px);
}

/* BUDDY LIST */
.sidebar{
  width:280px;
  background:#f4f4f4;
  border-right:1px solid #ccc;
}
.profileMini{
  padding:15px;
  border-bottom:1px solid #ccc;
  background:#fff;
}
.profileName{
  font-weight:bold;
  font-size:17px;
}
.profileId{
  font-size:12px;
  color:#777;
  margin-top:3px;
}
.statusSelect{
  width:100%;
  margin-top:10px;
  padding:8px;
  border:1px solid #aaa;
}
.search{
  padding:10px;
  border-bottom:1px solid #ccc;
}
.search input{
  width:100%;
  padding:9px;
  border:1px solid #aaa;
  border-radius:4px;
}
.buddyTitle{
  padding:10px 13px;
  font-size:12px;
  font-weight:bold;
  color:#666;
  background:#e8e8e8;
}
.buddy{
  display:flex;
  align-items:center;
  gap:9px;
  padding:11px 13px;
  cursor:pointer;
  border-bottom:1px solid #e4e4e4;
}
.buddy:hover{background:#ddd}
.buddyAvatar{
  width:35px;
  height:35px;
  border-radius:50%;
  background:#777;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
}
.buddyInfo{flex:1}
.buddyName{font-weight:bold;font-size:14px}
.buddyStatus{font-size:11px;color:#777;margin-top:3px}

/* CHAT */
.chatArea{
  flex:1;
  display:flex;
  flex-direction:column;
  min-width:0;
}
.chatHead{
  height:65px;
  border-bottom:1px solid #ccc;
  padding:10px 15px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.chatPerson{
  display:flex;
  align-items:center;
  gap:10px;
}
.chatAvatar{
  width:40px;
  height:40px;
  border-radius:50%;
  background:#777;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
}
.chatName{font-weight:bold}
.chatStatus{font-size:12px;color:#777;margin-top:3px}
.callBtns button{
  border:1px solid #aaa;
  background:#eee;
  padding:7px 9px;
  border-radius:4px;
  cursor:pointer;
  margin-left:4px;
}
.messages{
  flex:1;
  overflow-y:auto;
  padding:18px;
  background:#fff;
}
.emptyChat{
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#999;
  text-align:center;
}
.message{
  margin-bottom:13px;
  max-width:75%;
}
.message.me{margin-left:auto}
.messageBubble{
  display:inline-block;
  padding:9px 12px;
  border-radius:10px;
  background:#eee;
  line-height:1.4;
}
.message.me .messageBubble{
  background:#e6d8f5;
}
.messageMeta{
  font-size:10px;
  color:#888;
  margin-top:3px;
}
.message.me .messageMeta{text-align:right}
.composer{
  border-top:1px solid #ccc;
  padding:10px;
  display:flex;
  gap:7px;
}
.composer input{
  flex:1;
  padding:11px;
  border:1px solid #aaa;
  border-radius:4px;
}
.sendBtn{
  background:#5b2a91;
  color:white;
  border:0;
  padding:0 18px;
  border-radius:4px;
  cursor:pointer;
}

/* MOBILE */
@media(max-width:700px){
  .sidebar{width:100%}
  .main{display:block}
  .chatArea{display:none;height:calc(100vh - 58px)}
  .main.chatOpen .sidebar{display:none}
  .main.chatOpen .chatArea{display:flex}
  .mobileBack{
    display:block!important;
  }
}
.mobileBack{
  display:none;
  background:none;
  border:0;
  font-size:20px;
  cursor:pointer;
}

/* REGISTER MODAL */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.5);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:10;
}
.modalBox{
  width:100%;
  max-width:400px;
  background:white;
  padding:20px;
  border-radius:7px;
}
.modalBox h2{
  margin-bottom:15px;
  color:#5b2a91;
}
.modalBox input{
  width:100%;
  padding:10px;
  margin-bottom:10px;
  border:1px solid #aaa;
}
.modalBtns{
  display:flex;
  gap:8px;
  margin-top:5px;
}
.modalBtns button{flex:1}
</style>
</head>

<body>

<!-- LOGIN -->
<section id="loginPage">
  <div class="loginBox">
    <div class="loginHead">
      <div class="logo">Y-M Chat</div>
      <div class="sub">Classic Messenger Experience</div>
    </div>

    <div class="loginBody">
      <input id="loginId" placeholder="Y-M ID / Username">
      <input id="loginPass" type="password" placeholder="Password">

      <button class="btn btnPurple" onclick="login()">LOGIN</button>

      <div class="loginLinks">
        <button onclick="openRegister()">REGISTER Y-M ID</button>
      </div>

      <p id="loginMsg"
         style="text-align:center;color:#c00;font-size:12px;margin-top:12px"></p>
    </div>
  </div>
</section>

<!-- APP -->
<section id="app" class="hidden">

  <header class="topbar">
    <div class="topLogo">Y-M Chat</div>

    <div class="userTop">
      <span class="statusDot" id="topDot"></span>
      <span id="topUser">Nizam</span>
      <button class="menuBtn" onclick="logout()">LOGOUT</button>
    </div>
  </header>

  <div class="main" id="main">

    <!-- BUDDY LIST -->
    <aside class="sidebar">

      <div class="profileMini">
        <div class="profileName" id="myName">Nizam</div>
        <div class="profileId" id="myId">@nizam</div>

        <select class="statusSelect" id="myStatus"
                onchange="changeStatus()">
          <option value="Online">🟢 Online</option>
          <option value="Busy">🔴 Busy</option>
          <option value="Away">🟡 Away</option>
          <option value="Invisible">⚪ Invisible</option>
        </select>
      </div>

      <div class="search">
        <input id="searchBuddy"
               placeholder="Search buddy..."
               oninput="renderBuddies()">
      </div>

      <div class="buddyTitle">BUDDIES</div>

      <div id="buddyList"></div>

    </aside>

    <!-- CHAT -->
    <main class="chatArea">

      <div class="chatHead">

        <div class="chatPerson">
          <button class="mobileBack" onclick="closeChat()">‹</button>

          <div class="chatAvatar" id="chatAvatar">?</div>

          <div>
            <div class="chatName" id="chatName">
              Select a buddy
            </div>
            <div class="chatStatus" id="chatStatus">
              Choose someone from your buddy list
            </div>
          </div>
        </div>

        <div class="callBtns">
          <button onclick="comingSoon('Voice Call')">☎</button>
          <button onclick="comingSoon('Video Call')">▣</button>
        </div>

      </div>

      <div class="messages" id="messages">
        <div class="emptyChat">
          <div>
            <b>Welcome to Y-M Chat</b><br>
            Select a buddy to start chatting.
          </div>
        </div>
      </div>

      <div class="composer">
        <input id="messageInput"
               placeholder="Type a message..."
               onkeydown="if(event.key==='Enter')sendMessage()">
        <button class="sendBtn" onclick="sendMessage()">SEND</button>
      </div>

    </main>

  </div>
</section>

<!-- REGISTER -->
<div id="registerModal" class="modal hidden">

  <div class="modalBox">

    <h2>Register Y-M ID</h2>

    <input id="regName" placeholder="Your Name">
    <input id="regId" placeholder="Choose Y-M ID">
    <input id="regPass" type="password" placeholder="Password">

    <div class="modalBtns">
      <button class="btn btnGray" onclick="closeRegister()">
        CANCEL
      </button>

      <button class="btn btnPurple" onclick="register()">
        REGISTER
      </button>
    </div>

    <p id="regMsg"
       style="font-size:12px;color:#c00;margin-top:10px"></p>

  </div>

</div>

<script>
/* =========================
   DEMO DATA
========================= */

const defaultBuddies = [
  {
    id:"ahmad",
    name:"Ahmad",
    status:"Online",
    avatar:"A"
  },
  {
    id:"ali",
    name:"Ali",
    status:"Away",
    avatar:"A"
  },
  {
    id:"siti",
    name:"Siti",
    status:"Online",
    avatar:"S"
  },
  {
    id:"john",
    name:"John",
    status:"Offline",
    avatar:"J"
  }
];

let currentUser =
  JSON.parse(localStorage.getItem("ym_currentUser")) || null;

let users =
  JSON.parse(localStorage.getItem("ym_users")) || [];

let selectedBuddy = null;

let chats =
  JSON.parse(localStorage.getItem("ym_chats")) || {};

/* =========================
   START
========================= */

if(currentUser){
  showApp();
}

/* =========================
   REGISTER
========================= */

function openRegister(){
  document.getElementById("registerModal")
    .classList.remove("hidden");

  document.getElementById("regMsg").textContent="";
}

function closeRegister(){
  document.getElementById("registerModal")
    .classList.add("hidden");
}

function register(){

  const name =
    document.getElementById("regName").value.trim();

  const id =
    document.getElementById("regId").value.trim().toLowerCase();

  const pass =
    document.getElementById("regPass").value;

  const msg =
    document.getElementById("regMsg");

  if(!name || !id || !pass){
    msg.textContent="Sila isi semua ruangan.";
    return;
  }

  if(id.length < 3){
    msg.textContent="Y-M ID minimum 3 aksara.";
    return;
  }

  if(users.some(u=>u.id===id)){
    msg.textContent="Y-M ID sudah digunakan.";
    return;
  }

  const user={
    name:name,
    id:id,
    password:pass,
    status:"Online"
  };

  users.push(user);

  localStorage.setItem(
    "ym_users",
    JSON.stringify(users)
  );

  currentUser={
    name:name,
    id:id,
    status:"Online"
  };

  localStorage.setItem(
    "ym_currentUser",
    JSON.stringify(currentUser)
  );

  closeRegister();
  showApp();
}

/* =========================
   LOGIN
========================= */

function login(){

  const id =
    document.getElementById("loginId")
      .value.trim().toLowerCase();

  const pass =
    document.getElementById("loginPass").value;

  const msg =
    document.getElementById("loginMsg");

  /* Demo account */
  if(id==="nizam" && pass==="1234"){

    currentUser={
      name:"Nizam",
      id:"nizam",
      status:"Online"
    };

  }else{

    const found =
      users.find(
        u=>u.id===id && u.password===pass
      );

    if(!found){
      msg.textContent=
        "Y-M ID atau password salah.";
      return;
    }

    currentUser={
      name:found.name,
      id:found.id,
      status:"Online"
    };
  }

  localStorage.setItem(
    "ym_currentUser",
    JSON.stringify(currentUser)
  );

  msg.textContent="";
  showApp();
}

/* =========================
   SHOW APP
========================= */

function showApp(){

  document.getElementById("loginPage")
    .classList.add("hidden");

  document.getElementById("app")
    .classList.remove("hidden");

  document.getElementById("topUser")
    .textContent=currentUser.name;

  document.getElementById("myName")
    .textContent=currentUser.name;

  document.getElementById("myId")
    .textContent="@"+currentUser.id;

  document.getElementById("myStatus").value=
    currentUser.status || "Online";

  updateTopStatus();
  renderBuddies();
}

/* =========================
   BUDDIES
========================= */

function getBuddies(){

  const registeredUsers =
    users
      .filter(u=>u.id!==currentUser.id)
      .map(u=>({
        id:u.id,
        name:u.name,
        status:"Online",
        avatar:u.name.charAt(0).toUpperCase()
      }));

  return [...defaultBuddies,...registeredUsers];
}

function renderBuddies(){

  const list =
    document.getElementById("buddyList");

  const search =
    document.getElementById("searchBuddy")
      .value.toLowerCase();

  list.innerHTML="";

  const buddies =
    getBuddies().filter(b=>
      b.name.toLowerCase().includes(search) ||
      b.id.toLowerCase().includes(search)
    );

  buddies.forEach(b=>{

    const div=document.createElement("div");
    div.className="buddy";

    let dot="⚪";

    if(b.status==="Online") dot="🟢";
    if(b.status==="Busy") dot="🔴";
    if(b.status==="Away") dot="🟡";

    div.innerHTML=`
      <div class="buddyAvatar">${escapeHtml(b.avatar)}</div>
      <div class="buddyInfo">
        <div class="buddyName">
          ${escapeHtml(b.name)}
        </div>
        <div class="buddyStatus">
          ${dot} ${escapeHtml(b.status)}
        </div>
      </div>
    `;

    div.onclick=()=>openChat(b);

    list.appendChild(div);
  });
}

/* =========================
   OPEN CHAT
========================= */

function openChat(buddy){

  selectedBuddy=buddy;

  document.getElementById("main")
    .classList.add("chatOpen");

  document.getElementById("chatAvatar")
    .textContent=buddy.avatar;

  document.getElementById("chatName")
    .textContent=buddy.name;

  document.getElementById("chatStatus")
    .textContent=buddy.status;

  renderMessages();
}

/* =========================
   CLOSE MOBILE CHAT
========================= */

function closeChat(){

  document.getElementById("main")
    .classList.remove("chatOpen");

  selectedBuddy=null;
}

/* =========================
   MESSAGES
========================= */

function chatKey(){

  if(!selectedBuddy) return null;

  return [
    currentUser.id,
    selectedBuddy.id
  ].sort().join("_");
}

function renderMessages(){

  const box =
    document.getElementById("messages");

  if(!selectedBuddy){
    box.innerHTML=`
      <div class="emptyChat">
        Select a buddy to start chatting.
      </div>`;
    return;
  }

  const key=chatKey();

  const data=chats[key] || [];

  box.innerHTML="";

  if(data.length===0){

    box.innerHTML=`
      <div class="emptyChat">
        <div>
          <b>New conversation</b><br>
          Say hello to ${escapeHtml(selectedBuddy.name)}.
        </div>
      </div>`;

    return;
  }

  data.forEach(m=>{

    const div=
      document.createElement("div");

    div.className=
      "message "+(m.sender===currentUser.id?"me":"");

    div.innerHTML=`
      <div class="messageBubble">
        ${escapeHtml(m.text)}
      </div>
      <div class="messageMeta">
        ${escapeHtml(m.senderName)} • ${escapeHtml(m.time)}
      </div>
    `;

    box.appendChild(div);
  });

  box.scrollTop=box.scrollHeight;
}

/* =========================
   SEND MESSAGE
========================= */

function sendMessage(){

  if(!selectedBuddy){
    alert("Pilih buddy dahulu.");
    return;
  }

  const input=
    document.getElementById("messageInput");

  const text=input.value.trim();

  if(!text) return;

  const key=chatKey();

  if(!chats[key]){
    chats[key]=[];
  }

  const now=new Date();

  chats[key].push({
    sender:currentUser.id,
    senderName:currentUser.name,
    text:text,
    time:now.toLocaleTimeString(
      "ms-MY",
      {
        hour:"2-digit",
        minute:"2-digit"
      }
    )
  });

  localStorage.setItem(
    "ym_chats",
    JSON.stringify(chats)
  );

  input.value="";
  renderMessages();
}

/* =========================
   STATUS
========================= */

function changeStatus(){

  currentUser.status=
    document.getElementById("myStatus").value;

  localStorage.setItem(
    "ym_currentUser",
    JSON.stringify(currentUser)
  );

  updateTopStatus();
  renderBuddies();
}

function updateTopStatus(){

  const dot=
    document.getElementById("topDot");

  const status=currentUser.status;

  dot.style.background=
    status==="Online" ? "#24b84b" :
    status==="Busy" ? "#d62828" :
    status==="Away" ? "#e0a100" :
    "#aaa";
}

/* =========================
   LOGOUT
========================= */

function logout(){

  currentUser=null;

  localStorage.removeItem(
    "ym_currentUser"
  );

  selectedBuddy=null;

  document.getElementById("app")
    .classList.add("hidden");

  document.getElementById("loginPage")
    .classList.remove("hidden");

  document.getElementById("loginPass")
    .value="";

  document.getElementById("main")
    .classList.remove("chatOpen");
}

/* =========================
   FUTURE FEATURES
========================= */

function comingSoon(name){

  alert(
    name+
    " akan kita bina dalam modul seterusnya."
  );
}

/* =========================
   SECURITY HELPER
========================= */

function escapeHtml(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}
</script>

</body>
</html>
