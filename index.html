<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Y-M Chat V1.9.1</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

html,body{
    width:100%;
    min-height:100%;
    background:#eef3f8;
    color:#222;
}

body{
    display:flex;
    justify-content:center;
}

button,
input{
    font-family:inherit;
}

button{
    cursor:pointer;
}

#app{
    width:100%;
    max-width:480px;
    min-height:100vh;
    background:#f7f9fc;
    position:relative;
    box-shadow:0 0 25px rgba(0,0,0,.08);
}

/* =========================
   AUTH
========================= */

.auth-screen{
    min-height:100vh;
    padding:30px 20px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(145deg,#1976d2,#0d47a1);
}

.auth-box{
    width:100%;
    background:white;
    border-radius:24px;
    padding:28px 22px;
    box-shadow:0 15px 40px rgba(0,0,0,.22);
}

.logo{
    text-align:center;
    margin-bottom:22px;
}

.logo-icon{
    width:70px;
    height:70px;
    margin:auto;
    border-radius:22px;
    background:#1976d2;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:25px;
    font-weight:bold;
    box-shadow:0 8px 20px rgba(25,118,210,.35);
}

.logo h1{
    margin-top:12px;
    color:#1976d2;
    font-size:28px;
}

.logo p{
    color:#777;
    margin-top:5px;
    font-size:13px;
}

.auth-title{
    font-size:22px;
    margin-bottom:5px;
}

.auth-subtitle{
    color:#777;
    font-size:13px;
    margin-bottom:18px;
}

.input-group{
    margin-bottom:14px;
}

.input-group label{
    display:block;
    font-size:13px;
    font-weight:bold;
    margin-bottom:6px;
    color:#555;
}

.input-group input{
    width:100%;
    border:1px solid #d9e0e8;
    border-radius:12px;
    padding:13px;
    outline:none;
    font-size:14px;
    background:#fafbfd;
}

.input-group input:focus{
    border-color:#1976d2;
    background:white;
}

.primary-btn{
    width:100%;
    border:0;
    border-radius:12px;
    padding:13px;
    background:#1976d2;
    color:white;
    font-weight:bold;
    font-size:14px;
}

.primary-btn:active{
    transform:scale(.98);
}

.secondary-btn{
    width:100%;
    border:1px solid #1976d2;
    border-radius:12px;
    padding:12px;
    background:white;
    color:#1976d2;
    font-weight:bold;
    margin-top:10px;
}

.auth-links{
    display:flex;
    justify-content:space-between;
    margin-top:15px;
    font-size:13px;
}

.auth-links span{
    color:#1976d2;
    cursor:pointer;
    font-weight:bold;
}

.demo-box{
    margin-top:18px;
    background:#eef6ff;
    padding:12px;
    border-radius:12px;
    font-size:12px;
    color:#456;
}

/* =========================
   APP HEADER
========================= */

#mainApp{
    min-height:100vh;
    padding-bottom:72px;
}

.topbar{
    height:62px;
    background:#1976d2;
    color:white;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 16px;
    position:sticky;
    top:0;
    z-index:20;
}

.topbar-title{
    font-size:20px;
    font-weight:bold;
}

.top-actions{
    display:flex;
    gap:8px;
}

.icon-btn{
    width:38px;
    height:38px;
    border:0;
    border-radius:50%;
    background:rgba(255,255,255,.16);
    color:white;
    font-size:17px;
}

.page{
    display:none;
    padding:16px;
}

.page.active{
    display:block;
}

/* =========================
   HOME
========================= */

.hero{
    background:linear-gradient(135deg,#1976d2,#42a5f5);
    color:white;
    border-radius:20px;
    padding:20px;
    display:flex;
    align-items:center;
    gap:14px;
    box-shadow:0 8px 20px rgba(25,118,210,.2);
}

.hero-avatar{
    width:62px;
    height:62px;
    border-radius:50%;
    background:white;
    color:#1976d2;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:22px;
    font-weight:bold;
    overflow:hidden;
    flex-shrink:0;
}

.hero-avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.hero-text h2{
    font-size:20px;
}

.hero-text p{
    font-size:13px;
    margin-top:4px;
    opacity:.9;
}

.online-badge{
    display:inline-flex;
    align-items:center;
    gap:5px;
    margin-top:7px;
    font-size:11px;
}

.online-dot{
    width:8px;
    height:8px;
    border-radius:50%;
    background:#4caf50;
}

.search-box{
    margin:16px 0;
    position:relative;
}

.search-box input{
    width:100%;
    border:1px solid #dce3eb;
    border-radius:13px;
    padding:13px 14px 13px 40px;
    outline:none;
    background:white;
}

.search-icon{
    position:absolute;
    left:14px;
    top:12px;
    color:#888;
}

.section-title{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin:18px 0 10px;
}

.section-title h3{
    font-size:16px;
}

.section-title span{
    color:#1976d2;
    font-size:12px;
    cursor:pointer;
}

.quick-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
}

.quick-card{
    background:white;
    border-radius:14px;
    padding:12px 5px;
    text-align:center;
    box-shadow:0 2px 8px rgba(0,0,0,.05);
    cursor:pointer;
}

.quick-icon{
    font-size:22px;
    margin-bottom:6px;
}

.quick-card span{
    display:block;
    font-size:11px;
}

.online-list{
    display:flex;
    gap:10px;
    overflow-x:auto;
    padding-bottom:4px;
}

.online-user{
    min-width:65px;
    text-align:center;
}

.user-avatar{
    width:50px;
    height:50px;
    margin:auto;
    border-radius:50%;
    background:#e3edf8;
    color:#1976d2;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
    position:relative;
    overflow:hidden;
}

.user-avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.status-dot{
    position:absolute;
    right:0;
    bottom:0;
    width:13px;
    height:13px;
    border-radius:50%;
    border:2px solid white;
    background:#4caf50;
}

.status-dot.offline{
    background:#aaa;
}

.online-user p{
    margin-top:5px;
    font-size:11px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.activity-card,
.feature-card,
.room-preview{
    background:white;
    border-radius:14px;
    padding:13px;
    margin-bottom:9px;
    box-shadow:0 2px 8px rgba(0,0,0,.05);
}

.activity-row{
    display:flex;
    align-items:center;
    gap:10px;
}

.activity-icon{
    width:38px;
    height:38px;
    border-radius:12px;
    background:#eef5ff;
    display:flex;
    align-items:center;
    justify-content:center;
}

.activity-row p{
    font-size:13px;
}

.activity-row small{
    color:#999;
    display:block;
    margin-top:3px;
}

.feature-card{
    background:linear-gradient(135deg,#eaf4ff,#fff);
}

.feature-card h3{
    color:#1976d2;
    margin-bottom:6px;
}

.feature-card p{
    font-size:12px;
    color:#666;
    line-height:1.5;
}

/* =========================
   CHATS
========================= */

.filter-row{
    display:flex;
    gap:7px;
    overflow-x:auto;
    margin-bottom:14px;
}

.filter-btn{
    border:1px solid #dce3eb;
    background:white;
    color:#666;
    border-radius:20px;
    padding:8px 13px;
    font-size:12px;
    white-space:nowrap;
}

.filter-btn.active{
    background:#1976d2;
    color:white;
    border-color:#1976d2;
}

.chat-card{
    background:white;
    border-radius:15px;
    padding:12px;
    margin-bottom:9px;
    display:flex;
    align-items:center;
    gap:11px;
    box-shadow:0 2px 8px rgba(0,0,0,.05);
    cursor:pointer;
}

.chat-main{
    flex:1;
    min-width:0;
}

.chat-name-row{
    display:flex;
    justify-content:space-between;
    gap:8px;
}

.chat-name{
    font-weight:bold;
    font-size:14px;
}

.chat-time{
    font-size:10px;
    color:#999;
}

.chat-preview{
    margin-top:5px;
    font-size:12px;
    color:#777;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.unread{
    min-width:20px;
    height:20px;
    border-radius:50%;
    background:#1976d2;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:10px;
}

.empty-state{
    text-align:center;
    padding:35px 15px;
    color:#888;
}

.empty-state .empty-icon{
    font-size:40px;
    margin-bottom:10px;
}

/* =========================
   FRIENDS
========================= */

.stats-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin-bottom:15px;
}

.stat-card{
    background:white;
    border-radius:13px;
    padding:12px 5px;
    text-align:center;
}

.stat-card strong{
    display:block;
    color:#1976d2;
    font-size:19px;
}

.stat-card span{
    color:#777;
    font-size:10px;
}

.add-friend-btn{
    width:100%;
    border:0;
    background:#1976d2;
    color:white;
    padding:12px;
    border-radius:12px;
    font-weight:bold;
    margin-bottom:15px;
}

.request-card{
    background:#fff8e1;
    border:1px solid #ffe082;
    border-radius:14px;
    padding:12px;
    margin-bottom:9px;
}

.request-top{
    display:flex;
    gap:10px;
    align-items:center;
}

.request-info{
    flex:1;
}

.request-info strong{
    font-size:14px;
}

.request-info p{
    font-size:11px;
    color:#777;
    margin-top:3px;
}

.request-actions{
    display:flex;
    gap:7px;
    margin-top:10px;
}

.accept-btn,
.decline-btn{
    flex:1;
    border:0;
    border-radius:9px;
    padding:8px;
    font-size:11px;
    font-weight:bold;
}

.accept-btn{
    background:#1976d2;
    color:white;
}

.decline-btn{
    background:#eee;
    color:#555;
}

.friend-card{
    background:white;
    border-radius:15px;
    padding:12px;
    margin-bottom:9px;
    display:flex;
    align-items:center;
    gap:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.05);
}

.friend-info{
    flex:1;
    min-width:0;
}

.friend-info strong{
    display:block;
    font-size:14px;
}

.friend-status{
    font-size:11px;
    margin-top:4px;
    color:#777;
}

.friend-status.online{
    color:#2e8b3c;
}

.friend-actions{
    display:flex;
    gap:5px;
}

.small-action{
    border:0;
    width:32px;
    height:32px;
    border-radius:9px;
    background:#eef5ff;
    color:#1976d2;
}

.small-action.danger{
    background:#fff0f0;
    color:#d33;
}

/* =========================
   ROOMS
========================= */

.room-card{
    background:white;
    border-radius:15px;
    padding:13px;
    display:flex;
    align-items:center;
    gap:11px;
    margin-bottom:9px;
    box-shadow:0 2px 8px rgba(0,0,0,.05);
    cursor:pointer;
}

.room-icon{
    width:48px;
    height:48px;
    border-radius:13px;
    background:#edf5ff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:23px;
}

.room-info{
    flex:1;
}

.room-info strong{
    font-size:14px;
}

.room-info p{
    font-size:11px;
    color:#888;
    margin-top:4px;
}

/* =========================
   PROFILE
========================= */

.profile-cover{
    height:170px;
    background:linear-gradient(135deg,#1976d2,#64b5f6);
    position:relative;
    border-radius:0 0 18px 18px;
    overflow:hidden;
}

.profile-cover img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.cover-camera,
.avatar-camera{
    position:absolute;
    border:0;
    width:36px;
    height:36px;
    border-radius:50%;
    background:rgba(0,0,0,.45);
    color:white;
    z-index:2;
}

.cover-camera{
    right:12px;
    bottom:12px;
}

.profile-main{
    padding:0 16px;
}

.profile-avatar-wrap{
    margin-top:-42px;
    position:relative;
    width:88px;
}

.profile-avatar{
    width:88px;
    height:88px;
    border-radius:50%;
    border:4px solid white;
    background:#dceafa;
    color:#1976d2;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:28px;
    font-weight:bold;
    overflow:hidden;
}

.profile-avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.avatar-camera{
    right:-3px;
    bottom:2px;
    width:29px;
    height:29px;
    font-size:12px;
}

.profile-name{
    margin-top:9px;
}

.profile-name h2{
    font-size:20px;
}

.profile-name p{
    color:#777;
    font-size:12px;
    margin-top:3px;
}

.profile-actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin:15px 0;
}

.profile-action{
    border:1px solid #dce3eb;
    background:white;
    border-radius:11px;
    padding:11px 6px;
    font-size:12px;
}

.profile-action.logout{
    color:#d33;
}

.profile-section{
    background:white;
    border-radius:15px;
    margin-bottom:10px;
    overflow:hidden;
}

.profile-item{
    padding:13px;
    border-bottom:1px solid #eef1f4;
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:13px;
}

.profile-item:last-child{
    border-bottom:0;
}

.profile-item span:last-child{
    color:#999;
}

/* =========================
   BOTTOM NAV
========================= */

.bottom-nav{
    position:fixed;
    bottom:0;
    width:100%;
    max-width:480px;
    height:68px;
    background:white;
    border-top:1px solid #e4e8ed;
    display:flex;
    z-index:50;
}

.nav-item{
    flex:1;
    border:0;
    background:white;
    color:#888;
    font-size:10px;
    position:relative;
}

.nav-item .nav-icon{
    display:block;
    font-size:21px;
    margin-bottom:3px;
}

.nav-item.active{
    color:#1976d2;
}

.nav-badge{
    position:absolute;
    top:7px;
    right:27%;
    min-width:17px;
    height:17px;
    border-radius:50%;
    background:#e53935;
    color:white;
    font-size:9px;
    display:flex;
    align-items:center;
    justify-content:center;
}

/* =========================
   MODALS
========================= */

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.48);
    z-index:100;
    align-items:flex-end;
    justify-content:center;
}

.modal.show{
    display:flex;
}

.modal-box{
    width:100%;
    max-width:480px;
    background:white;
    border-radius:22px 22px 0 0;
    max-height:88vh;
    overflow:auto;
    animation:slideUp .2s ease;
}

@keyframes slideUp{
    from{transform:translateY(100%)}
    to{transform:translateY(0)}
}

.modal-header{
    padding:15px;
    border-bottom:1px solid #edf0f3;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.modal-header h3{
    font-size:17px;
}

.close-btn{
    width:32px;
    height:32px;
    border:0;
    border-radius:50%;
    background:#f1f3f5;
}

.modal-content{
    padding:15px;
}

.chat-window{
    height:420px;
    display:flex;
    flex-direction:column;
}

.chat-messages{
    flex:1;
    overflow-y:auto;
    padding:10px 2px;
}

.message{
    max-width:78%;
    padding:9px 11px;
    border-radius:14px;
    margin-bottom:8px;
    font-size:13px;
    position:relative;
}

.message.me{
    margin-left:auto;
    background:#1976d2;
    color:white;
    border-bottom-right-radius:4px;
}

.message.other{
    background:#eef1f5;
    color:#333;
    border-bottom-left-radius:4px;
}

.message-tools{
    font-size:9px;
    opacity:.65;
    margin-top:4px;
    cursor:pointer;
}

.chat-input-row{
    display:flex;
    gap:7px;
    padding-top:9px;
    border-top:1px solid #eee;
}

.chat-input-row input{
    flex:1;
    border:1px solid #dce3eb;
    border-radius:12px;
    padding:11px;
    outline:none;
}

.send-btn{
    width:45px;
    border:0;
    border-radius:12px;
    background:#1976d2;
    color:white;
}

.room-messages{
    height:390px;
    overflow-y:auto;
    background:#f6f8fb;
    padding:12px;
    border-radius:13px;
}

.room-message{
    margin-bottom:10px;
}

.room-message strong{
    color:#1976d2;
    font-size:12px;
}

.room-message p{
    margin-top:3px;
    font-size:13px;
}

.confirm-box{
    padding:22px;
    text-align:center;
}

.confirm-box h3{
    margin-bottom:8px;
}

.confirm-box p{
    color:#777;
    font-size:13px;
    line-height:1.5;
    margin-bottom:18px;
}

.confirm-actions{
    display:flex;
    gap:8px;
}

.confirm-actions button{
    flex:1;
    padding:11px;
    border:0;
    border-radius:11px;
}

.cancel-btn{
    background:#eee;
}

.confirm-danger{
    background:#d33;
    color:white;
}

/* Friend profile modal */

.friend-profile{
    text-align:center;
    padding:20px 15px;
}

.friend-profile-avatar{
    width:82px;
    height:82px;
    border-radius:50%;
    background:#e5effa;
    color:#1976d2;
    display:flex;
    align-items:center;
    justify-content:center;
    margin:auto;
    font-size:25px;
    font-weight:bold;
}

.friend-profile h2{
    margin-top:10px;
}

.friend-profile p{
    color:#777;
    font-size:12px;
    margin-top:4px;
}

.profile-modal-actions{
    display:flex;
    gap:8px;
    margin-top:18px;
}

.profile-modal-actions button{
    flex:1;
    border:0;
    padding:11px;
    border-radius:11px;
}

.toast{
    position:fixed;
    left:50%;
    bottom:82px;
    transform:translateX(-50%) translateY(20px);
    background:#222;
    color:white;
    padding:10px 15px;
    border-radius:20px;
    font-size:12px;
    opacity:0;
    pointer-events:none;
    transition:.25s;
    z-index:200;
    max-width:90%;
    text-align:center;
}

.toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

.hidden{
    display:none!important;
}

/* =========================
   RESPONSIVE
========================= */

@media(min-width:481px){
    .bottom-nav{
        left:50%;
        transform:translateX(-50%);
    }
}

@media(max-width:350px){
    .quick-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .friend-actions{
        flex-direction:column;
    }
}
</style>
</head>

<body>

<div id="app"></div>

<!-- CHAT MODAL -->
<div class="modal" id="chatModal">
    <div class="modal-box">
        <div class="modal-header">
            <h3 id="chatModalTitle">Chat</h3>
            <button class="close-btn" onclick="closeChat()">✕</button>
        </div>

        <div class="modal-content">
            <div class="chat-window">
                <div class="chat-messages" id="chatMessages"></div>

                <div class="chat-input-row">
                    <input id="chatInput"
                           placeholder="Type a message..."
                           onkeydown="if(event.key==='Enter')sendMessage()">
                    <button class="send-btn" onclick="sendMessage()">➤</button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- ROOM MODAL -->
<div class="modal" id="roomModal">
    <div class="modal-box">
        <div class="modal-header">

/* =========================

function login(){

    const username =
        document.getElementById("loginUsername").value.trim();

    const password =
        document.getElementById("loginPassword").value;

    const users = getUsers();

    const user = users.find(
        u => u.username.toLowerCase() === username.toLowerCase()
        && u.password === password
    );

    if(!user){
        showToast("Invalid username or password.");
        return;
    }

    localStorage.setItem(
        CURRENT_USER_KEY,
        user.username
    );

    startApp();
}

/* =========================
   REGISTER
========================= */

function register(){

    const name =
        document.getElementById("registerName").value.trim();

    const username =
        document.getElementById("registerUsername").value.trim();

    const password =
        document.getElementById("registerPassword").value;

    const answer =
        document.getElementById("registerAnswer").value.trim();

    if(!name || !username || !password || !answer){
        showToast("Please complete all fields.");
        return;
    }

    if(password.length < 6){
        showToast("Password must be at least 6 characters.");
        return;
    }

    if(username.length < 3){
        showToast("Username must be at least 3 characters.");
        return;
    }

    let users = getUsers();

    if(users.some(
        u => u.username.toLowerCase() === username.toLowerCase()
    )){
        showToast("Username already exists.");
        return;
    }

    users.push({
        name:name,
        username:username,
        password:password,
        securityQuestion:"What is YAM?",
        securityAnswer:answer.toLowerCase()
    });

    saveUsers(users);

    localStorage.setItem(
        CURRENT_USER_KEY,
        username
    );

    startApp();
}

/* =========================

========================= */

function checkForgotUser(){

    const username =
        document.getElementById("forgotUsername").value.trim();

function resetPassword(username){

    const answer =
        document.getElementById("forgotAnswer").value
        .trim()
        .toLowerCase();

    let users = getUsers();

    const index = users.findIndex(
        u => u.username.toLowerCase() === username.toLowerCase()
    );

    if(index === -1){
        showToast("User not found.");
        return;
    }

    if(users[index].securityAnswer !== answer){
        showToast("Wrong security answer.");
        return;
    }

    document.getElementById("app").innerHTML = `
        <div class="auth-screen">
            <div class="auth-box">

                <div class="logo">

                           type="password"
                           placeholder="Confirm password">

                        onclick="saveNewPassword('${escapeHTML(username)}')">

                </button>

            </div>
        </div>
    `;
}

function saveNewPassword(username){

    const password =
        document.getElementById("newPassword").value;

    const confirm =
        document.getElementById("confirmPassword").value;

    if(password.length < 6){
        showToast("Password must be at least 6 characters.");
        return;
    }

    if(password !== confirm){
        showToast("Passwords do not match.");
        return;
    }

    let users = getUsers();

    const index = users.findIndex(
        u => u.username.toLowerCase() === username.toLowerCase()
    );

    if(index === -1){
        showToast("User not found.");
        return;
    }

    users[index].password = password;

    saveUsers(users);

    showToast("Password changed successfully.");

    setTimeout(showLogin,800);
}

/* =========================

function openPage(page){

        p => p.classList.remove("active")
    );

        document.getElementById("page-" + page);

    if(target){
        target.classList.add("active");
    }

    document.querySelectorAll(".nav-item").forEach(
        item => {
            item.classList.toggle(
                "active",
                item.dataset.page === page

    );

    if(page === "home") renderHome();
    if(page === "chats") renderChats();
    if(page === "friends") renderFriends();
    if(page === "rooms") renderRooms();

        top:0,
        behavior:"smooth"
    });
}

let chatData = [

        messages:[
            {

            },

let activeChat = null;

/* =========================
   CHAT HELPERS
========================= */

function getLastMessage(chat){

    if(!chat.messages || !chat.messages.length){
        return "No messages yet";
    }

    return chat.messages[chat.messages.length - 1].text;
}

function getLastTime(){

    return new Date().toLocaleTimeString([],{
        hour:"2-digit",
        minute:"2-digit"
    });
}

/* =========================
   RENDER CHATS
========================= */

let currentChatFilter = "all";

function renderChats(){

    const page =
        document.getElementById("page-chats");

    if(!page) return;

    let chats = [...chatData];

    if(currentChatFilter === "unread"){
        chats = chats.filter(c => c.unread > 0);
    }

    if(currentChatFilter === "online"){
        chats = chats.filter(c => c.online);
    }

    page.innerHTML = `

        <div class="section-title">
            <h3>Chats</h3>
            <span>${chatData.length} conversations</span>
        </div>

        <div class="search-box">
            <span class="search-icon">🔎</span>

            <input
                placeholder="Search chats..."
                oninput="filterChats(this.value)">
        </div>

        <div class="filter-row">

            <button class="filter-btn ${currentChatFilter==="all"?"active":""}"
                    onclick="setChatFilter('all')">
                All
            </button>

            <button class="filter-btn ${currentChatFilter==="unread"?"active":""}"
                    onclick="setChatFilter('unread')">
                Unread
            </button>

            <button class="filter-btn ${currentChatFilter==="online"?"active":""}"
                    onclick="setChatFilter('online')">
                Online
            </button>

        </div>

        <div id="chatList">

            ${
                chats.length
                ?
                chats.map((chat,index) => `

                    <div class="chat-card"
                         data-chat-name="${escapeHTML(chat.name)}"
                         onclick="openChat('${escapeHTML(chat.name)}')">

                        <div class="user-avatar">

                            ${escapeHTML(chat.name.charAt(0))}

                            <span class="status-dot ${
                                chat.online ? "" : "offline"
                            }"></span>

                        </div>

                        <div class="chat-main">

                            <div class="chat-name-row">

                                <span class="chat-name">
                                    ${escapeHTML(chat.name)}
                                </span>

                                <span class="chat-time">
                                    ${getLastTime()}
                                </span>

                            </div>

                            <div class="chat-preview">
                                ${escapeHTML(getLastMessage(chat))}
                            </div>

                        </div>

                        ${
                            chat.unread > 0
                            ?
                            `<div class="unread">${chat.unread}</div>`
                            :
                            ""
                        }

                    </div>

                `).join("")
                :
                `
                    <div class="empty-state">
                        <div class="empty-icon">💬</div>
                        <p>No chats found.</p>
                    </div>
                `
            }

        </div>
    `;
}

function setChatFilter(filter){

    currentChatFilter = filter;
    renderChats();
}

function filterChats(value){

    const search =
        value.toLowerCase().trim();

    document.querySelectorAll(
        "#chatList .chat-card"
    ).forEach(card => {

        const name =
            card.dataset.chatName.toLowerCase();

        card.style.display =
            name.includes(search)
            ? "flex"
            : "none";
    });
}

/* =========================
   OPEN CHAT
========================= */

function openChat(name){

    activeChat = name;

    const chat =
        chatData.find(c => c.name === name);

    if(!chat) return;

    chat.unread = 0;

    document.getElementById("chatModalTitle")
        .textContent = name;

    renderChatMessages();

    document.getElementById("chatModal")
        .classList.add("show");

    updateGlobalUnread();
    renderChats();
}

function closeChat(){

    document.getElementById("chatModal")
        .classList.remove("show");

    activeChat = null;
}

function renderChatMessages(){

    const box =
        document.getElementById("chatMessages");

    if(!box || !activeChat) return;

    const chat =
        chatData.find(c => c.name === activeChat);

    if(!chat) return;

    box.innerHTML = chat.messages.map(
        (message,index) => `

            <div class="message ${
                message.from === "me"
                ? "me"
                : "other"
            }">

                ${escapeHTML(message.text)}

                <div class="message-tools"
                     onclick="deleteMessage(${index})">
                    Delete
                </div>

            </div>
        `
    ).join("");

    box.scrollTop = box.scrollHeight;
}

/* =========================
   SEND MESSAGE
========================= */

function sendMessage(){

    if(!activeChat) return;

    const input =
        document.getElementById("chatInput");

    const text =
        input.value.trim();

    if(!text) return;

    const chat =
        chatData.find(c => c.name === activeChat);

    if(!chat) return;

    chat.messages.push({
        from:"me",
        text:text
    });

    input.value = "";

    renderChatMessages();
    renderChats();
    updateGlobalUnread();
}

/* =========================
   DELETE MESSAGE
========================= */

function deleteMessage(index){

    if(!activeChat) return;

    const chat =
        chatData.find(c => c.name === activeChat);

    if(!chat) return;

    chat.messages.splice(index,1);

    renderChatMessages();

        chatData.reduce(
            (sum,chat) => sum + chat.unread,
            0
        );

        document.getElementById("globalUnreadBadge");

    if(!badge) return;

    if(total > 0){

        badge.textContent =
            total > 99 ? "99+" : total;

        badge.classList.remove("hidden");

    }else{

        badge.classList.add("hidden");
    }
}

/* =========================
   ADD FRIEND
========================= */

function addFriendDemo(){

    const name =
        prompt("Enter username or friend name:");

    if(!name) return;

    const clean =
        name.trim();

    if(!clean) return;

    const friends =
        getFriendData();

    if(
        friends.some(
            f => f.name.toLowerCase() === clean.toLowerCase()
        )
    ){
        showToast("This person is already your friend.");
        return;
    }

    const requests =
        getFriendRequests();

    if(
        requests.some(
            r => r.name.toLowerCase() === clean.toLowerCase()
        )
    ){
        showToast("Friend request already exists.");
        return;
    }

    requests.push({
        name:clean,
        message:"wants to be your friend"
    });

    saveFriendRequests(requests);

    renderFriends();
    updateFriendRequestBadges();

    showToast("Friend request added.");
}

/* =========================
   ACCEPT FRIEND
========================= */

function acceptFriend(index){

    const requests =
        getFriendRequests();

    const request =
        requests[index];

    if(!request) return;

    const friends =
        getFriendData();

    if(
        !friends.some(
            f => f.name.toLowerCase() ===
            request.name.toLowerCase()
        )
    ){

        friends.push({
            name:request.name,
            online:true
        });
    }

    requests.splice(index,1);

    saveFriendData(friends);
    saveFriendRequests(requests);

    renderFriends();
    renderHome();
    updateFriendRequestBadges();

    showToast(
        request.name + " is now your friend."
    );
}

/* =========================
   DECLINE REQUEST
========================= */

function declineFriend(index){

    const requests =
        getFriendRequests();

    if(!requests[index]) return;

    const name =
        requests[index].name;

    requests.splice(index,1);

    saveFriendRequests(requests);

    renderFriends();
    updateFriendRequestBadges();

    showToast(
        "Friend request from " + name + " declined."
    );
}

/* =========================
   REMOVE FRIEND
========================= */

function removeFriend(name){

    askConfirm(
        "Remove Friend",
        "Remove " + name + " from your friends?",
        function(){

            let friends =
                getFriendData();

            friends =
                friends.filter(
                    f => f.name !== name
                );

            saveFriendData(friends);

            renderFriends();
            renderHome();

            showToast(
                name + " removed from friends."
            );
        }
    );
}

/* =========================
   CHANGE PASSWORD
========================= */

function changePassword(){

    const username =
        getCurrentUser();

    const users =
        getUsers();

    const index =
        users.findIndex(
            u => u.username === username
        );

    if(index === -1) return;

    const oldPassword =
        prompt("Enter current password:");

    if(oldPassword === null) return;

    if(oldPassword !== users[index].password){

        showToast("Current password is incorrect.");
        return;
    }

    const newPassword =
        prompt("Enter new password:");

    if(!newPassword) return;

    if(newPassword.length < 6){

        showToast(
            "Password must be at least 6 characters."
        );

        return;
    }

    users[index].password =
        newPassword;

    saveUsers(users);

    showToast("Password changed successfully.");
}

/* =========================
   HOME SEARCH
========================= */

function searchHome(value){

    const search =
        value.toLowerCase().trim();

    if(!search) return;

    if(
        search.includes("friend")
        ||
        search.includes("friends")
    ){

        openPage("friends");
        return;
    }

    if(
        search.includes("room")
        ||
        search.includes("rooms")
        ||
        search.includes("malaysia")
        ||
        search.includes("world")
        ||
        search.includes("automotive")
    ){

        openPage("rooms");
        return;
    }

    if(
        search.includes("profile")
        ||
        search.includes("account")
    ){

        openPage("profile");
        return;
    }

    openPage("chats");

    setTimeout(() => {

        const input =
            document.querySelector(
                "#page-chats .search-box input"
            );

        if(input){
            input.value = value;
            filterChats(value);
        }

    },100);
}

    document.getElementById(
        "confirmText"
    ).textContent = text;

    confirmCallback = callback;

    document.getElementById(
        "confirmButton"
    ).onclick = function(){

        if(confirmCallback){
            confirmCallback();
        }

        closeConfirm();
    };

    document.getElementById(
        "confirmModal"
    ).classList.add("show");
}

function closeConfirm(){

    document.getElementById(
        "confirmModal"
    ).classList.remove("show");

    confirmCallback = null;
}

/* =========================
   TOAST
========================= */

let toastTimer;

function showToast(message){

    const toast =
        document.getElementById("toast");

    if(!toast) return;

    toast.textContent = message;

    toast.classList.add("show");

    clearTimeout(toastTimer);

    toastTimer =
        setTimeout(() => {

            toast.classList.remove("show");

        },2500);
}

/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}

/* =========================
   CLOSE MODALS WHEN CLICK
   OUTSIDE
========================= */

document.addEventListener(
    "click",
    function(event){

        if(event.target.classList.contains("modal")){

            event.target.classList.remove("show");

            if(event.target.id === "chatModal"){
                activeChat = null;
            }

            if(event.target.id === "roomModal"){
                activeRoom = null;
            }

            if(event.target.id === "friendProfileModal"){
                selectedFriend = null;
            }

            if(event.target.id === "confirmModal"){
                confirmCallback = null;
            }
        }
    }
);

/* =========================
   START
========================= */

createDemoUser();

if(getCurrentUser()){

    startApp();

}else{

    showLogin();
}

</script>
