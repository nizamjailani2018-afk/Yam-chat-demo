<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YAM Chat V4.4.7</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

html,body{
    width:100%;
    overflow-x:hidden;
}

body{
    background:#eef2f7;
    color:#222;
}

button{
    border:0;
    cursor:pointer;
}

.hidden{
    display:none!important;
}

/* ================= LOGIN ================= */

#loginPage{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:linear-gradient(135deg,#2563eb,#0f172a);
}

.login-box{
    width:100%;
    max-width:420px;
    background:white;
    padding:28px;
    border-radius:20px;
    box-shadow:0 15px 40px rgba(0,0,0,.25);
}

.logo{
    text-align:center;
    font-size:42px;
    font-weight:900;
    color:#2563eb;
    margin-bottom:5px;
}

.login-sub{
    text-align:center;
    color:#777;
    margin-bottom:25px;
}

.input{
    width:100%;
    padding:13px;
    border:1px solid #ddd;
    border-radius:10px;
    margin-bottom:12px;
    outline:none;
}

.input:focus{
    border-color:#2563eb;
}

.primary-btn{
    width:100%;
    padding:13px;
    border-radius:10px;
    background:#2563eb;
    color:white;
    font-weight:bold;
}

.secondary-btn{
    width:100%;
    padding:13px;
    border-radius:10px;
    background:#eef2ff;
    color:#2563eb;
    font-weight:bold;
    margin-top:10px;
}

/* ================= APP ================= */

#app{
    display:none;
    min-height:100vh;
}

.topbar{
    position:sticky;
    top:0;
    z-index:100;
    height:58px;
    background:white;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 15px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.top-logo{
    font-size:25px;
    font-weight:900;
    color:#2563eb;
}

.top-user{
    font-weight:bold;
    color:#444;
}

.main{
    max-width:700px;
    margin:auto;
    padding:15px;
    padding-bottom:90px;
}

.page{
    display:none;
}

.page.active{
    display:block;
}

/* ================= HOME ================= */

.create-box{
    background:white;
    border-radius:18px;
    padding:15px;
    box-shadow:0 3px 12px rgba(0,0,0,.06);
    margin-bottom:15px;
}

.create-title{
    font-size:18px;
    font-weight:bold;
    margin-bottom:12px;
}

.post-options{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
}

.post-option{
    padding:13px 5px;
    border-radius:12px;
    background:#f1f5f9;
    font-weight:bold;
    color:#334155;
}

.post-option.active{
    background:#2563eb;
    color:white;
}

.post-editor{
    margin-top:12px;
}

.post-editor textarea{
    width:100%;
    min-height:100px;
    resize:none;
    border:1px solid #ddd;
    border-radius:12px;
    padding:12px;
    outline:none;
}

.media-preview{
    margin-top:10px;
}

.media-preview img,
.media-preview video{
    width:100%;
    max-height:350px;
    object-fit:contain;
    border-radius:12px;
    background:#000;
}

.editor-actions{
    display:flex;
    gap:8px;
    margin-top:10px;
}

.editor-actions button{
    flex:1;
    padding:12px;
    border-radius:10px;
    font-weight:bold;
}

.cancel-btn{
    background:#eee;
}

.post-btn{
    background:#2563eb;
    color:white;
}

/* ================= POSTS ================= */

.post-card{
    background:white;
    border-radius:18px;
    padding:15px;
    margin-bottom:15px;
    box-shadow:0 3px 12px rgba(0,0,0,.06);
}

.post-head{
    display:flex;
    align-items:center;
    gap:10px;
}

.avatar{
    width:45px;
    height:45px;
    border-radius:50%;
    object-fit:cover;
    background:#2563eb;
}

.avatar-small{
    width:35px;
    height:35px;
    border-radius:50%;
    object-fit:cover;
    background:#2563eb;
}

.post-user{
    font-weight:bold;
}

.post-time{
    font-size:12px;
    color:#888;
    margin-top:3px;
}

.post-menu{
    margin-left:auto;
    font-size:22px;
    background:transparent;
}

.post-text{
    margin:14px 0;
    white-space:pre-wrap;
    line-height:1.5;
}

.post-media{
    width:100%;
    max-height:450px;
    object-fit:contain;
    border-radius:12px;
    background:#000;
}

.post-actions{
    display:flex;
    gap:5px;
    margin-top:10px;
    border-top:1px solid #eee;
    padding-top:10px;
}

.post-actions button{
    flex:1;
    padding:9px 5px;
    border-radius:9px;
    background:#f1f5f9;
}

.post-actions button.liked{
    color:#2563eb;
    font-weight:bold;
}

.comments{
    margin-top:10px;
}

.comment{
    display:flex;
    gap:8px;
    margin-top:9px;
}

.comment-body{
    flex:1;
    background:#f1f5f9;
    border-radius:12px;
    padding:8px 10px;
}

.comment-name{
    font-weight:bold;
    font-size:13px;
}

.comment-text{
    margin-top:3px;
    white-space:pre-wrap;
}

.comment-input{
    display:flex;
    gap:7px;
    margin-top:10px;
}

.comment-input input{
    flex:1;
    border:1px solid #ddd;
    border-radius:10px;
    padding:10px;
}

.comment-input button{
    background:#2563eb;
    color:white;
    padding:0 15px;
    border-radius:10px;
}

/* ================= FRIENDS ================= */

.section-title{
    font-size:22px;
    font-weight:bold;
    margin-bottom:15px;
}

.friend-card{
    background:white;
    border-radius:15px;
    padding:12px;
    margin-bottom:10px;
    display:flex;
    align-items:center;
    gap:12px;
    box-shadow:0 3px 10px rgba(0,0,0,.05);
}

.friend-info{
    flex:1;
}

.friend-name{
    font-weight:bold;
}

.friend-status{
    color:#777;
    font-size:13px;
    margin-top:4px;
}

.chat-btn{
    background:#2563eb;
    color:white;
    padding:9px 13px;
    border-radius:9px;
    font-weight:bold;
}

/* ================= ROOMS ================= */

.room-card{
    background:white;
    padding:16px;
    border-radius:16px;
    margin-bottom:10px;
    box-shadow:0 3px 10px rgba(0,0,0,.05);
    cursor:pointer;
}

.room-name{
    font-weight:bold;
    font-size:17px;
}

.room-region{
    color:#777;
    margin-top:5px;
    font-size:13px;
}

/* ================= PROFILE ================= */

#profilePage{
    margin-left:-15px;
    margin-right:-15px;
    margin-top:-15px;
}

.profile-main{
    position:relative;
    min-height:calc(100vh - 58px);
    border-radius:0;
    overflow:hidden;
    box-shadow:0 3px 12px rgba(0,0,0,.08);

    background-image:linear-gradient(
        135deg,
        #2563eb,
        #111827
    );

    background-size:cover;
    background-position:center top;
    background-repeat:no-repeat;
}

.profile-main::before{
    content:"";
    position:absolute;
    inset:0;
    background:rgba(0,0,0,.22);
    z-index:0;
    pointer-events:none;
}

.profile-main > *{
    position:relative;
    z-index:1;
}

/* ================= FULL SCREEN COVER ================= */

.profile-cover{
    width:100vw;
    height:360px;

    margin-left:calc(50% - 50vw);
    margin-right:calc(50% - 50vw);

    background:transparent;

    background-size:cover;
    background-position:center;

    position:relative;
    overflow:visible;

    z-index:2;
}

.cover-dark{
    position:absolute;
    inset:0;

    background:linear-gradient(
        to bottom,
        rgba(0,0,0,.05),
        rgba(0,0,0,.32)
    );

    pointer-events:none;
}

/* ================= MUSIC BUTTON ================= */

.profile-music-button{
    position:absolute;
    top:15px;
    left:15px;

    width:44px;
    height:44px;
    min-width:44px;
    min-height:44px;

    padding:0;

    border-radius:50%;

    background:rgba(255,255,255,.96);
    color:#222;

    font-size:21px;

    display:flex;
    align-items:center;
    justify-content:center;

    box-shadow:0 3px 12px rgba(0,0,0,.22);

    z-index:50;

    transition:.15s;
}

.profile-music-button:hover{
    background:white;
    transform:scale(1.05);
}

.profile-music-button:active{
    transform:scale(.96);
}

/* ================= CAMERA + THREE DOT ================= */

.profile-top-actions{
    position:absolute;

    top:15px;
    right:15px;

    display:flex;
    align-items:center;
    justify-content:flex-end;

    gap:8px;

    z-index:50;
}

.profile-top-actions button{
    width:44px;
    height:44px;

    min-width:44px;
    min-height:44px;

    padding:0;

    border-radius:50%;

    background:rgba(255,255,255,.96);
    color:#222;

    font-size:21px;

    display:flex;
    align-items:center;
    justify-content:center;

    box-shadow:0 3px 12px rgba(0,0,0,.22);

    transition:.15s;
}

.profile-top-actions button:hover{
    background:white;
    transform:scale(1.05);
}

/* ================= THREE DOT MENU ================= */

.profile-menu-wrap{
    position:relative;

    display:flex;
    justify-content:flex-end;
}

.profile-menu{
    position:absolute;

    top:52px;
    right:0;

    width:220px;

    background:white;

    border-radius:14px;

    padding:6px;

    box-shadow:0 8px 25px rgba(0,0,0,.25);

    border:1px solid rgba(0,0,0,.08);

    z-index:1000;
}

.profile-menu::before{
    content:"";

    position:absolute;

    top:-7px;
    right:14px;

    width:14px;
    height:14px;

    background:white;

    transform:rotate(45deg);

    border-left:1px solid rgba(0,0,0,.08);
    border-top:1px solid rgba(0,0,0,.08);
}

.profile-menu-item{
    position:relative;

    z-index:2;

    padding:13px 12px;

    border-radius:9px;

    cursor:pointer;

    font-weight:600;

    background:white;
}

.profile-menu-item:hover{
    background:#f1f5f9;
}

.profile-menu-item.logout-item{
    color:#dc2626;
}

/* ================= PROFILE PICTURE ================= */

/*
    V4.4.7
    Semua kandungan profile dinaikkan
    lebih kurang 35px supaya ruang
    kosong di atas lebih kecil.
*/

.profile-picture-wrap{
    padding:0 18px;

    margin-top:-95px;

    position:relative;

    z-index:20;
}

.profile-picture-box{
    position:relative;

    width:115px;
    height:115px;

    display:block;
}

.profile-picture{
    width:115px;
    height:115px;

    border-radius:50%;

    border:5px solid white;

    object-fit:cover;

    background:#2563eb;

    box-shadow:0 4px 14px rgba(0,0,0,.25);

    display:block;
}

.profile-picture-camera{
    position:absolute;

    right:-3px;
    bottom:-3px;

    width:40px;
    height:40px;

    min-width:40px;
    min-height:40px;

    padding:0;

    border-radius:50%;

    background:#2563eb;

    color:white;

    font-size:19px;

    line-height:1;

    display:flex;
    align-items:center;
    justify-content:center;

    box-shadow:0 3px 10px rgba(0,0,0,.35);

    border:3px solid white;

    z-index:9999;

    cursor:pointer;

    transition:.15s;
}

.profile-picture-camera:hover{
    transform:scale(1.08);
    background:#1d4ed8;
}

.profile-picture-camera:active{
    transform:scale(.96);
}

.profile-name{
    font-size:25px;
    font-weight:bold;

    margin-top:10px;

    color:white;

    text-shadow:0 2px 6px rgba(0,0,0,.45);
}

.profile-username{
    color:rgba(255,255,255,.85);

    font-size:13px;

    margin-top:3px;

    text-shadow:0 1px 4px rgba(0,0,0,.4);
}

.profile-status{
    color:white;

    margin-top:8px;

    cursor:pointer;

    text-shadow:0 1px 5px rgba(0,0,0,.45);
}

.profile-bio{
    color:white;

    margin-top:10px;

    line-height:1.5;

    white-space:pre-wrap;

    text-shadow:0 1px 5px rgba(0,0,0,.45);
}

/* ================= PROFILE BUTTONS ================= */

.profile-buttons{
    display:grid;

    grid-template-columns:repeat(2,1fr);

    gap:8px;

    padding:16px;
}

.profile-buttons button{
    padding:12px 8px;

    border-radius:11px;

    background:rgba(255,255,255,.88);

    color:#2563eb;

    font-weight:bold;

    box-shadow:0 3px 10px rgba(0,0,0,.12);
}

/* ================= INFO ================= */

.info-title{
    padding:15px 15px 5px;

    font-size:18px;

    font-weight:bold;

    color:white;

    text-shadow:0 1px 5px rgba(0,0,0,.45);
}

.info-list{
    padding:0 15px 15px;
}

.info-row{
    padding:12px 14px;

    margin-top:7px;

    border-bottom:1px solid rgba(255,255,255,.3);

    background:rgba(255,255,255,.78);

    border-radius:10px;
}

.info-label{
    color:#555;

    font-size:12px;

    margin-bottom:3px;
}

.info-value{
    font-weight:500;
    color:#222;
}

/* ================= MUSIC ================= */

.music-box{
    margin:0 15px 15px;

    background:rgba(255,255,255,.90);

    padding:14px;

    border-radius:14px;

    box-shadow:0 3px 10px rgba(0,0,0,.12);
}

.music-title{
    font-weight:bold;

    margin-bottom:9px;
}

.music-box audio{
    width:100%;
}

.music-buttons{
    display:flex;

    gap:8px;

    margin-top:9px;
}

.music-buttons button{
    flex:1;

    padding:9px;

    border-radius:9px;
}

/* ================= BOTTOM NAV ================= */

.bottom-nav{
    position:fixed;

    left:0;
    right:0;
    bottom:0;

    z-index:200;

    height:65px;

    background:white;

    display:grid;

    grid-template-columns:repeat(4,1fr);

    box-shadow:0 -2px 12px rgba(0,0,0,.1);
}

.nav-btn{
    background:white;

    color:#777;

    font-size:12px;

    display:flex;
    flex-direction:column;

    align-items:center;
    justify-content:center;

    gap:3px;
}

.nav-btn span{
    font-size:21px;
}

.nav-btn.active{
    color:#2563eb;

    font-weight:bold;
}

/* ================= MODAL ================= */

.modal-bg{
    position:fixed;

    inset:0;

    z-index:500;

    background:rgba(0,0,0,.55);

    display:none;

    align-items:center;
    justify-content:center;

    padding:18px;
}

.modal-bg.show{
    display:flex;
}

.modal{
    width:100%;

    max-width:500px;

    max-height:90vh;

    overflow:auto;

    background:white;

    border-radius:18px;

    padding:20px;
}

.modal-title{
    font-size:20px;

    font-weight:bold;

    margin-bottom:15px;
}

.modal-actions{
    display:flex;

    gap:8px;

    margin-top:15px;
}

.modal-actions button{
    flex:1;

    padding:12px;

    border-radius:10px;

    font-weight:bold;
}

.modal-ok{
    background:#2563eb;
    color:white;
}

.modal-cancel{
    background:#eee;
}

/* ================= CHAT ================= */

.chat-overlay{
    position:fixed;

    inset:0;

    z-index:400;

    background:#eef2f7;

    display:none;

    flex-direction:column;
}

.chat-overlay.show{
    display:flex;
}

.chat-head{
    height:60px;

    background:white;

    display:flex;

    align-items:center;

    gap:10px;

    padding:0 12px;

    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.chat-back{
    font-size:25px;

    background:transparent;
}

.chat-title{
    font-weight:bold;
}

.chat-body{
    flex:1;

    overflow:auto;

    padding:15px;
}

.chat-message{
    max-width:75%;

    padding:10px 12px;

    border-radius:15px;

    margin-bottom:9px;

    background:white;

    box-shadow:0 2px 5px rgba(0,0,0,.05);
}

.chat-message.mine{
    margin-left:auto;

    background:#2563eb;

    color:white;
}

.chat-foot{
    background:white;

    padding:10px;

    display:flex;

    gap:8px;
}

.chat-foot input{
    flex:1;

    padding:12px;

    border:1px solid #ddd;

    border-radius:12px;
}

.chat-foot button{
    padding:0 17px;

    border-radius:12px;

    background:#2563eb;

    color:white;
}

/* ================= EMPTY ================= */

.empty{
    text-align:center;

    padding:35px 15px;

    color:#888;

    background:white;

    border-radius:16px;
}

/* ================= RESPONSIVE ================= */

@media(max-width:430px){

    .profile-cover{
        height:330px;
    }

    .profile-picture-box{
        width:105px;
        height:105px;
    }

    .profile-picture{
        width:105px;
        height:105px;
    }

    .profile-picture-camera{
        width:37px;
        height:37px;

        min-width:37px;
        min-height:37px;

        font-size:17px;

        right:-3px;
        bottom:-3px;
    }

    /*
        V4.4.7
        Mobile juga dinaikkan lebih kurang 35px.
    */

    .profile-picture-wrap{
        margin-top:-90px;
    }

    .profile-menu{
        width:195px;
    }

    .profile-buttons{
        grid-template-columns:1fr 1fr;
    }

}

</style>
</head>

<body>

<!-- ================= LOGIN ================= -->

<div id="loginPage">

    <div class="login-box">

        <div class="logo">
            YAM
        </div>

        <div class="login-sub">
            Chat • Friends • Rooms • Social
        </div>

        <input
            id="loginUsername"
            class="input"
            placeholder="Username">

        <input
            id="loginPassword"
            class="input"
            type="password"
            placeholder="Password">

        <button
            class="primary-btn"
            onclick="login()">
            🔐 LOGIN
        </button>

        <button
            class="secondary-btn"
            onclick="register()">
            📝 DAFTAR AKAUN
        </button>

    </div>

</div>


<!-- ================= APP ================= -->

<div id="app">

    <div class="topbar">

        <div class="top-logo">
            YAM
        </div>

        <div
            id="topUser"
            class="top-user">
        </div>

    </div>


    <main class="main">

        <!-- ================= HOME ================= -->

        <section
            id="homePage"
            class="page active">

            <div class="create-box">

                <div class="create-title">
                    📝 Apa yang anda mahu post?
                </div>

                <div class="post-options">

                    <button
                        id="textPostBtn"
                        class="post-option active"
                        onclick="selectPostType('text')">
                        📝 TULISAN
                    </button>

                    <button
                        id="imagePostBtn"
                        class="post-option"
                        onclick="selectPostType('image')">
                        🖼️ GAMBAR
                    </button>

                    <button
                        id="videoPostBtn"
                        class="post-option"
                        onclick="selectPostType('video')">
                        🎥 VIDEO
                    </button>

                </div>


                <div
                    id="postEditor"
                    class="post-editor">

                    <textarea
                        id="postText"
                        placeholder="Apa yang anda fikirkan?"></textarea>

                    <div
                        id="mediaPreview"
                        class="media-preview">
                    </div>

                    <div class="editor-actions">

                        <button
                            class="cancel-btn"
                            onclick="cancelPost()">
                            Batal
                        </button>

                        <button
                            class="post-btn"
                            onclick="createPost()">
                            🚀 POST
                        </button>

                    </div>

                </div>

            </div>

            <div id="feed"></div>

        </section>


        <!-- ================= FRIENDS ================= -->

        <section
            id="friendsPage"
            class="page">

            <div class="section-title">
                👥 Friends
            </div>

            <div id="friendsList"></div>

        </section>


        <!-- ================= ROOMS ================= -->

        <section
            id="roomsPage"
            class="page">

            <div class="section-title">
                🌎 YAM Rooms
            </div>

            <div id="roomsList"></div>

        </section>


        <!-- ================= PROFILE ================= -->

        <section
            id="profilePage"
            class="page">

            <div class="profile-main">

                <div
                    id="profileCover"
                    class="profile-cover">

                    <div class="cover-dark"></div>

                    <button
                        type="button"
                        class="profile-music-button"
                        onclick="openMusic()"
                        title="Music">
                        🎵
                    </button>


                    <div class="profile-top-actions">

                        <button
                            type="button"
                            onclick="changeCover()"
                            title="Tukar Background Cover">
                            📷
                        </button>

                        <div class="profile-menu-wrap">

                            <button
                                type="button"
                                onclick="openProfileMenu()"
                                title="Menu Profile">
                                ⋮
                            </button>

                            <div
