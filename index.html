<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Y-M Chat V1.9.3</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

html,body{
    width:100%;
    min-height:100%;
    background:#eef3f8;
    color:#222;
}

button,input,select{
    font-family:Arial,sans-serif;
}

button{
    cursor:pointer;
}

.app{
    width:100%;
    max-width:480px;
    min-height:100vh;
    margin:auto;
    background:#fff;
    position:relative;
    overflow:hidden;
}

/* =========================
   AUTH
========================= */

.auth{
    min-height:100vh;
    padding:35px 22px;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(160deg,#1976d2,#42a5f5);
}

.auth-box{
    width:100%;
    background:#fff;
    border-radius:22px;
    padding:28px 22px;
    box-shadow:0 12px 35px rgba(0,0,0,.18);
}

.logo{
    text-align:center;
    margin-bottom:24px;
}

.logo h1{
    color:#1976d2;
    font-size:42px;
    letter-spacing:2px;
}

.logo p{
    color:#777;
    font-size:13px;
    margin-top:5px;
}

.auth-title{
    font-size:23px;
    margin-bottom:18px;
    text-align:center;
}

.input-group{
    margin-bottom:14px;
}

.input-group label{
    display:block;
    font-size:13px;
    font-weight:bold;
    color:#555;
    margin-bottom:6px;
}

.input-group input,
.input-group select{
    width:100%;
    padding:13px 14px;
    border:1px solid #d5dce3;
    border-radius:11px;
    outline:none;
    font-size:15px;
    background:#fff;
}

.input-group input:focus,
.input-group select:focus{
    border-color:#1976d2;
}

.primary-btn{
    width:100%;
    border:none;
    background:#1976d2;
    color:white;
    padding:13px;
    border-radius:11px;
    font-size:16px;
    font-weight:bold;
    margin-top:5px;
}

.primary-btn:hover{
    background:#1565c0;
}

.secondary-btn{
    width:100%;
    border:1px solid #1976d2;
    background:white;
    color:#1976d2;
    padding:12px;
    border-radius:11px;
    font-size:15px;
    font-weight:bold;
    margin-top:10px;
}

.auth-links{
    text-align:center;
    margin-top:17px;
    font-size:14px;
}

.auth-links span{
    color:#1976d2;
    font-weight:bold;
    cursor:pointer;
}

.auth-message{
    min-height:20px;
    text-align:center;
    margin:8px 0;
    font-size:13px;
    color:#d32f2f;
}

/* =========================
   APP HEADER
========================= */

.page{
    min-height:100vh;
    padding-bottom:72px;
    background:#f7f9fb;
}

.header{
    height:62px;
    background:#1976d2;
    color:white;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 17px;
    position:sticky;
    top:0;
    z-index:20;
}

.header-title{
    font-size:21px;
    font-weight:bold;
}

.header-actions{
    display:flex;
    gap:7px;
}

.icon-btn{
    border:none;
    background:rgba(255,255,255,.16);
    color:white;
    width:38px;
    height:38px;
    border-radius:50%;
    font-size:18px;
}

/* =========================
   HOME
========================= */

.home-content{
    padding:16px;
}

.welcome-card{
    background:linear-gradient(135deg,#1976d2,#42a5f5);
    color:white;
    padding:20px;
    border-radius:17px;
    margin-bottom:17px;
    box-shadow:0 5px 16px rgba(25,118,210,.2);
}

.welcome-card h2{
    font-size:22px;
    margin-bottom:7px;
}

.welcome-card p{
    font-size:14px;
    opacity:.95;
}

.section-title{
    font-size:17px;
    font-weight:bold;
    margin:18px 2px 10px;
}

.quick-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:11px;
}

.quick-card{
    border:none;
    background:#fff;
    border-radius:15px;
    padding:18px 12px;
    text-align:left;
    box-shadow:0 2px 9px rgba(0,0,0,.07);
}

.quick-icon{
    font-size:27px;
    margin-bottom:8px;
}

.quick-card strong{
    display:block;
    font-size:15px;
}

.quick-card small{
    display:block;
    color:#777;
    margin-top:4px;
}

.status-card{
    background:#fff;
    border-radius:15px;
    padding:15px;
    margin-top:15px;
    box-shadow:0 2px 9px rgba(0,0,0,.07);
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.status-left{
    display:flex;
    align-items:center;
    gap:11px;
}

.status-dot{
    width:12px;
    height:12px;
    background:#25c46a;
    border-radius:50%;
}

/* =========================
   LIST
========================= */

.content{
    padding:12px 15px;
}

.search{
    width:100%;
    border:1px solid #dce2e8;
    border-radius:12px;
    padding:12px 14px;
    outline:none;
    background:white;
    margin-bottom:12px;
}

.list-item{
    background:white;
    padding:13px;
    border-radius:14px;
    margin-bottom:9px;
    display:flex;
    align-items:center;
    gap:12px;
    box-shadow:0 2px 8px rgba(0,0,0,.06);
}

.avatar{
    width:47px;
    height:47px;
    min-width:47px;
    border-radius:50%;
    background:#1976d2;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:19px;
    font-weight:bold;
}

.avatar.online{
    position:relative;
}

.avatar.online:after{
    content:"";
    position:absolute;
    width:11px;
    height:11px;
    background:#22c55e;
    border:2px solid white;
    border-radius:50%;
    right:0;
    bottom:1px;
}

.item-info{
    flex:1;
    min-width:0;
}

.item-info strong{
    display:block;
    font-size:15px;
}

.item-info small{
    display:block;
    color:#777;
    margin-top:4px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.item-btn{
    border:none;
    background:#e8f1fc;
    color:#1976d2;
    border-radius:9px;
    padding:8px 10px;
    font-weight:bold;
}

/* =========================
   ROOMS
========================= */

.room-banner{
    background:#fff;
    margin-bottom:12px;
    border-radius:14px;
    padding:16px;
    box-shadow:0 2px 8px rgba(0,0,0,.06);
}

.room-banner h3{
    margin-bottom:5px;
}

.room-banner p{
    font-size:13px;
    color:#777;
}

.room-item{
    background:#fff;
    border-radius:14px;
    padding:14px;
    margin-bottom:10px;
    display:flex;
    align-items:center;
    gap:12px;
    box-shadow:0 2px 8px rgba(0,0,0,.06);
}

.room-icon{
    width:48px;
    height:48px;
    border-radius:13px;
    background:#e7f0fb;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:24px;
}

.room-info{
    flex:1;
}

.room-info strong{
    display:block;
}

.room-info small{
    display:block;
    color:#777;
    margin-top:4px;
}

/* =========================
   PROFILE
========================= */

.profile-cover{
    height:165px;
    background:linear-gradient(135deg,#1976d2,#64b5f6);
    position:relative;
}

.profile-cover-edit{
    position:absolute;
    right:12px;
    top:12px;
    width:37px;
    height:37px;
    border:none;
    border-radius:50%;
    background:rgba(0,0,0,.28);
    color:white;
    font-size:19px;
}

.profile-main{
    background:white;
    position:relative;
    padding:0 16px 20px;
}

.profile-avatar{
    width:92px;
    height:92px;
    border-radius:50%;
    background:#1976d2;
    border:5px solid white;
    color:white;
    font-size:35px;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-top:-46px;
    position:relative;
    z-index:2;
}

.profile-camera{
    position:absolute;
    top:7px;
    left:78px;
    width:30px;
    height:30px;
    border:none;
    background:#1976d2;
    color:white;
    border-radius:50%;
    font-size:14px;
}

.cover-camera{
    position:absolute;
    right:58px;
    top:12px;
    width:37px;
    height:37px;
    border:none;
    border-radius:50%;
    background:rgba(0,0,0,.28);
    color:white;
}

.profile-name{
    margin-top:10px;
    font-size:22px;
}

.profile-username{
    color:#777;
    margin-top:4px;
}

.profile-actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:9px;
    margin-top:15px;
}

.profile-action{
    border:none;
    background:#eef5fc;
    color:#1976d2;
    padding:11px;
    border-radius:10px;
    font-weight:bold;
}

.profile-section{
    margin-top:17px;
}

.info-row{
    padding:13px 0;
    border-bottom:1px solid #edf0f3;
    display:flex;
    justify-content:space-between;
    gap:15px;
}

.info-row span:first-child{
    color:#777;
}

.privacy-btn{
    border:none;
    background:#e9f2fd;
    color:#1976d2;
    border-radius:8px;
    padding:6px 9px;
    font-size:12px;
}

/* =========================
   SETTINGS
========================= */

.settings-card{
    background:white;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 2px 8px rgba(0,0,0,.06);
}

.setting-row{
    min-height:55px;
    padding:12px 14px;
    border-bottom:1px solid #edf0f3;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
}

.setting-row:last-child{
    border-bottom:none;
}

.setting-left{
    display:flex;
    align-items:center;
    gap:11px;
}

.setting-icon{
    width:35px;
    height:35px;
    border-radius:9px;
    background:#edf4fc;
    display:flex;
    align-items:center;
    justify-content:center;
}

/* =========================
   CHAT
========================= */

.chat-page{
    min-height:100vh;
    padding-bottom:64px;
    background:#eaf0f5;
}

.chat-header{
    height:61px;
    background:#1976d2;
    color:white;
    display:flex;
    align-items:center;
    padding:0 10px;
    gap:9px;
    position:sticky;
    top:0;
    z-index:20;
}

.back-btn{
    border:none;
    background:transparent;
    color:white;
    font-size:25px;
    width:35px;
}

.chat-user{
    flex:1;
}

.chat-user strong{
    display:block;
}

.chat-user small{
    font-size:11px;
    opacity:.85;
}

.chat-menu{
    border:none;
    background:transparent;
    color:white;
    font-size:22px;
}

.messages{
    padding:15px 12px;
    min-height:calc(100vh - 125px);
    padding-bottom:75px;
}

.message{
    max-width:78%;
    margin-bottom:10px;
    padding:10px 12px;
    border-radius:15px;
    font-size:14px;
    position:relative;
}

.message.me{
    margin-left:auto;
    background:#1976d2;
    color:white;
    border-bottom-right-radius:4px;
}

.message.them{
    margin-right:auto;
    background:white;
    border-bottom-left-radius:4px;
}

.message-time{
    font-size:9px;
    opacity:.65;
    margin-top:4px;
    text-align:right;
}

.message-delete{
    position:absolute;
    top:-7px;
    right:-7px;
    width:21px;
    height:21px;
    border:none;
    border-radius:50%;
    background:#ef4444;
    color:white;
    font-size:11px;
}

.chat-input{
    position:fixed;
    bottom:0;
    width:100%;
    max-width:480px;
    background:white;
    padding:9px;
    display:flex;
    gap:7px;
    border-top:1px solid #dfe4e9;
    z-index:30;
}

.chat-input input{
    flex:1;
    border:1px solid #d5dce3;
    border-radius:22px;
    padding:11px 14px;
    outline:none;
}

.send-btn{
    width:44px;
    height:44px;
    border:none;
    border-radius:50%;
    background:#1976d2;
    color:white;
    font-size:18px;
}

/* =========================
   ROOM CHAT
========================= */

.room-chat-info{
    background:white;
    padding:10px 14px;
    font-size:12px;
    color:#666;
    text-align:center;
    border-bottom:1px solid #ddd;
}

.room-system{
    text-align:center;
    font-size:11px;
    color:#888;
    margin:10px;
}

/* =========================
   BOTTOM NAV
========================= */

.bottom-nav{
    position:fixed;
    bottom:0;
    width:100%;
    max-width:480px;
    height:65px;
    background:white;
    border-top:1px solid #dfe4e9;
    display:grid;
    grid-template-columns:repeat(5,1fr);
    z-index:25;
}

.nav-btn{
    border:none;
    background:white;
    color:#777;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:3px;
    font-size:11px;
}

.nav-btn .nav-icon{
    font-size:21px;
}

.nav-btn.active{
    color:#1976d2;
    font-weight:bold;
}

/* =========================
   MODAL
========================= */

.modal-bg{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.45);
    display:none;
    align-items:flex-end;
    justify-content:center;
    z-index:100;
}

.modal{
    width:100%;
    max-width:480px;
    background:white;
    border-radius:20px 20px 0 0;
    padding:20px;
    animation:slideUp .2s ease;
}

@keyframes slideUp{
    from{
        transform:translateY(100%);
    }
    to{
        transform:translateY(0);
    }
}

.modal h3{
    margin-bottom:14px;
}

.modal-option{
    width:100%;
    border:none;
    background:#f5f7f9;
    padding:14px;
    margin-bottom:8px;
    border-radius:10px;
    text-align:left;
    font-weight:bold;
}

.modal-close{
    width:100%;
    border:none;
    background:#1976d2;
    color:white;
    padding:13px;
    border-radius:10px;
    margin-top:7px;
    font-weight:bold;
}

/* =========================
   EMPTY
========================= */

.empty{
    text-align:center;
    padding:50px 20px;
    color:#888;
}

.empty-icon{
    font-size:45px;
    margin-bottom:10px;
}

/* =========================
   TOAST
========================= */

.toast{
    position:fixed;
    left:50%;
    bottom:82px;
    transform:translateX(-50%);
    background:#222;
    color:white;
    padding:10px 16px;
    border-radius:20px;
    font-size:13px;
    display:none;
    z-index:200;
    max-width:90%;
    text-align:center;
}

/* =========================
   RESPONSIVE
========================= */

@media(min-width:481px){
    .chat-input,
    .bottom-nav{
        left:50%;
        transform:translateX(-50%);
    }
}
</style>
</head>

<body>

<div id="app"></div>

<div class="toast" id="toast"></div>

<div class="modal-bg" id="modalBg">
    <div class="modal" id="modalContent"></div>
</div>

<script>

/* =========================================================
   Y-M CHAT V1.9.3
   LOCAL DEMO VERSION
========================================================= */

const APP_VERSION = "V1.9.3";

let currentUser = JSON.parse(localStorage.getItem("ym_currentUser")) || null;

let users = JSON.parse(localStorage.getItem("ym_users")) || [];

let chats = JSON.parse(localStorage.getItem("ym_chats")) || {};

let currentPage = "home";

let currentChatUser = null;

let currentRoom = null;


/* =========================================================
   DEFAULT USERS
========================================================= */

function createDefaultUsers(){

    if(users.length === 0){

        users = [
            {
                name:"Ahmad",
                username:"ahmad",
                password:"123456",
                question:"What is your favourite colour?",
                answer:"blue",
                status:"Online"
            },
            {
                name:"Siti",
                username:"siti",
                password:"123456",
                question:"What is your favourite food?",
                answer:"nasi",
                status:"Online"
            },
            {
                name:"John",
                username:"john",
                password:"123456",
                question:"What is your favourite sport?",
                answer:"football",
                status:"Busy"
            }
        ];

        saveUsers();
    }
}

createDefaultUsers();


/* =========================================================
   STORAGE
========================================================= */

function saveUsers(){
    localStorage.setItem("ym_users",JSON.stringify(users));
}

function saveChats(){
    localStorage.setItem("ym_chats",JSON.stringify(chats));
}

function saveCurrentUser(){
    if(currentUser){
        localStorage.setItem(
            "ym_currentUser",
            JSON.stringify(currentUser)
        );
    }else{
        localStorage.removeItem("ym_currentUser");
    }
}


/* =========================================================
   HELPERS
========================================================= */

function getInitial(name){

    if(!name) return "?";

    return name.charAt(0).toUpperCase();
}

function escapeHTML(text){

    return String(text)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}

function timeNow(){

    return new Date().toLocaleTimeString([],{
        hour:"2-digit",
        minute:"2-digit"
    });
}

function showToast(text){

    const toast = document.getElementById("toast");

    toast.innerText = text;
    toast.style.display = "block";

    clearTimeout(window.toastTimer);

    window.toastTimer = setTimeout(()=>{
        toast.style.display = "none";
    },2200);
}


/* =========================================================
   AUTH SCREEN
========================================================= */

function renderLogin(){

    document.getElementById("app").innerHTML = `

    <div class="auth">

        <div class="auth-box">

            <div class="logo">
                <h1>Y-M</h1>
                <p>Connect. Chat. Meet.</p>
            </div>

            <div class="auth-title">
                Welcome Back
            </div>

            <div class="input-group">
                <label>Username</label>
                <input
                    id="loginUsername"
                    type="text"
                    placeholder="Enter username"
                >
            </div>

            <div class="input-group">
                <label>Password</label>
                <input
                    id="loginPassword"
                    type="password"
                    placeholder="Enter password"
                >
            </div>

            <div class="auth-message" id="loginMessage"></div>

            <button
                class="primary-btn"
                onclick="login()"
            >
                Login
            </button>

            <div class="auth-links">
                <span onclick="renderRegister()">
                    Create Account
                </span>
                &nbsp; • &nbsp;
                <span onclick="renderForgot()">
                    Forgot Password?
                </span>
            </div>

        </div>

    </div>
    `;
}


/* =========================================================
   REGISTER
========================================================= */

function renderRegister(){

    document.getElementById("app").innerHTML = `

    <div class="auth">

        <div class="auth-box">

            <div class="logo">
                <h1>Y-M</h1>
                <p>Create your Y-M account</p>
            </div>

            <div class="auth-title">
                Register
            </div>

            <div class="input-group">
                <label>Name</label>
                <input
                    id="regName"
                    type="text"
                    placeholder="Your name"
                >
            </div>

            <div class="input-group">
                <label>Username</label>
                <input
                    id="regUsername"
                    type="text"
                    placeholder="Choose username"
                >
            </div>

            <div class="input-group">
                <label>Password</label>
                <input
                    id="regPassword"
                    type="password"
                    placeholder="Create password"
                >
            </div>

            <div class="input-group">
                <label>Security Question</label>

                <select id="regQuestion">

                    <option value="">
                        Select a question
                    </option>

                    <option>
                        What is your favourite colour?
                    </option>

                    <option>
                        What is your favourite food?
                    </option>

                    <option>
                        What is your favourite sport?
                    </option>

                    <option>
                        What is your favourite place?
                    </option>

                </select>

            </div>

            <div class="input-group">
                <label>Your Answer</label>

                <input
                    id="regAnswer"
                    type="text"
                    placeholder="Security answer"
                >

            </div>

            <div class="auth-message" id="registerMessage"></div>

            <button
                class="primary-btn"
                onclick="registerUser()"
            >
                Create Account
            </button>

            <button
                class="secondary-btn"
                onclick="renderLogin()"
            >
                Back to Login
            </button>

        </div>

    </div>
    `;

/* =========================================================
   FORGOT PASSWORD
========================================================= */

function renderForgot(){

    document.getElementById("app").innerHTML = `

    <div class="auth">

        <div class="auth-box">

            <div class="logo">
                <h1>Y-M</h1>
                <p>Account Security</p>
            </div>

            <div class="auth-title">
                Forgot Password
            </div>

            <div class="input-group">
                <label>Username</label>

                <input
                    id="forgotUsername"
                    type="text"
                    placeholder="Enter your username"
                >

            </div>

            <div class="auth-message" id="forgotMessage"></div>

            <button
                class="primary-btn"
                onclick="findSecurityQuestion()"
            >
                Continue
            </button>

            <button
                class="secondary-btn"
                onclick="renderLogin()"
            >
                Back to Login
            </button>

        </div>

    </div>
    `;

/* =========================================================
   REGISTER FUNCTION
========================================================= */

function registerUser(){

    const name =
        document.getElementById("regName").value.trim();

    const username =
        document.getElementById("regUsername").value.trim().toLowerCase();

    const password =
        document.getElementById("regPassword").value;

    const question =
        document.getElementById("regQuestion").value;

    const answer =
        document.getElementById("regAnswer").value.trim().toLowerCase();

    const message =
        document.getElementById("registerMessage");


    if(!name || !username || !password || !question || !answer){

        message.innerText =
            "Please complete all fields.";

        return;
    }


    if(username.length < 3){

        message.innerText =
            "Username must contain at least 3 characters.";

        return;
    }


    if(password.length < 6){

        message.innerText =
            "Password must contain at least 6 characters.";

        return;
    }


    if(users.some(u=>u.username === username)){

        message.innerText =
            "Username already exists.";

        return;
    }


    users.push({

        name:name,

        username:username,

        password:password,

        question:question,

        answer:answer,

        status:"Online"

    });


    saveUsers();


    showToast("Account created successfully.");

    renderLogin();
}


/* =========================================================
   LOGIN
========================================================= */

function login(){

    const username =
        document.getElementById("loginUsername").value
        .trim()
        .toLowerCase();

    const password =
        document.getElementById("loginPassword").value;

    const message =
        document.getElementById("loginMessage");


    const user =
        users.find(u =>
            u.username === username &&
            u.password === password
        );


    if(!user){

        message.innerText =
            "Invalid username or password.";

        return;
    }


    user.status = "Online";

    currentUser = user;

    saveUsers();

    saveCurrentUser();

    currentPage = "home";

    renderApp();

}

/* =========================================================
   VERIFY SECURITY
========================================================= */

function verifySecurity(username){

    const answer =
        document.getElementById("securityAnswer")
        .value
        .trim()
        .toLowerCase();

    const message =
        document.getElementById("securityMessage");


    const user =
        users.find(u=>u.username === username);


    if(!user || answer !== user.answer){

        message.innerText =
            "Incorrect answer.";

        return;
    }


    document.getElementById("app").innerHTML = `

    <div class="auth">

        <div class="auth-box">

            <div class="logo">
                <h1>Y-M</h1>
                <p>Account Security</p>

                Change Password

            <div class="input-group">

}


/* =========================================================
   CHANGE FORGOT PASSWORD
========================================================= */

function changeForgotPassword(username){

    const newPassword =
        document.getElementById("newPassword").value;

    const confirmPassword =
        document.getElementById("confirmPassword").value;

    const message =
        document.getElementById("passwordMessage");


    if(newPassword.length < 6){

        message.innerText =
            "Password must contain at least 6 characters.";

        return;
    }


    if(newPassword !== confirmPassword){

        message.innerText =
            "Passwords do not match.";

        return;
    }


    const user =
        users.find(u=>u.username === username);


    user.password = newPassword;

    saveUsers();


    showToast("Password changed successfully.");

    renderLogin();
}


/* =========================================================
   MAIN APP
========================================================= */

function renderApp(){

    if(!currentUser){

        renderLogin();

        return;
    }


    if(currentPage === "chat"){

        renderPrivateChat();

        return;
    }


    if(currentPage === "roomChat"){

        renderRoomChat();

        return;
    }


    let content = "";


    if(currentPage === "home"){

        content = renderHome();

    }else if(currentPage === "chats"){

        content = renderChats();

    }else if(currentPage === "friends"){

        content = renderFriends();

    }else if(currentPage === "rooms"){

        content = renderRooms();

    }else if(currentPage === "profile"){

        content = renderProfile();

    }else if(currentPage === "settings"){

        content = renderSettings();

    }


    document.getElementById("app").innerHTML = `

    <div class="page">

        <div class="header">

            <div class="header-title">
                ${getPageTitle()}

            <div class="header-actions">

}

    return html;

/* =========================================================
   PRIVATE CHAT
========================================================= */

function openChat(username){

    const user =
        users.find(u=>u.username === username);

    if(!user) return;

    currentChatUser = user;

    currentPage = "chat";

    renderPrivateChat();
}


function renderPrivateChat(){

    const user = currentChatUser;

    if(!user){

        currentPage = "chats";

        renderApp();

        return;
    }


    if(!chats[user.username]){

        chats[user.username] = [];

        saveChats();
    }


    let messageHTML = "";


    if(chats[user.username].length === 0){

        messageHTML = `

        <div class="room-system">
            Start your conversation with
            ${escapeHTML(user.name)}.
        </div>

        `;

    }else{

        chats[user.username].forEach((message,index)=>{

            messageHTML += `

            <div class="message ${message.sender === currentUser.username ? "me":"them"}">

                <button
                    class="message-delete"
                    onclick="deleteMessage('${escapeHTML(user.username)}',${index})"
                >
                    ×
                </button>

                ${escapeHTML(message.text)}

                <div class="message-time">
                    ${escapeHTML(message.time)}
                </div>

            </div>

            `;

        });

    }


    document.getElementById("app").innerHTML = `

    <div class="chat-page">

        <div class="chat-header">

            <button
                class="back-btn"
                onclick="goPage('chats')"
            >
                ‹
            </button>


            <div class="avatar" style="
                width:40px;
                height:40px;
                min-width:40px;
                font-size:16px;
                background:white;
                color:#1976d2;
            ">
                ${getInitial(user.name)}
            </div>


            <div class="chat-user">

                <strong>
                    ${escapeHTML(user.name)}
                </strong>

                <small>
                    ${escapeHTML(user.status || "Online")}
                </small>

            </div>


            <button
                class="chat-menu"
                onclick="openChatMenu()"
            >
                ⋮
            </button>

        </div>


        <div class="messages" id="messages">

            ${messageHTML}

        </div>


        <div class="chat-input">

            <input
                id="messageInput"
                type="text"
                placeholder="Type a message..."
                onkeydown="if(event.key==='Enter')sendMessage()"
            >

            <button
                class="send-btn"
                onclick="sendMessage()"
            >
                ➤
            </button>

        </div>

    </div>

    `;


    setTimeout(()=>{

        const messages =
            document.getElementById("messages");

        if(messages){

            messages.scrollTop =
                messages.scrollHeight;
        }

    },50);
}


/* =========================================================
   SEND MESSAGE
========================================================= */

function sendMessage(){

    const input =
        document.getElementById("messageInput");

    const text =
        input.value.trim();

    if(!text) return;


    const username =
        currentChatUser.username;


    if(!chats[username]){

        chats[username] = [];
    }


    chats[username].push({

        sender:currentUser.username,

        text:text,

        time:timeNow()

    });


    saveChats();

    input.value = "";

    renderPrivateChat();
}


/* =========================================================
   DELETE MESSAGE
========================================================= */

function deleteMessage(username,index){

    if(!confirm("Delete this message?")) return;

    chats[username].splice(index,1);

    saveChats();

    renderPrivateChat();
}


/* =========================================================
   DELETE CHAT
========================================================= */

function deleteChat(){

    if(!currentChatUser) return;

    const username =
        currentChatUser.username;

    if(!confirm("Delete this entire chat?")) return;

    delete chats[username];

    saveChats();

    showToast("Chat deleted.");

    currentPage = "chats";

    renderApp();
}

function sendRoomMessage(){

    const input =
        document.getElementById("roomMessageInput");

    const text =
        input.value.trim();

    if(!text) return;


    showToast(
        "Room message sent in demo mode."
    );

    input.value = "";
}

/* =========================================================
   STATUS
========================================================= */

function changeStatus(){

    openModal(`

        <h3>
            Change Status
        </h3>

        <button
            class="modal-option"
            onclick="setStatus('Online')"
        >
            🟢 Online
        </button>

        <button
            class="modal-option"
            onclick="setStatus('Busy')"
        >
            🔴 Busy
        </button>

        <button
            class="modal-option"
            onclick="setStatus('Invisible')"
        >
            ⚫ Invisible
        </button>

        <button
            class="modal-close"
            onclick="closeModal()"
        >
            Cancel
        </button>

    `);
}


function setStatus(status){

    currentUser.status = status;


    const user =
        users.find(u =>
            u.username === currentUser.username
        );


    if(user){

        user.status = status;
    }


    saveUsers();

    saveCurrentUser();

    closeModal();

    showToast("Status changed to " + status);

    renderApp();
}


/* =========================================================
   CHANGE NAME
========================================================= */

function changeName(){

    openModal(`

        <h3>
            Change Name
        </h3>

        <div class="input-group">

            <label>New Name</label>

            <input
                id="newNameInput"
                type="text"
                value="${escapeHTML(currentUser.name)}"
            >

        </div>

        <button
            class="modal-close"
            onclick="saveNewName()"
        >
            Save Name
        </button>

    `);
}


function saveNewName(){

    const newName =
        document.getElementById("newNameInput")
        .value
        .trim();


    if(!newName){

        showToast("Name cannot be empty.");

        return;
    }


    currentUser.name = newName;


    const user =
        users.find(u =>
            u.username === currentUser.username
        );


    if(user){

        user.name = newName;
    }


    saveUsers();

    saveCurrentUser();

    closeModal();

    showToast("Name updated.");

    renderApp();
}


/* =========================================================
   CHANGE PASSWORD
========================================================= */

function changePassword(){

    openModal(`

        <h3>
            Change Password
        </h3>

        <div class="input-group">

            <label>Current Password</label>

            <input
                id="oldPassword"
                type="password"
            >

        </div>


        <div class="input-group">

            <label>New Password</label>

            <input
                id="changeNewPassword"
                type="password"
            >

        </div>


        <div class="input-group">

            <label>Confirm New Password</label>

            <input
                id="changeConfirmPassword"
                type="password"
            >

        </div>


        <button
            class="modal-close"
            onclick="saveNewPassword()"
        >
            Change Password
        </button>

    `);
}


function saveNewPassword(){

    const oldPassword =
        document.getElementById("oldPassword").value;

    const newPassword =
        document.getElementById("changeNewPassword").value;

    const confirmPassword =
        document.getElementById("changeConfirmPassword").value;


    if(oldPassword !== currentUser.password){

        showToast("Current password is incorrect.");

        return;
    }


    if(newPassword.length < 6){

        showToast("New password must contain at least 6 characters.");

        return;
    }


    if(newPassword !== confirmPassword){

        showToast("Passwords do not match.");

        return;
    }


    currentUser.password = newPassword;


    const user =
        users.find(u =>
            u.username === currentUser.username
        );


    if(user){

        user.password = newPassword;
    }


    saveUsers();

    saveCurrentUser();

    closeModal();

    showToast("Password changed successfully.");
}

/* =========================================================
   FILTER
========================================================= */

function filterList(value,listId){

    const list =
        document.getElementById(listId);

    if(!list) return;


    const items =
        list.querySelectorAll(".searchable");


    value =
        value.toLowerCase();


    items.forEach(item=>{

        const name =
            item.dataset.name.toLowerCase();


        item.style.display =
            name.includes(value)
            ? "flex"
            : "none";

    });
}


/* =========================================================
   MODAL
========================================================= */

function openModal(content){

    const bg =
        document.getElementById("modalBg");

    const modal =
        document.getElementById("modalContent");


    modal.innerHTML = content;

    bg.style.display = "flex";
}


function closeModal(){

    document.getElementById("modalBg")
        .style.display = "none";
}


document.getElementById("modalBg")
.addEventListener("click",function(e){

    if(e.target === this){

        closeModal();
    }

});


/* =========================================================
   LOGOUT
========================================================= */

function logout(){

    openModal(`

        <h3>
            Logout
        </h3>

        <p style="
            color:#666;
            font-size:14px;
            line-height:1.5;
            margin-bottom:15px;
        ">
            Are you sure you want to logout?
        </p>

        <button
            class="modal-option"
            onclick="confirmLogout()"
        >
            🚪 Yes, Logout
        </button>

        <button
            class="modal-close"
            onclick="closeModal()"
        >
            Cancel
        </button>

    `);
}


function confirmLogout(){

    const user =
        users.find(u =>
            u.username === currentUser.username
        );


    if(user){

        user.status = "Offline";

        saveUsers();
    }


    currentUser = null;

    saveCurrentUser();

    closeModal();

    currentPage = "home";

    renderLogin();
}


/* =========================================================
   START
========================================================= */

if(currentUser){

    const savedUser =
        users.find(u =>
            u.username === currentUser.username
        );


    if(savedUser){

        currentUser = savedUser;

        currentUser.status = "Online";

        saveCurrentUser();

        saveUsers();

        renderApp();

    }else{

        currentUser = null;

        saveCurrentUser();

        renderLogin();
    }

}else{

    renderLogin();
}
