<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#eef3f8;
    color:#222;

.app{

/* =========================
   TOP
========================= */

.topbar{
    height:58px;

    align-items:center;

}

/* =========================
   COVER
========================= */

.cover{
    height:205px;

    position:relative;
    overflow:hidden;
}

.cover img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:none;
}

/* 3 DOTS - ATAS COVER */
.cover-menu{
    position:absolute;
    top:12px;
    right:12px;
    z-index:10;
}

.menu-button{
    width:43px;
    height:43px;
    border:0;
    border-radius:50%;
    background:rgba(255,255,255,.94);
    color:#222;
    font-size:27px;
    cursor:pointer;
    box-shadow:0 2px 7px rgba(0,0,0,.25);
}

.menu-box{
    display:none;
    position:absolute;
    top:50px;
    right:0;
    width:220px;
    background:white;
    border-radius:10px;

    box-shadow:0 4px 16px rgba(0,0,0,.25);

.menu-box button{

.cover-camera{

    cursor:pointer;

/* =========================
   PROFILE
========================= */

.profile-area{

}

.profile-head{

.avatar-box{

/* =========================

<script>

/* =====================================================
   Y-M CHAT PROFILE V1.1
   ===================================================== */

const ACCOUNT_KEY = "ym_accounts";
const CURRENT_USER_KEY = "ym_current_user";
const PROFILE_KEY = "ym_profiles";

const DB_NAME = "YMChatProfileDB";
const DB_VERSION = 1;
const MEDIA_STORE = "media";
const POST_STORE = "posts";

let currentUser = null;
let profileData = null;

let selectedImage = null;
let selectedVideo = null;


/* =====================================================
   INDEXED DB
===================================================== */

let db = null;

function openDatabase(){

    return new Promise((resolve,reject)=>{

        const request =
            indexedDB.open(DB_NAME,DB_VERSION);

        request.onupgradeneeded = function(event){

            const database = event.target.result;

            if(!database.objectStoreNames.contains(MEDIA_STORE)){

                database.createObjectStore(
                    MEDIA_STORE,
                    {keyPath:"id"}
                );
            }

            if(!database.objectStoreNames.contains(POST_STORE)){

                database.createObjectStore(
                    POST_STORE,
                    {keyPath:"id"}
                );
            }
        };

        request.onsuccess = function(event){

            db = event.target.result;

            resolve(db);
        };

        request.onerror = function(){

            reject(request.error);
        };

    });
}


/* =====================================================
   MEDIA DB
===================================================== */

function saveMedia(id,blob){

    return new Promise((resolve,reject)=>{

        const transaction =
            db.transaction(
                MEDIA_STORE,
                "readwrite"
            );

        const store =
            transaction.objectStore(
                MEDIA_STORE
            );

        store.put({
            id:id,
            blob:blob
        });

        transaction.oncomplete =
            ()=>resolve();

        transaction.onerror =
            ()=>reject(transaction.error);

    });
}


function getMedia(id){

    return new Promise((resolve,reject)=>{

        const transaction =
            db.transaction(
                MEDIA_STORE,
                "readonly"
            );

        const store =
            transaction.objectStore(
                MEDIA_STORE
            );

        const request =
            store.get(id);

        request.onsuccess =
            ()=>resolve(
                request.result
                ? request.result.blob
                : null
            );

        request.onerror =
            ()=>reject(request.error);

    });
}


function deleteMedia(id){

    return new Promise((resolve,reject)=>{

        const transaction =
            db.transaction(
                MEDIA_STORE,
                "readwrite"
            );

        transaction
            .objectStore(MEDIA_STORE)
            .delete(id);

        transaction.oncomplete =
            ()=>resolve();

        transaction.onerror =
            ()=>reject(transaction.error);

    });
}


/* =====================================================
   POSTS DB
===================================================== */

function getAllPosts(){

    return new Promise((resolve,reject)=>{

        const transaction =
            db.transaction(
                POST_STORE,
                "readonly"
            );

        const request =
            transaction
            .objectStore(POST_STORE)
            .getAll();

        request.onsuccess =
            ()=>resolve(
                request.result || []
            );

        request.onerror =
            ()=>reject(request.error);

    });
}


function savePost(post){

    return new Promise((resolve,reject)=>{

        const transaction =
            db.transaction(
                POST_STORE,
                "readwrite"
            );

        transaction
            .objectStore(POST_STORE)
            .put(post);

        transaction.oncomplete =
            ()=>resolve();

        transaction.onerror =
            ()=>reject(transaction.error);

    });
}


function removePost(postId){

    return new Promise((resolve,reject)=>{

        const transaction =
            db.transaction(
                POST_STORE,
                "readwrite"
            );

        transaction
            .objectStore(POST_STORE)
            .delete(postId);

        transaction.oncomplete =
            ()=>resolve();

        transaction.onerror =
            ()=>reject(transaction.error);

    });
}


/* =====================================================
   LOCAL STORAGE
===================================================== */

function getProfiles(){

    try{
        return JSON.parse(
            localStorage.getItem(PROFILE_KEY)
        ) || {};
    }catch(e){
        return {};
    }
}


function saveProfiles(data){

    localStorage.setItem(
        PROFILE_KEY,
        JSON.stringify(data)
    );
}


function getAccounts(){

    try{
        return JSON.parse(
            localStorage.getItem(ACCOUNT_KEY)
        ) || [];
    }catch(e){
        return [];
    }
}


function saveAccounts(accounts){

    localStorage.setItem(
        ACCOUNT_KEY,
        JSON.stringify(accounts)
    );
}


/* =====================================================
   HELPERS
===================================================== */

function escapeHTML(text){

    if(text === null || text === undefined){
        return "";
    }

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


function initial(name){

    if(!name){
        return "N";
    }

    return name
        .trim()
        .charAt(0)
        .toUpperCase() || "N";
}


function toast(message){

    const box =
        document.getElementById("toast");

    box.textContent = message;
    box.style.display = "block";

    clearTimeout(window.toastTimer);

    window.toastTimer =
        setTimeout(()=>{
            box.style.display = "none";
        },2200);
}

===================================================== */

async function initialize(){

    try{

        await openDatabase();

    }catch(error){

        toast("Browser storage unavailable.");
        return;
    }


    currentUser =
        localStorage.getItem(
            CURRENT_USER_KEY
        );


    const profiles =
        getProfiles();


    if(currentUser && profiles[currentUser]){

        profileData =
            profiles[currentUser];

    }else{

        const accounts =
            getAccounts();

        const account =
            accounts.find(a =>
                a.ymid === currentUser ||
                a.username === currentUser ||
                a.name === currentUser
            );


        profileData = {

            name:
                account?.name ||
                currentUser ||
                "Nizam@",

            ymid:
                account?.ymid ||
                currentUser ||
                "@nizam",

            birthday:"",
            birthplace:"",
            school:"",

            country:
                account?.country ||
                "Malaysia",

            bio:
                "Welcome to my Y-M Chat profile.",

            profileMediaId:null,
            coverMediaId:null,

            email:
                account?.email || ""
        };


        profiles[
            currentUser || "demo-user"
        ] = profileData;

        saveProfiles(profiles);
    }


    await renderProfile();

    await renderPosts();
}

}

        document.getElementById(

            "avatarText"
        );


    if(profileData.profileMediaId){

                cover.style.display = "block";

            }

        }catch(e){}

    }else{

        cover.style.display = "none";

function changePassword(){

    const current =
        document.getElementById(
            "currentPassword"
        ).value;

    const next =
        document.getElementById(
            "newPassword"
        ).value;

    const confirm =
        document.getElementById(
            "confirmPassword"
        ).value;


    if(!current || !next || !confirm){

        toast("Please complete all fields.");
        return;
    }


    if(next !== confirm){

        toast("New passwords do not match.");
        return;
    }


    if(next.length < 6){

        toast(
            "Password must be at least 6 characters."
        );

        return;
    }


    const accounts =
        getAccounts();


    const index =
        accounts.findIndex(a =>
            a.ymid === currentUser ||
            a.username === currentUser ||
            a.name === currentUser
        );


    if(index === -1){

        profileData.demoPassword =
            next;

        saveCurrentProfile();

        closeModal(
            "passwordModal"
        );

        toast("Password changed.");
        return;
    }


    if(accounts[index].password !== current){

        toast(
            "Current password is incorrect."
        );

        return;
    }


    accounts[index].password =
        next;

    saveAccounts(accounts);

    closeModal(
        "passwordModal"
    );

    toast(
        "Password changed successfully."
    );
}

/* =====================================================
   CREATE POST
===================================================== */

async function createPost(){

    const text =
        document.getElementById(
            "postText"
        ).value.trim();


    if(
        !text &&
        !selectedImage &&
        !selectedVideo
    ){

        toast(
            "Write something or choose media."
        );

        return;
    }


    const postId =
        "post_" +
        Date.now() +
        "_" +
        Math.random()
            .toString(16)
            .slice(2);


    const post = {

        id:postId,

        user:
            currentUser ||
            profileData.ymid ||
            "demo-user",

        name:
            profileData.name ||
            "Y-M User",

        text:text,

        mediaId:null,

        mediaType:null,

        likes:[],

        comments:[],

        hidden:false,

        createdAt:
            new Date().toLocaleString()
    };


    try{

        /* IMAGE */

        if(selectedImage){

            const mediaId =
                "media_" +
                postId;

            await saveMedia(
                mediaId,
                selectedImage
            );

            post.mediaId =
                mediaId;

            post.mediaType =
                "image";
        }


        /* VIDEO */

        if(selectedVideo){

            const mediaId =
                "media_" +
                postId;

            await saveMedia(
                mediaId,
                selectedVideo
            );

            post.mediaId =
                mediaId;

            post.mediaType =
                "video";
        }


        await savePost(post);


        document.getElementById(
            "postText"
        ).value = "";

        clearMedia();

        await renderPosts();

        toast(
            "Post published successfully."
        );

    }catch(error){

        console.error(error);

        toast(
            "Post could not be saved."
        );
    }
}


/* =====================================================
   RENDER POSTS
===================================================== */

async function renderPosts(){

    const container =
        document.getElementById(
            "postsContainer"
        );

    container.innerHTML = "";


    let posts =
        await getAllPosts();


    posts =
        posts
        .sort(
            (a,b) =>
                Number(b.id.includes("_"))
                ? 0
                : 0
        );


    const visible =
        posts.filter(
            post => !post.hidden
        );


    if(visible.length === 0){

        container.innerHTML = `
            <div style="
                text-align:center;
                padding:30px 10px;
                color:#777;
            ">
                No posts yet.<br>
                Write something above.
            </div>
        `;

        return;
    }


    for(const post of visible){

        const element =
            await buildPostElement(post);

        container.appendChild(element);
    }
}


/* =====================================================
   BUILD POST
===================================================== */

async function buildPostElement(post){

    const element =
        document.createElement("div");

    element.className =
        "post";


    const user =
        currentUser ||
        profileData.ymid ||
        "demo-user";


    const liked =
        Array.isArray(post.likes) &&
        post.likes.includes(user);


    let mediaHTML = "";


    if(post.mediaId){

        try{

            const blob =
                await getMedia(
                    post.mediaId
                );


            if(blob){

                const url =
                    URL.createObjectURL(blob);


                if(post.mediaType === "image"){

                    mediaHTML = `
                        <img
                            class="post-media"
                            src="${url}"
                            alt="Post image"
                        >
                    `;

                }else if(
                    post.mediaType === "video"
                ){

                    mediaHTML = `
                        <video
                            class="post-media"
                            controls
                            playsinline
                            preload="metadata"
                        >
                            <source
                                src="${url}"
                            >
                        </video>
                    `;
                }
            }

        }catch(error){}
    }


    let commentsHTML = "";


    if(
        Array.isArray(post.comments)
    ){

        for(
            const comment
            of post.comments
        ){

            if(comment.hidden){
                continue;
            }


            const own =
                comment.user === user;


            commentsHTML += `

                <div class="comment">

                    <div class="comment-top">

                        <div class="comment-body">

                            <strong>
                                ${escapeHTML(
                                    comment.name
                                )}
                            </strong>

                            <div>
                                ${escapeHTML(
                                    comment.text
                                )}
                            </div>

                        </div>

                        <div class="comment-buttons">

                            ${
                                own
                                ?
                                `
                                <button
                                    onclick="deleteComment(
                                        '${post.id}',
                                        '${comment.id}'
                                    )"
                                >
                                    🗑️
                                </button>
                                `
                                :
                                `
                                <button
                                    onclick="hideComment(
                                        '${post.id}',
                                        '${comment.id}'
                                    )"
                                >
                                    🙈
                                </button>
                                `
                            }

                        </div>

                    </div>

                </div>
            `;
        }
    }


    element.innerHTML = `

        <div class="post-header">

            <div class="post-avatar">
                ${escapeHTML(
                    initial(post.name)
                )}
            </div>

            <div class="post-user">

                <strong>
                    ${escapeHTML(post.name)}
                </strong>

                <small>
                    ${escapeHTML(post.createdAt)}
                </small>

            </div>

            <button
                class="post-menu"
                onclick="postMenu('${post.id}')"
            >
                ⋮
            </button>

        </div>


        ${
            post.text
            ?
            `
            <div class="post-content">
                ${escapeHTML(post.text)}
            </div>
            `
            :
            ""
        }


        ${mediaHTML}


        <div class="post-actions">

            <button
                class="${liked ? "like-active" : ""}"
                onclick="toggleLike('${post.id}')"
            >
                ${liked ? "❤️" : "🤍"}
                Like (${post.likes.length})
            </button>

            <button
                onclick="focusComment('${post.id}')"
            >
                💬 Comment
            </button>

            <button
                onclick="sharePost('${post.id}')"
            >
                📤 Share
            </button>

        </div>


        <div class="comments">

            ${commentsHTML}


            <input
                id="comment-${post.id}"
                class="comment-input"
                placeholder="Write a comment..."
                onkeydown="
                    commentKey(
                        event,
                        '${post.id}'
                    )
                "
            >


            <button
                class="comment-send"
                onclick="
                    addComment(
                        '${post.id}'
                    )
                "
            >
                Send Comment
            </button>

        </div>
    `;


    return element;
}


/* =====================================================
   LIKE
===================================================== */

async function toggleLike(postId){

    const posts =
        await getAllPosts();

    const post =
        posts.find(
            p => p.id === postId
        );


    if(!post){
        return;
    }


    if(!Array.isArray(post.likes)){

        post.likes = [];
    }


    const user =
        currentUser ||
        profileData.ymid ||
        "demo-user";


    const index =
        post.likes.indexOf(user);


    if(index === -1){

        post.likes.push(user);

    }else{

        post.likes.splice(
            index,
            1
        );
    }


    await savePost(post);

    await renderPosts();
}


/* =====================================================
   COMMENTS
===================================================== */

function focusComment(postId){

    const input =
        document.getElementById(
            "comment-" + postId
        );


    if(input){

        input.focus();

        input.scrollIntoView({
            behavior:"smooth",
            block:"center"
        });
    }
}


function commentKey(event,postId){

    if(event.key === "Enter"){

        event.preventDefault();

        addComment(postId);
    }
}


async function addComment(postId){

    const input =
        document.getElementById(
            "comment-" + postId
        );


    if(!input){
        return;
    }


    const text =
        input.value.trim();


    if(!text){
        return;
    }


    const posts =
        await getAllPosts();


    const post =
        posts.find(
            p => p.id === postId
        );


    if(!post){
        return;
    }


    if(!Array.isArray(post.comments)){

        post.comments = [];
    }


    post.comments.push({

        id:
            "comment_" +
            Date.now() +
            "_" +
            Math.random()
                .toString(16)
                .slice(2),

        user:
            currentUser ||
            profileData.ymid ||
            "demo-user",

        name:
            profileData.name ||
            "Y-M User",

        text:text,

        hidden:false
    });


    await savePost(post);

    await renderPosts();

    toast(
        "Comment added."
    );
}


/* =====================================================
   DELETE COMMENT
===================================================== */

async function deleteComment(
    postId,
    commentId
){

    const posts =
        await getAllPosts();


    const post =
        posts.find(
            p => p.id === postId
        );


    if(!post){
        return;
    }


    const user =
        currentUser ||
        profileData.ymid ||
        "demo-user";


    const comment =
        post.comments.find(
            c => c.id === commentId
        );


    if(!comment){
        return;
    }


    if(comment.user !== user){

        toast(
            "You can only delete your comment."
        );

        return;
    }


    post.comments =
        post.comments.filter(
            c => c.id !== commentId
        );


    await savePost(post);

    await renderPosts();

    toast(
        "Comment deleted."
    );
}


/* =====================================================
   HIDE COMMENT
===================================================== */

async function hideComment(
    postId,
    commentId
){

    const posts =
        await getAllPosts();


    const post =
        posts.find(
            p => p.id === postId
        );


    if(!post){
        return;
    }


    const comment =
        post.comments.find(
            c => c.id === commentId
        );


    if(!comment){
        return;
    }


    comment.hidden =
        true;


    await savePost(post);

    await renderPosts();

    toast(
        "Comment hidden."
    );
}


/* =====================================================
   POST MENU
===================================================== */

async function postMenu(postId){

    const posts =
        await getAllPosts();


    const post =
        posts.find(
            p => p.id === postId
        );


    if(!post){
        return;
    }


    const user =
        currentUser ||
        profileData.ymid ||
        "demo-user";


    if(post.user === user){

        const yes =
            confirm(
                "Delete this post?"
            );


        if(!yes){
            return;
        }


        if(post.mediaId){

            await deleteMedia(
                post.mediaId
            );
        }


        await removePost(
            post.id
        );


        await renderPosts();

        toast(
            "Post deleted."
        );

    }else{

        const yes =
            confirm(
                "Hide this post?"
            );


        if(!yes){
            return;
        }


        post.hidden =
            true;


        await savePost(post);

        await renderPosts();

        toast(
            "Post hidden."
        );
    }
}


/* =====================================================
   SHARE
===================================================== */

async function sharePost(postId){

    const posts =
        await getAllPosts();


    const post =
        posts.find(
            p => p.id === postId
        );


    if(!post){
        return;
    }


    const text =
        post.name +
        ": " +
        (
            post.text ||
            "Y-M Chat post"
        );


    if(navigator.share){

        try{

            await navigator.share({
                title:"Y-M Chat",
                text:text
            });

        }catch(e){}

        return;
    }


    if(navigator.clipboard){

        try{

            await navigator.clipboard.writeText(
                text
            );

            toast(
                "Post copied."
            );

        }catch(e){

            toast(
                "Share unavailable."
            );
        }

        return;
    }


    toast(
        "Share unavailable."
    );
}

/* =====================================================
   MODAL
===================================================== */

function closeModal(id){

    document.getElementById(
        id
    ).style.display =
        "none";
}


document
.querySelectorAll(".modal")
.forEach(modal => {

    modal.addEventListener(
        "click",
        function(event){

            if(event.target === modal){

                modal.style.display =
                    "none";
            }
        }
    );

});


/* =====================================================
   LOGOUT
===================================================== */

function logout(){

    closeMenu();


    const yes =
        confirm(
            "Are you sure you want to log out?"
        );


    if(!yes){
        return;
    }


    localStorage.removeItem(
        CURRENT_USER_KEY
    );


    toast(
        "Logged out."
    );


    setTimeout(()=>{

        location.reload();

    },700);
}
