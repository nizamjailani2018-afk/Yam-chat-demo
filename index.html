<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YAM Chat V4.5.3</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

html,body{
    width:100%;
    min-height:100%;
    overflow-x:hidden;
}

body{
    background:#f1f3f6;
    color:#111;
}

/* ================= LOGIN ================= */

#loginPage{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    background:linear-gradient(135deg,#111,#333,#111);
}

.login-box{
    width:100%;
    max-width:390px;
    background:#fff;
    border-radius:20px;
    padding:30px 24px;
    box-shadow:0 15px 50px rgba(0,0,0,.35);
}

.logo{
    text-align:center;
    font-size:38px;
    font-weight:900;
    margin-bottom:5px;
}

.logo span{
    color:#1877f2;
}

.login-sub{
    text-align:center;
    color:#777;
    margin-bottom:25px;
}

.login-box input{
    width:100%;
    padding:14px;
    margin-bottom:12px;
    border:1px solid #ddd;
    border-radius:10px;
    outline:none;
    font-size:15px;
}

.login-box input:focus{
    border-color:#1877f2;
}

.login-btn,
.register-btn{
    width:100%;
    padding:13px;
    border:0;
    border-radius:10px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.login-btn{
    background:#1877f2;
    color:#fff;
}

.register-btn{
    margin-top:10px;
    background:#e9f3ff;
    color:#1877f2;
}

.login-msg{
    text-align:center;
    min-height:20px;
    margin-top:12px;
    font-size:14px;
    color:#d00;
}

/* ================= APP ================= */

#app{
    display:none;
    min-height:100vh;
    padding-bottom:70px;
}

.topbar{
    position:sticky;
    top:0;
    z-index:50;
    height:58px;
    background:#fff;
    border-bottom:1px solid #ddd;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 15px;
}

.top-logo{
    font-size:25px;
    font-weight:900;
}

.top-logo span{
    color:#1877f2;
}

.current-user{
    font-size:14px;
    font-weight:bold;
    color:#555;
}

/* ================= PAGES ================= */

.page{
    display:none;
}

.page.active{
    display:block;
}

.container{
    width:100%;
    max-width:700px;
    margin:auto;
    padding:12px;
}

/* ================= COMPOSER ================= */

.composer{
    background:#fff;
    border-radius:14px;
    padding:14px;
    box-shadow:0 1px 4px rgba(0,0,0,.08);
    margin-bottom:12px;
}

.composer-top{
    display:flex;
    gap:10px;
    align-items:center;
}

.small-avatar{
    width:42px;
    height:42px;
    border-radius:50%;
    object-fit:cover;
    background:#ddd;
}

.composer textarea{
    flex:1;
    min-height:45px;
    resize:none;
    border:1px solid #ddd;
    border-radius:12px;
    padding:12px;
    outline:none;
}

.post-type-row{
    display:flex;
    gap:8px;
    margin-top:10px;
}

.post-type-row button{
    flex:1;
    border:0;
    padding:10px 5px;
    border-radius:9px;
    background:#f0f2f5;
    cursor:pointer;
}

.post-type-row button.active{
    background:#1877f2;
    color:#fff;
}

.media-preview{
    display:none;
    margin-top:10px;
}

.media-preview img,
.media-preview video{
    width:100%;
    max-height:350px;
    object-fit:contain;
    border-radius:10px;
    background:#111;
}

.post-btn{
    width:100%;
    margin-top:10px;
    border:0;
    padding:12px;
    border-radius:10px;
    background:#1877f2;
    color:#fff;
    font-weight:bold;
    cursor:pointer;
}

/* ================= POSTS ================= */

.post{
    background:#fff;
    border-radius:14px;
    margin-bottom:12px;
    overflow:hidden;
    box-shadow:0 1px 4px rgba(0,0,0,.08);
}

.post-head{
    display:flex;
    align-items:center;
    padding:12px;
    gap:10px;
}

.post-avatar{
    width:42px;
    height:42px;
    border-radius:50%;
    object-fit:cover;
    background:#ddd;
}

.post-owner{
    font-weight:bold;
}

.post-time{
    font-size:12px;
    color:#777;
    margin-top:2px;
}

.post-menu{
    margin-left:auto;
    border:0;
    background:none;
    font-size:22px;
    cursor:pointer;
}

.post-text{
    padding:0 12px 12px;
    white-space:pre-wrap;
    word-break:break-word;
}

.post-media{
    width:100%;
    max-height:550px;
    object-fit:contain;
    background:#111;
}

.post-actions{
    display:flex;
    border-top:1px solid #eee;
    border-bottom:1px solid #eee;
}

.post-actions button{
    flex:1;
    border:0;
    background:#fff;
    padding:11px 4px;
    cursor:pointer;
    font-weight:bold;
    color:#555;
}

.post-actions button.liked{
    color:#1877f2;
}

.comment-area{
    padding:10px;
}

.comment{
    background:#f0f2f5;
    border-radius:10px;
    padding:8px 10px;
    margin-bottom:7px;
    position:relative;
}

.comment-user{
    font-weight:bold;
    font-size:13px;
}

.comment-text{
    font-size:14px;
    margin-top:3px;
    word-break:break-word;
}

.comment-tools{
    margin-top:5px;
    display:flex;
    gap:5px;
    flex-wrap:wrap;
}

.comment-tools button{
    border:0;
    background:none;
    color:#1877f2;
    font-size:12px;
    cursor:pointer;
}

.comment-tools button.danger{
    color:#c00;
}

.comment-tools button.block-btn{
    color:#c00;
}

.comment-input-row{
    display:flex;
    gap:7px;
}

.comment-input-row input{
    flex:1;
    border:1px solid #ddd;
    border-radius:20px;
    padding:9px 12px;
    outline:none;
}

.comment-input-row button{
    border:0;
    background:#1877f2;
    color:#fff;
    border-radius:20px;
    padding:0 15px;
}

.no-comments{
    font-size:13px;
    color:#888;
    margin-bottom:8px;
}

/* ================= PROFILE ================= */

.profile-page{
    padding:0 0 20px;
}

/*
   COVER DITINGKATKAN:
   Background cover sekarang merangkumi seluruh kawasan
   termasuk bawah 3 butang Gambar / Cover / Menu.
*/

.profile-hero{
    position:relative;
    min-height:540px;
    background:#222;
    background-position:center;
    background-size:cover;
    background-repeat:no-repeat;
    overflow:hidden;
}

.profile-hero::before{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(
        to bottom,
        rgba(0,0,0,.05),
        rgba(0,0,0,.15) 35%,
        rgba(0,0,0,.72) 100%
    );
}

.profile-content{
    position:relative;
    z-index:2;
    min-height:540px;
    padding-top:160px;
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
}

.profile-info{
    padding:20px 15px 15px;
    color:#fff;
}

.profile-avatar-wrap{
    margin-bottom:10px;
}

.profile-avatar{
    width:105px;
    height:105px;
    border-radius:50%;
    object-fit:cover;
    border:4px solid #fff;
    background:#ddd;
    box-shadow:0 4px 15px rgba(0,0,0,.35);
}

.profile-name{
    font-size:24px;
    font-weight:900;
    text-shadow:0 2px 5px rgba(0,0,0,.5);
}

.profile-bio{
    margin-top:5px;
    font-size:14px;
    opacity:.95;
}

.profile-buttons{
    display:flex;
    gap:8px;
    padding:10px;
}

.profile-buttons button{
    flex:1;
    border:1px solid rgba(255,255,255,.55);
    background:rgba(255,255,255,.90);
    color:#111;
    padding:11px 5px;
    border-radius:10px;
    font-weight:bold;
    cursor:pointer;
    backdrop-filter:blur(5px);
}

.profile-tabs{
    display:flex;
    background:#fff;
    border-bottom:1px solid #ddd;
    overflow-x:auto;
}

.profile-tabs button{
    min-width:100px;
    flex:1;
    padding:13px 8px;
    border:0;
    background:#fff;
    cursor:pointer;
    font-weight:bold;
    color:#666;
}

.profile-tabs button.active{
    color:#1877f2;
    border-bottom:3px solid #1877f2;
}

/* ================= FRIENDS ================= */

.friend-card,
.room-card{
    background:#fff;
    border-radius:14px;
    padding:13px;
    margin-bottom:10px;
    display:flex;
    align-items:center;
    gap:12px;
    box-shadow:0 1px 4px rgba(0,0,0,.08);
}

.friend-card img{
    width:50px;
    height:50px;
    border-radius:50%;
    object-fit:cover;
}

.friend-info{
    flex:1;
}

.friend-name{
    font-weight:bold;
}

.friend-card button,
.room-card button{
    border:0;
    background:#1877f2;
    color:#fff;
    border-radius:9px;
    padding:9px 12px;
}

/* ================= MARKET ================= */

.market-add{
    background:#fff;
    padding:14px;
    border-radius:14px;
    margin-bottom:12px;
}

.market-add input,
.market-add textarea{
    width:100%;
    margin-bottom:9px;
    padding:11px;
    border:1px solid #ddd;
    border-radius:9px;
}

.market-add textarea{
    min-height:80px;
}

.market-add button{
    width:100%;
    padding:11px;
    border:0;
    border-radius:9px;
    background:#1877f2;
    color:#fff;
    font-weight:bold;
}

.market-item{
    background:#fff;
    border-radius:14px;
    overflow:hidden;
    margin-bottom:12px;
}

.market-item img{
    width:100%;
    max-height:350px;
    object-fit:contain;
    background:#111;
}

.market-info{
    padding:12px;
}

.market-title{
    font-weight:bold;
    font-size:18px;
}

.market-price{
    color:#e53935;
    font-size:18px;
    font-weight:bold;
    margin:5px 0;
}

/* ================= NAV ================= */

.bottom-nav{
    position:fixed;
    z-index:100;
    bottom:0;
    left:0;
    right:0;
    height:65px;
    background:#fff;
    border-top:1px solid #ddd;
    display:flex;
}

.bottom-nav button{
    flex:1;
    border:0;
    background:#fff;
    color:#777;
    font-weight:bold;
    cursor:pointer;
}

.bottom-nav button.active{
    color:#1877f2;
}

/* ================= MODAL ================= */

.modal-bg{
    display:none;
    position:fixed;
    z-index:200;
    inset:0;
    background:rgba(0,0,0,.55);
    align-items:center;
    justify-content:center;
    padding:15px;
}

.modal{
    width:100%;
    max-width:500px;
    max-height:85vh;
    overflow-y:auto;
    background:#fff;
    border-radius:15px;
    padding:18px;
}

.modal h3{
    margin-bottom:12px;
}

.modal button{
    border:0;
    padding:10px 12px;
    border-radius:9px;
    margin:4px 2px;
    cursor:pointer;
}

.modal .danger{
    background:#ffe7e7;
    color:#c00;
}

.modal .primary{
    background:#1877f2;
    color:#fff;
}

.modal .normal{
    background:#eee;
}

/* ================= CHAT ================= */

.chat-overlay{
    display:none;
    position:fixed;
    z-index:150;
    inset:0;
    background:#f1f3f6;
}

.chat-head{
    height:58px;
    background:#fff;
    border-bottom:1px solid #ddd;
    display:flex;
    align-items:center;
    gap:10px;
    padding:0 12px;
}

.chat-head button{
    border:0;
    background:none;
    font-size:23px;
}

.chat-messages{
    height:calc(100vh - 116px);
    overflow-y:auto;
    padding:12px;
}

.chat-bubble{
    max-width:78%;
    padding:9px 12px;
    border-radius:15px;
    margin-bottom:7px;
    word-break:break-word;
}

.chat-me{
    margin-left:auto;
    background:#1877f2;
    color:#fff;
}

.chat-other{
    background:#fff;
}

.chat-input{
    height:58px;
    background:#fff;
    border-top:1px solid #ddd;
    display:flex;
    gap:7px;
    padding:8px;
}

.chat-input input{
    flex:1;
    border:1px solid #ddd;
    border-radius:20px;
    padding:10px;
}

.chat-input button{
    border:0;
    background:#1877f2;
    color:#fff;
    border-radius:20px;
    padding:0 15px;
}

/* ================= EMPTY ================= */

.empty{
    text-align:center;
    color:#888;
    padding:30px 10px;
}

/* ================= MOBILE ================= */

@media(max-width:500px){

    .profile-hero,
    .profile-content{
        min-height:500px;
    }

    .profile-content{
        padding-top:135px;
    }

    .profile-avatar{
        width:90px;
        height:90px;
    }

    .profile-name{
        font-size:21px;
    }

    .post-actions button{
        font-size:13px;
    }
}

@media(max-width:360px){

    .profile-hero,
    .profile-content{
        min-height:485px;
    }

    .profile-content{
        padding-top:120px;
    }

    .profile-buttons{
        gap:5px;
        padding:8px;
    }

    .profile-buttons button{
        font-size:12px;
        padding:10px 3px;
    }
}
</style>
</head>

<body>

<!-- ================= LOGIN ================= -->

<div id="loginPage">
    <div class="login-box">

        <div class="logo">
            YAM<span>CHAT</span>
        </div>

        <div class="login-sub">
            Sembang • Kawan • Komuniti
        </div>

        <input
            id="loginUsername"
            type="text"
            placeholder="Username"
        >

        <input
            id="loginPassword"
            type="password"
            placeholder="Password"
        >

        <button
            class="login-btn"
            onclick="login()"
        >
            LOGIN
        </button>

        <button
            class="register-btn"
            onclick="register()"
        >
            DAFTAR AKAUN
        </button>

        <div
            id="loginMsg"
            class="login-msg"
        ></div>

    </div>
</div>


<!-- ================= APP ================= -->

<div id="app">

    <div class="topbar">

        <div class="top-logo">
            YAM<span>CHAT</span>
        </div>

        <div
            id="currentUserDisplay"
            class="current-user"
        ></div>

    </div>


    <!-- ================= HOME ================= -->

    <section
        id="homePage"
        class="page active"
    >

        <div class="container">

            <div class="composer">

                <div class="composer-top">

                    <img
                        id="composerAvatar"
                        class="small-avatar"
                        src=""
                    >

                    <textarea
                        id="postText"
                        placeholder="Apa yang anda fikirkan?"
                    ></textarea>

                </div>

                <div class="post-type-row">

                    <button
                        id="typeText"
                        class="active"
                        onclick="selectPostType('text')"
                    >
                        📝 Teks
                    </button>

                    <button
                        id="typeImage"
                        onclick="selectPostType('image')"
                    >
                        🖼️ Gambar
                    </button>

                    <button
                        id="typeVideo"
                        onclick="selectPostType('video')"
                    >
                        🎬 Video
                    </button>

                </div>

                <input
                    id="postFile"
                    type="file"
                    accept="image/*,video/*"
                    style="display:none"
                >

                <div
                    id="mediaPreview"
                    class="media-preview"
                ></div>

                <button
                    class="post-btn"
                    onclick="createPost()"
                >
                    POST
                </button>

            </div>

            <div id="feed"></div>

        </div>

    </section>


    <!-- ================= FRIENDS ================= -->

    <section
        id="friendsPage"
        class="page"
    >

        <div class="container">

            <h2 style="margin-bottom:12px;">
                Kawan
            </h2>

            <div id="friendsList"></div>

        </div>

    </section>


    <!-- ================= ROOMS ================= -->

    <section
        id="roomsPage"
        class="page"
    >

        <div class="container">

            <h2 style="margin-bottom:12px;">
                Rooms
            </h2>

            <div id="roomsList"></div>

        </div>

    </section>


    <!-- ================= PROFILE ================= -->

    <section
        id="profilePage"
        class="page profile-page"
    >

        <div
            id="profileHero"
            class="profile-hero"
        >

            <div class="profile-content">

                <div class="profile-info">

                    <div class="profile-avatar-wrap">

                        <img
                            id="profileAvatar"
                            class="profile-avatar"
                            src=""
                        >

                    </div>

                    <div
                        id="profileName"
                        class="profile-name"
                    ></div>

                    <div
                        id="profileBio"
                        class="profile-bio"
                    >
                        Selamat datang ke profil saya di YAM Chat.
                    </div>

                </div>


                <div class="profile-buttons">

                    <button
                        onclick="changeProfilePicture()"
                    >
                        📷 Gambar
                    </button>

                    <button
                        onclick="changeCover()"
                    >
                        🖼️ Cover
                    </button>

                    <button
                        onclick="openProfileMenu()"
                    >
                        ☰ Menu
                    </button>

                </div>

            </div>

        </div>


        <input
            id="profileFile"
            type="file"
            accept="image/*"
            style="display:none"
        >

        <input
            id="coverFile"
            type="file"
            accept="image/*"
            style="display:none"
        >


        <div class="profile-tabs">

            <button
                id="tabPost"
                onclick="showProfileTab('post')"
            >
                Post
            </button>

            <button
                id="tabImage"
                onclick="showProfileTab('image')"
            >
                Gambar
            </button>

            <button
                id="tabVideo"
                onclick="showProfileTab('video')"
            >
                Video
            </button>

            <button
                id="tabMarket"
                onclick="showProfileTab('market')"
            >
                Market
            </button>

        </div>


        <div class="container">

            <div
                id="profileTabContent"
            ></div>

        </div>

    </section>


    <!-- ================= BOTTOM NAV ================= -->

    <div class="bottom-nav">

        <button
            id="navHome"
            class="active"
            onclick="showPage('home')"
        >
            🏠<br>Home
        </button>

        <button
            id="navFriends"
            onclick="showPage('friends')"
        >
            👥<br>Kawan
        </button>

        <button
            id="navRooms"
            onclick="showPage('rooms')"
        >
            💬<br>Rooms
        </button>

        <button
            id="navProfile"
            onclick="showPage('profile')"
        >
            👤<br>Profil
        </button>

    </div>

</div>


<!-- ================= MODAL ================= -->

<div
    id="modalBg"
    class="modal-bg"
    onclick="closeModalOutside(event)"
>

    <div
        id="modal"
        class="modal"
    ></div>

</div>


<!-- ================= CHAT ================= -->

<div
    id="chatOverlay"
    class="chat-overlay"
>

    <div class="chat-head">

        <button onclick="closeChat()">
            ‹
        </button>

        <strong id="chatTitle"></strong>

    </div>


    <div
        id="chatMessages"
        class="chat-messages"
    ></div>


    <div class="chat-input">

        <input
            id="chatInput"
            placeholder="Tulis mesej..."
        >

        <button onclick="sendChat()">
            Hantar
        </button>

    </div>

</div>


<script>

/* =========================================================
   YAM CHAT V4.5.3
   ========================================================= */

const DEFAULT_AVATAR =
    "data:image/svg+xml;charset=UTF-8," +
    encodeURIComponent(`
        <svg xmlns="http://www.w3.org/2000/svg"
             width="200"
             height="200">

            <rect
                width="200"
                height="200"
                fill="#ddd"
            />

            <circle
                cx="100"
                cy="75"
                r="38"
                fill="#aaa"
            />

            <path
                d="M35 180c10-45 40-65 65-65s55 20 65 65"
                fill="#aaa"
            />

        </svg>
    `);


let currentUser =
    localStorage.getItem("yam_current_user") || "";

let selectedPostType = "text";
let selectedPostFile = null;
let selectedMarketImage = "";
let currentChatUser = "";
let currentProfileTab = "post";


/* =========================================================
   BASIC HELPERS
   ========================================================= */

function $(id){
    return document.getElementById(id);
}


function escapeHtml(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


function safeArg(value){

    return JSON.stringify(
        String(value ?? "")
    );
}


function getAccounts(){

    try{

        return JSON.parse(
            localStorage.getItem(
                "yam_accounts"
            ) || "{}"
        );

    }catch(e){

        return {};
    }
}


function saveAccounts(accounts){

    localStorage.setItem(
        "yam_accounts",
        JSON.stringify(accounts)
    );
}


function getAvatar(username){

    return localStorage.getItem(
        "yam_picture_"+username
    ) || DEFAULT_AVATAR;
}


function getCover(username){

    return localStorage.getItem(
        "yam_cover_"+username
    ) || "";
}


function getPosts(){

    try{

        return JSON.parse(
            localStorage.getItem(
                "yam_posts"
            ) || "[]"
        );

    }catch(e){

        return [];
    }
}


function savePosts(posts){

    localStorage.setItem(
        "yam_posts",
        JSON.stringify(posts)
    );
}


function formatTime(timestamp){

    const d =
        new Date(timestamp);

    return d.toLocaleDateString(
        "ms-MY",
        {
            day:"2-digit",
            month:"2-digit",
            year:"numeric"
        }
    )
    +
    " "
    +
    d.toLocaleTimeString(
        "ms-MY",
        {
            hour:"2-digit",
            minute:"2-digit"
        }
    );
}

function login(){

        .value
        .trim();

        "#d00";

    }

    const accounts =
        getAccounts();

    const accountKey =
        Object.keys(accounts)
        .find(

                ===
                username.toLowerCase()
        );

    if(!accountKey){

        $("loginMsg").textContent =
            "Akaun tidak dijumpai. Sila daftar akaun dahulu.";

        return;
    }

    if(
        String(accounts[accountKey].password)
        !==
        String(password)
    ){

        $("loginMsg").textContent =
            "Password tidak betul.";

        return;
    }

    currentUser =
        accountKey;

    localStorage.setItem(
        "yam_current_user",
        currentUser
    );

    $("loginMsg").style.color =
        "#168a24";

    $("loginMsg").textContent =
        "Login berjaya!";

    setTimeout(
        ()=>{
            startApp();
        },
        300
    );
}


function register(){

    const username =
        $("loginUsername")
        .value
        .trim();

    const password =
        $("loginPassword")
        .value;

    $("loginMsg").style.color =
        "#d00";

    if(username.length < 3){

        $("loginMsg").textContent =
            "Username mesti sekurang-kurangnya 3 aksara.";

        return;
    }

    if(username.length > 30){

        $("loginMsg").textContent =
            "Username terlalu panjang.";

        return;
    }

    if(/\s/.test(username)){

        $("loginMsg").textContent =
            "Username tidak boleh mempunyai ruang.";

        return;
    }

    if(password.length < 4){

        $("loginMsg").textContent =
            "Password mesti sekurang-kurangnya 4 aksara.";

        return;
    }

    const accounts =
        getAccounts();

    const existingKey =
        Object.keys(accounts)
        .find(
            key =>
                key.toLowerCase()
                ===
                username.toLowerCase()
        );

    if(existingKey){

        $("loginMsg").textContent =
            "Username sudah digunakan.";

        return;
    }

    accounts[username] = {

        password:password,

        createdAt:Date.now()

    };

    saveAccounts(accounts);

    localStorage.setItem(
        "yam_current_user",
        username
    );

    currentUser =
        username;

    $("loginMsg").style.color =
        "#168a24";

    $("loginMsg").textContent =
        "Akaun berjaya didaftarkan!";

    setTimeout(
        ()=>{
            startApp();
        },
        300
    );
}


function logout(){

    localStorage.removeItem(

    );

    currentUser = "";

    $("app").style.display =

/* =========================================================
   INDEXED DB MEDIA
   ========================================================= */

let mediaDBPromise =
    null;


function openMediaDB(){

    if(mediaDBPromise)
        return mediaDBPromise;

    mediaDBPromise =
        new Promise(
            (resolve,reject)=>{

                const request =
                    indexedDB.open(
                        "YAM_CHAT_MEDIA_DB",
                        1
                    );

                request.onupgradeneeded =
                    function(e){

                        const db =
                            e.target.result;

                        if(
                            !db.objectStoreNames
                            .contains("media")
                        ){

                            db.createObjectStore(
                                "media",
                                {
                                    keyPath:"id"
                                }
                            );
                        }
                    };

                request.onsuccess =
                    function(){

                        resolve(
                            request.result
                        );
                    };

                request.onerror =
                    function(){

                        reject(
                            request.error
                        );
                    };
            }
        );

    return mediaDBPromise;
}


async function saveMedia(file){

    if(!file)
        return null;

    const id =
        "media_"
        +
        Date.now()
        +
        "_"
        +
        Math.random()
        .toString(36)
        .slice(2);

    const buffer =
        await file.arrayBuffer();

    const db =
        await openMediaDB();

    await new Promise(
        (resolve,reject)=>{

            const tx =
                db.transaction(
                    "media",
                    "readwrite"
                );

            tx.objectStore("media")
                .put({

                    id:id,

                    name:file.name,

                    type:file.type,

                    data:buffer

                });

            tx.oncomplete =
                resolve;

            tx.onerror =
                ()=>reject(tx.error);
        }
    );

    return id;
}


async function getMedia(id){

    if(!id)
        return null;

    const db =
        await openMediaDB();

    return new Promise(
        (resolve,reject)=>{

            const tx =
                db.transaction(
                    "media",
                    "readonly"
                );

            const request =
                tx.objectStore("media")
                .get(id);

            request.onsuccess =
                ()=>{
                    resolve(
                        request.result
                        || null
                    );
                };

            request.onerror =
                ()=>{
                    reject(
                        request.error
                    );
                };
        }
    );
}


async function deleteMedia(id){

    if(!id)
        return;

    const db =
        await openMediaDB();

    return new Promise(
        (resolve,reject)=>{

            const tx =
                db.transaction(
                    "media",
                    "readwrite"
                );

            tx.objectStore("media")
                .delete(id);

            tx.oncomplete =
                resolve;

            tx.onerror =
                ()=>reject(tx.error);
        }
    );
}

async function createPost(){

    const text =
        $("postText")
        .value
        .trim();

    if(!text && !selectedPostFile){

        alert(
            "Sila tulis sesuatu atau pilih media."
        );

        return;
    }

    let mediaId =
        null;

    if(selectedPostFile){

        try{

            mediaId =
                await saveMedia(
                    selectedPostFile
                );

        }catch(e){

            alert(
                "Gagal menyimpan media."
            );

            return;
        }
    }

    const posts =
        getPosts();

    posts.unshift({

        id:Date.now(),

        owner:currentUser,

        text:text,

        type:selectedPostType,

        mediaId:mediaId,

        time:Date.now(),

        likes:[],

        comments:[],

        hiddenComments:false,

        blockedUsers:[]

    });

    savePosts(posts);

    $("postText").value =
        "";

    $("postFile").value =
        "";

    $("mediaPreview")
        .style
        .display =
        "none";

    $("mediaPreview")
        .innerHTML =
        "";

    selectedPostFile =
        null;

    selectedPostType =
        "text";

    document
        .querySelectorAll(
            ".post-type-row button"
        )
        .forEach(
            btn =>
                btn.classList.remove("active")
        );

    $("typeText")
        .classList
        .add("active");

}


/* =========================================================
   RENDER FEED
   ========================================================= */

async function renderFeed(){

    const posts =
        getPosts();

    if(posts.length === 0){

        $("feed").innerHTML =
            `
            <div class="empty">
                Belum ada posting.
                Jadilah orang pertama membuat posting.
            </div>
            `;

        return;
    }

    let html =
        "";

    for(const post of posts){

        let mediaHtml =
            "";

        if(post.mediaId){

            try{

                const media =
                    await getMedia(
                        post.mediaId
                    );

                if(media){

                    const blob =
                        new Blob(
                            [media.data],
                            {
                                type:media.type
                            }
                        );

                    const url =
                        URL.createObjectURL(
                            blob
                        );

                    if(
                        post.type === "image"
                    ){

                        mediaHtml =
                            `
                            <img
                                class="post-media"
                                src="${url}"
                            >
                            `;
                    }

                    if(
                        post.type === "video"
                    ){

                        mediaHtml =
                            `
                            <video
                                class="post-media"
                                src="${url}"
                                controls
                            ></video>
                            `;
                    }
                }

            }catch(e){}
        }

        const likes =
            Array.isArray(post.likes)
            ?
            post.likes
            :
            [];

        const comments =
            Array.isArray(post.comments)
            ?
            post.comments
            :
            [];

        const blocked =
            Array.isArray(post.blockedUsers)
            ?
            post.blockedUsers
            :
            [];

        const visibleComments =
            post.hiddenComments
            ?
            []
            :
            comments.filter(
                c =>
                    !blocked.includes(
                        c.user
                    )
            );

        const liked =
            likes.includes(
                currentUser
            );

        const isOwner =
            post.owner === currentUser;

        let commentsHtml =
            "";

        if(post.hiddenComments){

            commentsHtml =
                `
                <div class="no-comments">
                    🙈 Komen telah disembunyikan
                    oleh pemilik posting.
                </div>
                `;

        }else{

            if(
                visibleComments.length === 0
            ){

                commentsHtml =
                    `
                    <div class="no-comments">
                        Belum ada komen.
                    </div>
                    `;

            }else{

                commentsHtml =
                    visibleComments
                    .map(
                        c => {

                            const isCommentOwner =
                                c.user === currentUser;

                            const canDelete =
                                isOwner
                                ||
                                isCommentOwner;

                            const canBlock =
                                isOwner
                                &&
                                c.user !== currentUser
                                &&
                                c.user !== post.owner;

                            return `
                                <div class="comment">

                                    <div class="comment-user">
                                        ${escapeHtml(c.user)}
                                    </div>

                                    <div class="comment-text">
                                        ${escapeHtml(c.text)}
                                    </div>

                                    <div class="comment-tools">

                                        ${
                                            canDelete
                                            ?
                                            `
                                            <button
                                                class="danger"
                                                onclick="deleteComment(
                                                    ${post.id},
                                                    ${safeArg(c.id)}
                                                )"
                                            >
                                                🗑️ Padam
                                            </button>
                                            `
                                            :
                                            ""
                                        }

                                        ${
                                            canBlock
                                            ?
                                            `
                                            <button
                                                class="block-btn"
                                                onclick="toggleBlockUser(
                                                    ${post.id},
                                                    ${safeArg(c.user)}
                                                )"
                                            >
                                                🚫 Block
                                            </button>
                                            `
                                            :
                                            ""
                                        }

                                    </div>

                                </div>
                            `;
                        }
                    )
                    .join("");
            }
        }

        let commentInput =
            "";

        if(
            !post.hiddenComments
            &&
            !blocked.includes(
                currentUser
            )
        ){

            commentInput =
                `
                <div class="comment-input-row">

                    <input
                        id="commentInput_${post.id}"
                        placeholder="Tulis komen..."
                        onkeydown="
                            if(event.key==='Enter')
                            addComment(${post.id})
                        "
                    >

                    <button
                        onclick="addComment(${post.id})"
                    >
                        Hantar
                    </button>

                </div>
                `;
        }

        html += `
            <div class="post">

                <div class="post-head">

                    <img
                        class="post-avatar"
                        src="${getAvatar(post.owner)}"
                    >

                    <div>

                        <div class="post-owner">
                            ${escapeHtml(post.owner)}
                        </div>

                        <div class="post-time">
                            ${formatTime(post.time)}
                        </div>

                    </div>

                    ${
                        isOwner
                        ?
                        `
                        <button
                            class="post-menu"
                            onclick="postOwnerMenu(${post.id})"
                        >
                            ⋮
                        </button>
                        `
                        :
                        ""
                    }

                </div>

                ${
                    post.text
                    ?
                    `
                    <div class="post-text">
                        ${escapeHtml(post.text)}
                    </div>
                    `
                    :
                    ""
                }

                ${mediaHtml}

                <div class="post-actions">

                    <button
                        class="${liked ? "liked" : ""}"
                        onclick="toggleLike(${post.id})"
                    >
                        👍 Like
                        ${likes.length ? likes.length : ""}
                    </button>

                    <button
                        onclick="focusComment(${post.id})"
                    >
                        💬 Komen
                        ${
                            visibleComments.length
                            ?
                            visibleComments.length
                            :
                            ""
                        }
                    </button>

                    <button
                        onclick="sharePost(${post.id})"
                    >
                        ↗ Kongsi
                    </button>

                </div>

                <div class="comment-area">

                    ${commentsHtml}

                    ${commentInput}

                </div>

            </div>
        `;
    }

    $("feed").innerHTML =
        html;
}


/* =========================================================
   LIKE
   ========================================================= */

function toggleLike(postId){

    const posts =
        getPosts();

    const post =
        posts.find(
            p =>
                p.id === postId
        );

    if(!post)
        return;

    if(
        !Array.isArray(
            post.likes
        )
    ){

        post.likes =
            [];
    }

    const index =
        post.likes.indexOf(
            currentUser
        );

    if(index >= 0){

        post.likes.splice(
            index,
            1
        );

    }else{

        post.likes.push(
            currentUser
        );
    }

    savePosts(posts);

    renderFeed();
}


/* =========================================================
   COMMENT
   ========================================================= */

function focusComment(postId){

    const input =
        $("commentInput_"+postId);

    if(input){

        input.focus();

        input.scrollIntoView({
            behavior:"smooth",
            block:"center"
        });
    }
}


function addComment(postId){

    const input =
        $("commentInput_"+postId);

    if(!input)
        return;

    const text =
        input.value
        .trim();

    if(!text)
        return;

    const posts =
        getPosts();

    const post =
        posts.find(
            p =>
                p.id === postId
        );

    if(!post)
        return;

    if(post.hiddenComments){

        alert(
            "Komen sedang disembunyikan."
        );

        return;
    }

    if(
        !Array.isArray(
            post.blockedUsers
        )
    ){

        post.blockedUsers =
            [];
    }

    if(
        post.blockedUsers.includes(
            currentUser
        )
    ){

        alert(
            "Anda telah di-block daripada komen pada posting ini."
        );

        return;
    }

    if(
        !Array.isArray(
            post.comments
        )
    ){

        post.comments =
            [];
    }

    post.comments.push({

        id:
            Date.now()
            +
            "_"
            +
            Math.random()
                .toString(36)
                .slice(2),

        user:currentUser,

        text:text,

        time:Date.now()

    });

    savePosts(posts);

    renderFeed();
}


/* =========================================================
   DELETE COMMENT
   PEMILIK KOMEN ATAU PEMILIK POSTING
   ========================================================= */

function deleteComment(
    postId,
    commentId
){

    const posts =
        getPosts();

    const post =
        posts.find(
            p =>
                p.id === postId
        );

    if(!post)
        return;

    if(
        !Array.isArray(
            post.comments
        )
    ){

        return;
    }

    const comment =
        post.comments.find(
            c =>
                String(c.id)
                ===
                String(commentId)
        );

    if(!comment)
        return;

    const canDelete =
        post.owner === currentUser
        ||
        comment.user === currentUser;

    if(!canDelete)
        return;

    post.comments =
        post.comments.filter(
            c =>
                String(c.id)
                !==
                String(commentId)
        );

    savePosts(posts);

    renderFeed();
}


/* =========================================================
   BLOCK / UNBLOCK
   BLOCK JUGA BUANG KOMEN PENGGUNA TERSEBUT
   ========================================================= */

function toggleBlockUser(
    postId,
    username
){

    const posts =
        getPosts();

    const post =
        posts.find(
            p =>
                p.id === postId
        );

    if(
        !post
        ||
        post.owner !== currentUser
    ){

        return;
    }

    if(
        !Array.isArray(
            post.blockedUsers
        )
    ){

        post.blockedUsers =
            [];
    }

    const index =
        post.blockedUsers.indexOf(
            username
        );

    if(index >= 0){

        post.blockedUsers.splice(
            index,
            1
        );

    }else{

        post.blockedUsers.push(
            username
        );

        /*
           Bila Block:
           Semua komen lama daripada
           user tersebut turut dibuang.
        */

        if(
            Array.isArray(
                post.comments
            )
        ){

            post.comments =
                post.comments.filter(
                    c =>
                        c.user !== username
                );
        }
    }

    savePosts(posts);

    renderFeed();
}


function unblockUser(
    postId,
    username
){

    const posts =
        getPosts();

    const post =
        posts.find(
            p =>
                p.id === postId
        );

    if(
        !post
        ||
        post.owner !== currentUser
    ){

        return;
    }

    if(
        !Array.isArray(
            post.blockedUsers
        )
    ){

        post.blockedUsers =
            [];
    }

    post.blockedUsers =
        post.blockedUsers.filter(
            u =>
                u !== username
        );

    savePosts(posts);

    renderFeed();
}

function toggleComments(
    postId
){

    const posts =
        getPosts();

    const post =
        posts.find(
            p =>
                p.id === postId
        );

    if(
        !post
        ||
        post.owner !== currentUser
    ){

        return;
    }

    post.hiddenComments =
        !post.hiddenComments;

/* =========================================================
   MANAGE COMMENTS
   ========================================================= */

function managePostComments(
    postId
){

    const posts =
        getPosts();

    const post =
        posts.find(
            p =>
                p.id === postId
        );

    if(
        !post
        ||
        post.owner !== currentUser
    ){

        return;
    }

    const comments =
        Array.isArray(post.comments)
        ?
        post.comments
        :
        [];

    const blocked =
        Array.isArray(post.blockedUsers)
        ?
        post.blockedUsers
        :
        [];

    let html = `
        <h3>💬 Urus Komen</h3>
    `;

    if(comments.length === 0){

        html += `
            <div class="empty">
                Tiada komen aktif.
            </div>
        `;

    }else{

        comments.forEach(
            c => {

                const isBlocked =
                    blocked.includes(
                        c.user
                    );

                html += `
                    <div class="comment">

                        <div class="comment-user">

                            ${escapeHtml(c.user)}

                            ${
                                isBlocked
                                ?
                                " 🚫"
                                :
                                ""
                            }

                        </div>

                        <div class="comment-text">
                            ${escapeHtml(c.text)}
                        </div>

                        <div class="comment-tools">

                            <button
                                class="danger"
                                onclick="
                                    deleteCommentAndManage(
                                        ${postId},
                                        ${safeArg(c.id)}
                                    )
                                "
                            >
                                🗑️ Padam
                            </button>

                            <button
                                class="normal"
                                onclick="
                                    toggleBlockAndManage(
                                        ${postId},
                                        ${safeArg(c.user)}
                                    )
                                "
                            >
                                ${
                                    isBlocked
                                    ?
                                    "Buka Block"
                                    :
                                    "🚫 Block"
                                }
                            </button>

                        </div>

                    </div>
                `;
            }
        );
    }

    html += `

        <button
            class="primary"
            onclick="manageBlockedUsers(${postId})"
        >
            🚫 Urus Blocked Users
        </button>

        <br>

        <button
            class="normal"
            onclick="closeModal()"
        >
            Selesai
        </button>

    `;

    openModal(html);
}


/* =========================================================
   DELETE COMMENT FROM MANAGE

function deleteCommentAndManage(

    commentId
){

    const posts =
        getPosts();

    if(

/* =========================================================
   BLOCK FROM MANAGE
   ========================================================= */

function toggleBlockAndManage(
    postId,
    username
){

    const posts =
        getPosts();

    const post =
        posts.find(
            p =>
                p.id === postId
        );

    if(
        !post
        ||
        post.owner !== currentUser
    ){

        return;
    }

    if(
        !Array.isArray(
            post.blockedUsers
        )
    ){

        post.blockedUsers =
            [];
    }

    const index =
        post.blockedUsers.indexOf(
            username
        );

    if(index >= 0){

        post.blockedUsers.splice(
            index,
            1
        );

    }else{

        post.blockedUsers.push(
            username
        );

        post.comments =
            (post.comments || [])
            .filter(
                c =>
                    c.user !== username
            );
    }

    savePosts(posts);

    renderFeed();

    managePostComments(
        postId
    );
}

/* =========================================================
   DELETE POST
   ========================================================= */

async function deletePost(
    postId
){

    const posts =
        getPosts();

    const index =
        posts.findIndex(
            p =>
                p.id === postId
        );

    if(index < 0)
        return;

    const post =
        posts[index];

    if(
        post.owner !== currentUser
    ){

        return;
    }

    const yes =
        confirm(
            "Padam posting ini?"
        );

    if(!yes)
        return;

    if(post.mediaId){

        try{

            await deleteMedia(
                post.mediaId
            );

        }catch(e){}
    }

    posts.splice(
        index,
        1
    );

    savePosts(posts);

    closeModal();

    renderFeed();
}

/* =========================================================
   PROFILE TABS
   ========================================================= */

async function showProfileTab(
    tab
){

    currentProfileTab =
        tab;

    document
        .querySelectorAll(
            ".profile-tabs button"
        )
        .forEach(
            btn =>
                btn.classList.remove(
                    "active"
                )
        );

    if(tab === "post")
        $("tabPost")
            .classList
            .add("active");

    if(tab === "image")
        $("tabImage")
            .classList
            .add("active");

    if(tab === "video")
        $("tabVideo")
            .classList
            .add("active");

    if(tab === "market")
        $("tabMarket")
            .classList
            .add("active");

    const content =
        $("profileTabContent");

    if(tab === "market"){

        renderMarket();

        return;
    }

    const posts =
        getPosts()
        .filter(
            p =>
                p.owner === currentUser
        );

    let filtered =
        posts;

    if(tab === "image"){

        filtered =
            posts.filter(
                p =>
                    p.type === "image"
            );
    }

    if(tab === "video"){

        filtered =
            posts.filter(
                p =>
                    p.type === "video"
            );
    }

    if(filtered.length === 0){

        content.innerHTML =
            `
            <div class="empty">
                Belum ada kandungan.
            </div>
            `;

        return;
    }

    let html =
        "";

    for(const post of filtered){

        let mediaHtml =
            "";

        if(post.mediaId){

            try{

                const media =
                    await getMedia(
                        post.mediaId
                    );

                if(media){

                    const blob =
                        new Blob(
                            [media.data],
                            {
                                type:media.type
                            }
                        );

                    const url =
                        URL.createObjectURL(
                            blob
                        );

                    if(
                        post.type === "image"
                    ){

                        mediaHtml =
                            `
                            <img
                                class="post-media"
                                src="${url}"
                            >
                            `;
                    }

                    if(
                        post.type === "video"
                    ){

                        mediaHtml =
                            `
                            <video
                                class="post-media"
                                src="${url}"
                                controls
                            ></video>
                            `;
                    }
                }

            }catch(e){}
        }

        html += `
            <div class="post">

                <div class="post-head">

                    <img
                        class="post-avatar"
                        src="${getAvatar(currentUser)}"
                    >

                    <div>

                        <div class="post-owner">
                            ${escapeHtml(currentUser)}
                        </div>

                        <div class="post-time">
                            ${formatTime(post.time)}
                        </div>

                    </div>

                </div>

                ${
                    post.text
                    ?
                    `
                    <div class="post-text">
                        ${escapeHtml(post.text)}
                    </div>
                    `
                    :
                    ""
                }

                ${mediaHtml}

            </div>
        `;
    }

    content.innerHTML =
        html;
}

function addMarketItem(){

    const title =
        $("marketTitle")
        .value
        .trim();

    const price =
        $("marketPrice")
        .value
        .trim();

    const description =
        $("marketDesc")
        .value
        .trim();

    const file =
        $("marketFile")
        .files[0];

    if(!title || !price){

        alert(
            "Sila isi nama dan harga."
        );

        return;
    }

    if(
        file
        &&
        file.size > 3*1024*1024
    ){

        alert(
            "Gambar maksimum 3MB."
        );

        return;
    }

    const finish =
        image => {

            const items =
                getMarket();

            items.unshift({

                id:Date.now(),

                owner:currentUser,

                title:title,

                price:price,

                description:description,

                image:image || "",

                time:Date.now()

            });

            saveMarket(items);

            renderMarket();
        };

    if(file){

        const reader =
            new FileReader();

        reader.onload =
            () =>
                finish(
                    reader.result
                );

        reader.readAsDataURL(
            file
        );

    }else{

        finish("");
    }
}


function deleteMarketItem(
    id
){

    const items =
        getMarket();

    const item =
        items.find(
            i =>
                i.id === id
        );

    if(
        !item
        ||
        item.owner !== currentUser
    ){

        return;
    }

    if(
        !confirm(
            "Padam barang ini?"
        )
    ){

        return;
    }

    saveMarket(
        items.filter(
            i =>
                i.id !== id
        )
    );

    renderMarket();
}


/* =========================================================
   CHAT
   ========================================================= */

function chatKey(a,b){

    return "yamchat_"
        +
        [a,b]
        .sort()
        .join("_");
}


function getChatMessages(a,b){

    try{

        return JSON.parse(
            localStorage.getItem(
                chatKey(a,b)
            )
            ||
            "[]"
        );

    }catch(e){

        return [];
    }
}


function saveChatMessages(
    a,
    b,
    messages
){

    localStorage.setItem(
        chatKey(a,b),
        JSON.stringify(messages)
    );
}


function openChat(
    username
){

    currentChatUser =
        username;

    $("chatTitle")
        .textContent =
        username;

    $("chatOverlay")
        .style
        .display =
        "block";

    renderChat();

    setTimeout(
        ()=>{
            $("chatInput").focus();
        },
        100
    );
}


function closeChat(){

    $("chatOverlay")
        .style
        .display =
        "none";

    currentChatUser =
        "";
}


function renderChat(){

    const messages =
        getChatMessages(
            currentUser,
            currentChatUser
        );

    if(messages.length === 0){

        $("chatMessages").innerHTML =
            `
            <div class="empty">
                Belum ada mesej.
            </div>
            `;

        return;
    }

    $("chatMessages").innerHTML =
        messages
        .map(
            m =>
                `

                <div
                    class="
                        chat-bubble
                        ${
                            m.user === currentUser
                            ?
                            "chat-me"
                            :
                            "chat-other"
                        }
                    "
                >
                    ${escapeHtml(m.text)}
                </div>

                `
        )
        .join("");

    $("chatMessages")
        .scrollTop =
        $("chatMessages")
        .scrollHeight;
}


function sendChat(){

    const input =
        $("chatInput");

    const text =
        input.value
        .trim();

    if(
        !text
        ||
        !currentChatUser
    ){

        return;
    }

    const messages =
        getChatMessages(
            currentUser,
            currentChatUser
        );

    messages.push({

        user:currentUser,

        text:text,

        time:Date.now()

    });

    saveChatMessages(
        currentUser,
        currentChatUser,
        messages
    );

    input.value =
        "";

    renderChat();
}


$("chatInput").addEventListener(
    "keydown",
    function(e){

        if(e.key === "Enter"){

            sendChat();
        }
    }
);

            id="roomMessages"
            style="
                max-height:350px;
                overflow-y:auto;
                background:#f1f3f6;
                padding:10px;
                border-radius:10px;
                margin-bottom:10px;
            "
        >
    `;

    if(messages.length === 0){

        html += `
            <div class="empty">
                Belum ada mesej.
            </div>
        `;

    }else{

        messages.forEach(
            m => {

                html += `

                    <div
                        style="
                            background:#fff;
                            border-radius:9px;
                            padding:8px;
                            margin-bottom:6px;
                        "
                    >

                        <strong>
                            ${escapeHtml(m.user)}
                        </strong>

                        <div>
                            ${escapeHtml(m.text)}
                        </div>

                    </div>

                `;
            }
        );
    }

    html += `

        </div>

        <input
            id="roomInput"
            placeholder="Tulis mesej..."
            style="
                width:100%;
                padding:11px;
                border:1px solid #ddd;
                border-radius:9px;
                margin-bottom:8px;
            "
            onkeydown="
                if(event.key==='Enter')
                sendRoom(${safeArg(room)})
            "
        >

        <button
            class="primary"
            onclick="sendRoom(${safeArg(room)})"
        >
            Hantar
        </button>

        <button
            class="normal"
            onclick="closeModal()"
        >
            Tutup
        </button>

    `;

    openModal(html);
}


function sendRoom(
    room
){

    const input =
        $("roomInput");

    if(!input)
        return;

    const text =
        input.value
        .trim();

    if(!text)
        return;

    const messages =
        getRoomMessages(
            room
        );

    messages.push({

        user:currentUser,

        text:text,

        time:Date.now()

    });

    localStorage.setItem(
        roomKey(room),
        JSON.stringify(messages)
    );

    openRoom(room);
}


/* =========================================================
   MODAL
   ========================================================= */

function openModal(
    html
){

    $("modal").innerHTML =
        html;

    $("modalBg")
        .style
        .display =
        "flex";
}


function closeModal(){

    $("modalBg")
        .style
        .display =
        "none";

    $("modal").innerHTML =
        "";
}


function closeModalOutside(
    event
){

    if(
        event.target ===
        $("modalBg")
    ){

        closeModal();
    }
}


/* =========================================================
   LOAD PROFILE BIO
   ========================================================= */

function loadBio(){

    if(!currentUser)
        return;

    let profile = {};

    try{

        profile =
            JSON.parse(
                localStorage.getItem(
                    "yam_profile_"+currentUser
                )
                ||
                "{}"
            );

    }catch(e){}

    $("profileBio")
        .textContent =
        profile.bio
        ||
        "Selamat datang ke profil saya di YAM Chat.";
}


/* =========================================================
   INITIAL START
   ========================================================= */

loadBio();

if(currentUser){

    startApp();

}else{

    $("loginPage")
        .style
        .display =
        "flex";

    $("app")
        .style
        .display =
        "none";
}

</script>
