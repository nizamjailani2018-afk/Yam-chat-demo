<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Y-M Chat - Home V1.1</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#eef2f7;
    color:#222;
}

.app{
    width:100%;
    max-width:480px;
    min-height:100vh;
    margin:auto;
    background:#f5f7fa;
    padding-bottom:78px;
}

.header{
    height:62px;
    background:#1976d2;
    color:white;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 15px;
    position:sticky;
    top:0;
    z-index:20;
    box-shadow:0 2px 8px rgba(0,0,0,.18);
}

.logo{
    font-size:23px;
    font-weight:bold;
}

.logo span{
    display:block;
    font-size:12px;
    opacity:.85;
}

.header-actions{
    display:flex;
    gap:8px;
}

.icon-btn{
    width:40px;
    height:40px;
    border:none;
    border-radius:50%;
    background:rgba(255,255,255,.17);
    color:white;
    font-size:20px;
    cursor:pointer;
}

.profile-bar{
    background:white;
    padding:13px 15px;
    display:flex;
    align-items:center;
    gap:11px;
    border-bottom:1px solid #ddd;
}

.avatar,
.mini-avatar{
    width:45px;
    height:45px;
    border-radius:50%;
    background:#1976d2;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
    font-size:18px;
    overflow:hidden;
    flex-shrink:0;
}

.mini-avatar{
    width:40px;
    height:40px;
}

.avatar img,
.mini-avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.profile-info{
    flex:1;
}

.profile-name{
    font-weight:bold;
    font-size:15px;
}

.profile-id{
    color:#777;
    font-size:12px;
    margin-top:3px;
}

.notice{
    margin:12px;
    background:#e3f2fd;
    border:1px solid #bbdefb;
    border-radius:10px;
    padding:11px;
    color:#1565c0;
    font-size:13px;
}

.create-post{
    background:white;
    margin:12px;
    border-radius:12px;
    padding:13px;
    box-shadow:0 1px 4px rgba(0,0,0,.08);
}

.create-top{
    display:flex;
    gap:10px;
    align-items:flex-start;
}

.post-input{
    flex:1;
    min-height:42px;
    border:1px solid #ddd;
    border-radius:22px;
    padding:11px 14px;
    outline:none;
    resize:none;
    font-size:14px;
}

.post-input:focus{
    border-color:#1976d2;
}

.media-preview{
    margin-top:10px;
    display:none;
    border-radius:10px;
    overflow:hidden;
    background:#f1f1f1;
}

.media-preview img,
.media-preview video{
    width:100%;
    max-height:280px;
    object-fit:cover;
    display:block;
}

.create-actions{
    display:flex;
    margin-top:12px;
    border-top:1px solid #eee;
    padding-top:10px;
    gap:5px;
}

.media-btn{
    flex:1;
    border:none;
    background:white;
    padding:9px 3px;
    border-radius:8px;
    cursor:pointer;
    font-size:12px;
    color:#444;
}

.media-btn:hover{
    background:#f2f5f8;
}

.post-btn{
    background:#1976d2;
    color:white;
    font-weight:bold;
}

input[type="file"]{
    display:none;
}

.feed-title{
    padding:4px 14px 8px;
    font-size:16px;
    font-weight:bold;
}

.post-card{
    background:white;
    margin:0 12px 12px;
    border-radius:12px;
    box-shadow:0 1px 5px rgba(0,0,0,.08);
    overflow:hidden;
}

.post-head{
    display:flex;
    align-items:center;
    padding:13px;
    gap:10px;
}

.post-user{
    flex:1;
}

.post-user-name{
    font-size:14px;
    font-weight:bold;
}

.post-time{
    color:#888;
    font-size:11px;
    margin-top:3px;
}

.more-btn{
    border:none;
    background:white;
    font-size:22px;
    color:#777;
    cursor:pointer;
    padding:4px 8px;
}

.post-text{
    padding:0 13px 13px;
    font-size:14px;
    line-height:1.5;
    white-space:pre-wrap;
}

.post-media{
    width:100%;
    background:#000;
}

.post-media img,
.post-media video{
    width:100%;
    max-height:430px;
    display:block;
    object-fit:contain;
}

.post-stats{
    padding:9px 13px;
    color:#777;
    font-size:12px;
    border-bottom:1px solid #eee;
}

.post-actions{
    display:flex;
}

.post-action{
    flex:1;
    border:none;
    background:white;
    padding:11px 5px;
    cursor:pointer;
    color:#555;
    font-size:13px;
}

.post-action:hover{
    background:#f4f6f8;
}

.post-action.liked{
    color:#1976d2;
    font-weight:bold;
}

.comments-area{
    border-top:1px solid #eee;
    padding:10px 13px;
    background:#fafafa;
}

.comments-title{
    font-size:12px;
    font-weight:bold;
    color:#666;
    margin-bottom:8px;
}

.comment{
    display:flex;
    gap:8px;
    margin-bottom:9px;
}

.comment-avatar{
    width:30px;
    height:30px;
    border-radius:50%;
    background:#1976d2;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:12px;
    font-weight:bold;
    flex-shrink:0;
}

.comment-body{
    flex:1;
    background:white;
    border:1px solid #e4e4e4;
    border-radius:9px;
    padding:8px;
}

.comment-name{
    font-size:12px;
    font-weight:bold;
}

.comment-text{
    font-size:13px;
    margin-top:4px;
    line-height:1.4;
    white-space:pre-wrap;
}

.comment-bottom{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:6px;
}

.comment-time{
    color:#999;
    font-size:10px;
}

.comment-menu{
    border:none;
    background:transparent;
    color:#777;
    cursor:pointer;
    font-size:12px;
}

.empty{
    text-align:center;
    padding:35px 20px;
    color:#888;
}

.empty-icon{
    font-size:42px;
    margin-bottom:10px;
}

.notification-panel{
    position:fixed;
    top:62px;
    right:calc(50% - 230px);
    width:310px;
    max-width:calc(100% - 30px);
    background:white;
    border-radius:0 0 12px 12px;
    box-shadow:0 4px 15px rgba(0,0,0,.2);
    display:none;
    z-index:30;
    overflow:hidden;
}

.notification-panel.show{
    display:block;
}

.notification-head{
    padding:13px;
    font-weight:bold;
    border-bottom:1px solid #eee;
}

.notification-item{
    padding:12px;
    border-bottom:1px solid #eee;
    font-size:13px;
}

.notification-item small{
    display:block;
    color:#888;
    margin-top:4px;
}

.bottom-nav{
    position:fixed;
    bottom:0;
    left:50%;
    transform:translateX(-50%);
    width:100%;
    max-width:480px;
    height:68px;
    background:white;
    border-top:1px solid #ddd;
    display:flex;
    z-index:25;
    box-shadow:0 -2px 8px rgba(0,0,0,.08);
}

.nav-btn{
    flex:1;
    border:none;
    background:white;
    color:#777;
    cursor:pointer;
    font-size:11px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:4px;
}

.nav-icon{
    font-size:21px;
}

.nav-btn.active{
    color:#1976d2;
    font-weight:bold;
}

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.45);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:50;
    padding:20px;
}

.modal.show{
    display:flex;
}

.modal-box{
    width:100%;
    max-width:390px;
    background:white;
    border-radius:14px;
    padding:18px;
}

.modal-title{
    font-size:18px;
    font-weight:bold;
    margin-bottom:15px;
}

.modal-btn{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    margin-top:8px;
    cursor:pointer;
    background:#1976d2;
    color:white;
    font-weight:bold;
}

.modal-btn.secondary{
    background:#eee;
    color:#333;
}

.comment-input{
    width:100%;
    border:1px solid #ddd;
    border-radius:8px;
    padding:11px;
    resize:none;
    min-height:80px;
    outline:none;
}

.menu-option{
    width:100%;
    padding:12px;
    margin-top:8px;
    border:none;
    border-radius:8px;
    background:#f1f3f5;
    text-align:left;
    cursor:pointer;
    font-size:14px;
}

.menu-option.delete{
    color:#d32f2f;
}

@media(max-width:480px){
    .notification-panel{
        right:15px;
    }
}
</style>
</head>

<body>

<div class="app">

<header class="header">

    <div class="logo">
        Y-M Chat
        <span>Home</span>
    </div>

    <div class="header-actions">
        <button class="icon-btn" onclick="toggleNotifications()">🔔</button>
        <button class="icon-btn" onclick="openMenu()">⋮</button>
    </div>

</header>

<div id="notificationPanel" class="notification-panel">

    <div class="notification-head">
        🔔 Notifications
    </div>

    <div class="notification-item">
        Welcome to Y-M Chat.
        <small>Just now</small>
    </div>

    <div class="notification-item">
        Home V1.1 is active.
        <small>Today</small>
    </div>

</div>

<section class="profile-bar">

    <div class="avatar" id="topAvatar">Y</div>

    <div class="profile-info">
        <div class="profile-name" id="topName">
            Y-M User
        </div>

        <div class="profile-id" id="topId">
            @ymuser
        </div>
    </div>

</section>

<div class="notice">
    👋 Welcome to <b>Y-M Chat</b>. Share what is on your mind.
</div>

<section class="create-post">

    <div class="create-top">

        <div class="mini-avatar" id="miniAvatar">Y</div>

        <textarea
            id="postInput"
            class="post-input"
            placeholder="What's on your mind?"
        ></textarea>

    </div>

    <div id="mediaPreview" class="media-preview"></div>

    <div class="create-actions">

        <button
            class="media-btn"
            onclick="document.getElementById('imageInput').click()">
            🖼️ Photo
        </button>

        <button
            class="media-btn"
            onclick="document.getElementById('videoInput').click()">
            🎥 Video
        </button>

        <button
            class="media-btn post-btn"
            onclick="createPost()">
            ➤ Post
        </button>

    </div>

    <input
        type="file"
        id="imageInput"
        accept="image/*"
        onchange="previewImage(event)"
    >

    <input
        type="file"
        id="videoInput"
        accept="video/*"
        onchange="previewVideo(event)"
    >

</section>

<div class="feed-title">
    📰 Y-M Feed
</div>

<main id="feed"></main>

</div>

<nav class="bottom-nav">

    <button class="nav-btn active" onclick="goHome()">
        <span class="nav-icon">🏠</span>
        Home
    </button>

    <button class="nav-btn" onclick="openFriends()">
        <span class="nav-icon">👥</span>
        Friends
    </button>

    <button class="nav-btn" onclick="openChat()">
        <span class="nav-icon">💬</span>
        Chat
    </button>

    <button class="nav-btn" onclick="openRooms()">
        <span class="nav-icon">🌎</span>
        Rooms
    </button>

    <button class="nav-btn" onclick="openProfile()">
        <span class="nav-icon">👤</span>
        Profile
    </button>

</nav>

<div id="commentModal" class="modal">

    <div class="modal-box">

        <div class="modal-title">
            💬 Add Comment
        </div>

        <textarea
            id="commentInput"
            class="comment-input"
            placeholder="Write a comment..."
        ></textarea>

        <button class="modal-btn" onclick="submitComment()">
            Send Comment
        </button>

        <button
            class="modal-btn secondary"
            onclick="closeCommentModal()">
            Cancel
        </button>

    </div>

</div>

<div id="postMenuModal" class="modal">

    <div class="modal-box">

        <div class="modal-title">
            Post Options
        </div>

        <div id="postMenuOptions"></div>

        <button
            class="modal-btn secondary"
            onclick="closePostMenu()">
            Cancel
        </button>

    </div>

</div>

<div id="commentMenuModal" class="modal">

    <div class="modal-box">

        <div class="modal-title">
            Comment Options
        </div>

        <div id="commentMenuOptions"></div>

        <button
            class="modal-btn secondary"
            onclick="closeCommentMenu()">
            Cancel
        </button>

    </div>

</div>

<script>

let posts = [];
let selectedMedia = null;
let selectedMediaType = null;
let commentPostId = null;
let selectedMenuPostId = null;
let selectedMenuCommentId = null;
let selectedMenuCommentPostId = null;


/* USER */

function getCurrentUser(){

    const current =
        localStorage.getItem("ym_current_user");

    if(!current){
        return null;
    }

    try{
        return JSON.parse(current);
    }catch(error){
        return null;
    }
}

function getCurrentUsername(){

    const user = getCurrentUser();

    return user && user.username
        ? user.username
        : "ymuser";
}

function getCurrentName(){

    const user = getCurrentUser();

    return user && user.name
        ? user.name
        : "Y-M User";
}

function getUserLetter(name){

    return (name || "Y")
        .charAt(0)
        .toUpperCase();
}

function loadUser(){

    const name = getCurrentName();
    const username = getCurrentUsername();
    const letter = getUserLetter(name);

    document.getElementById("topName").textContent =
        name;

    document.getElementById("topId").textContent =
        "@" + username;

    document.getElementById("topAvatar").textContent =
        letter;

    document.getElementById("miniAvatar").textContent =
        letter;
}


/* STORAGE */

function loadPosts(){

    const saved =
        localStorage.getItem("ym_home_posts");

    if(saved){

        try{
            posts = JSON.parse(saved);
        }catch(error){
            posts = [];
        }

    }

    renderPosts();
}

function savePosts(){

    localStorage.setItem(
        "ym_home_posts",
        JSON.stringify(posts)
    );

}


/* TIME */

function formatTime(timestamp){

    const date = new Date(timestamp);
    const now = new Date();
    const difference = now - date;

    const minutes =
        Math.floor(difference / 60000);

    if(minutes < 1){
        return "Just now";
    }

    if(minutes < 60){
        return minutes + " minutes ago";
    }

    const hours =
        Math.floor(minutes / 60);

    if(hours < 24){
        return hours + " hours ago";
    }

    const days =
        Math.floor(hours / 24);

    if(days < 7){
        return days + " days ago";
    }

    return date.toLocaleDateString();
}


/* SECURITY */

function escapeHTML(text){

    if(!text){
        return "";
    }

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/* CREATE POST */

function createPost(){

    const text =
        document.getElementById("postInput")
        .value.trim();

    if(!text && !selectedMedia){

        alert("Please write something or select a photo/video.");

        return;
    }

    const post = {

        id:Date.now(),

        userName:getCurrentName(),

        username:getCurrentUsername(),

        text:text,

        media:selectedMedia,

        mediaType:selectedMediaType,

        time:Date.now(),

        likes:0,

        liked:false,

        hidden:false,

        comments:[]

    };

    posts.unshift(post);

    savePosts();

    document.getElementById("postInput").value = "";

    selectedMedia = null;
    selectedMediaType = null;

    document.getElementById("mediaPreview").style.display =
        "none";

    document.getElementById("mediaPreview").innerHTML =
        "";

    document.getElementById("imageInput").value = "";
    document.getElementById("videoInput").value = "";

    renderPosts();
}


/* RENDER POSTS */

function renderPosts(){

    const feed =
        document.getElementById("feed");

    feed.innerHTML = "";

    const visiblePosts =
        posts.filter(post => !post.hidden);

    if(visiblePosts.length === 0){

        feed.innerHTML = `

            <div class="empty">

                <div class="empty-icon">📰</div>

                <div>No posts available.</div>

                <small>Be the first to create a post.</small>

            </div>

        `;

        return;
    }

    visiblePosts.forEach(post => {

        const card =
            document.createElement("article");

        card.className = "post-card";

        const letter =
            getUserLetter(post.userName);

        let mediaHTML = "";

        if(post.media && post.mediaType === "image"){

            mediaHTML = `

                <div class="post-media">

                    <img
                        src="${post.media}"
                        alt="Post image"
                    >

                </div>

            `;
        }

        if(post.media && post.mediaType === "video"){

            mediaHTML = `

                <div class="post-media">

                    <video
                        src="${post.media}"
                        controls
                    ></video>

                </div>

            `;
        }

        const comments =
            Array.isArray(post.comments)
            ? post.comments
            : [];

        const commentsHTML =
            renderComments(post);

        card.innerHTML = `

            <div class="post-head">

                <div class="avatar">
                    ${letter}
                </div>

                <div class="post-user">

                    <div class="post-user-name">
                        ${escapeHTML(post.userName)}
                    </div>

                    <div class="post-time">
                        @${escapeHTML(post.username)}
                        ·
                        ${formatTime(post.time)}
                    </div>

                </div>

                <button
                    class="more-btn"
                    onclick="openPostMenu(${post.id})">
                    ⋮
                </button>

            </div>

            ${
                post.text
                ? `<div class="post-text">
                    ${escapeHTML(post.text)}
                   </div>`
                : ""
            }

            ${mediaHTML}

            <div class="post-stats">

                ❤️ ${post.likes || 0}
                &nbsp;&nbsp;
                💬 ${comments.length}

            </div>

            <div class="post-actions">

                <button
                    class="post-action ${post.liked ? "liked" : ""}"
                    onclick="likePost(${post.id})">

                    ${post.liked ? "💙 Liked" : "👍 Like"}

                </button>

                <button
                    class="post-action"
                    onclick="openComment(${post.id})">

                    💬 Comment

                </button>

                <button
                    class="post-action"
                    onclick="sharePost(${post.id})">

                    ↗️ Share

                </button>

            </div>

            ${commentsHTML}

        `;

        feed.appendChild(card);

    });
}


/* COMMENTS */

function renderComments(post){

    const comments =
        Array.isArray(post.comments)
        ? post.comments
        : [];

    if(comments.length === 0){
        return "";
    }

    let html = `

        <div class="comments-area">

            <div class="comments-title">
                Comments
            </div>

    `;

    comments.forEach(comment => {

        const letter =
            getUserLetter(comment.user);

        html += `

            <div class="comment">

                <div class="comment-avatar">
                    ${letter}
                </div>

                <div class="comment-body">

                    <div class="comment-name">
                        ${escapeHTML(comment.user)}
                    </div>

                    <div class="comment-text">
                        ${escapeHTML(comment.text)}
                    </div>

                    <div class="comment-bottom">

                        <span class="comment-time">
                            ${formatTime(comment.time)}
                        </span>

                        <button
                            class="comment-menu"
                            onclick="openCommentMenu(
                                ${post.id},
                                ${comment.id}
                            )">

                            Options ▾

                        </button>

                    </div>

                </div>

            </div>

        `;

    });

    html += `</div>`;

    return html;
}

function openComment(id){

    commentPostId = id;

    document.getElementById("commentInput").value = "";

    document.getElementById("commentModal")
        .classList.add("show");
}

function closeCommentModal(){

    document.getElementById("commentModal")
        .classList.remove("show");

    commentPostId = null;
}

function submitComment(){

    const text =
        document.getElementById("commentInput")
        .value.trim();

    if(!text){

        alert("Please write a comment.");

        return;
    }

    const post =
        posts.find(item => item.id === commentPostId);

    if(!post){
        return;
    }

    if(!Array.isArray(post.comments)){
        post.comments = [];
    }

    post.comments.push({

        id:Date.now(),

        user:getCurrentName(),

        username:getCurrentUsername(),

        text:text,

        time:Date.now(),

        hidden:false

    });

    savePosts();

    closeCommentModal();

    renderPosts();
}


/* LIKE */

function likePost(id){

    const post =
        posts.find(item => item.id === id);

    if(!post){
        return;
    }

    if(post.liked){

        post.likes =
            Math.max(0,(post.likes || 0) - 1);

        post.liked = false;

    }else{

        post.likes =
            (post.likes || 0) + 1;

        post.liked = true;

    }

    savePosts();

    renderPosts();
}


/* POST MENU */

function openPostMenu(id){

    selectedMenuPostId = id;

    const post =
        posts.find(item => item.id === id);

    if(!post){
        return;
    }

    const isOwner =
        post.username === getCurrentUsername();

    const options =
        document.getElementById("postMenuOptions");

    options.innerHTML = "";

    if(isOwner){

        options.innerHTML = `

            <button
                class="menu-option delete"
                onclick="deletePost()">

                🗑️ Delete Post

            </button>

        `;

    }else{

        options.innerHTML = `

            <button
                class="menu-option"
                onclick="hidePost()">

                🚫 Hide Post

            </button>

        `;

    }

    document.getElementById("postMenuModal")
        .classList.add("show");
}

function closePostMenu(){

    document.getElementById("postMenuModal")
        .classList.remove("show");

    selectedMenuPostId = null;
}

function deletePost(){

    const post =
        posts.find(item => item.id === selectedMenuPostId);

    if(!post){
        return;
    }

    const confirmed =
        confirm("Are you sure you want to delete this post?");

    if(!confirmed){
        return;
    }

    posts =
        posts.filter(item => item.id !== selectedMenuPostId);

    savePosts();

    closePostMenu();

    renderPosts();
}

function hidePost(){

    const post =
        posts.find(item => item.id === selectedMenuPostId);

    if(!post){
        return;
    }

    post.hidden = true;

    savePosts();

    closePostMenu();

    renderPosts();
}


/* COMMENT MENU */

function openCommentMenu(postId, commentId){

    selectedMenuPostId = postId;
    selectedMenuCommentId = commentId;

    const post =
        posts.find(item => item.id === postId);

    if(!post){
        return;
    }

    const comment =
        post.comments.find(item => item.id === commentId);

    if(!comment){
        return;
    }

    const isOwner =
        comment.username === getCurrentUsername();

    const options =
        document.getElementById("commentMenuOptions");

    options.innerHTML = "";

    if(isOwner){

        options.innerHTML = `

            <button
                class="menu-option delete"
                onclick="deleteComment()">

                🗑️ Delete Comment

            </button>

        `;

    }else{

        options.innerHTML = `

            <button
                class="menu-option"
                onclick="hideComment()">

                🚫 Hide Comment

            </button>

        `;

    }

    document.getElementById("commentMenuModal")
        .classList.add("show");
}

function closeCommentMenu(){

    document.getElementById("commentMenuModal")
        .classList.remove("show");

    selectedMenuPostId = null;
    selectedMenuCommentId = null;
}

function deleteComment(){

    const post =
        posts.find(item => item.id === selectedMenuPostId);

    if(!post){
        return;
    }

    const confirmed =
        confirm("Are you sure you want to delete this comment?");

    if(!confirmed){
        return;
    }

    post.comments =
        post.comments.filter(
            comment => comment.id !== selectedMenuCommentId
        );

    savePosts();

    closeCommentMenu();

    renderPosts();
}

function hideComment(){

    const post =
        posts.find(item => item.id === selectedMenuPostId);

    if(!post){
        return;
    }

    const comment =
        post.comments.find(
            item => item.id === selectedMenuCommentId
        );

    if(!comment){
        return;
    }

    comment.hidden = true;

    post.comments =
        post.comments.filter(comment => !comment.hidden);

    savePosts();

    closeCommentMenu();

    renderPosts();
}


/* MEDIA PREVIEW */

function previewImage(event){

    const file =
        event.target.files[0];

    if(!file){
        return;
    }

    const reader = new FileReader();

    reader.onload = function(event){

        selectedMedia =
            event.target.result;

        selectedMediaType =
            "image";

        const preview =
            document.getElementById("mediaPreview");

        preview.innerHTML = `

            <img
                src="${selectedMedia}"
                alt="Image preview"
            >

        `;

        preview.style.display = "block";
    };

    reader.readAsDataURL(file);
}

function previewVideo(event){

    const file =
        event.target.files[0];

    if(!file){
        return;
    }

    const reader = new FileReader();

    reader.onload = function(event){

        selectedMedia =
            event.target.result;

        selectedMediaType =
            "video";

        const preview =
            document.getElementById("mediaPreview");

        preview.innerHTML = `

            <video
                src="${selectedMedia}"
                controls
            ></video>

        `;

        preview.style.display = "block";
    };

    reader.readAsDataURL(file);
}


/* SHARE */

function sharePost(id){

    const post =
        posts.find(item => item.id === id);

    if(!post){
        return;
    }

    const shareText =
        post.text || "Post from Y-M Chat";

    if(navigator.share){

        navigator.share({

            title:"Y-M Chat",
            text:shareText

        }).catch(() => {});

    }else{

        alert("Share: " + shareText);

    }
}
